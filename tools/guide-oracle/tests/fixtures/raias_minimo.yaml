# Fixture mínima do padrão de raias (construída à mão). Duas demandas:
# `bug` com três raias (orquestradora, diagnóstico, correção) e `incidente` com uma.
versao: 1

demandas:
  - id: bug
    nome: Bug
    sigla: bug
    publico: false
  - id: incidente
    nome: Incidente
    sigla: inc
    publico: false

raias:
  - id: bug_orq
    nome: Orquestração do bug
    demanda: bug
    responsabilidade: Conduzir o bug da entrada ao fechamento
    cor: '#4F81BD'
    orquestradora: true
    status: rascunho
    publico: false
  - id: bug_diag
    nome: Diagnóstico
    demanda: bug
    responsabilidade: Reproduzir o defeito e achar a causa raiz
    cor: '#F2C14E'
    orquestradora: false
    status: rascunho
    publico: false
  - id: bug_corr
    nome: Correção
    demanda: bug
    responsabilidade: Corrigir e verificar a correção
    cor: '#2B2B2B'
    orquestradora: false
    status: rascunho
    publico: false
  - id: inc_orq
    nome: Orquestração do incidente
    demanda: incidente
    responsabilidade: Conduzir o incidente até a normalização
    cor: '#C0504D'
    orquestradora: true
    status: rascunho
    publico: false

requisitos:
  - id: funcional
    nome: Funcional
    publico: false

decisoes:
  # ---- raia bug_orq (orquestradora) ----
  - id: bug_orq_s1
    raia: bug_orq
    tipo: inicio
    rotulo: Bug reportado
    condicao: ''
    proximo:
      - {para: bug_orq_c1, condicao: ''}
    estado: {}
    playbook: pb_bug_orq_s1
    layout: {coluna: 0}
    publico: false
  - id: bug_orq_c1
    raia: bug_orq
    tipo: chamada
    raia_chamada: bug_diag
    rotulo: Diagnosticar o bug
    condicao: ''
    proximo:
      - {para: bug_orq_c2, condicao: causa encontrada}
      - {para: bug_orq_e2, condicao: não reproduzível}
    estado: {}
    playbook: pb_bug_orq_c1
    layout: {coluna: 1}
    publico: false
  - id: bug_orq_c2
    raia: bug_orq
    tipo: chamada
    raia_chamada: bug_corr
    rotulo: Corrigir o bug
    condicao: ''
    proximo:
      - {para: bug_orq_g1, condicao: corrigido}
    estado: {}
    layout: {coluna: 2}
    publico: false
  - id: bug_orq_g1
    raia: bug_orq
    tipo: bifurcacao
    rotulo: Bug é potencial incidente?
    condicao: raio de impacto, dados, dinheiro ou segurança
    proximo:
      - {para: bug_orq_t1, condicao: sim}
      - {para: bug_orq_e1, condicao: não}
    estado: {}
    ligacoes:
      - demanda_destino: incidente
        para: inc_orq_s1
        condicao: pelo menos um critério de potencial incidente
        tipo: aciona
        rotulo: Bug vira potencial incidente
    playbook: pb_bug_orq_g1
    layout: {coluna: 3}
    publico: false
  - id: bug_orq_t1
    raia: bug_orq
    tipo: tarefa
    rotulo: Registrar o bug no ticket do incidente
    condicao: ''
    proximo:
      - {para: bug_orq_e1, condicao: ''}
    estado: {}
    playbook: pb_bug_orq_t1
    layout: {coluna: 4}
    publico: false
  - id: bug_orq_e1
    raia: bug_orq
    tipo: fim
    retorno: bug fechado
    rotulo: Bug fechado
    condicao: ''
    proximo: []
    estado: {}
    layout: {coluna: 5}
    publico: false
  - id: bug_orq_e2
    raia: bug_orq
    tipo: fim
    retorno: bug descartado
    rotulo: Bug descartado por falta de reprodução
    condicao: ''
    proximo: []
    estado: {}
    layout: {coluna: 5}
    publico: false

  # ---- raia bug_diag ----
  - id: bug_diag_s1
    raia: bug_diag
    tipo: inicio
    rotulo: Diagnóstico solicitado
    condicao: ''
    proximo:
      - {para: bug_diag_t1, condicao: ''}
    estado: {}
    playbook: pb_bug_diag_s1
    layout: {coluna: 0}
    publico: false
  - id: bug_diag_t1
    raia: bug_diag
    tipo: tarefa
    rotulo: Reproduzir o defeito
    condicao: ''
    proximo:
      - {para: bug_diag_g1, condicao: ''}
    estado: {}
    layout: {coluna: 1}
    publico: false
  - id: bug_diag_g1
    raia: bug_diag
    tipo: bifurcacao
    rotulo: Reproduziu?
    condicao: ''
    proximo:
      - {para: bug_diag_e1, condicao: sim}
      - {para: bug_diag_e2, condicao: não}
    estado: {}
    layout: {coluna: 2}
    publico: false
  - id: bug_diag_e1
    raia: bug_diag
    tipo: fim
    retorno: causa encontrada
    rotulo: Causa raiz identificada
    condicao: ''
    proximo: []
    estado: {}
    layout: {coluna: 3}
    publico: false
  - id: bug_diag_e2
    raia: bug_diag
    tipo: fim
    retorno: não reproduzível
    rotulo: Sem reprodução
    condicao: ''
    proximo: []
    estado: {}
    layout: {coluna: 3}
    publico: false

  # ---- raia bug_corr ----
  - id: bug_corr_s1
    raia: bug_corr
    tipo: inicio
    rotulo: Correção solicitada
    condicao: ''
    proximo:
      - {para: bug_corr_t1, condicao: ''}
    estado: {}
    layout: {coluna: 0}
    publico: false
  - id: bug_corr_t1
    raia: bug_corr
    tipo: tarefa
    rotulo: Implementar a correção com teste de regressão
    condicao: ''
    proximo:
      - {para: bug_corr_e1, condicao: ''}
    estado: {}
    playbook: pb_bug_corr_t1
    layout: {coluna: 1}
    publico: false
  - id: bug_corr_e1
    raia: bug_corr
    tipo: fim
    retorno: corrigido
    rotulo: Correção verificada
    condicao: ''
    proximo: []
    estado: {}
    layout: {coluna: 2}
    publico: false

  # ---- raia inc_orq (demanda incidente) ----
  - id: inc_orq_s1
    raia: inc_orq
    tipo: inicio
    rotulo: Incidente declarado
    condicao: ''
    proximo:
      - {para: inc_orq_t1, condicao: ''}
    estado: {}
    layout: {coluna: 0}
    publico: false
  - id: inc_orq_t1
    raia: inc_orq
    tipo: tarefa
    rotulo: Mitigar e comunicar
    condicao: ''
    proximo:
      - {para: inc_orq_e1, condicao: ''}
    estado: {}
    layout: {coluna: 1}
    publico: false
  - id: inc_orq_e1
    raia: inc_orq
    tipo: fim
    retorno: normalizado
    rotulo: Serviço normalizado
    condicao: ''
    proximo: []
    estado: {}
    layout: {coluna: 2}
    publico: false

celulas:
  - demanda: bug
    requisito: funcional
    perguntas_chave: []
    tecnicas: []
    abordagens: []
    padroes: []
    estrategias: []
    categorias_ferramenta: []
    publico: false
  - demanda: incidente
    requisito: funcional
    perguntas_chave: []
    tecnicas: []
    abordagens: []
    padroes: []
    estrategias: []
    categorias_ferramenta: []
    publico: false

playbooks:
  - id: pb_bug_orq_s1
    resumo: Todo bug nasce de um relato. Registre o que foi visto antes de agir.
    perguntas_chave: [pq_bug_orq_s1_1]
    fazer:
      - Registrar o relato com data e ambiente
      - Anexar evidências
    evitar:
      - Corrigir sem reproduzir
    tecnicas:
      - tec_x5_whys
    publico: false
  - id: pb_bug_orq_c1
    resumo: Chame a raia de diagnóstico e espere um dos retornos nomeados.
    fazer:
      - Entregar o relato completo à raia de diagnóstico
    publico: false
  - id: pb_bug_orq_g1
    resumo: Avalie os critérios de potencial incidente.
    perguntas_chave: [pq_bug_orq_g1_1]
    fazer:
      - Conferir cada critério
    evitar:
      - Decidir sem dados
    abordagens:
      - abo_triagem
    publico: false
  - id: pb_bug_orq_t1
    resumo: Deixe o rastro entre bug e incidente no ticket.
    publico: false
  - id: pb_bug_diag_s1
    resumo: Comece pela reprodução em ambiente controlado.
    publico: false
  - id: pb_bug_corr_t1
    resumo: Corrija o defeito e escreva o teste que o teria pego.
    fazer:
      - Escrever o teste antes da correção
    evitar:
      - Correção sem teste de regressão
    padroes:
      - pad_teste_regressao
    publico: false

abordagens:
  - id: abo_triagem
    nome: Triagem por critérios
    publico: false
tecnicas:
  - id: tec_x5_whys
    nome: 5 porquês
    publico: false
padroes:
  - id: pad_teste_regressao
    nome: Teste de regressão
    publico: false
estrategias:
  - id: est_hotfix
    nome: Hotfix controlado
    publico: false
categorias_ferramenta: []
fontes: []

decisor_construir_comprar_assinar:
  criterios: [diferenciacao, tempo_ate_valor, custo_total, dependencia_fornecedor, risco]
  escala: {min: 1, max: 5}
  opcoes: [construir, comprar, assinar]
  ordem_desempate: [assinar, comprar, construir]
  pesos:
    cumprir_prazo: {diferenciacao: 0.10, tempo_ate_valor: 0.40, custo_total: 0.20, dependencia_fornecedor: 0.10, risco: 0.20}
    diferenciar_produto: {diferenciacao: 0.40, tempo_ate_valor: 0.15, custo_total: 0.15, dependencia_fornecedor: 0.15, risco: 0.15}
    reduzir_custo: {diferenciacao: 0.10, tempo_ate_valor: 0.15, custo_total: 0.40, dependencia_fornecedor: 0.15, risco: 0.20}
    validar_hipotese: {diferenciacao: 0.10, tempo_ate_valor: 0.35, custo_total: 0.20, dependencia_fornecedor: 0.10, risco: 0.25}

perguntas:
  - id: pq_bug_orq_s1_1
    texto: "Quem foi afetado e desde quando?"
    depende_de: [bug_orq_s1]
  - id: pq_bug_orq_g1_1
    texto: "O raio de impacto cresce?"
    depende_de: [bug_orq_g1]
