name: release
on:
  push:
    tags: ['v*.*.*']
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check the actor and the tag format
        env:
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "sayymon" ] || [ "$OWNER" != "sayymon" ]; then
            echo "Only the owner can create releases." >&2
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag must follow SemVer: vX.Y.Z" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  verify:
    name: verify
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run validate
      - run: npm test
      - run: npm run build
        env:
          SITE_BASE: /software-engineer-kit
          SITE_URL: https://sayymon.github.io/software-engineer-kit
      - run: npm run smoke
        env:
          SITE_BASE: /software-engineer-kit
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
      - name: Zip the site
        env:
          TAG: ${{ github.ref_name }}
        run: (cd site/dist && zip -qr "$GITHUB_WORKSPACE/site-$TAG.zip" .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-zip
          path: site-*.zip
          if-no-files-found: error
  release:
    name: release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-zip
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --generate-notes "${flags[@]}" "site-$TAG.zip"
  deploy-pages:
    name: deploy-pages
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
