  - evitar:
    - Classificar pelo medo de acordar alguém
    - Rebaixar severidade para "não fazer barulho"
    fazer:
    - 'SEV1: indisponibilidade total, perda de dados ou impacto financeiro e de segurança relevante'
    - 'SEV2: degradação importante ou parte dos clientes sem funcionalidade central'
    - 'SEV3: impacto limitado, com contorno disponível'
    - Em dúvida entre dois níveis, adote o mais alto e reveja depois
    id: pb_inc_cls_t1
    exemplo: "Checkout com 12% de erros, mas com contorno por outro meio de pagamento: classificado como SEV2."
