    fazer:
    - Envie a mensagem de resolução ao mesmo público do aviso inicial
    - Informe quando o post-mortem será publicado
    id: pb_inc_enc_t2
    exemplo: "Resolvido às 14h40, 38 minutos de falha em 12% dos pagamentos; correção definitiva segue como bug."
    publico: false
    resumo: 'Feche o ciclo com quem foi avisado: o que houve, impacto, estado atual e próximo passo (post-mortem).'
    status: rascunho
    tecnicas:
    - tec_comunicacao_incidente
  - id: pb_inc_enc_e1
    exemplo: "A raia Encerramento devolve «encerrado» entregando Comunicado de resolução, Relato do bug e Linha do tempo do incidente; em Encerrar o incidente (inc_orq_c9), o fluxo segue para «Aprender com o incidente». Por exemplo, Comunicado de resolução: Resolvido às 14h40: 38 minutos de falha em 12% dos pagamentos; correção definitiva segue como bug."
    resumo: 'Retorno «encerrado» da raia Encerramento: incidente encerrado. Quem chamou a raia segue por este retorno.'
    status: rascunho
    publico: false
  - id: pb_inc_pos_s0
    exemplo: "A raia Aprendizado pós-incidente começa recebendo Linha do tempo do incidente, Severidade e Orçamento de erro estourado; o primeiro passo é «Exige post-mortem formal?». Por exemplo, Linha do tempo do incidente: 14h02 alerta de erro no checkout; 14h05 IC assume; 14h12 rollback da versão 4.12; 14h20 taxa de erro normal."
    resumo: 'Início da raia Aprendizado pós-incidente. Responsabilidade: transformar o incidente em aprendizado e ações corretivas.'
