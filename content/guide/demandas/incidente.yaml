    exemplo: "A raia Classificação de severidade começa recebendo Alerta triado, Impacto confirmado e Serviço tem SLO; o primeiro passo é «Classificar a severidade (SEV1 a SEV3)». Por exemplo, Alerta triado: Latência p99 do checkout acima de 3 s há 10 min, 12% das requisições com erro."
