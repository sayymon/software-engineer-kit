  - id: pb_inc_cmd_g3
    exemplo: "SRE decide com Papéis do incidente e Severidade: «sim, dependência fora do time ou sem progresso» leva a «Escalar»; «não, o time resolve sozinho» leva a «Seguir sem escalada». Por exemplo, Papéis do incidente: IC: plantonista de SRE; comunicação: PM do checkout; registro: dev do time; investigação: dev e SRE."
    resumo: 'Escalar cedo é cuidado, não fracasso. Defina critérios antes: dependência externa, causa fora do serviço ou tempo sem progresso.'
    fazer:
