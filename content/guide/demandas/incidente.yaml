    estado:
      severidade: sev1|sev2
    entradas: [linha_do_tempo_do_incidente, severidade]
    saidas: [post_mortem, impacto_no_sla, diagrama_de_ishikawa]
    subtarefas:
      - id: inc_pos_t1_st1
        rotulo: "Reconstruir a linha do tempo com os fatos"
        papel: sre
        entradas: [linha_do_tempo_do_incidente]
        saidas: [post_mortem]
        tecnicas:
          - tecnica: tec_linha_do_tempo
            uso: obrigatoria
            porque: "fatos com horário antes de qualquer opinião"
        exemplo: "Linha do tempo completa: deploy, alerta, comando, rollback e estabilização, com horários."
        status: rascunho
      - id: inc_pos_t1_st2
        rotulo: "Conduzir a análise sem culpados"
        papel: tech_lead
        apoio: [sre, dev]
        entradas: [post_mortem]
        saidas: [post_mortem, diagrama_de_ishikawa]
        tecnicas:
          - tecnica: tec_ishikawa
            uso: recomendada
            porque: "chega às causas de sistema por categoria, sem parar na primeira"
          - tecnica: tec_blameless_postmortem
            uso: obrigatoria
            porque: "pessoas falam do que aconteceu sem medo"
          - tecnica: tec_x5_whys
            uso: recomendada
            porque: "chega à causa de sistema, não à pessoa"
        exemplo: "Causa: cálculo de frete sem flag; detecção boa (2 minutos); rollback demorou 10 minutos por falta de runbook."
        status: rascunho
