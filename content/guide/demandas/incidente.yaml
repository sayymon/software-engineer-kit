    exemplo: "A raia Reavaliação de severidade devolve «severidade_mantida» entregando Severidade e Severidade mudou; em Reavaliar a severidade (inc_orq_c8), o fluxo segue para «Mitigar e verificar o serviço (até 3 tentativas)»."
    resumo: 'Retorno «severidade_mantida» da raia Reavaliação de severidade: severidade mantida. Quem chamou a raia segue por este retorno.'
