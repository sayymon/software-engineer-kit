# Demanda: Incidente. Raias, nós, playbooks e células desta demanda.
demandas:
  - id: incidente
    nome: Incidente
    sigla: inc
    publico: false
# RASCUNHO: revisão humana. Raias com responsabilidade única (SRP) das três demandas (feature, bug e incidente). A feature cobre a variante com IA e agentes.
raias:
  - id: inc_orq
    nome: Orquestração do incidente
    demanda: incidente
    responsabilidade: Conduzir o incidente do alerta ao serviço restaurado, delegando cada etapa a uma raia
    cor: '#607D8B'
    orquestradora: true
    status: rascunho
    publico: false
  - id: inc_tri
    nome: Detecção e triagem
    demanda: incidente
    responsabilidade: Confirmar se o alerta tem impacto real no cliente
    cor: '#0072B2'
    entradas: [alerta_de_falha]
    status: rascunho
    publico: false
  - id: inc_cls
    nome: Classificação de severidade
    demanda: incidente
    responsabilidade: Classificar a severidade do incidente, considerando janelas críticas
    cor: '#E69F00'
    entradas: [alerta_triado, impacto_confirmado, tem_slo]
    status: rascunho
    publico: false
    entradas:
    - alerta_triado
    - impacto_confirmado
    - tem_slo
    - sinais_do_alerta
    - tem_sla
  - id: inc_cmd
    nome: Comando do incidente
    demanda: incidente
    responsabilidade: Definir o comando conforme a estrutura do time e sinalizar a necessidade de escalada
    cor: '#009E73'
    status: rascunho
    publico: false
    entradas:
    - severidade
    - estrutura_time
    - tem_oncall
    - linha_do_tempo_do_incidente
  - id: inc_esc
    nome: Escalada
    demanda: incidente
    responsabilidade: Escalar o incidente para outro time ou para a liderança
    cor: '#D55E00'
    status: rascunho
    publico: false
    entradas:
    - requer_escalada
    - papeis_do_incidente
    - registro_da_mitigacao
    - linha_do_tempo_do_incidente
  - id: inc_rcl
    nome: Reavaliação de severidade
    demanda: incidente
    responsabilidade: Reavaliar a severidade e dizer se ela mudou
    cor: '#CC79A7'
    status: rascunho
    publico: false
    entradas:
    - motivo_escalada
    - severidade
    - sinais_do_alerta
    - linha_do_tempo_do_incidente
  - id: inc_com
    nome: Comunicação por severidade
    demanda: incidente
    responsabilidade: Comunicar o incidente na cadência da severidade
    cor: '#56B4E9'
    status: rascunho
    publico: false
    entradas:
    - severidade
    - papeis_do_incidente
    - severidade_mudou
    - turno_ativo
    - handoff_de_turno
  - id: inc_con
    nome: Contenção de danos
    demanda: incidente
    responsabilidade: Conter os danos na intensidade da severidade
    cor: '#882255'
    status: rascunho
    publico: false
    entradas:
    - severidade
    - contencao_restrita
    - sinais_do_alerta
  - id: inc_mit
    nome: Mitigação e verificação
    demanda: incidente
    responsabilidade: Restaurar o serviço e verificar a estabilidade em até 3 tentativas
    cor: '#999933'
    status: rascunho
    publico: false
    entradas:
    - sinais_do_alerta
    - acao_de_contencao
    - contencao
    - tem_runbook
    - severidade
    - tentativas_mitigacao
    - linha_do_tempo_do_incidente
    - ambiente_de_dr
  - id: inc_enc
    nome: Encerramento
    demanda: incidente
    responsabilidade: Encerrar o incidente com a causa tratada e a resolução comunicada
    cor: '#44AA99'
    status: rascunho
    publico: false
    entradas:
    - servico_restaurado
    - verificacao_de_estabilidade
    - registro_da_mitigacao
    - linha_do_tempo_do_incidente
    - comunicado_do_incidente
  - id: inc_pos
    nome: Aprendizado pós-incidente
    demanda: incidente
    responsabilidade: Transformar o incidente em aprendizado e ações corretivas
    cor: '#332288'
    status: rascunho
    publico: false
    entradas:
    - linha_do_tempo_do_incidente
    - severidade
    - orcamento_erro_estourado
    - tem_sla
decisoes:
  # ==== demanda incidente (raias inc_*) ====
  # ---- raia inc_orq: Orquestração do incidente ----
  - id: inc_orq_s0
    raia: inc_orq
    tipo: inicio
    rotulo: Alerta ou relato de falha em produção
    condicao: ''
    proximo:
    - para: inc_orq_c1
      condicao: ''
    estado:
      tentativas_mitigacao: 0
      tem_slo: sim|nao
    saidas: [alerta_de_falha, tem_slo, estrutura_time, tem_oncall, tem_sla]
    playbook: pb_inc_orq_s0
    layout:
      coluna: 0
    status: rascunho
    publico: false
  - id: inc_orq_c1
    raia: inc_orq
    tipo: chamada
    raia_chamada: inc_tri
    rotulo: Detectar e triar o alerta
    condicao: ''
    proximo:
    - para: inc_orq_c2
      condicao: impacto_confirmado
    - para: inc_orq_e1
      condicao: alarme_falso
    estado: {}
    entradas: [alerta_de_falha]
    saidas: [alerta_triado, impacto_confirmado, linha_do_tempo_do_incidente, sinais_do_alerta, tem_runbook]
    playbook: pb_inc_orq_c1
    layout:
      coluna: 1
    status: rascunho
    publico: false
  - id: inc_orq_c2
    raia: inc_orq
    tipo: chamada
    raia_chamada: inc_cls
    rotulo: Classificar a severidade
    condicao: ''
    proximo:
    - para: inc_orq_c3
      condicao: sev1
    - para: inc_orq_c3
      condicao: sev2
    - para: inc_orq_c3
      condicao: sev3
    estado: {}
    entradas: [alerta_triado, impacto_confirmado, tem_slo, sinais_do_alerta, tem_sla]
    saidas: [severidade, janela_critica, tipo_janela, contencao_restrita, orcamento_erro_estourado]
    playbook: pb_inc_orq_c2
    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: inc_orq_c3
    raia: inc_orq
    tipo: chamada
    raia_chamada: inc_cmd
    rotulo: Assumir o comando e decidir a escalada
    condicao: ''
    proximo:
    - para: inc_orq_c4
      condicao: seguir
    - para: inc_orq_c7
      condicao: escalar
    estado: {}
    entradas: [severidade, estrutura_time, tem_oncall, linha_do_tempo_do_incidente]
    saidas: [papeis_do_incidente, requer_escalada]
    playbook: pb_inc_orq_c3
    layout:
      coluna: 3
    status: rascunho
    publico: false
  - id: inc_orq_c4
    raia: inc_orq
    tipo: chamada
    raia_chamada: inc_com
    rotulo: Comunicar conforme a severidade
    condicao: ''
    proximo:
    - para: inc_orq_c5
      condicao: comunicado
    estado: {}
    entradas: [severidade, papeis_do_incidente]
    saidas: [comunicado_do_incidente]
    playbook: pb_inc_orq_c4
    layout:
      coluna: 4
    status: rascunho
    publico: false
  - id: inc_orq_c5
    raia: inc_orq
    tipo: chamada
    raia_chamada: inc_con
    rotulo: Conter danos conforme a severidade
    condicao: ''
    proximo:
    - para: inc_orq_c6
      condicao: contido
    estado: {}
    entradas: [severidade, contencao_restrita]
    saidas: [acao_de_contencao, contencao]
    playbook: pb_inc_orq_c5
    layout:
      coluna: 5
    status: rascunho
    publico: false
  - id: inc_orq_c6
    raia: inc_orq
    tipo: chamada
    raia_chamada: inc_mit
    rotulo: Mitigar e verificar o serviço (até 3 tentativas)
    condicao: ''
    proximo:
    - para: inc_orq_c9
      condicao: estavel
    - para: inc_orq_c7
      condicao: tentativas_esgotadas
    estado: {}
    entradas: [sinais_do_alerta, acao_de_contencao, contencao, tem_runbook]
    saidas: [registro_da_mitigacao, verificacao_de_estabilidade, servico_restaurado]
    playbook: pb_inc_orq_c6
    layout:
      coluna: 6
    status: rascunho
    publico: false
  - id: inc_orq_c7
    raia: inc_orq
    tipo: chamada
    raia_chamada: inc_esc
    rotulo: Escalar para outro time ou para a liderança
    condicao: ''
    proximo:
    - para: inc_orq_c8
      condicao: escalado
    estado: {}
    entradas: [requer_escalada, papeis_do_incidente, registro_da_mitigacao]
    saidas: [pedido_de_escalada, motivo_escalada]
    playbook: pb_inc_orq_c7
    layout:
      coluna: 7
    status: rascunho
    publico: false
  - id: inc_orq_c8
    raia: inc_orq
    tipo: chamada
    raia_chamada: inc_rcl
    rotulo: Reavaliar a severidade
    condicao: ''
    proximo:
    - para: inc_orq_c4
      condicao: severidade_mudou
    - para: inc_orq_c6
      condicao: severidade_mantida
    estado: {}
    entradas: [motivo_escalada, severidade]
    saidas: [severidade, severidade_mudou]
    playbook: pb_inc_orq_c8
    layout:
      coluna: 8
    status: rascunho
    publico: false
  - id: inc_orq_c9
    raia: inc_orq
    tipo: chamada
    raia_chamada: inc_enc
    rotulo: Encerrar o incidente
    condicao: ''
    proximo:
    - para: inc_orq_c10
      condicao: encerrado
    estado: {}
    entradas: [verificacao_de_estabilidade, registro_da_mitigacao, linha_do_tempo_do_incidente]
    saidas: [comunicado_de_resolucao, relato_do_bug, linha_do_tempo_do_incidente]
    playbook: pb_inc_orq_c9
    layout:
      coluna: 7
    status: rascunho
    publico: false
  - id: inc_orq_c10
    raia: inc_orq
    tipo: chamada
    raia_chamada: inc_pos
    rotulo: Aprender com o incidente
    condicao: ''
    proximo:
    - para: inc_orq_e2
      condicao: formal
    - para: inc_orq_e2
      condicao: registro_leve
    estado: {}
    entradas: [linha_do_tempo_do_incidente, severidade, orcamento_erro_estourado, tem_sla]
    saidas: [post_mortem, acoes_corretivas, nota_do_incidente, ajuste_de_runbook_ou_alerta, impacto_no_sla]
    playbook: pb_inc_orq_c10
    layout:
      coluna: 8
    status: rascunho
    publico: false
  - id: inc_orq_e1
    raia: inc_orq
    tipo: fim
    retorno: alarme_falso
    rotulo: Alarme falso registrado e alerta ajustado
    condicao: ''
    proximo: []
    estado: {}
    entradas: [ajuste_de_runbook_ou_alerta]
    playbook: pb_inc_orq_e1
    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: inc_orq_e2
    raia: inc_orq
    tipo: fim
    retorno: restaurado
    rotulo: Serviço restaurado e aprendizado registrado
    condicao: ''
    proximo: []
    estado: {}
    entradas: [comunicado_de_resolucao, acoes_corretivas, nota_do_incidente, ajuste_de_runbook_ou_alerta, impacto_no_sla]
    playbook: pb_inc_orq_e2
    layout:
      coluna: 9
    status: rascunho
    publico: false
  # ---- raia inc_tri: Detecção e triagem ----
  - id: inc_tri_s0
    raia: inc_tri
    tipo: inicio
    rotulo: Alerta recebido para triagem
    condicao: ''
    proximo:
    - para: inc_tri_t1
      condicao: ''
    estado: {}
    playbook: pb_inc_tri_s0
    layout:
      coluna: 0
    status: rascunho
    publico: false
  - id: inc_tri_t1
    raia: inc_tri
    tipo: tarefa
    rotulo: Detecção e triagem inicial
    condicao: ''
    proximo:
    - para: inc_tri_g1
      condicao: ''
    estado:
      tem_runbook: sim|nao
    entradas: [alerta_de_falha]
    saidas: [linha_do_tempo_do_incidente, sinais_do_alerta, alerta_triado, tem_runbook]
    subtarefas:
      - id: inc_tri_t1_st1
        rotulo: "Reconhecer o alerta e abrir a linha do tempo"
        papel: sre
        entradas: [alerta_de_falha]
        saidas: [linha_do_tempo_do_incidente]
        tecnicas:
          - tecnica: tec_linha_do_tempo
            uso: obrigatoria
            porque: "registrar desde o primeiro minuto evita reconstruir de memória depois"
        exemplo: "14h02: alerta reconhecido pelo plantonista; canal do incidente aberto com a linha do tempo."
        status: rascunho
      - id: inc_tri_t1_st2
        rotulo: "Coletar os sinais: métricas, logs e mudanças recentes"
        papel: sre
        apoio: [dev]
        entradas: [alerta_de_falha]
        saidas: [sinais_do_alerta]
        tecnicas:
          - tecnica: tec_telemetria_padronizada
            uso: obrigatoria
            porque: "a mesma métrica para todos evita discussão sobre o que é normal"
          - tecnica: tec_logs_e_rastreamento
            uso: recomendada
            porque: "o rastro mostra onde a requisição falha"
        exemplo: "Erro 500 do checkout em 12% desde 14h00; deploy da 4.12 às 13h55."
        status: rascunho
      - id: inc_tri_t1_st3
        rotulo: "Verificar se existe runbook para o alerta"
        papel: sre
        entradas: [alerta_de_falha, sinais_do_alerta]
        saidas: [alerta_triado, tem_runbook]
        tecnicas:
          - tecnica: tec_runbook
            uso: recomendada
            porque: "o runbook encurta o caminho até a primeira mitigação"
        exemplo: "Runbook do alerta de erro do checkout encontrado: passos de rollback e de desligar flags."
        status: rascunho
    playbook: pb_inc_tri_t1
    layout:
      coluna: 1
    status: rascunho
    publico: false
  - id: inc_tri_g1
    raia: inc_tri
    tipo: bifurcacao
    rotulo: Impacto real no cliente?
    condicao: Impacto real no cliente?
    proximo:
    - para: inc_tri_e1
      condicao: sim, há impacto confirmado
    - para: inc_tri_t2
      condicao: não, alarme falso ou sem impacto
    estado:
      impacto_confirmado: sim|nao
    entradas: [sinais_do_alerta, alerta_triado]
    saidas: [impacto_confirmado]
    papel: sre
    consultado: [suporte]
    playbook: pb_inc_tri_g1
    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: inc_tri_t2
    raia: inc_tri
    tipo: tarefa
    rotulo: Registrar o alarme falso e ajustar o alerta
    condicao: ''
    proximo:
    - para: inc_tri_e2
      condicao: ''
    estado: {}
    entradas: [sinais_do_alerta, linha_do_tempo_do_incidente]
    saidas: [ajuste_de_runbook_ou_alerta, linha_do_tempo_do_incidente]
    subtarefas:
      - id: inc_tri_t2_st1
        rotulo: "Registrar por que não havia impacto"
        papel: sre
        entradas: [sinais_do_alerta, linha_do_tempo_do_incidente]
        saidas: [linha_do_tempo_do_incidente]
        exemplo: "Pico de erro de 30 segundos num endpoint interno sem cliente afetado."
        status: rascunho
      - id: inc_tri_t2_st2
        rotulo: "Ajustar o limite, a janela ou a rota do alerta"
        papel: sre
        entradas: [sinais_do_alerta]
        saidas: [ajuste_de_runbook_ou_alerta]
        tecnicas:
          - tecnica: tec_alertas
            uso: obrigatoria
            porque: "alarme falso repetido ensina o time a ignorar o alerta"
        exemplo: "Limite do alerta passa de 1% em 1 minuto para 2% em 5 minutos."
        status: rascunho
    playbook: pb_inc_tri_t2
    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: inc_tri_e1
    raia: inc_tri
    tipo: fim
    retorno: impacto_confirmado
    rotulo: Impacto confirmado
    condicao: ''
    proximo: []
    estado: {}
    saidas: [alerta_triado, impacto_confirmado, linha_do_tempo_do_incidente, sinais_do_alerta, tem_runbook]
    playbook: pb_inc_tri_e1
    layout:
      coluna: 3
    status: rascunho
    publico: false
  - id: inc_tri_e2
    raia: inc_tri
    tipo: fim
    retorno: alarme_falso
    rotulo: Alarme falso ou sem impacto
    condicao: ''
    proximo: []
    estado: {}
    saidas: [impacto_confirmado, ajuste_de_runbook_ou_alerta]
    playbook: pb_inc_tri_e2
    layout:
      coluna: 3
    status: rascunho
    publico: false
  # ---- raia inc_cls: Classificação de severidade ----
  - id: inc_cls_s0
    raia: inc_cls
    tipo: inicio
    rotulo: Impacto confirmado, classificar
    condicao: ''
    proximo:
    - para: inc_cls_t1
      condicao: ''
    estado: {}
    entradas: [alerta_triado, impacto_confirmado, tem_slo]
    playbook: pb_inc_cls_s0
    layout:
      coluna: 0
    status: rascunho
    publico: false
  - id: inc_cls_t1
    raia: inc_cls
    tipo: tarefa
    rotulo: Classificar a severidade (SEV1 a SEV3)
    condicao: ''
    proximo:
    - para: inc_cls_g1
      condicao: ''
    estado:
      severidade: sev1|sev2|sev3
    entradas: [alerta_triado, impacto_confirmado, tem_slo, tem_sla]
    saidas: [raio_de_impacto, severidade, justificativa_da_severidade, orcamento_erro_estourado]
    subtarefas:
      - id: inc_cls_t1_st1
        exemplo: "Compras afetadas: 8 mil nos últimos 15 minutos, em 3 países, com cerca de 12% das tentativas de pagamento falhando."
        rotulo: "Estimar o raio de impacto"
        papel: sre
        apoio: [dev]
        entradas: [alerta_triado, impacto_confirmado]
        saidas: [raio_de_impacto]
        tecnicas:
          - tecnica: tec_blast_radius
            uso: obrigatoria
            porque: "mede o alcance em clientes e receita, no lugar de palpite"
          - tecnica: tec_slo_sli
            uso: opcional
            porque: "traduz o alerta em impacto percebido pelo cliente"
        status: rascunho
      - id: inc_cls_t1_st2
        exemplo: "Indisponibilidade parcial do checkout com perda de receita relevante cai na linha de SEV2 da matriz. Se as vendas pararem por completo, sobe para SEV1."
        rotulo: "Aplicar a matriz de severidade"
        papel: sre
        apoio: [tech_lead]
        entradas: [raio_de_impacto, impacto_confirmado]
        saidas: [severidade, orcamento_erro_estourado, justificativa_da_severidade]
        tecnicas:
          - tecnica: tec_sla
            uso: condicional
            quando: {todos: [{var: tem_sla, igual: sim}]}
            porque: "incidente que ameaça um compromisso contratual sobe na matriz"
          - tecnica: tec_matriz_severidade
            uso: obrigatoria
            porque: "um critério escrito evita classificar por medo ou por intuição"
          - tecnica: tec_error_budget
            uso: condicional
            quando: {todos: [{var: tem_slo, igual: "sim"}]}
            porque: "com SLO definido, o consumo do orçamento de erro mostra a gravidade"
        consultado: [pm]
        status: rascunho
      - id: inc_cls_t1_st3
        exemplo: "Severidade SEV2 registrada às 14h20, com a justificativa: 12% das compras falham, há contorno por outro meio de pagamento."
        rotulo: "Registrar a severidade e a justificativa"
        papel: sre
        entradas: [severidade, raio_de_impacto]
        saidas: [justificativa_da_severidade]
        tecnicas:
          - tecnica: tec_linha_do_tempo
            uso: recomendada
            porque: "a justificativa vira o primeiro item da linha do tempo do incidente"
          - tecnica: tec_blameless_postmortem
            uso: condicional
            quando: {todos: [{var: severidade, em: [sev1, sev2]}]}
            porque: "SEV1 e SEV2 pedem post-mortem formal, e fatos registrados sem culpa alimentam essa análise"
        status: rascunho
    playbook: pb_inc_cls_t1
    layout:
      coluna: 1
    status: rascunho
    publico: false
  - id: inc_cls_g1
    raia: inc_cls
    tipo: bifurcacao
    rotulo: Afetado por janela crítica ou sazonalidade?
    condicao: O fluxo é afetado por janela crítica, evento repentino ou sazonalidade?
    proximo:
    - para: inc_cls_t2
      condicao: sim, há janela crítica ativa
    - para: inc_cls_g2
      condicao: não, sem janela crítica
    estado:
      janela_critica: sim|nao
      tipo_janela: sazonal|repentina|freeze|manutencao|nenhuma
    entradas: [severidade]
    saidas: [janela_critica, tipo_janela]
    tecnicas:
      - tecnica: tec_calendario_eventos_criticos
        uso: obrigatoria
        porque: "a janela crítica só aparece quando alguém consulta o calendário"
      - tecnica: tec_status_de_janela
        uso: recomendada
        porque: "mostra se há freeze ou manutenção em vigor agora"
    papel: sre
    apoio: [pm]
    playbook: pb_inc_cls_g1
    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: inc_cls_t2
    raia: inc_cls
    tipo: tarefa
    rotulo: 'Janela crítica: reavaliar severidade e contenção'
    condicao: ''
    proximo:
    - para: inc_cls_g2
      condicao: ''
    estado:
      janela_critica: sim
      tipo_janela: sazonal|repentina|freeze|manutencao
      severidade: sev1|sev2|sev3  # nunca abaixo da severidade mínima definida para a janela
      contencao_restrita: sim  # evitar deploy na janela e preferir feature flag a rollback de grande escopo
    entradas: [severidade, janela_critica, tipo_janela, raio_de_impacto, justificativa_da_severidade]
    saidas: [severidade, contencao_restrita, justificativa_da_severidade]
    subtarefas:
      - id: inc_cls_t2_st1
        exemplo: "É a semana de um grande lançamento de creator: um incidente que seria SEV3 passa a valer no mínimo SEV2 até o fim da janela."
        rotulo: "Elevar a severidade mínima da janela"
        papel: sre
        apoio: [stakeholder]
        entradas: [severidade, tipo_janela]
        saidas: [severidade, justificativa_da_severidade]
        tecnicas:
          - tecnica: tec_capacity_planning_sazonal
            uso: opcional
            porque: "ajuda a calibrar a severidade mínima nos picos previsíveis"
        status: rascunho
      - id: inc_cls_t2_st2
        exemplo: "Durante a janela, a reversão do release fica proibida sem aprovação do responsável. A contenção passa a ser desligar a flag da novidade."
        rotulo: "Restringir a contenção arriscada"
        papel: sre
        apoio: [dev]
        entradas: [severidade, raio_de_impacto, tipo_janela]
        saidas: [contencao_restrita, justificativa_da_severidade]
        tecnicas:
          - tecnica: tec_feature_flags
            uso: recomendada
            porque: "desligar por flag evita deploy em plena janela"
          - tecnica: tec_canary_release
            uso: condicional
            quando: {todos: [{var: janela_critica, igual: "sim"}, {var: tipo_janela, em: [sazonal, repentina]}]}
            porque: "no pico, a mudança de contenção sobe aos poucos para limitar o dano"
          - tecnica: tec_code_freeze
            uso: condicional
            quando: {todos: [{var: tipo_janela, em: [freeze, manutencao]}]}
            porque: "em freeze ou manutenção, qualquer mudança exige exceção aprovada"
        status: rascunho
      - id: inc_cls_t2_st3
        exemplo: "Na linha do tempo: \"14h35, severidade elevada de SEV3 para SEV2 por causa do lançamento em andamento\"."
        rotulo: "Registrar o motivo na linha do tempo"
        papel: sre
        entradas: [justificativa_da_severidade, severidade]
        saidas: [justificativa_da_severidade]
        tecnicas:
          - tecnica: tec_linha_do_tempo
            uso: recomendada
            porque: "quem assume depois entende por que a severidade subiu"
        status: rascunho
    playbook: pb_inc_cls_t2
    layout:
      coluna: 3
    status: rascunho
    publico: false
