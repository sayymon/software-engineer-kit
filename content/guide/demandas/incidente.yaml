# Playbooks vindos da proposta (texto já sem travessões). RASCUNHO: revisão humana.
perguntas:
  - id: pq_inc_tri_t1_1
    texto: "Quem está sendo afetado e desde quando?"
    depende_de: [inc_tri_t1]
    status: rascunho
    publico: false
  - id: pq_inc_tri_t1_2
    texto: "O que mudou nas últimas horas (deploy, configuração, tráfego)?"
    depende_de: [inc_tri_t1]
    status: rascunho
    publico: false
  - id: pq_inc_tri_t1_3
    texto: "Existe runbook para este sintoma?"
    depende_de: [inc_tri_t1]
    status: rascunho
    publico: false
  - id: pq_inc_cls_t1_1
    texto: "Há perda de dados ou indisponibilidade total?"
    depende_de: [inc_cls_t1]
    status: rascunho
    publico: false
  - id: pq_inc_cls_t1_2
    texto: "Quantos clientes e qual receita estão afetados?"
    depende_de: [inc_cls_t1]
    status: rascunho
    publico: false
  - id: pq_inc_cls_t1_3
    texto: "Existe contorno para o cliente?"
