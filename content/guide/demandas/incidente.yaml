  - id: pb_inc_com_e1
    exemplo: "A raia Comunicação por severidade devolve «comunicado» entregando Comunicado do incidente; em Comunicar conforme a severidade (inc_orq_c4), o fluxo segue para «Conter danos conforme a severidade». Por exemplo, Comunicado do incidente: 14h30: pagamentos com cartão falham para 12% dos compradores; rollback em andamento; próxima atualização às 15h."
    resumo: 'Retorno «comunicado» da raia Comunicação por severidade: comunicação feita. Quem chamou a raia segue por este retorno.'
