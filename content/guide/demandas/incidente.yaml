    - tec_oncall_rotation
    - tec_follow_the_sun
    status: rascunho
    publico: false
  - id: pb_inc_cmd_t2
    exemplo: "Plantonista de SRE acionado em 3 minutos. IC no plantonista; comunicação com a PM; registro com um dev."
    resumo: O engenheiro de plantão é o incident commander (IC) por padrão. SRE ou plataforma apoiam com ferramentas e infraestrutura.
