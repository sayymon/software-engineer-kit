playbooks:
  - evitar:
    - Começar a investigar em conversas paralelas e dispersas
    - Esperar "ter certeza" para avisar o time
    fazer:
    - Registre quem detectou, quando e por qual canal (alerta, cliente, suporte)
    - Abra um canal único de coordenação desde o primeiro minuto
    - Se o incidente veio do fluxo de bug (ligação aciona), registre o link do ticket do bug e siga em paralelo com ele
    id: pb_inc_orq_s0
    exemplo: "A raia Orquestração do incidente começa recebendo Alerta de falha, Serviço tem SLO e Estrutura do time; o primeiro passo é «Detectar e triar o alerta». Por exemplo, Alerta de falha: Alerta de monitoria: taxa de erro 5xx do checkout em 12% desde as 14h03."
    publico: false
    resumo: Incidente é qualquer evento que degrada o serviço para o cliente agora. A prioridade é restaurar o serviço, não achar culpado.
    status: rascunho
    tecnicas:
    - tec_incident_command
  - id: pb_inc_orq_c1
    exemplo: "Chama a raia Detecção e triagem; «impacto_confirmado» leva a «Classificar a severidade»; «alarme_falso» leva a «Alarme falso registrado e alerta ajustado». Por exemplo, Alerta triado: Latência p99 do checkout acima de 3 s há 10 min, 12% das requisições com erro."
    resumo: 'Chama a raia Detecção e triagem: confirmar se o alerta tem impacto real no cliente. O fluxo segue pelo retorno que a raia devolver.'
    fazer:
    - 'Retornos possíveis: impacto_confirmado, alarme_falso'
    - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c2
    exemplo: "Chama a raia Classificação de severidade; «sev1» leva a «Assumir o comando e decidir a escalada»; «sev2» leva a «Assumir o comando e decidir a escalada»; «sev3» leva a «Assumir o comando e decidir a escalada»."
    resumo: 'Chama a raia Classificação de severidade: classificar a severidade do incidente, considerando janelas críticas. O fluxo segue pelo retorno que a raia devolver.'
    fazer:
    - 'Retornos possíveis: sev1, sev2, sev3'
    - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c3
    exemplo: "Chama a raia Comando do incidente; «seguir» leva a «Comunicar conforme a severidade»; «escalar» leva a «Escalar para outro time ou para a liderança». Por exemplo, Papéis do incidente: IC: plantonista de SRE; comunicação: PM do checkout; registro: dev do time; investigação: dev e SRE."
    resumo: 'Chama a raia Comando do incidente: definir o comando conforme a estrutura do time e sinalizar a necessidade de escalada. O fluxo segue pelo retorno que a raia devolver.'
    fazer:
    - 'Retornos possíveis: seguir, escalar'
    - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c4
    exemplo: "Chama a raia Comunicação por severidade; «comunicado» leva a «Conter danos conforme a severidade». Por exemplo, Comunicado do incidente: 14h30: pagamentos com cartão falham para 12% dos compradores; rollback em andamento; próxima atualização às 15h."
    resumo: 'Chama a raia Comunicação por severidade: comunicar o incidente na cadência da severidade. O fluxo segue pelo retorno que a raia devolver.'
    fazer:
    - 'Retornos possíveis: comunicado'
    - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c5
    exemplo: "Chama a raia Contenção de danos; «contido» leva a «Mitigar e verificar o serviço (até 3 tentativas)». Por exemplo, Ação de contenção: Flag do novo cálculo de frete desligada às 14h10; checkout volta a usar o cálculo anterior."
    resumo: 'Chama a raia Contenção de danos: conter os danos na intensidade da severidade. O fluxo segue pelo retorno que a raia devolver.'
    fazer:
    - 'Retornos possíveis: contido'
    - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c6
    exemplo: "Chama a raia Mitigação e verificação; «estavel» leva a «Encerrar o incidente»; «tentativas_esgotadas» leva a «Escalar para outro time ou para a liderança». Por exemplo, Registro da mitigação: Tentativa 1: rollback da 4.12 às 14h12, erro caiu de 12% para 0,3%."
    resumo: 'Chama a raia Mitigação e verificação: restaurar o serviço e verificar a estabilidade em até 3 tentativas. O fluxo segue pelo retorno que a raia devolver.'
    fazer:
    - 'Retornos possíveis: estavel, tentativas_esgotadas'
    - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c7
    exemplo: "Chama a raia Escalada; «escalado» leva a «Reavaliar a severidade». Por exemplo, Pedido de escalada: Para o time de pagamentos: SEV1, 2 mitigações sem efeito, precisamos de quem conhece o gateway."
    resumo: 'Chama a raia Escalada: escalar o incidente para outro time ou para a liderança. O fluxo segue pelo retorno que a raia devolver.'
    fazer:
    - 'Retornos possíveis: escalado'
    - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c8
    exemplo: "Chama a raia Reavaliação de severidade; «severidade_mudou» leva a «Comunicar conforme a severidade»; «severidade_mantida» leva a «Mitigar e verificar o serviço (até 3 tentativas)»."
    resumo: 'Chama a raia Reavaliação de severidade: reavaliar a severidade e dizer se ela mudou. O fluxo segue pelo retorno que a raia devolver.'
    fazer:
    - 'Retornos possíveis: severidade_mudou, severidade_mantida'
    - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c9
    exemplo: "Chama a raia Encerramento; «encerrado» leva a «Aprender com o incidente». Por exemplo, Comunicado de resolução: Resolvido às 14h40: 38 minutos de falha em 12% dos pagamentos; correção definitiva segue como bug."
    resumo: 'Chama a raia Encerramento: encerrar o incidente com a causa tratada e a resolução comunicada. O fluxo segue pelo retorno que a raia devolver.'
    fazer:
    - 'Retornos possíveis: encerrado'
    - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c10
    exemplo: "Chama a raia Aprendizado pós-incidente; «formal» leva a «Serviço restaurado e aprendizado registrado»; «registro_leve» leva a «Serviço restaurado e aprendizado registrado». Por exemplo, Post-mortem: Post-mortem do checkout: causa no cálculo de frete sem flag; detecção em 2 minutos; rollback em 10."
    resumo: 'Chama a raia Aprendizado pós-incidente: transformar o incidente em aprendizado e ações corretivas. O fluxo segue pelo retorno que a raia devolver.'
    fazer:
    - 'Retornos possíveis: formal, registro_leve'
    - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - evitar:
    - Deixar o alerta ruidoso como está
    fazer:
    - Anote o motivo do falso positivo
    - Abra tarefa para ajustar ou remover o alerta
    id: pb_inc_orq_e1
    exemplo: "A demanda termina em «alarme_falso»: alarme falso registrado e alerta ajustado, com Ajuste de runbook ou alerta. Por exemplo, Ajuste de runbook ou alerta: Limite do alerta de erro do checkout passou de 1% em 1 minuto para 2% em 5 minutos."
    publico: false
    resumo: Alarme falso também ensina. Ajuste o alerta para reduzir ruído e proteger a atenção de quem está de plantão.
    status: rascunho
  - evitar:
    - Encerrar sem registrar o resultado
    fazer:
    - Arquive o canal com o resumo e links da linha do tempo
    id: pb_inc_orq_e2
    exemplo: "A demanda termina em «restaurado»: serviço restaurado e aprendizado registrado, com Comunicado de resolução, Ações corretivas e Nota do incidente. Por exemplo, Comunicado de resolução: Resolvido às 14h40: 38 minutos de falha em 12% dos pagamentos; correção definitiva segue como bug."
    publico: false
    resumo: Incidente bom é o que termina com o serviço de pé, o time com ação clara e o sistema um pouco mais forte.
    status: rascunho
  - id: pb_inc_tri_s0
    exemplo: "A raia Detecção e triagem começa recebendo Alerta de falha; o primeiro passo é «Detecção e triagem inicial». Por exemplo, Alerta de falha: Alerta de monitoria: taxa de erro 5xx do checkout em 12% desde as 14h03."
    resumo: 'Início da raia Detecção e triagem. Responsabilidade: confirmar se o alerta tem impacto real no cliente.'
    status: rascunho
    publico: false
  - evitar:
    - Descartar o alerta sem checar o impacto real
    - Investigar a causa antes de medir o impacto
    fazer:
    - Olhe os indicadores de saúde (erros, latência, disponibilidade) e compare com o normal
    - 'Cheque mudanças recentes: deploys, flags, migrações'
    - Procure o runbook do serviço e siga o primeiro passo
    id: pb_inc_tri_t1
    exemplo: "O alerta de pagamentos disparou às 14h02. Em 10 minutos a equipe confirma nos painéis que há falhas reais e já identifica o serviço afetado."
    perguntas_chave: [pq_inc_tri_t1_1, pq_inc_tri_t1_2, pq_inc_tri_t1_3]
    publico: false
    resumo: Confirme depressa se o problema é real e qual o impacto no cliente. Triagem leva minutos, não horas.
    status: rascunho
    tecnicas:
    - tec_runbook
    - tec_slo_sli
  - evitar:
    - Silenciar alerta sem registrar o motivo
    - Ignorar alerta recorrente "porque sempre é falso"
    fazer:
    - Se não houve impacto, registre o alerta e ajuste o limiar ou a regra
    - Na dúvida com sinais conflitantes, trate como incidente e reavalie em 10 minutos
    id: pb_inc_tri_g1
    exemplo: "Os painéis mostram 12% de erro no pagamento e reclamações no suporte: impacto real confirmado, então segue como incidente."
    publico: false
    resumo: 'Gate de realidade: sem impacto confirmado não há incidente, mas há dívida de alerta.'
    status: rascunho
  - id: pb_inc_tri_e1
    exemplo: "A raia Detecção e triagem devolve «impacto_confirmado» entregando Alerta triado, Impacto confirmado e Linha do tempo do incidente; em Detectar e triar o alerta (inc_orq_c1), o fluxo segue para «Classificar a severidade». Por exemplo, Alerta triado: Latência p99 do checkout acima de 3 s há 10 min, 12% das requisições com erro."
    resumo: 'Retorno «impacto_confirmado» da raia Detecção e triagem: impacto confirmado. Quem chamou a raia segue por este retorno.'
    status: rascunho
    publico: false
  - id: pb_inc_tri_e2
