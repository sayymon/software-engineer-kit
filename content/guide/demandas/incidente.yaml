        rotulo: "Calcular o impacto no SLA e os avisos ou créditos devidos"
        papel: sre
        apoio: [pm]
        quando: {todos: [{var: tem_sla, igual: sim}]}
        porque: "o contrato define o que o cliente recebe quando o compromisso é descumprido"
        entradas: [linha_do_tempo_do_incidente]
        saidas: [impacto_no_sla]
        tecnicas:
