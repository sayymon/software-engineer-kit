  - id: pb_inc_mit_e2
    exemplo: "A raia Mitigação e verificação devolve «tentativas_esgotadas» entregando Registro da mitigação e Tentativas de mitigação; em Mitigar e verificar o serviço (até 3 tentativas) (inc_orq_c6), o fluxo segue para «Escalar para outro time ou para a liderança». Por exemplo, Registro da mitigação: Tentativa 1: rollback da 4.12 às 14h12, erro caiu de 12% para 0,3%."
    resumo: 'Retorno «tentativas_esgotadas» da raia Mitigação e verificação: 3 tentativas esgotadas, escalar. Quem chamou a raia segue por este retorno.'
    status: rascunho
    publico: false
  - id: pb_inc_enc_s0
    exemplo: "A raia Encerramento começa recebendo Serviço restaurado, Verificação de estabilidade e Registro da mitigação; o primeiro passo é «Encaminhar a correção da causa e encerrar o incidente». Por exemplo, Verificação de estabilidade: Taxa de erro abaixo de 0,3% e latência p95 normal por 30 minutos seguidos."
    resumo: 'Início da raia Encerramento. Responsabilidade: encerrar o incidente com a causa tratada e a resolução comunicada.'
