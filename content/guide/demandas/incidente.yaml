    status: rascunho
    publico: false
  - id: pq_inc_cls_g1_1
    texto: "Estamos em pico sazonal, lançamento de creator, fechamento financeiro de período ou data promocional de alto volume?"
    depende_de: [inc_cls_g1]
    status: rascunho
    publico: false
  - id: pq_inc_cls_t2_1
    texto: "Qual a severidade mínima combinada para esta janela?"
