    tecnicas:
    - tec_matriz_severidade
  - id: pb_inc_cls_g1
    exemplo: "O incidente acontece na semana de um grande lançamento de creator, então a janela crítica está ativa e o fluxo segue pelo caminho \"sim\"."
    resumo: O contexto temporal muda a ação. Confira se existe janela crítica, evento repentino ou sazonalidade antes de decidir severidade e contenção.
    perguntas_chave: [pq_inc_cls_g1_1, pq_com_etg_g1_2, pq_com_etg_g1_3]
    fazer:
    - Consulte o calendário de eventos críticos e o status de janela
    - Registre janela_critica e tipo_janela (sazonal, repentina, freeze, manutencao ou nenhuma)
    - Em dúvida, trate como janela ativa e reavalie quando a dúvida for resolvida
    - 'Critério da saída «sim, há janela crítica ativa»: pico sazonal de vendas, lançamento de creator, fechamento financeiro de período, datas promocionais de alto volume, code freeze, janela de manutenção ou evento repentino (viral de creator, falha de provedor, ataque)'
    - 'Critério da saída «não, sem janela crítica»: seguir com a severidade classificada'
    evitar:
    - Decidir a severidade só pelo sintoma, ignorando o momento
    - Descobrir o freeze depois de fazer o deploy de contenção
    tecnicas:
    - tec_calendario_eventos_criticos
    - tec_status_de_janela
    - tec_code_freeze
    status: rascunho
    publico: false
  - id: pb_inc_cls_t2
    exemplo: "Por causa do lançamento em andamento, um problema que seria SEV3 passa a SEV2 e a comunicação ao time sai 30 minutos antes."
    resumo: Na janela crítica o mesmo sintoma custa mais. Suba a severidade mínima, antecipe escalada e comunicação e restrinja a contenção arriscada.
    perguntas_chave: [pq_inc_cls_t2_1, pq_inc_cls_t2_2]
    fazer:
    - "A severidade mínima por tipo de janela é um valor a calibrar com o time"
    - "Antecipe a escalada e o primeiro comunicado: o prazo antecipado é um valor a calibrar"
    - "Prefira kill switch ou degradação controlada a rollback de grande escopo, quando existirem"
    - "Em dúvida sobre a janela, trate como ativa e reavalie quando a dúvida for resolvida"
    - "Eleve a severidade mínima conforme o tipo de janela (valor a calibrar)"
    - "Evite deploy na janela; prefira feature flag, kill switch ou degradação controlada a rollback de grande escopo"
    - "Registre o motivo da reavaliação na linha do tempo"
    evitar:
    - Fazer deploy de correção em plena janela de pico
    - Manter a severidade baixa por o impacto parecer pequeno em números absolutos
    tecnicas:
    - tec_calendario_eventos_criticos
    - tec_code_freeze
    - tec_feature_flags
    - tec_capacity_planning_sazonal
    - tec_game_day
    status: rascunho
    publico: false
