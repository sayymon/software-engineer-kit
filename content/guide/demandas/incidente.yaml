    tecnicas:
    - tec_error_budget
  - evitar:
    - Procurar "o culpado"
    - Post-mortem sem dados da linha do tempo
    - Reunião só de quem esteve no incidente
    fazer:
    - Monte a linha do tempo com horários reais do canal
    - Faça os 5 porquês até chegar a fatores do sistema
    - Inclua o que deu certo, além do que falhou
    - Publique o documento para quem quiser ler
    id: pb_inc_pos_t1
    exemplo: "Linha do tempo completa: deploy, alerta, comando, rollback e estabilização, com horários. Causa: cálculo de frete sem flag; detecção boa (2 minutos); rollback demorou 10 minutos por falta de runbook. 38 minutos consumiram 88% do SLA do mês; sem violação; aviso contratual a 2 parceiros."
    perguntas_chave: [pq_inc_pos_t1_1, pq_inc_pos_t1_2, pq_inc_pos_t1_3]
    publico: false
    resumo: 'Aprender sem culpar: o foco é o sistema que permitiu a falha, não a pessoa.'
    status: rascunho
    tecnicas:
    - tec_blameless_postmortem
    - tec_x5_whys
    - tec_linha_do_tempo
  - evitar:
    - Ações genéricas ("melhorar monitoramento")
    - Ações sem dono
    fazer:
    - Priorize ações que removem a causa ou detectam mais cedo
    - Registre no backlog com prioridade visível
    - Inclua melhorias de alerta, runbook e cobertura de plantão
    - Ações que previnem uma classe de bug alimentam o fluxo de bug (etapa "Registrar ação preventiva e acompanhar") pela ligação alimenta
    id: pb_inc_pos_t2
    exemplo: "3 cards: flag obrigatória no frete, alerta por país, runbook de rollback do checkout."
    perguntas_chave: [pq_inc_pos_t2_1, pq_inc_pos_t2_2]
    publico: false
    resumo: Post-mortem sem ação é só história. Cada ação tem dono, prazo e critério de pronto.
    status: rascunho
    tecnicas:
    - tec_acoes_corretivas
    - tec_runbook
  - evitar:
    - Esquecer as ações depois da semana do incidente
    fazer:
    - Revise as ações abertas na retrospectiva ou na reunião de operação
    - Reporte ações atrasadas à liderança
    id: pb_inc_pos_t3
    exemplo: "Revisão semanal dos 3 cards até o último fechar. Resumo do post-mortem enviado aos times: toda mudança de cálculo sai atrás de flag."
    publico: false
    resumo: 'Follow-up fecha o aprendizado: revise o andamento das ações em cadência fixa.'
    status: rascunho
    tecnicas:
    - tec_acoes_corretivas
  - evitar:
    - Descartar o aprendizado por ser incidente pequeno
    fazer:
    - Anote causa, correção e o que evitaria a repetição
    - Atualize o runbook
    id: pb_inc_pos_t4
    exemplo: "SEV3: lentidão de 20 minutos no relatório; cache reiniciado. Passo de reiniciar o cache entrou no runbook do relatório."
    publico: false
    resumo: Para SEV3, registre o que aprendeu em poucas linhas e ajuste o runbook ou o alerta.
    status: rascunho
    tecnicas:
    - tec_runbook
  - id: pb_inc_pos_e1
    exemplo: "A raia Aprendizado pós-incidente devolve «formal» entregando Post-mortem, Ações corretivas e Impacto no SLA; em Aprender com o incidente (inc_orq_c10), o fluxo segue para «Serviço restaurado e aprendizado registrado». Por exemplo, Post-mortem: Post-mortem do checkout: causa no cálculo de frete sem flag; detecção em 2 minutos; rollback em 10."
    resumo: 'Retorno «formal» da raia Aprendizado pós-incidente: post-mortem formal concluído. Quem chamou a raia segue por este retorno.'
    status: rascunho
    publico: false
  - id: pb_inc_pos_e2
    exemplo: "A raia Aprendizado pós-incidente devolve «registro_leve» entregando Nota do incidente e Ajuste de runbook ou alerta; em Aprender com o incidente (inc_orq_c10), o fluxo segue para «Serviço restaurado e aprendizado registrado». Por exemplo, Nota do incidente: SEV3: lentidão no relatório de vendas por 20 minutos; cache reiniciado; limite do alerta ajustado."
    resumo: 'Retorno «registro_leve» da raia Aprendizado pós-incidente: registro leve feito. Quem chamou a raia segue por este retorno.'
    status: rascunho
    publico: false
  - id: pb_inc_tri_t2
    resumo: 'Alarme falso também é trabalho: registre por que não havia impacto e ajuste o alerta para não acordar ninguém à toa da próxima vez.'
    perguntas_chave: [pq_inc_tri_t2_1]
    fazer:
    - Ajuste o limite, a janela ou a rota com base nos sinais coletados
    evitar:
    - Silenciar o alerta sem entender o pico
    exemplo: O alerta disparou por 30 segundos de erro num endpoint interno; a janela passou para 5 minutos.
    status: rascunho
    publico: false
