    nome: 'Orquestração: teste e qualidade'
    demanda: teste_qa
    responsabilidade: Conduzir a demanda de teste e qualidade do início ao fim, delegando cada etapa a uma raia
    cor: '#607D8B'
    orquestradora: true
    status: rascunho
    publico: false
  - id: tqa_est
    nome: Estratégia de testes
    demanda: teste_qa
    responsabilidade: Mapear as lacunas de cobertura e priorizar pelo risco
    cor: '#332288'
    status: rascunho
    publico: false
