  - id: pb_tqa_orq_c4
    exemplo: "Chama a raia Testes de ponta a ponta (E2E); «aprovado» leva a «Testes de performance»; «reprovado» leva a «Execução das tarefas»; «nao_aplicavel» leva a «Testes de performance»."
    resumo: Chama a raia Testes de ponta a ponta. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - 'Retornos possíveis: aprovado, reprovado, nao_aplicavel'
    status: rascunho
    publico: false
  - id: pb_tqa_orq_c5
    exemplo: "Chama a raia Testes de performance; «aprovado» leva a «Review humano»; «reprovado» leva a «Execução das tarefas»; «nao_aplicavel» leva a «Review humano»."
    resumo: Chama a raia Testes de performance. O fluxo segue pelo retorno que a raia devolver.
    fazer:
