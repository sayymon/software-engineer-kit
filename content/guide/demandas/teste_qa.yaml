    status: rascunho
    publico: false
  - id: pb_tqa_est_t1
    exemplo: "QA entrega Mapa de cobertura. Mapa de cobertura: Pagamentos sem teste de contrato; 60% das falhas do semestre vieram do cálculo de frete sem teste de integração."
    resumo: 'Mapear as lacunas de cobertura. Entrega: o que não tem teste, por nível da pirâmide, e o histórico de falhas.'
