    resumo: 'Priorizar pelo risco e escolher os níveis de teste. Entrega: lista priorizada de testes a criar, com o nível de cada um.'
    perguntas_chave: [pq_tqa_est_t2_1]
    status: rascunho
    publico: false
  - id: pb_tqa_est_e1
    exemplo: "A raia Estratégia de testes devolve «estrategia_definida» entregando Estratégia de testes; em Estratégia de testes (tqa_orq_c1), o fluxo segue para «Execução das tarefas». Por exemplo, Estratégia de testes: Prioridade 1: contrato com o gateway de pagamento; prioridade 2: integração do frete; prioridade 3: E2E do checkout."
    resumo: Retorno «estrategia_definida» da raia Estratégia de testes. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_tqa_orq_s0
    exemplo: "A raia Orquestração: teste e qualidade começa; o primeiro passo é «Estratégia de testes»."
    resumo: 'Demanda de qualidade amplia a rede de proteção: cobre o que hoje quebra sem ninguém perceber, priorizando pelo risco.'
    status: rascunho
    publico: false
  - id: pb_tqa_orq_c1
    exemplo: "Chama a raia Estratégia de testes; «estrategia_definida» leva a «Execução das tarefas». Por exemplo, Estratégia de testes: Prioridade 1: contrato com o gateway de pagamento; prioridade 2: integração do frete; prioridade 3: E2E do checkout."
    resumo: Chama a raia Estratégia de testes. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - 'Retornos possíveis: estrategia_definida'
    status: rascunho
    publico: false
  - id: pb_tqa_orq_c2
    exemplo: "Chama a raia Execução por papéis; «execucao_integrada» leva a «Testes automatizados». Por exemplo, Estratégia de testes: Prioridade 1: contrato com o gateway de pagamento; prioridade 2: integração do frete; prioridade 3: E2E do checkout."
    resumo: Chama a raia Execução das tarefas. O fluxo segue pelo retorno que a raia devolver.
    fazer:
