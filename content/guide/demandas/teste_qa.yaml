    status: rascunho
    publico: false
  - id: pb_tqa_orq_c3
    exemplo: "Chama a raia Testes automatizados e regressão; «testes_aprovados» leva a «Testes de ponta a ponta»; «testes_reprovados» leva a «Execução das tarefas»."
