playbooks:
  - id: pb_doc_pla_s0
    exemplo: "A raia Planejamento da documentação começa; o primeiro passo é «Definir público, tipo e fonte de verdade»."
    resumo: 'Início da raia Planejamento da documentação. Responsabilidade: definir o público, o tipo de documento e a fonte de verdade.'
    status: rascunho
    publico: false
  - id: pb_doc_pla_t1
    exemplo: "Tech Lead entrega Plano da documentação. Plano da documentação: Guia de uso da API de cupons para times parceiros, no portal de desenvolvedores, gerado a partir do contrato."
    resumo: 'Definir público, tipo e fonte de verdade. Entrega: para quem, que tipo (tutorial, guia, referência, explicação) e onde mora.'
    perguntas_chave: [pq_doc_pla_t1_1]
    status: rascunho
    publico: false
  - id: pb_doc_pla_e1
    exemplo: "A raia Planejamento da documentação devolve «plano_definido» entregando Plano da documentação; em Planejamento da documentação (doc_orq_c1), o fluxo segue para «Escrita da documentação». Por exemplo, Plano da documentação: Guia de uso da API de cupons para times parceiros, no portal de desenvolvedores, gerado a partir do contrato."
    resumo: Retorno «plano_definido» da raia Planejamento da documentação. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_doc_esc_s0
    exemplo: "A raia Escrita da documentação começa; o primeiro passo é «Escrever a documentação»."
    resumo: 'Início da raia Escrita da documentação. Responsabilidade: escrever a documentação e validar com quem vai usar.'
    status: rascunho
    publico: false
  - id: pb_doc_esc_t1
    exemplo: "Tech Lead entrega Documentação escrita. Documentação escrita: Guia com autenticação, três exemplos de chamada e a tabela de erros."
    resumo: 'Escrever a documentação. Entrega: texto ou diagrama pronto para revisão.'
    perguntas_chave: [pq_doc_esc_t1_1]
    status: rascunho
    publico: false
  - id: pb_doc_esc_t2
    exemplo: "Tech Lead entrega Documentação validada. Documentação validada: Uma pessoa de um time parceiro integrou seguindo só o guia; dois passos foram reescritos."
    resumo: 'Validar com uma pessoa do público. Entrega: documento ajustado depois de alguém do público usar.'
    perguntas_chave: [pq_doc_esc_t2_1]
    status: rascunho
    publico: false
  - id: pb_doc_esc_e1
    exemplo: "A raia Escrita da documentação devolve «documentacao_pronta» entregando Documentação validada; em Escrita da documentação (doc_orq_c2), o fluxo segue para «Review humano». Por exemplo, Documentação validada: Uma pessoa de um time parceiro integrou seguindo só o guia; dois passos foram reescritos."
    resumo: Retorno «documentacao_pronta» da raia Escrita da documentação. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_doc_pub_s0
    exemplo: "A raia Publicação e divulgação começa; o primeiro passo é «Publicar e avisar os interessados»."
    resumo: 'Início da raia Publicação e divulgação. Responsabilidade: publicar no lugar certo e avisar quem precisa saber.'
    status: rascunho
    publico: false
  - id: pb_doc_pub_t1
    exemplo: "Tech Lead entrega Aviso de documentação. Aviso de documentação: Mensagem no canal dos times parceiros: guia novo da API de cupons publicado, com o link."
    resumo: 'Publicar e avisar os interessados. Entrega: mensagem com o link e o que mudou.'
    perguntas_chave: [pq_doc_pub_t1_1]
    status: rascunho
    publico: false
  - id: pb_doc_pub_e1
    exemplo: "A raia Publicação e divulgação devolve «documentacao_publicada» entregando Aviso de documentação; em Publicação e divulgação (doc_orq_c4), o fluxo segue para «Documentação publicada e divulgada». Por exemplo, Aviso de documentação: Mensagem no canal dos times parceiros: guia novo da API de cupons publicado, com o link."
    resumo: Retorno «documentacao_publicada» da raia Publicação e divulgação. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_doc_orq_s0
    exemplo: "A raia Orquestração: documentação começa; o primeiro passo é «Planejamento da documentação»."
    resumo: 'Documentação é legado: escreva para quem vem depois. Defina o público e a fonte de verdade antes de escrever.'
    status: rascunho
    publico: false
  - id: pb_doc_orq_c1
    exemplo: "Chama a raia Planejamento da documentação; «plano_definido» leva a «Escrita da documentação». Por exemplo, Plano da documentação: Guia de uso da API de cupons para times parceiros, no portal de desenvolvedores, gerado a partir do contrato."
    resumo: Chama a raia Planejamento da documentação. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - 'Retornos possíveis: plano_definido'
    status: rascunho
    publico: false
  - id: pb_doc_orq_c2
    exemplo: "Chama a raia Escrita da documentação; «documentacao_pronta» leva a «Review humano». Por exemplo, Documentação validada: Uma pessoa de um time parceiro integrou seguindo só o guia; dois passos foram reescritos."
    resumo: Chama a raia Escrita da documentação. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - 'Retornos possíveis: documentacao_pronta'
    status: rascunho
    publico: false
  - id: pb_doc_orq_c3
    exemplo: "Chama a raia Review humano; «aprovado_pelo_humano» leva a «Publicação e divulgação»; «ajustes_solicitados» leva a «Escrita da documentação». Por exemplo, Documentação validada: Uma pessoa de um time parceiro integrou seguindo só o guia; dois passos foram reescritos."
    resumo: Chama a raia Review humano. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - 'Retornos possíveis: aprovado_pelo_humano, ajustes_solicitados'
    status: rascunho
    publico: false
  - id: pb_doc_orq_c4
    exemplo: "Chama a raia Publicação e divulgação; «documentacao_publicada» leva a «Documentação publicada e divulgada». Por exemplo, Aviso de documentação: Mensagem no canal dos times parceiros: guia novo da API de cupons publicado, com o link."
    resumo: Chama a raia Publicação e divulgação. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - 'Retornos possíveis: documentacao_publicada'
    status: rascunho
    publico: false
  - id: pb_doc_orq_e1
    exemplo: "A demanda termina em «documentacao_disponivel»: documentação publicada e divulgada, com Aviso de documentação. Por exemplo, Aviso de documentação: Mensagem no canal dos times parceiros: guia novo da API de cupons publicado, com o link."
    resumo: Documentação publicada e divulgada. Fim da demanda.
    status: rascunho
    publico: false
