  - id: pb_dsc_ava_t1
    exemplo: "PM entrega Mapa de consumidores. Mapa de consumidores: Endpoint antigo de relatório: 3 consumidores, 2% do tráfego, um parceiro externo."
    resumo: 'Medir o uso e identificar os consumidores. Entrega: quem usa, quanto e com que dependência.'
    perguntas_chave: [pq_dsc_ava_t1_1]
    status: rascunho
    publico: false
  - id: pb_dsc_ava_g1
    exemplo: "PM decide com Mapa de consumidores: «sim» leva a «Descontinuar»; «não» leva a «Manter». Por exemplo, Mapa de consumidores: Endpoint antigo de relatório: 3 consumidores, 2% do tráfego, um parceiro externo."
    resumo: Descontinuar? A resposta decide o retorno da raia.
    status: rascunho
    publico: false
  - id: pb_dsc_ava_e1
    exemplo: "A raia Avaliação de uso e impacto devolve «descontinuar» entregando Mapa de consumidores; em Avaliação de uso e impacto (dsc_orq_c1), o fluxo segue para «Aviso e migração dos consumidores». Por exemplo, Mapa de consumidores: Endpoint antigo de relatório: 3 consumidores, 2% do tráfego, um parceiro externo."
    resumo: Retorno «descontinuar» da raia Avaliação de uso e impacto. Quem chamou a raia segue por este retorno.
