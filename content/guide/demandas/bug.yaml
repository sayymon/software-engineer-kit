# Demanda: Bug. Raias, nós, playbooks e células desta demanda.
demandas:
  - id: bug
    nome: Bug
    sigla: bug
    publico: false
raias:
  - id: bug_orq
    nome: Orquestração do bug
    demanda: bug
    responsabilidade: Conduzir o bug do relato ao fechamento, delegando cada etapa a uma raia
    cor: '#607D8B'
    orquestradora: true
    status: rascunho
    publico: false
  - id: bug_rep
    nome: Reprodução
    demanda: bug
    responsabilidade: Reproduzir o problema relatado
    cor: '#0072B2'
    entradas: [relato_do_bug]
    status: rascunho
    publico: false
  - id: bug_tri
    nome: Triagem e classificação
    demanda: bug
    responsabilidade: Classificar o relato e priorizar a correção
    cor: '#E69F00'
    entradas: [relato_do_bug, passos_de_reproducao]
    status: rascunho
    publico: false
    entradas:
    - relato_do_bug
    - passos_de_reproducao
    - ambiente_do_bug
    - logs_do_bug
    - registro_visual_do_bug
  - id: bug_cor
    nome: Correção
    demanda: bug
    responsabilidade: Isolar a causa raiz e corrigir com teste de regressão
    cor: '#009E73'
    status: rascunho
    publico: false
    entradas:
    - passos_de_reproducao
    - logs_do_bug
    - estado_dos_dados
    - teste_que_reproduz
    - prioridade
    - hotfix_aberto
    - mitigacao_paliativa
    - paliativo_aplicado
  - id: bug_ent
    nome: Validação e entrega
    demanda: bug
    responsabilidade: Validar a correção, entregá-la e verificar em produção
    cor: '#117733'
    status: rascunho
    publico: false
    entradas:
    - entrega_integrada
    - teste_que_reproduz
    - causa_raiz
    - passos_de_reproducao
    - logs_do_bug
    - tem_qa_dedicado
  - id: bug_pre
    nome: Prevenção
    demanda: bug
    responsabilidade: Descobrir por que o bug escapou e registrar a ação preventiva
    cor: '#CC79A7'
    status: rascunho
    publico: false
# ==== Catálogos de dados (Requisito 16): artefatos e variáveis rastreados pelo fluxo. RASCUNHO: revisão humana. ====
# Variáveis: uma por chave de `estado` dos nós, com tipo e valores. Artefatos: o que as raias do piloto produzem e consomem.
    entradas:
    - causa_raiz
    - relato_do_bug
    - verificacao_em_producao
decisoes:
  # ==== demanda bug (raias bug_*) ====
  # ---- raia bug_orq: Orquestração do bug ----
  - id: bug_orq_s0
    raia: bug_orq
    tipo: inicio
    rotulo: Bug reportado
    condicao: ''
    proximo:
    - para: bug_orq_c1
      condicao: ''
    estado:
      corrige_defeito: sim
    saidas: [relato_do_bug]
    playbook: pb_bug_orq_s0
    layout:
      coluna: 0
    status: rascunho
    publico: false
  - id: bug_orq_c1
    raia: bug_orq
    tipo: chamada
    raia_chamada: bug_rep
    rotulo: Reproduzir o problema
    condicao: ''
    proximo:
    - para: bug_orq_c2
      condicao: reproduzido
    - para: bug_orq_e1
      condicao: nao_reproduzido
    estado: {}
    entradas: [relato_do_bug]
    saidas:
    - ambiente_do_bug
    - logs_do_bug
    - estado_dos_dados
    - registro_visual_do_bug
    - passos_de_reproducao
    - teste_que_reproduz
    - reproduzido
    playbook: pb_bug_orq_c1
    layout:
      coluna: 1
    status: rascunho
    publico: false
  - id: bug_orq_c2
    raia: bug_orq
    tipo: chamada
    raia_chamada: bug_tri
    rotulo: Triar e classificar o bug
    condicao: ''
    proximo:
    - para: bug_orq_c3
      condicao: hotfix
    - para: bug_orq_c3
      condicao: backlog
    - para: bug_orq_e2
      condicao: comportamento_esperado
    - para: bug_orq_e3
      condicao: pedido_feature
    estado: {}
    entradas: [relato_do_bug, passos_de_reproducao, ambiente_do_bug, logs_do_bug, registro_visual_do_bug]
    saidas: [tipo_defeito, severidade_bug, prioridade, hotfix_aberto, item_de_backlog, resposta_ao_relator, demanda_de_feature, muda_jornada, justificativa_da_severidade, paliativo_aplicado, mitigacao_paliativa]
    playbook: pb_bug_orq_c2
    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: bug_orq_c3
    raia: bug_orq
    tipo: chamada
    raia_chamada: bug_cor
    rotulo: Corrigir a causa raiz
    condicao: ''
    proximo:
    - para: bug_orq_g1
      condicao: correcao_pronta
    estado: {}
    entradas: [passos_de_reproducao, logs_do_bug, estado_dos_dados, teste_que_reproduz, prioridade, hotfix_aberto, mitigacao_paliativa, paliativo_aplicado]
    saidas: [entrega_integrada, causa_raiz, teste_que_reproduz]
    playbook: pb_bug_orq_c3
    layout:
      coluna: 3
    status: rascunho
    publico: false
  - id: bug_orq_g1
    raia: bug_orq
    tipo: bifurcacao
    rotulo: É hotfix?
    condicao: A triagem abriu a correção como hotfix?
    proximo:
    - para: bug_orq_c7
      condicao: 'sim: hotfix segue direto para a validação e entrega'
    - para: bug_orq_c4
      condicao: 'não: publicar e rodar a regressão'
    estado: {}
    entradas:
    - prioridade
    papel: tech_lead
    informado: [suporte, stakeholder]
    playbook: pb_bug_orq_g1
    layout:
      coluna: 4
    status: rascunho
    publico: false
  - id: bug_orq_c4
    raia: bug_orq
    tipo: chamada
    raia_chamada: com_pub
    rotulo: Publicar a correção em ambiente de testes
    condicao: ''
    proximo:
    - para: bug_orq_c5
      condicao: publicado
    - para: bug_orq_c3
      condicao: falha_na_publicacao
    estado: {}
    entradas:
    - entrega_integrada
    playbook: pb_bug_orq_c4
    layout:
      coluna: 4
    status: rascunho
    publico: false
  - id: bug_orq_c5
    raia: bug_orq
    tipo: chamada
    raia_chamada: com_val
    rotulo: Testes regressivos do bug e das funcionalidades core
    condicao: ''
    proximo:
    - para: bug_orq_c6
      condicao: testes_aprovados
    - para: bug_orq_c3
      condicao: testes_reprovados
    estado: {}
    entradas:
    - entrega_integrada
    - teste_que_reproduz
    playbook: pb_bug_orq_c5
    layout:
      coluna: 5
    status: rascunho
    publico: false
  - id: bug_orq_c6
    raia: bug_orq
    tipo: chamada
    raia_chamada: com_e2e
    rotulo: Regressão das jornadas afetadas e das jornadas core
    condicao: ''
    proximo:
    - para: bug_orq_c7
      condicao: aprovado
    - para: bug_orq_c7
      condicao: nao_aplicavel
    - para: bug_orq_c3
      condicao: reprovado
    estado: {}
    entradas:
    - entrega_integrada
    - muda_jornada
    playbook: pb_bug_orq_c6
    layout:
      coluna: 6
    status: rascunho
    publico: false
  - id: bug_orq_c7
    raia: bug_orq
    tipo: chamada
    raia_chamada: bug_ent
    rotulo: Validar, entregar e verificar em produção
    condicao: ''
    proximo:
    - para: bug_orq_c8
      condicao: verificado
    - para: bug_orq_c3
      condicao: nao_corrigido
    estado: {}
    entradas: [entrega_integrada, causa_raiz, teste_que_reproduz]
    saidas: [aviso_de_correcao, verificacao_em_producao]
    playbook: pb_bug_orq_c7
    layout:
      coluna: 7
    status: rascunho
    publico: false
  - id: bug_orq_c8
    raia: bug_orq
    tipo: chamada
    raia_chamada: bug_pre
    rotulo: Analisar o escape e registrar a prevenção
    condicao: ''
    proximo:
    - para: bug_orq_e4
      condicao: acao_registrada
    estado: {}
    entradas: [causa_raiz, verificacao_em_producao]
    saidas: [registro_da_acao_preventiva, acao_preventiva]
    playbook: pb_bug_orq_c8
    layout:
      coluna: 8
    status: rascunho
    publico: false
  - id: bug_orq_e1
    raia: bug_orq
    tipo: fim
    retorno: fechado_sem_reproducao
    rotulo: Fechado sem reprodução (reabrir se reaparecer)
    condicao: ''
    proximo: []
    estado: {}
    playbook: pb_bug_orq_e1
    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: bug_orq_e2
    raia: bug_orq
    tipo: fim
    retorno: esclarecido
    rotulo: Esclarecido como comportamento esperado
    condicao: ''
    proximo: []
    estado: {}
    playbook: pb_bug_orq_e2
    layout:
      coluna: 3
    status: rascunho
    publico: false
  - id: bug_orq_e3
    raia: bug_orq
    tipo: fim
    retorno: encaminhado
    rotulo: Encaminhado ao fluxo de feature
    condicao: ''
    proximo: []
    estado: {}
    playbook: pb_bug_orq_e3
    layout:
      coluna: 3
    status: rascunho
    publico: false
  - id: bug_orq_e4
    raia: bug_orq
    tipo: fim
    retorno: corrigido_e_fechado
    rotulo: Bug corrigido, verificado e fechado
    condicao: ''
    proximo: []
    estado: {}
    entradas: [registro_da_acao_preventiva, acao_preventiva, aviso_de_correcao]
    playbook: pb_bug_orq_e4
    layout:
      coluna: 6
    status: rascunho
    publico: false
  # ---- raia bug_rep: Reprodução ----
  - id: bug_rep_s0
    raia: bug_rep
    tipo: inicio
    rotulo: Bug a reproduzir
    condicao: ''
    proximo:
    - para: bug_rep_t1
      condicao: ''
    estado: {}
    entradas: [relato_do_bug]
    playbook: pb_bug_rep_s0
    layout:
      coluna: 0
    status: rascunho
    publico: false
  - id: bug_rep_t1
    raia: bug_rep
    tipo: tarefa
    rotulo: Reproduzir o problema
    condicao: ''
    proximo:
    - para: bug_rep_g1
      condicao: ''
    estado:
      reproduzido: sim|nao
    entradas:
    - relato_do_bug
    saidas:
    - ambiente_do_bug
    - logs_do_bug
    - estado_dos_dados
    - registro_visual_do_bug
    - passos_de_reproducao
    - teste_que_reproduz
    - reproduzido
    - queries_de_dados
    subtarefas:
    - id: bug_rep_t1_st1
      rotulo: Reunir o contexto do relato
      descricao: Versão, dispositivo, navegador, conta, flags ativas e horário em que o bug aconteceu
      papel: suporte
      apoio:
      - qa
      entradas:
      - relato_do_bug
      saidas:
      - ambiente_do_bug
      exemplo: Versão 4.12.0, iPhone 13, conta comprador_recorrente_02, flag de cupom ligada, 14h32.
      status: rascunho
    - id: bug_rep_t1_st2
      rotulo: Coletar logs, rastros e métricas do horário do erro
      papel: dev
      apoio:
      - sre
      entradas:
      - ambiente_do_bug
      saidas:
      - logs_do_bug
      tecnicas:
      - tecnica: tec_logs_e_rastreamento
        uso: obrigatoria
        porque: o rastro mostra onde a requisição falhou sem depender da memória de quem relatou
      exemplo: Erro 500 no serviço de cupons, id de correlação 7f3a, timeout na consulta de saldo.
      status: rascunho
    - id: bug_rep_t1_st3
      rotulo: Capturar o estado dos dados envolvidos
      papel: dev
      apoio:
      - engenheiro_de_dados
      entradas:
      - ambiente_do_bug
      - logs_do_bug
      saidas:
      - estado_dos_dados
      - queries_de_dados
      tecnicas:
      - tecnica: tec_mascaramento_de_dados
        uso: obrigatoria
        porque: a evidência sai de produção e não pode expor dados de pessoas
      exemplo: Pedido 98213 com cupom expirado e status pendente, dados do comprador mascarados.
      status: rascunho
    - id: bug_rep_t1_st4
      rotulo: Reproduzir em ambiente controlado e registrar os passos
      papel: qa
      entradas:
      - ambiente_do_bug
      - logs_do_bug
      - estado_dos_dados
      - queries_de_dados
      saidas:
      - passos_de_reproducao
      - registro_visual_do_bug
      - reproduzido
      tecnicas:
      - tecnica: tec_reproducao_minima
        uso: obrigatoria
        porque: o menor caso que mostra a falha acelera o isolamento da causa
      exemplo: 3 passos com carrinho de 1 item e cupom expirado; gravação de 20 s anexada.
      status: rascunho
    - id: bug_rep_t1_st5
      rotulo: Escrever o teste automatizado que falha com o bug
      papel: dev
      quando:
        todos:
        - var: reproduzido
          igual: sim
      porque: o teste prova o defeito antes da correção e vira regressão depois dela
      entradas:
      - passos_de_reproducao
      saidas:
      - teste_que_reproduz
      tecnicas:
      - tecnica: tec_teste_regressao
        uso: obrigatoria
        porque: o mesmo teste falha agora e protege contra a volta do defeito
      exemplo: Teste de integração do checkout com cupom expirado falha com erro 500.
      status: rascunho
    playbook: pb_bug_rep_t1
    layout:
      coluna: 1
    status: rascunho
    publico: false
  - id: bug_rep_g1
    raia: bug_rep
    tipo: bifurcacao
    rotulo: Reproduziu?
    condicao: Reproduziu?
    proximo:
    - para: bug_rep_e1
      condicao: sim
    - para: bug_rep_t2
      condicao: não
    estado:
      reproduzido: sim|nao
    entradas:
    - reproduzido
    - passos_de_reproducao
    papel: qa
    playbook: pb_bug_rep_g1
    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: bug_rep_t2
    raia: bug_rep
    tipo: tarefa
    rotulo: Coletar evidências e tentar de novo
    condicao: ''
    proximo:
    - para: bug_rep_g2
      condicao: ''
    estado:
      reproduzido: nao
    entradas:
    - relato_do_bug
    - ambiente_do_bug
    - logs_do_bug
    saidas:
    - logs_do_bug
    - estado_dos_dados
    - registro_visual_do_bug
    - passos_de_reproducao
    subtarefas:
    - id: bug_rep_t2_st1
      rotulo: Ampliar a coleta para outros serviços e um período maior
      papel: dev
      apoio:
      - sre
      entradas:
      - logs_do_bug
      saidas:
      - logs_do_bug
      tecnicas:
      - tecnica: tec_logs_e_rastreamento
        uso: obrigatoria
        porque: a causa pode estar num serviço vizinho ou começar antes do horário relatado
      exemplo: Rastros de pagamentos e cupons nas 2 horas anteriores; 4 erros parecidos em outras contas.
      status: rascunho
    - id: bug_rep_t2_st2
      rotulo: Pedir ao relator gravação de tela ou dados adicionais
      papel: suporte
      entradas:
      - relato_do_bug
      saidas:
      - registro_visual_do_bug
      exemplo: O comprador enviou a gravação; o erro só aparece com o cupom aplicado depois do frete.
      status: rascunho
    - id: bug_rep_t2_st3
      rotulo: Tentar em ambiente próximo de produção com dados mascarados
      papel: qa
      apoio:
      - dev
      entradas:
      - logs_do_bug
      - registro_visual_do_bug
      saidas:
      - estado_dos_dados
      - passos_de_reproducao
      tecnicas:
      - tecnica: tec_mascaramento_de_dados
        uso: obrigatoria
        porque: dados próximos dos reais reproduzem sem expor pessoas
      exemplo: Reproduzido em homologação com cópia mascarada do pedido 98213.
      status: rascunho
    playbook: pb_bug_rep_t2
    layout:
      coluna: 3
    status: rascunho
    publico: false
  - id: bug_rep_g2
    raia: bug_rep
    tipo: bifurcacao
    rotulo: Reproduz com as novas evidências?
    condicao: Reproduz com as novas evidências?
    proximo:
    - para: bug_rep_e1
      condicao: sim
    - para: bug_rep_e2
      condicao: não
    estado:
      reproduzido: sim|nao
    entradas:
    - passos_de_reproducao
    - registro_visual_do_bug
    papel: qa
    apoio: [dev]
    playbook: pb_bug_rep_g2
    layout:
      coluna: 4
    status: rascunho
    publico: false
  - id: bug_rep_e1
    raia: bug_rep
    tipo: fim
    retorno: reproduzido
    rotulo: Reproduzido
    condicao: ''
    proximo: []
    estado: {}
    saidas:
    - passos_de_reproducao
    - reproduzido
    - ambiente_do_bug
    - logs_do_bug
    - estado_dos_dados
    - registro_visual_do_bug
    - teste_que_reproduz
    playbook: pb_bug_rep_e1
    layout:
      coluna: 5
    status: rascunho
    publico: false
  - id: bug_rep_e2
    raia: bug_rep
    tipo: fim
    retorno: nao_reproduzido
    rotulo: Não reproduzido
    condicao: ''
    proximo: []
    estado: {}
    saidas:
    - reproduzido
    - ambiente_do_bug
    - logs_do_bug
    playbook: pb_bug_rep_e2
    layout:
      coluna: 5
    status: rascunho
    publico: false
  # ---- raia bug_tri: Triagem e classificação ----
  - id: bug_tri_s0
    raia: bug_tri
    tipo: inicio
    rotulo: Bug reproduzido, triar
    condicao: ''
    proximo:
    - para: bug_tri_g1
      condicao: ''
    estado: {}
    entradas: [relato_do_bug, passos_de_reproducao]
    playbook: pb_bug_tri_s0
    layout:
      coluna: 0
    status: rascunho
    publico: false
  - id: bug_tri_g1
    raia: bug_tri
    tipo: bifurcacao
    rotulo: Defeito, comportamento esperado ou feature?
    condicao: É defeito, comportamento esperado ou pedido de feature?
    proximo:
    - para: bug_tri_g2
      condicao: 'defeito: o sistema contraria o requisito'
    - para: bug_tri_t1
      condicao: comportamento esperado conforme o requisito
    - para: bug_tri_t2
      condicao: 'pedido de feature: o requisito não existia'
    estado:
      tipo_defeito: defeito|comportamento_esperado|pedido_feature
    entradas: [relato_do_bug, passos_de_reproducao]
    saidas: [tipo_defeito, requisito_de_referencia]
    tecnicas:
      - tecnica: tec_criterios_aceitacao
        uso: recomendada
        porque: "o critério de aceite diz o que o sistema deveria fazer"
      - tecnica: tec_x3_amigos
        uso: opcional
        porque: "na dúvida, alinhe com produto e qualidade antes de decidir"
    papel: pm
    apoio: [qa]
    consultado: [suporte]
    playbook: pb_bug_tri_g1
    layout:
      coluna: 1
    status: rascunho
    publico: false
  - id: bug_tri_t1
    raia: bug_tri
    tipo: tarefa
    rotulo: Responder e documentar o comportamento esperado
    condicao: ''
    proximo:
    - para: bug_tri_e3
      condicao: ''
    estado:
      tipo_defeito: comportamento_esperado
    entradas: [relato_do_bug, requisito_de_referencia]
    saidas: [resposta_ao_relator]
    subtarefas:
      - id: bug_tri_t1_st1
        exemplo: "Resposta ao relator: \"Este é o comportamento previsto no requisito RF-12: o cupom só vale para a primeira compra. Segue o link da regra\"."
        rotulo: "Redigir a resposta citando o requisito"
        papel: qa
        apoio: [pm]
        entradas: [relato_do_bug, requisito_de_referencia]
        saidas: [resposta_ao_relator]
        status: rascunho
      - id: bug_tri_t1_st2
        exemplo: "A resposta foi enviada em 1 hora. Como é a 3ª vez no mês que chega essa dúvida, abre-se uma tarefa para deixar a regra visível na tela do cupom."
        rotulo: "Enviar a resposta e avaliar a melhoria de UX"
        papel: pm
        entradas: [resposta_ao_relator]
        saidas: [resposta_ao_relator]
        status: rascunho
    playbook: pb_bug_tri_t1
    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: bug_tri_t2
    raia: bug_tri
    tipo: tarefa
    rotulo: Encaminhar como demanda de feature
    condicao: ''
    proximo:
    - para: bug_tri_e4
      condicao: ''
    estado:
      tipo_defeito: pedido_feature
    entradas: [relato_do_bug, requisito_de_referencia]
    saidas: [demanda_de_feature, resposta_ao_relator]
    subtarefas:
      - id: bug_tri_t2_st1
        exemplo: "O ticket \"quero pagar com carteira digital\" vira uma demanda de produto, com o relato original, o print e a lista de quem pediu."
        rotulo: "Converter o ticket em demanda de produto"
        papel: pm
        entradas: [relato_do_bug, requisito_de_referencia]
        saidas: [demanda_de_feature]
        tecnicas:
          - tecnica: tec_jobs_to_be_done
            uso: opcional
            porque: "descreve o problema do usuário em vez de só a solução pedida"
        status: rascunho
      - id: bug_tri_t2_st2
        exemplo: "Mensagem ao relator: \"Isso é uma melhoria, não um defeito. Ela entrou no fluxo de produtos e você acompanha pelo novo link\"."
        rotulo: "Avisar o relator sobre o novo caminho"
        papel: pm
        entradas: [demanda_de_feature]
        saidas: [resposta_ao_relator]
        status: rascunho
    playbook: pb_bug_tri_t2
    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: bug_tri_g2
    raia: bug_tri
    tipo: bifurcacao
    rotulo: É um potencial incidente?
    condicao: É um potencial incidente?
    proximo:
    - para: bug_tri_t3
      condicao: sim, pelo menos um critério atendido
    - para: bug_tri_t4
      condicao: não, nenhum critério atendido
    estado:
      potencial_incidente: sim|nao
      criterios_incidente: 'lista dos critérios atendidos: raio_impacto, perda_corrupcao_dados, seguranca_compliance, dinheiro, degradacao_crescente_ou_sem_contorno, janela_critica'
      janela_critica: sim|nao
      tipo_janela: sazonal|repentina|freeze|manutencao|nenhuma
    entradas: [relato_do_bug, passos_de_reproducao, logs_do_bug]
    saidas: [potencial_incidente, criterios_incidente, janela_critica, tipo_janela]
    tecnicas:
      - tecnica: tec_blast_radius
        uso: obrigatoria
        porque: "o critério de raio de impacto pede número, não impressão"
      - tecnica: tec_matriz_severidade
        uso: recomendada
        porque: "o mesmo critério de gravidade usado no incidente evita dois pesos e duas medidas"
      - tecnica: tec_slo_sli
        uso: opcional
        porque: "mostra se o indicador do serviço já está degradado"
    papel: qa
    apoio: [sre]
    consultado: [pm]
    playbook: pb_bug_tri_g2
    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: bug_tri_t3
    raia: bug_tri
    tipo: tarefa
    rotulo: Acionar o incidente e seguir com a correção em paralelo
    condicao: ''
    proximo:
    - para: bug_tri_t4
      condicao: ''
    estado:
      potencial_incidente: sim
      criterios_incidente: registrar os critérios atendidos no ticket do bug e do incidente
    ligacoes:
    - demanda_destino: incidente
      para: inc_orq_s0
      condicao: 'pelo menos um critério: raio de impacto (quantos usuários, creators ou compras afetados), perda ou corrupção de dados, segurança ou compliance, dinheiro (pagamentos, repasses), degradação crescente ou sem contorno'
      tipo: aciona
      rotulo: Bug vira potencial incidente
    entradas: [passos_de_reproducao, criterios_incidente, potencial_incidente, logs_do_bug, ambiente_do_bug]
    saidas: [incidente_aberto, relato_do_bug]
    subtarefas:
      - id: bug_tri_t3_st1
        exemplo: "Critérios atendidos no ticket: o defeito afeta o fluxo de pagamento e atinge mais de 5% dos clientes."
        rotulo: "Registrar os critérios atendidos no ticket"
        papel: qa
        entradas: [criterios_incidente, potencial_incidente]
        saidas: [relato_do_bug]
        status: rascunho
      - id: bug_tri_t3_st2
        exemplo: "O incidente é aberto com o título \"Falha no pagamento com cartão\" e os dois tickets ficam ligados um ao outro."
        rotulo: "Abrir o incidente e linkar os dois tickets"
        papel: sre
        apoio: [tech_lead]
        entradas: [criterios_incidente]
        saidas: [incidente_aberto]
        status: rascunho
      - id: bug_tri_t3_st3
        exemplo: "Para o incidente seguem 4 evidências: horário da primeira falha, versão afetada, identificador de 3 compras e o trecho do log."
        rotulo: "Passar as evidências ao incidente"
        papel: qa
        apoio: [dev]
        entradas: [incidente_aberto, passos_de_reproducao, criterios_incidente, logs_do_bug, ambiente_do_bug]
        tecnicas:
          - tecnica: tec_linha_do_tempo
            uso: opcional
            porque: "ajuda o incidente a reconstruir quando o defeito começou"
        saidas: [incidente_aberto]
        status: rascunho
    playbook: pb_bug_tri_t3
    layout:
      coluna: 3
    status: rascunho
    publico: false
  - id: bug_tri_t4
    raia: bug_tri
    tipo: tarefa
    rotulo: Avaliar severidade e prioridade
    condicao: ''
    proximo:
    - para: bug_tri_g3
      condicao: ''
    estado:
      severidade_bug: bloqueante|alta|media|baixa
      prioridade: hotfix|backlog
    entradas: [relato_do_bug, passos_de_reproducao, potencial_incidente, logs_do_bug, ambiente_do_bug]
    saidas: [avaliacao_de_impacto, severidade_bug, prioridade, muda_jornada, justificativa_da_severidade]
    subtarefas:
      - id: bug_tri_t4_st1
        exemplo: "O defeito atinge cerca de 2% dos pedidos, todos no checkout, que é um fluxo crítico para a receita."
        rotulo: "Medir o alcance e a criticidade do fluxo"
        papel: qa
        apoio: [dev]
        entradas: [relato_do_bug, passos_de_reproducao, logs_do_bug, ambiente_do_bug]
        saidas: [avaliacao_de_impacto, muda_jornada]
        tecnicas:
          - tecnica: tec_blast_radius
            uso: recomendada
            porque: "mede quantos usuários e qual fluxo o defeito atinge"
        status: rascunho
      - id: bug_tri_t4_st2
        exemplo: "Existe contorno: o cliente consegue concluir a compra pelo aplicativo. O contorno exige uma etapa extra, mas é aceitável por alguns dias."
        rotulo: "Verificar se há contorno aceitável"
        papel: pm
        apoio: [qa]
        entradas: [avaliacao_de_impacto]
        saidas: [avaliacao_de_impacto]
        status: rascunho
      - id: bug_tri_t4_st3
        exemplo: "Severidade alta, por afetar o checkout, e prioridade média, porque há contorno: tratar na sprint atual."
        rotulo: "Definir a severidade e a prioridade"
        papel: pm
        apoio: [tech_lead]
        entradas: [avaliacao_de_impacto]
        saidas: [severidade_bug, prioridade, justificativa_da_severidade]
        tecnicas:
          - tecnica: tec_matriz_severidade
            uso: obrigatoria
            porque: "severidade é o dano e precisa de critério escrito"
          - tecnica: tec_classes_de_servi_o
            uso: recomendada
            porque: "a classe de serviço define o prazo de tratamento"
        consultado: [suporte]
        status: rascunho
    playbook: pb_bug_tri_t4
    layout:
      coluna: 4
    status: rascunho
    publico: false
  - id: bug_tri_g3
    raia: bug_tri
    tipo: bifurcacao
    rotulo: Afetado por janela crítica ou sazonalidade?
    condicao: O fluxo é afetado por janela crítica, evento repentino ou sazonalidade?
    proximo:
    - para: bug_tri_g4
      condicao: sim, há janela crítica ativa
    - para: bug_tri_g5
      condicao: não, sem janela crítica
    estado:
      janela_critica: sim|nao
      tipo_janela: sazonal|repentina|freeze|manutencao|nenhuma
    entradas: [janela_critica, tipo_janela]
    saidas: [janela_critica, tipo_janela]
    tecnicas:
      - tecnica: tec_calendario_eventos_criticos
        uso: obrigatoria
        porque: "a janela crítica só aparece quando alguém consulta o calendário"
      - tecnica: tec_status_de_janela
        uso: recomendada
        porque: "mostra se há freeze ou manutenção em vigor agora"
    papel: tech_lead
    apoio: [pm]
    playbook: pb_bug_tri_g3
    layout:
      coluna: 5
    status: rascunho
    publico: false
  - id: bug_tri_g4
    raia: bug_tri
    tipo: bifurcacao
    rotulo: A janela pede correção imediata ou adiamento?
    condicao: A janela pede correção imediata ou adiamento?
    proximo:
    - para: bug_tri_t6
      condicao: correção imediata (hotfix)
    - para: bug_tri_t5
      condicao: adiar com mitigação paliativa
    - para: bug_tri_g5
      condicao: a janela não altera a decisão
    estado:
      prioridade: hotfix|backlog
      tipo_janela: sazonal|repentina|freeze|manutencao
    entradas: [tipo_janela, avaliacao_de_impacto, severidade_bug]
    saidas: [prioridade]
    tecnicas:
      - tecnica: tec_code_freeze
        uso: condicional
        quando: {todos: [{var: tipo_janela, em: [freeze, manutencao]}]}
        porque: "em freeze, o hotfix só sai com exceção aprovada"
      - tecnica: tec_hotfix
        uso: recomendada
        porque: "a correção imediata é a menor mudança que resolve"
    papel: tech_lead
    aprova: pm
    playbook: pb_bug_tri_g4
    layout:
      coluna: 6
    status: rascunho
    publico: false
  - id: bug_tri_t5
    raia: bug_tri
    tipo: tarefa
    rotulo: Aplicar paliativo e adiar a correção para depois da janela
    condicao: ''
    proximo:
    - para: bug_tri_t7
      condicao: ''
    estado:
      prioridade: backlog  # com data de retomada logo após a janela
      mitigacao_paliativa: sim
    entradas: [tipo_janela, avaliacao_de_impacto]
    saidas: [paliativo_aplicado, mitigacao_paliativa, prioridade, item_de_backlog]
    subtarefas:
      - id: bug_tri_t5_st1
        exemplo: "O paliativo é desligar a flag do novo botão de pagamento, o que devolve o fluxo antigo sem mexer no código."
        rotulo: "Aplicar o paliativo seguro"
        papel: dev
        apoio: [sre]
        entradas: [avaliacao_de_impacto, tipo_janela]
        saidas: [paliativo_aplicado, mitigacao_paliativa]
        tecnicas:
          - tecnica: tec_feature_flags
            uso: recomendada
            porque: "a flag reduz o dano sem mexer no código em plena janela"
          - tecnica: tec_degradacao_controlada
            uso: opcional
            porque: "alternativa quando não há flag para o trecho afetado"
        status: rascunho
      - id: bug_tri_t5_st2
        exemplo: "Retomada marcada para 10 dias após o fim da janela, com a pessoa responsável pelo checkout como dona e o ticket linkado."
        rotulo: "Registrar a data de retomada e o dono"
        papel: tech_lead
        entradas: [paliativo_aplicado, tipo_janela]
        saidas: [prioridade, item_de_backlog]
        tecnicas:
          - tecnica: tec_code_freeze
            uso: condicional
            quando: {todos: [{var: tipo_janela, em: [freeze, manutencao]}]}
            porque: "a retomada acompanha o fim do freeze ou da manutenção"
        status: rascunho
    playbook: pb_bug_tri_t5
    layout:
      coluna: 7
    status: rascunho
    publico: false
  - id: bug_tri_g5
    raia: bug_tri
    tipo: bifurcacao
    rotulo: Bloqueante ou de alto impacto?
    condicao: Bloqueante ou de alto impacto?
    proximo:
    - para: bug_tri_t6
      condicao: 'sim: tratar como hotfix'
    - para: bug_tri_t7
      condicao: 'não: priorizar no backlog'
    estado:
      prioridade: hotfix|backlog
    entradas: [avaliacao_de_impacto, severidade_bug]
    saidas: [prioridade]
    tecnicas:
      - tecnica: tec_matriz_severidade
        uso: recomendada
        porque: "hotfix só para o que o critério classifica como bloqueante ou de alto impacto"
    papel: pm
    apoio: [tech_lead]
    consultado: [suporte]
    playbook: pb_bug_tri_g5
    layout:
      coluna: 7
    status: rascunho
    publico: false
  - id: bug_tri_t6
    raia: bug_tri
    tipo: tarefa
    rotulo: Abrir hotfix com escopo mínimo
    condicao: ''
    proximo:
    - para: bug_tri_e1
      condicao: ''
    estado:
      prioridade: hotfix
    entradas: [relato_do_bug, passos_de_reproducao, prioridade]
    saidas: [hotfix_aberto]
    subtarefas:
      - id: bug_tri_t6_st1
        exemplo: "Branch criada a partir da tag da versão que está em produção, com o nome hotfix/pagamento-duplicado."
        rotulo: "Criar a branch a partir do que está em produção"
        papel: dev
        entradas: [relato_do_bug, passos_de_reproducao]
        saidas: [hotfix_aberto]
        tecnicas:
          - tecnica: tec_hotfix
            uso: obrigatoria
            porque: "hotfix é a menor mudança que resolve, partindo do que roda em produção"
        status: rascunho
      - id: bug_tri_t6_st2
        exemplo: "Antes de codar, avalia-se desligar a flag da funcionalidade: leva 2 minutos e resolve 90% dos casos, então vira o contorno imediato."
        rotulo: "Avaliar o contorno imediato"
        papel: tech_lead
        apoio: [sre]
        entradas: [passos_de_reproducao, hotfix_aberto]
        saidas: [hotfix_aberto]
        tecnicas:
          - tecnica: tec_feature_flags
            uso: condicional
            quando: {todos: [{var: janela_critica, igual: "sim"}]}
            porque: "em janela crítica, a flag contorna o defeito sem deploy grande"
          - tecnica: tec_rollback
            uso: opcional
            porque: "alternativa quando não existe flag para o trecho"
        status: rascunho
      - id: bug_tri_t6_st3
        exemplo: "Escopo fixado em corrigir só a validação do valor. O time recebe o aviso no canal de engenharia: \"hotfix em andamento, sem outras mudanças no checkout\"."
        rotulo: "Fixar o escopo mínimo e avisar o time"
        papel: tech_lead
        entradas: [hotfix_aberto, prioridade]
        saidas: [hotfix_aberto]
        tecnicas:
          - tecnica: tec_code_review
            uso: recomendada
            porque: "mudança de pressa precisa de um segundo par de olhos"
        status: rascunho
    playbook: pb_bug_tri_t6
    layout:
      coluna: 8
    status: rascunho
    publico: false
  - id: bug_tri_t7
    raia: bug_tri
    tipo: tarefa
    rotulo: Priorizar no backlog com prazo
    condicao: ''
    proximo:
    - para: bug_tri_e2
      condicao: ''
    estado:
      prioridade: backlog
    entradas: [avaliacao_de_impacto, severidade_bug, prioridade]
    saidas: [item_de_backlog, prioridade]
    subtarefas:
      - id: bug_tri_t7_st1
        exemplo: "O bug entra na fila atrás de 2 demandas de maior impacto e à frente de 4 melhorias."
        rotulo: "Ordenar junto com as demais demandas"
        papel: pm
        entradas: [avaliacao_de_impacto, severidade_bug]
        saidas: [item_de_backlog]
        tecnicas:
          - tecnica: tec_wsjf
            uso: opcional
            porque: "ajuda a comparar o bug com o restante do backlog"
        status: rascunho
      - id: bug_tri_t7_st2
        exemplo: "Para um bug de severidade média, o prazo é de 2 sprints. O ticket recebe a data e a pessoa responsável."
        rotulo: "Definir o prazo pela classe de serviço"
        papel: tech_lead
        apoio: [pm]
        entradas: [item_de_backlog, severidade_bug]
        saidas: [item_de_backlog, prioridade]
        tecnicas:
          - tecnica: tec_classes_de_servi_o
            uso: obrigatoria
            porque: "sem prazo o bug no backlog apodrece"
        status: rascunho
    playbook: pb_bug_tri_t7
    layout:
      coluna: 8
    status: rascunho
    publico: false
