perguntas:
  - id: pq_bug_orq_c4_1
    texto: "A correção está numa versão identificável e reversível?"
    depende_de: [bug_orq_c4]
    status: rascunho
    publico: false
  - id: pq_bug_orq_c5_1
    texto: "O teste que falhava com o bug agora passa?"
    depende_de: [bug_orq_c5]
    status: rascunho
    publico: false
  - id: pq_bug_orq_c5_2
    texto: "Alguma funcionalidade core mudou de resultado?"
    depende_de: [bug_orq_c5]
    status: rascunho
    publico: false
  - id: pq_bug_orq_c6_1
    texto: "A jornada onde o bug aparecia funciona de ponta a ponta?"
    depende_de: [bug_orq_c6]
    status: rascunho
    publico: false
  - id: pq_bug_rep_t1_1
    texto: "Quais passos, dados e ambiente levam à falha?"
    depende_de: [bug_rep_t1]
    status: rascunho
    publico: false
  - id: pq_bug_rep_t1_2
    texto: "Falha sempre ou às vezes?"
    depende_de: [bug_rep_t1]
    status: rascunho
    publico: false
  - id: pq_bug_tri_g1_1
    texto: "O que a spec ou o critério de aceitação diz?"
    depende_de: [bug_tri_g1]
    status: rascunho
    publico: false
  - id: pq_bug_tri_g1_2
    texto: "O usuário esperava algo razoável que nunca prometemos?"
    depende_de: [bug_tri_g1]
    status: rascunho
    publico: false
  - id: pq_bug_tri_g2_1
    texto: "Quantos usuários, creators ou compras são afetados?"
    depende_de: [bug_tri_g2]
