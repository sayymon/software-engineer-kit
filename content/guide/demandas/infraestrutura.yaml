  - id: pb_inf_orq_c6
    exemplo: "Chama a raia Implantação; «implantado» leva a «Validação em produção e monitoramento»; «implantacao_revertida» leva a «Execução das tarefas»."
    resumo: Chama a raia Implantação. O fluxo segue pelo retorno que a raia devolver.
