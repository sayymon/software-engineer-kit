    nome: 'Orquestração: infraestrutura e DevOps'
    demanda: infraestrutura
    responsabilidade: Conduzir a demanda de infraestrutura e DevOps do início ao fim, delegando cada etapa a uma raia
    cor: '#607D8B'
    orquestradora: true
    status: rascunho
    publico: false
  - id: inf_pla
    nome: Plano da mudança de infraestrutura
    demanda: infraestrutura
    responsabilidade: Descrever a mudança como código, avaliar o impacto e definir janela e rollback
    cor: '#332288'
    status: rascunho
    publico: false
