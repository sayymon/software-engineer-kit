playbooks:
  - id: pb_inf_pla_s0
    exemplo: "A raia Plano da mudança de infraestrutura começa; o primeiro passo é «Descrever a mudança como infraestrutura como código»."
    resumo: 'Início da raia Plano da mudança de infraestrutura. Responsabilidade: descrever a mudança como código, avaliar o impacto e definir janela e rollback.'
    status: rascunho
    publico: false
  - id: pb_inf_pla_t1
    exemplo: "DevOps entrega Infraestrutura como código da mudança e Ambiente de recuperação de desastre (DR). Infraestrutura como código da mudança: Arquivo versionado que aumenta o pool de conexões do banco e adiciona uma réplica de leitura."
    resumo: 'Descrever a mudança como infraestrutura como código. Entrega: definição versionada da mudança, revisável como qualquer código.'
    perguntas_chave: [pq_inf_pla_t1_1]
    status: rascunho
    publico: false
  - id: pb_inf_pla_t2
    exemplo: "DevOps entrega Plano de mudança. Plano de mudança: Afeta pedidos e relatórios; janela de baixo tráfego às 4h; rollback volta a configuração anterior em 5 minutos."
    resumo: 'Avaliar impacto, janela e plano de rollback. Entrega: serviços afetados, janela de execução e passos para voltar.'
    perguntas_chave: [pq_inf_pla_t2_1]
    status: rascunho
    publico: false
  - id: pb_inf_pla_e1
    exemplo: "A raia Plano da mudança de infraestrutura devolve «plano_aprovado» entregando Plano de mudança; em Plano da mudança de infraestrutura (inf_orq_c1), o fluxo segue para «Verificar a prontidão (Definition of Ready)». Por exemplo, Plano de mudança: Afeta pedidos e relatórios; janela de baixo tráfego às 4h; rollback volta a configuração anterior em 5 minutos."
    resumo: Retorno «plano_aprovado» da raia Plano da mudança de infraestrutura. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_inf_orq_s0
    exemplo: "A raia Orquestração: infraestrutura e DevOps começa; o primeiro passo é «Plano da mudança de infraestrutura»."
    resumo: 'Mudança de infraestrutura afeta tudo que roda em cima dela. Trate como código: versionada, revisada, testada e com caminho de volta.'
    status: rascunho
    publico: false
  - id: pb_inf_orq_c1
    exemplo: "Chama a raia Plano da mudança de infraestrutura; «plano_aprovado» leva a «Verificar a prontidão (Definition of Ready)». Por exemplo, Plano de mudança: Afeta pedidos e relatórios; janela de baixo tráfego às 4h; rollback volta a configuração anterior em 5 minutos."
    resumo: Chama a raia Plano da mudança de infraestrutura. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - 'Retornos possíveis: plano_aprovado'
    status: rascunho
    publico: false
  - id: pb_inf_orq_c2
    exemplo: "Chama a raia Prontidão (Definition of Ready); «pronto_para_iniciar» leva a «Execução das tarefas». Por exemplo, Plano de mudança: Afeta pedidos e relatórios; janela de baixo tráfego às 4h; rollback volta a configuração anterior em 5 minutos."
    resumo: Chama a raia Verificar a prontidão (Definition of Ready). O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - 'Retornos possíveis: pronto_para_iniciar'
    status: rascunho
    publico: false
  - id: pb_inf_orq_c3
    exemplo: "Chama a raia Execução por papéis; «execucao_integrada» leva a «Testes de segurança»."
    resumo: Chama a raia Execução das tarefas. O fluxo segue pelo retorno que a raia devolver.
