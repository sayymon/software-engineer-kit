# Demanda: Infraestrutura e DevOps. Esqueleto (onda 2): orquestradora, raias próprias e raias comuns. Status rascunho.
demandas:
  - id: infraestrutura
    nome: Infraestrutura e DevOps
    sigla: inf
    publico: false
artefatos:
  - id: mudanca_de_infraestrutura
    nome: "Infraestrutura como código da mudança"
    descricao: Definição versionada da mudança, revisável como qualquer código
    tipo: codigo
    subtipo: iac
    exemplo: Arquivo versionado que aumenta o pool de conexões do banco e adiciona uma réplica de leitura
    status: rascunho
    publico: false
  - id: plano_de_mudanca
    nome: Plano de mudança
    descricao: Serviços afetados, janela de execução e passos para voltar
    tipo: documento
    subtipo: plano
    exemplo: Afeta pedidos e relatórios; janela de baixo tráfego às 4h; rollback volta a configuração anterior em 5 minutos
    status: rascunho
    publico: false
raias:
