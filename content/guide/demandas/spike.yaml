playbooks:
  - id: pb_spk_def_s0
    exemplo: "A raia Pergunta e timebox começa; o primeiro passo é «Escrever a pergunta e o critério de sucesso»."
    resumo: "Início da raia Pergunta e timebox. Definir a pergunta, o critério de sucesso e o prazo máximo do spike."
    status: rascunho
    publico: false
  - id: pb_spk_def_t1
    exemplo: "Tech Lead entrega Pergunta do spike. Pergunta do spike: Dá para validar o cupom em menos de 50 ms com o cache distribuído? Sim se o p95 ficar abaixo de 50 ms com 2 mil chamadas por minuto."
    resumo: "Spike sem pergunta vira pesquisa sem fim. Escreva a pergunta, a hipótese e o que conta como resposta."
    perguntas_chave: [pq_spk_def_t1_1, pq_spk_def_t1_2]
    status: rascunho
    publico: false
  - id: pb_spk_def_t2
    exemplo: "Tech Lead entrega Timebox do spike. Timebox do spike: 3 dias; fora: tela, autenticação e dados reais."
    resumo: "O timebox é o contrato do spike: quando acaba, o time decide com o que tem."
    perguntas_chave: [pq_spk_def_t2_1]
    status: rascunho
    publico: false
  - id: pb_spk_def_e1
    exemplo: "A raia Pergunta e timebox devolve «definido» entregando Pergunta do spike e Timebox do spike; em Pergunta e timebox (spk_orq_c1), o fluxo segue para «Experimento e prova de conceito». Por exemplo, Pergunta do spike: Dá para validar o cupom em menos de 50 ms com o cache distribuído? Sim se o p95 ficar abaixo de 50 ms com 2 mil chamadas por minuto."
    resumo: "Retorno «definido»: pergunta, critério e timebox prontos."
    status: rascunho
    publico: false
  - id: pb_spk_poc_s0
    exemplo: "A raia Experimento e prova de conceito começa recebendo Pergunta do spike e Timebox do spike; o primeiro passo é «Construir a POC descartável». Por exemplo, Pergunta do spike: Dá para validar o cupom em menos de 50 ms com o cache distribuído? Sim se o p95 ficar abaixo de 50 ms com 2 mil chamadas por minuto."
    resumo: "Início da raia Experimento e prova de conceito. Construir a POC descartável e medir contra o critério dentro do timebox."
    status: rascunho
    publico: false
  - id: pb_spk_poc_t1
    exemplo: "Dev entrega Prova de conceito (POC). Prova de conceito (POC): Serviço mínimo com o cache distribuído e um script de carga, numa branch que não vai para produção."
    resumo: "A POC é descartável: sem testes completos, sem tela polida, sem dados reais. Ela existe para responder à pergunta."
    perguntas_chave: [pq_spk_poc_t1_1]
    evitar:
    - "Transformar a POC em produção"
    status: rascunho
    publico: false
  - id: pb_spk_poc_t2
    exemplo: "Dev entrega Resultado do spike. Resultado do spike: p95 de 38 ms com 2 mil chamadas por minuto; consumo de memória dentro do limite."
    resumo: "Meça o que o critério pede, do jeito mais simples que dá confiança."
    perguntas_chave: [pq_spk_poc_t2_1]
    status: rascunho
    publico: false
  - id: pb_spk_poc_g1
    exemplo: "Tech Lead decide com Resultado do spike e Timebox do spike: «sim, a pergunta foi respondida» leva a «Pergunta respondida»; «não, o timebox acabou» leva a «Timebox esgotado». Por exemplo, Resultado do spike: p95 de 38 ms com 2 mil chamadas por minuto; consumo de memória dentro do limite."
    resumo: "Com o timebox esgotado, não estique em silêncio: leve o que aprendeu para quem decide."
    status: rascunho
    publico: false
  - id: pb_spk_poc_e1
    exemplo: "A raia Experimento e prova de conceito devolve «respondido» entregando Resultado do spike e Prova de conceito (POC); em Experimento e prova de conceito (spk_orq_c2), o fluxo segue para «Recomendação». Por exemplo, Resultado do spike: p95 de 38 ms com 2 mil chamadas por minuto; consumo de memória dentro do limite."
    resumo: "Retorno «respondido»."
    status: rascunho
    publico: false
  - id: pb_spk_poc_e2
    exemplo: "A raia Experimento e prova de conceito devolve «timebox_esgotado» entregando Resultado do spike; em Experimento e prova de conceito (spk_orq_c2), o fluxo segue para «Timebox esgotado: decidir se estende ou encerra». Por exemplo, Resultado do spike: p95 de 38 ms com 2 mil chamadas por minuto; consumo de memória dentro do limite."
    resumo: "Retorno «timebox_esgotado»: o resultado parcial vai para a decisão."
    status: rascunho
    publico: false
  - id: pb_spk_rec_s0
    exemplo: "A raia Recomendação começa recebendo Resultado do spike e Pergunta do spike; o primeiro passo é «Registrar a recomendação com as evidências». Por exemplo, Resultado do spike: p95 de 38 ms com 2 mil chamadas por minuto; consumo de memória dentro do limite."
    resumo: "Início da raia Recomendação. Registrar a conclusão e a recomendação e levar a decisão a quem decide."
    status: rascunho
    publico: false
  - id: pb_spk_rec_t1
    exemplo: "Tech Lead entrega Recomendação do spike. Recomendação do spike: Viável com cache distribuído; risco na invalidação; feature estimada em 3 semanas."
    resumo: "A recomendação diz o que fazer, por que, os riscos e a estimativa que agora é possível."
    perguntas_chave: [pq_spk_rec_t1_1]
    status: rascunho
    publico: false
  - id: pb_spk_rec_t2
    exemplo: "Tech Lead entrega Comunicado do spike. Comunicado do spike: Spike do cache de cupons: viável, p95 de 38 ms; recomendação e riscos no link."
    resumo: "Quem decide ouve a resposta, a recomendação e os riscos antes de seguir."
    status: rascunho
    publico: false
  - id: pb_spk_rec_g1
    exemplo: "PM decide com Recomendação do spike: «sim, seguir para a feature» leva a «Viável»; «não, descartar e registrar a alternativa» leva a «Inviável». Por exemplo, Recomendação do spike: Viável com cache distribuído; risco na invalidação; feature estimada em 3 semanas."
    resumo: "Viável vai para a feature com a estimativa; inviável fica registrado para ninguém repetir a investigação."
    status: rascunho
    publico: false
  - id: pb_spk_rec_e1
    exemplo: "A raia Recomendação devolve «viavel» entregando Recomendação do spike; em Recomendação (spk_orq_c3), o fluxo segue para «Abordagem viável, segue para a feature». Por exemplo, Recomendação do spike: Viável com cache distribuído; risco na invalidação; feature estimada em 3 semanas."
    resumo: "Retorno «viavel»."
    status: rascunho
    publico: false
  - id: pb_spk_rec_e2
    exemplo: "A raia Recomendação devolve «inviavel» entregando Recomendação do spike; em Recomendação (spk_orq_c3), o fluxo segue para «Abordagem descartada, alternativa registrada». Por exemplo, Recomendação do spike: Viável com cache distribuído; risco na invalidação; feature estimada em 3 semanas."
    resumo: "Retorno «inviavel»."
    status: rascunho
    publico: false
  - id: pb_spk_orq_s0
    exemplo: "A raia Orquestração: spike e prova de conceito começa; o primeiro passo é «Pergunta e timebox»."
    resumo: "Spike é investigação com prazo: troca incerteza por conhecimento. A POC é descartável e responde uma pergunta; não vira produto sem passar pelo fluxo de feature."
    perguntas_chave: [pq_spk_orq_s0_1]
    status: rascunho
    publico: false
  - id: pb_spk_orq_c1
    exemplo: "Chama a raia Pergunta e timebox; «definido» leva a «Experimento e prova de conceito»."
    resumo: "Chama a raia Pergunta e timebox. Retornos possíveis: definido."
    status: rascunho
    publico: false
  - id: pb_spk_orq_c2
    exemplo: "Chama a raia Experimento e prova de conceito; «respondido» leva a «Recomendação»; «timebox_esgotado» leva a «Timebox esgotado: decidir se estende ou encerra». Por exemplo, Pergunta do spike: Dá para validar o cupom em menos de 50 ms com o cache distribuído? Sim se o p95 ficar abaixo de 50 ms com 2 mil chamadas por minuto."
    resumo: "Chama a raia Experimento e prova de conceito. Retornos possíveis: respondido, timebox_esgotado."
    status: rascunho
    publico: false
