# Demanda: Spike e prova de conceito. Onda 3, status rascunho.

demandas:
  - id: spike
    nome: "Spike e prova de conceito"
    sigla: spk
    publico: false

artefatos:
  - id: pergunta_do_spike
    nome: "Pergunta do spike"
    descricao: "A pergunta que o spike responde, a hipótese e o critério que diz se a resposta é sim ou não"
    exemplo: "Dá para validar o cupom em menos de 50 ms com o cache distribuído? Sim se o p95 ficar abaixo de 50 ms com 2 mil chamadas por minuto"
    tipo: documento
    subtipo: especificacao
    status: rascunho
    publico: false
  - id: timebox_do_spike
    nome: "Timebox do spike"
    descricao: "Prazo máximo, o que entra e o que fica fora da investigação"
    exemplo: "3 dias; fora: tela, autenticação e dados reais"
    tipo: documento
    subtipo: plano
    status: rascunho
    publico: false
  - id: poc
    nome: "Prova de conceito (POC)"
    descricao: "Código descartável que demonstra só o necessário para responder à pergunta do spike"
    exemplo: "Serviço mínimo com o cache distribuído e um script de carga, numa branch que não vai para produção"
    tipo: codigo
    subtipo: aplicacao
    status: rascunho
    publico: false
  - id: resultado_do_spike
    nome: "Resultado do spike"
    descricao: "O que foi medido ou observado na POC contra o critério de sucesso"
    exemplo: "p95 de 38 ms com 2 mil chamadas por minuto; consumo de memória dentro do limite"
    tipo: documento
    subtipo: relatorio
    status: rascunho
    publico: false
  - id: recomendacao_do_spike
    nome: "Recomendação do spike"
    descricao: "Conclusão, alternativas avaliadas, riscos e a estimativa que agora é possível fazer"
    exemplo: "Viável com cache distribuído; risco na invalidação; feature estimada em 3 semanas"
    tipo: documento
    subtipo: analise
    status: rascunho
    publico: false
  - id: comunicado_do_spike
    nome: "Comunicado do spike"
    descricao: "Mensagem com a pergunta, a resposta e a recomendação para quem decide"
    exemplo: "Spike do cache de cupons: viável, p95 de 38 ms; recomendação e riscos no link"
    tipo: acao
    subtipo: comunicacao
    destinatarios: [stakeholder, times_dependentes]
    status: rascunho
    publico: false

raias:
  - id: spk_orq
    nome: "Orquestração: spike e prova de conceito"
    demanda: spike
    responsabilidade: "Responder uma pergunta técnica ou de produto dentro de um timebox, com uma POC descartável, antes de decidir ou estimar"
    cor: '#607D8B'
    orquestradora: true
    status: rascunho
    publico: false
  - id: spk_def
    nome: "Pergunta e timebox"
    demanda: spike
    responsabilidade: "Definir a pergunta, o critério de sucesso e o prazo máximo do spike"
    cor: '#332288'
    status: rascunho
    publico: false
  - id: spk_poc
    nome: "Experimento e prova de conceito"
    demanda: spike
    responsabilidade: "Construir a POC descartável e medir contra o critério dentro do timebox"
    cor: '#117733'
    status: rascunho
    publico: false
    entradas: [pergunta_do_spike, timebox_do_spike]
  - id: spk_rec
    nome: "Recomendação"
    demanda: spike
    responsabilidade: "Registrar a conclusão e a recomendação e levar a decisão a quem decide"
    cor: '#CC6677'
    status: rascunho
    publico: false
    entradas: [resultado_do_spike, pergunta_do_spike]

decisoes:
  - id: spk_def_s0
    raia: spk_def
    tipo: inicio
    rotulo: "Incerteza registrada, definir o spike"
    condicao: ''
    proximo:
