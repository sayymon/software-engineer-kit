  - id: pb_sec_con_g1
    exemplo: "Segurança decide com Classificação de risco de segurança: «sim, conter já» leva a «Conter a exposição: WAF, bloqueio ou rotação de segredos»; «não, seguir para a correção» leva a «Sem contenção imediata». Por exemplo, Classificação de risco de segurança: CVSS 8,1; endpoint público; exploração pública conhecida; dados de pagamento no caminho."
    resumo: "Conter antes de corrigir quando o risco é alto: cada hora exposta conta."
