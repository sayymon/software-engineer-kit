    exemplo: "Segurança decide com Achado de segurança: «sim, exploração ativa» leva a «Exploração ativa»; «não» leva a «Reproduzir e classificar o risco pelo CVSS e pela exposição». Por exemplo, Achado de segurança: CVE de alta severidade na biblioteca de parsing de JSON usada pelo checkout, reportada pela varredura de dependências."
    resumo: "Exploração ativa é incidente: o fluxo de incidente comanda a resposta."
