  - id: pb_sec_tri_e1
    exemplo: "A raia Triagem de segurança devolve «ataque_em_andamento» entregando Achado de segurança; em Triagem de segurança (sec_orq_c1), o fluxo segue para «Exploração ativa tratada como incidente de segurança». Por exemplo, Achado de segurança: CVE de alta severidade na biblioteca de parsing de JSON usada pelo checkout, reportada pela varredura de dependências."
