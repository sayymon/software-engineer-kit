# Demanda: Segurança. Onda 3, status rascunho.

demandas:
  - id: seguranca
    nome: "Segurança"
    sigla: sec
    publico: false

artefatos:
  - id: achado_de_seguranca
    nome: "Achado de segurança"
    descricao: "Registro do achado: origem (varredura, teste de intrusão, recompensa por bugs, alerta, CVE de dependência), componente, evidência e quem reportou"
    exemplo: "CVE de alta severidade na biblioteca de parsing de JSON usada pelo checkout, reportada pela varredura de dependências"
    tipo: documento
    subtipo: registro
    status: rascunho
    publico: false
  - id: classificacao_de_risco
    nome: "Classificação de risco de segurança"
    descricao: "Severidade pelo CVSS, exposição (pública ou interna), exploração conhecida e dados afetados"
    exemplo: "CVSS 8,1; endpoint público; exploração pública conhecida; dados de pagamento no caminho"
    tipo: documento
    subtipo: analise
    status: rascunho
    publico: false
  - id: contencao_de_seguranca
    nome: "Contenção de segurança"
    descricao: "Medida imediata que reduz a exposição antes da correção: bloqueio, regra de WAF (patch virtual), rotação de segredos ou desligar o recurso"
    exemplo: "Regra de WAF bloqueando o payload malicioso e rotação das chaves da API de cupons"
    tipo: acao
    subtipo: contencao
    status: rascunho
    publico: false
  - id: teste_de_exploracao
    nome: "Teste de exploração"
    descricao: "Teste que reproduz a exploração da vulnerabilidade e passa a falhar depois da correção"
    exemplo: "Teste que envia o JSON malicioso ao checkout e espera a recusa, não a execução"
    tipo: teste
    subtipo: seguranca
    status: rascunho
    publico: false
  - id: avaliacao_de_dados_pessoais
    nome: "Avaliação de dados pessoais"
    descricao: "Se houve exposição de dados pessoais, quais, de quantas pessoas e por quanto tempo, para decidir as notificações legais"
    exemplo: "Sem exposição: logs mostram tentativas bloqueadas pela regra de WAF desde a primeira hora"
    tipo: documento
    subtipo: analise
    status: rascunho
    publico: false
  - id: notificacao_regulatoria
    nome: "Notificação regulatória"
    descricao: "Comunicação à autoridade de proteção de dados e aos titulares quando a lei exige"
    exemplo: "Notificação à autoridade em até 3 dias úteis com a natureza dos dados e as medidas tomadas"
    tipo: acao
    subtipo: comunicacao
    destinatarios: [stakeholder]
    status: rascunho
    publico: false
  - id: aviso_de_seguranca
    nome: "Aviso de segurança"
    descricao: "Comunicado responsável do que foi corrigido, para quem precisa agir (times, suporte e, se for o caso, clientes)"
    exemplo: "Aviso aos times: dependência atualizada no checkout; nenhum dado exposto; atualizar também nos serviços X e Y"
    tipo: acao
    subtipo: comunicacao
    destinatarios: [times_dependentes, suporte, stakeholder]
    status: rascunho
    publico: false

raias:
  - id: sec_orq
    nome: "Orquestração: segurança"
    demanda: seguranca
    responsabilidade: "Tratar uma vulnerabilidade encontrada ou um ataque identificado: triar, conter, corrigir, validar e divulgar com responsabilidade"
    cor: '#607D8B'
    orquestradora: true
    status: rascunho
    publico: false
  - id: sec_tri
    nome: "Triagem de segurança"
    demanda: seguranca
    responsabilidade: "Confirmar o achado, descartar falso positivo e classificar o risco"
    cor: '#332288'
    status: rascunho
    publico: false
  - id: sec_con
    nome: "Contenção da exposição"
    demanda: seguranca
    responsabilidade: "Reduzir a exposição enquanto a correção não chega"
    cor: '#117733'
    status: rascunho
    publico: false
    entradas: [classificacao_de_risco, achado_de_seguranca]
  - id: sec_cor
    nome: "Correção da vulnerabilidade"
    demanda: seguranca
    responsabilidade: "Corrigir na causa com o teste de exploração e abrir o PR"
    cor: '#CC6677'
    status: rascunho
    publico: false
    entradas: [classificacao_de_risco, achado_de_seguranca]
  - id: sec_div
    nome: "Conformidade e divulgação"
    demanda: seguranca
    responsabilidade: "Avaliar dados pessoais, cumprir as notificações legais e divulgar com responsabilidade"
    cor: '#44AA99'
    status: rascunho
    publico: false
    entradas: [achado_de_seguranca, classificacao_de_risco]

