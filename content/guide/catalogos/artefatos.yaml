    subtipo: comunicacao
    status: rascunho
    destinatarios:
    - tech_lead
    - dev
    - qa
    - arquiteto
    - times_dependentes
  - id: matriz_de_papeis
    nome: Matriz de papéis
    descricao: Papel principal e de apoio de cada tarefa, com tarefas sensíveis marcadas
