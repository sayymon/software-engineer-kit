    exemplo: "A raia Prontidão (Definition of Ready) devolve «pronto_para_iniciar» entregando Critérios de aceite e Checklist de prontidão; em Verificar a prontidão (Definition of Ready) (feat_cls_c1), o fluxo segue para «Escopo delimitado e pronto para especificar». Por exemplo, Critérios de aceite: Dado um cupom válido, quando o comprador o aplica no checkout, então o total mostra o desconto em até 1 s."
    resumo: 'Retorno «pronto_para_iniciar» da raia Prontidão (Definition of Ready): item que atende à Definition of Ready, fatiado e priorizado. Quem chamou a raia segue para a próxima etapa da própria demanda (especificar, corrigir, executar).'
    perguntas_chave: [pq_com_pro_e1_1]
    status: rascunho
    publico: false
  - id: pb_com_dcs_s0
    resumo: "Antes de especificar, decida se a solução é construída, comprada ou assinada. A decisão começa pelo custo nos três prazos e pelo orçamento previsto."
    exemplo: "O escopo do cupom de recompra está claro; antes da spec, o time compara construir, comprar e assinar."
    perguntas_chave: [pq_com_dcs_s0_1]
    status: rascunho
    publico: false
  - id: pb_com_dcs_t1
    resumo: "O custo de cada opção é levantado nos três prazos, com o custo de não fazer e o ROI. É a evidência que embasa as notas do Decisor."
    exemplo: "Relatório de custo com construir, comprar e assinar em 6 meses, 2 anos e 5 anos, mais o custo de não fazer."
    perguntas_chave: [pq_com_dcs_t1_1, pq_com_dcs_t1_2]
    fazer:
    - "Compare as três opções no mesmo horizonte"
    - "Inclua manutenção, operação e o custo de sair"
    evitar:
    - "Comparar só o preço inicial"
    status: rascunho
    publico: false
  - id: pb_com_dcs_g1
    resumo: "Portão de custo: com todas as opções fora do orçamento, a demanda volta ao demandante com o relatório de custo, que já é um insumo para a priorização."
    exemplo: "O custo de assinar e de comprar está dentro do previsto; a decisão segue para o Decisor sem a opção de construir agora."
    perguntas_chave: [pq_com_dcs_g1_1]
    status: rascunho
    publico: false
  - id: pb_com_dcs_t2
    resumo: "O Decisor pondera os critérios pelo objetivo de quem pede e devolve a recomendação com a conta aberta."
    exemplo: "Objetivo cumprir_prazo: assinar vence pelo tempo até o valor; construir só venceria com diferenciar_produto."
    perguntas_chave: [pq_com_dcs_t2_1]
    fazer:
    - "Use o comando engenharia decidir e guarde a justificativa"
    evitar:
    - "Ajustar notas até a opção preferida vencer"
    status: rascunho
    publico: false
  - id: pb_com_dcs_t3
    resumo: "O ADR registra a opção, as alternativas, o relatório de custo, o resultado do Decisor e as consequências, como o plano de saída."
    exemplo: "ADR 014: assinar o motor de cupons do fornecedor B; revisar a decisão em 2 anos."
    perguntas_chave: [pq_com_dcs_t3_1]
    status: rascunho
    publico: false
  - id: pb_com_dcs_g2
    resumo: "A opção do ADR define o caminho: construir segue para a spec; comprar e assinar passam antes pela escolha do fornecedor."
    exemplo: "Assinar: a raia de fornecedor e contratação escolhe o fornecedor antes da spec da integração."
    status: rascunho
    publico: false
  - id: pb_com_dcs_e1
    resumo: "Retorno «construir» da raia Decisão construir, comprar ou assinar."
    exemplo: "A raia devolve «construir» com o ADR de fornecimento e o relatório de custo."
    status: rascunho
    publico: false
  - id: pb_com_dcs_e2
    resumo: "Retorno «comprar» da raia Decisão construir, comprar ou assinar."
    exemplo: "A raia devolve «comprar» com o ADR de fornecimento e o relatório de custo."
    status: rascunho
    publico: false
  - id: pb_com_dcs_e3
    resumo: "Retorno «assinar» da raia Decisão construir, comprar ou assinar."
    exemplo: "A raia devolve «assinar» com o ADR de fornecimento e o relatório de custo."
    status: rascunho
    publico: false
  - id: pb_com_dcs_e4
    resumo: "Retorno «fora_do_orcamento»: nenhuma opção cabe no orçamento previsto; o relatório de custo volta para quem pediu."
    exemplo: "Fora do orçamento do ano: a feature volta ao backlog com o relatório de custo anexado."
    status: rascunho
    publico: false
  - id: pb_com_frn_s0
    resumo: "Comprar ou assinar também é entrega: o fornecedor precisa atender os requisitos, a segurança e ter um plano de saída."
    exemplo: "Decidido assinar o motor de cupons; três fornecedores na lista."
    status: rascunho
    publico: false
  - id: pb_com_frn_t1
    resumo: "Avalie os fornecedores com a mesma régua: requisitos, arquitetura, segurança, privacidade, SLA, suporte e saída."
    exemplo: "Avaliação de 3 fornecedores; o B é o único com exportação completa dos dados."
    perguntas_chave: [pq_com_frn_t1_1]
    evitar:
    - "Escolher pelo preço sem conferir segurança e saída"
    status: rascunho
    publico: false
  - id: pb_com_frn_g1
    resumo: "Nenhum fornecedor atende: a decisão volta para o Decisor com a avaliação, normalmente apontando para construir."
    exemplo: "Nenhum fornecedor exporta os dados; a decisão volta e construir passa a vencer."
    status: rascunho
    publico: false
  - id: pb_com_frn_t2
    resumo: "O contrato fecha preço, SLA, cláusulas de segurança e privacidade e o plano de saída. A integração com o fornecedor vira requisito da spec."
    exemplo: "Assinatura anual do fornecedor B; a spec passa a ter a integração com a API dele."
    perguntas_chave: [pq_com_frn_t2_1]
    status: rascunho
    publico: false
  - id: pb_com_frn_e1
    resumo: "Retorno «contratado»: a feature segue para a prontidão e a spec já com a integração."
    exemplo: "Contrato assinado; tem_integracao = sim."
    status: rascunho
    publico: false
  - id: pb_com_frn_e2
    resumo: "Retorno «nenhum_atende»: a decisão volta para o Decisor."
    exemplo: "Nenhum fornecedor atende; volta para a decisão."
    status: rascunho
    publico: false

