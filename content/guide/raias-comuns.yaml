# Biblioteca de raias comuns: raias reutilizáveis que qualquer orquestradora pode chamar (setup, execução,
# publicação, testes, review, homologação, implantação, liberação e monitoramento). A demanda `comum` é uma
# biblioteca: não tem orquestradora, não aparece no seletor e entra no diagrama de cada demanda que a chama.
demandas:
  - id: comum
    nome: Raias comuns
    sigla: com
    biblioteca: true
    publico: false
raias:
  - id: com_set
    nome: Preparação para execução (setup)
    demanda: comum
    responsabilidade: Preparar ferramentas, ambiente, contexto, agentes e skills, e definir quem exerce cada papel, antes de iniciar a execução
    cor: '#AA4499'
    entradas:
    - lista_de_tarefas
    - matriz_de_papeis
    - mapa_de_dependencias
    - mapa_de_tarefas
    - spec
    - design_md
    - adrs_da_feature
    - usa_ia
    - aprendizado_do_agente
    status: rascunho
    publico: false
  - id: com_exe
    nome: Execução por papéis
    demanda: comum
    responsabilidade: Orquestrar a execução das tarefas entre agentes e pessoas por papel, na ordem e no paralelismo planejados
    cor: '#009E73'
    entradas:
    - decisoes_bloqueantes
    - ordem_execucao
    - plano_de_agentes
    - plano_de_alocacao
    - tarefa_de_correcao
    - tipo_alocacao
    - dependencia_humana
    - ambiente_efemero
    status: rascunho
    publico: false
  - id: com_pub
    nome: Publicação em ambiente de testes
    demanda: comum
    responsabilidade: Versionar pela estratégia do time e publicar em um ambiente de testes, como o staging de desenvolvimento
    cor: '#BBCC33'
    entradas:
    - entrega_integrada
    - branch_da_feature
    - pipeline_ci_cd
    status: rascunho
    publico: false
  - id: com_dea
    nome: Execução pelos agentes por papel
    demanda: comum
    responsabilidade: Executar, por meio dos agentes de cada papel, as tarefas delegadas, com autonomia delimitada e desvios sinalizados
    entradas:
    - plano_de_agentes
    - lista_de_tarefas
    - agente_do_papel
    - skill_do_agente
    - configuracao_de_ferramentas
    - spec
    - ambiente_de_desenvolvimento
    - contexto_de_execucao
    - ambiente_sandbox
    cor: '#E69F00'
    status: rascunho
    publico: false
  - id: com_exp
    nome: Execução pelas pessoas por papel
    demanda: comum
    responsabilidade: Executar pelas pessoas de cada papel as tarefas humanas e de decisão, pareando com agentes nas híbridas
    cor: '#882255'
    entradas: [ambiente_local]
    status: rascunho
    publico: false
  - id: com_mel
    nome: Melhoria contínua dos agentes
    demanda: comum
    responsabilidade: Revisar e melhorar o agente a cada desvio do esperado, transformando o desvio em teste e em aprendizado
    cor: '#6699CC'
    entradas:
    - registro_de_desvio
    status: rascunho
    publico: false
  - id: com_val
    nome: Testes automatizados e regressão
    demanda: comum
    responsabilidade: Validar a entrega com testes unitários, de integração, de contrato e de regressão das funcionalidades core, revisando e aprimorando os testes com TDD e a pirâmide de testes
    cor: '#D55E00'
    status: rascunho
    publico: false
    entradas:
    - entrega_integrada
    - criterios_de_aceite
    - requirements_md
    - tem_integracao
    - definition_of_done
    - altera_comportamento_existente
    - corrige_defeito
    - teste_que_reproduz
    - contrato_de_api
  - id: com_e2e
    nome: Testes de ponta a ponta (E2E)
    demanda: comum
    responsabilidade: Testar as jornadas críticas de usuário afetadas pela entrega e as jornadas core
    cor: '#F0E442'
    entradas:
    - entrega_integrada
    - requirements_md
    - muda_jornada
    - tem_requisito_de_acessibilidade
    - ambiente_de_staging
    - ambiente_de_qa
    status: rascunho
    publico: false
  - id: com_evl
    nome: Avaliação de IA (evals)
    demanda: comum
    responsabilidade: 'Avaliar features com IA aplicada por evals: qualidade, alucinação, custo por chamada e latência'
    cor: '#88CCEE'
    entradas:
    - entrega_integrada
    - requisitos_de_ia
    - usa_ia
    status: rascunho
    publico: false
  - id: com_prf
    nome: Testes de performance
    demanda: comum
    responsabilidade: Medir latência, vazão e ponto de ruptura contra as metas dos requisitos não funcionais
    cor: '#661100'
    entradas:
    - entrega_integrada
    - requirements_md
    - tem_requisito_de_performance
    - janela_critica
    status: rascunho
    publico: false
  - id: com_seg
    nome: Testes de segurança
    demanda: comum
    responsabilidade: Analisar código, dependências e segredos e testar a aplicação em execução
    cor: '#EE7733'
    entradas:
    - entrega_integrada
    - design_md
    - expoe_interface_externa
    - usa_ia
    - exige_seguranca_reforcada
    status: rascunho
    publico: false
  - id: com_rev
    nome: Review humano
    demanda: comum
    responsabilidade: Revisar arquitetura, casos de borda e segurança, inclusive do que os agentes geraram, e aprovar ou pedir ajustes
    entradas:
    - entrega_integrada
    - adrs_da_feature
    cor: '#56B4E9'
    status: rascunho
    publico: false
  - id: com_hml
    nome: Testes integrados
    demanda: comum
    responsabilidade: 'Testar a feature integrada no ambiente que ela pede: staging, homologação ou produção controlada, com estratégia de liberação e aceite do negócio'
    cor: '#997700'
    entradas:
    - versao_da_feature
    - metricas_de_sucesso
    - risco_de_liberacao
    - precisa_de_experimento
    status: rascunho
    publico: false
  - id: com_etg
    nome: Implantação
    demanda: comum
    responsabilidade: 'Implantar em produção respeitando janelas críticas e conferir pelo checklist: versão, saúde, monitoramento, logs e negócio'
    cor: '#999933'
    status: rascunho
    publico: false
    entradas:
    - versao_da_feature
    - estrategia_de_liberacao
    - usa_ia
    - janela_critica
    - risco_de_liberacao
    - ambiente_de_pre_producao
  - id: com_lib
    nome: Liberação e comunicação
    demanda: comum
    responsabilidade: Acionar os stakeholders e liberar a feature por tipo de usuário ou região quando houver estratégia de rollout
    cor: '#EE8866'
    entradas:
    - implantacao_em_producao
    - estrategia_de_liberacao
    - mapa_de_interessados
    - tem_rollout_gradual
    status: rascunho
    publico: false
  - id: com_mon
    nome: Validação em produção e monitoramento
    demanda: comum
    responsabilidade: Validar a feature em produção pelos indicadores técnicos e de negócio e acionar o incidente quando ela causar degradação
    cor: '#77AADD'
    entradas:
    - metricas_de_sucesso
    - implantacao_em_producao
    - precisa_de_experimento
    - ambiente_de_producao
    status: rascunho
    publico: false
  - id: com_pro
    nome: Prontidão (Definition of Ready)
    demanda: comum
    responsabilidade: Garantir que o item atende à Definition of Ready e está pronto para o time iniciar, em qualquer demanda
    cor: '#DDCC77'
    status: rascunho
    publico: false
    entradas:
    - historias_refinadas
    - escopo_da_feature
    - definition_of_done
    - criterios_de_aceite
  - id: com_dcs
    nome: Decisão construir, comprar ou assinar
    demanda: comum
    responsabilidade: Levantar o custo de cada opção no curto, médio e longo prazo, confirmar se cabe no orçamento, pontuar as opções no Decisor e registrar a decisão em ADR
    cor: '#4477AA'
    status: rascunho
    publico: false
    entradas: [escopo_da_feature, requisitos_classificados, caso_de_negocio, metricas_de_sucesso]
  - id: com_frn
    nome: Fornecedor e contratação
    demanda: comum
    responsabilidade: Avaliar fornecedores, contratar com SLA e plano de saída e preparar a integração
    cor: '#AA3377'
    status: rascunho
    publico: false
    entradas: [adr_de_fornecimento, relatorio_de_custo, requisitos_classificados, opcao_de_fornecimento]

decisoes:
  - id: com_set_s0
    raia: com_set
    tipo: inicio
    rotulo: Tarefas mapeadas, preparar a execução
    condicao: ''
    proximo:
    - para: com_set_t1
      condicao: ''
    estado: {}
    playbook: pb_com_set_s0
    layout:
      coluna: 0
    status: rascunho
    publico: false
  - id: com_set_t1
    raia: com_set
    tipo: tarefa
    rotulo: Preparar o ambiente e as ferramentas
    condicao: ''
    proximo:
    - para: com_set_t2
      condicao: ''
    estado: {}
    entradas:
    - lista_de_tarefas
    - mapa_de_tarefas
    saidas:
    - ambiente_de_desenvolvimento
    - branch_da_feature
    - pipeline_ci_cd
    - ambiente_local
    - ambiente_sandbox
    - ambiente_efemero
    subtarefas:
    - id: com_set_t1_st1
      rotulo: Criar a branch da feature e o ambiente de desenvolvimento
      papel: dev
      saidas:
      - branch_da_feature
      - ambiente_de_desenvolvimento
      tecnicas:
      - tecnica: tec_estrategia_de_branches
        uso: obrigatoria
        porque: a branch da feature isola o trabalho e define como ele volta à principal
      exemplo: Branch feature/cupom-recorrente a partir da principal; ambiente local com dados de exemplo.
      status: rascunho
    - id: com_set_t1_st2
      rotulo: Configurar o pipeline de integração contínua
      papel: devops
      apoio:
      - sre
      - seguranca
      saidas:
      - ambiente_de_desenvolvimento
      - pipeline_ci_cd
      tecnicas:
      - tecnica: tec_devsecops
        uso: recomendada
        porque: o pipeline nasce com as análises de segurança
      - tecnica: tec_ci_cd
        uso: obrigatoria
        porque: todo commit da feature passa pelos testes e pelas análises automáticas
      exemplo: Pipeline com testes, análise estática, varredura de dependências e publicação em homologação.
      status: rascunho
    - id: com_set_t1_st3
      rotulo: Liberar acessos com menor privilégio
      papel: seguranca
      saidas:
      - ambiente_de_desenvolvimento
      tecnicas:
      - tecnica: tec_menor_privilegio
        uso: obrigatoria
        porque: cada pessoa e agente recebe só o acesso que a tarefa exige
      exemplo: Leitura do histórico em homologação para Dev e QA; nenhum acesso a dados de produção.
      status: rascunho
    - id: com_set_t1_st4
      rotulo: Preparar o ambiente local de quem desenvolve
      papel: dev
      apoio:
      - devops
      quando:
        todos:
        - var: tipo_alocacao
          diferente: somente_agente
      porque: pessoas que executam tarefas precisam subir a entrega na própria máquina
      saidas:
      - ambiente_local
      exemplo: Um comando sobe checkout, banco e cache de cupons em contêineres com dados sintéticos.
      status: rascunho
    - id: com_set_t1_st5
      rotulo: Preparar o sandbox isolado do agente
      papel: devops
      apoio:
      - seguranca
      quando:
        todos:
        - var: tipo_alocacao
          diferente: somente_pessoas
      porque: o agente executa sem acesso a produção nem a segredos reais
      saidas:
      - ambiente_sandbox
      tecnicas:
      - tecnica: tec_devsecops
        uso: recomendada
        porque: rede restrita e credenciais de teste nascem com o sandbox
      exemplo: Contêiner por tarefa com o repositório, credenciais de teste e rede restrita.
      status: rascunho
    - id: com_set_t1_st6
      rotulo: Configurar ambientes efêmeros por PR
      papel: devops
      quando:
        todos:
        - var: tem_ambiente_efemero
          igual: sim
      porque: cada mudança é testada e revisada isolada antes do merge
      entradas:
      - pipeline_ci_cd
      saidas:
      - ambiente_efemero
      exemplo: O pipeline cria pr-412.preview com banco descartável e remove no merge.
      status: rascunho
    playbook: pb_com_set_t1
    layout:
      coluna: 1
    status: rascunho
    publico: false
  - id: com_set_t2
    raia: com_set
    tipo: tarefa
    rotulo: Revisar e preparar o contexto
    condicao: ''
    proximo:
    - para: com_set_t3
      condicao: ''
    estado: {}
    entradas:
    - spec
    - design_md
    - adrs_da_feature
    saidas:
    - contexto_de_execucao
    subtarefas:
    - id: com_set_t2_st1
      rotulo: Revisar a spec, o design e os ADRs com o time
      papel: tech_lead
      apoio:
      - arquiteto
      saidas:
      - contexto_de_execucao
      exemplo: 'Sessão de 30 minutos: dúvidas sobre o contrato do evento resolvidas antes de começar.'
      status: rascunho
    - id: com_set_t2_st2
      rotulo: Preparar o contexto do projeto para os agentes
      papel: engenheiro_de_ia
      apoio:
      - arquiteto
      entradas:
      - contexto_de_execucao
      saidas:
      - contexto_de_execucao
      tecnicas:
      - tecnica: tec_spec_driven_development
        uso: recomendada
        porque: agentes executam melhor com spec, padrões e regras do projeto à mão
      exemplo: Contexto com estrutura do projeto, padrões, convenções de teste e os ADRs da feature.
      status: rascunho
    playbook: pb_com_set_t2
    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: com_set_t3
    raia: com_set
    tipo: tarefa
    rotulo: 'Definir quem exerce cada papel: pessoa, agente ou par'
    condicao: ''
    proximo:
    - para: com_set_g1
      condicao: ''
    estado:
      alocacao: agente|pessoa|hibrida
      tarefas_agente: lista de tarefas
      tarefas_pessoa: lista de tarefas
    entradas:
    - lista_de_tarefas
    - matriz_de_papeis
    - mapa_de_dependencias
    saidas:
    - alocacao
    - tarefas_agente
    - tarefas_pessoa
    - tipo_alocacao
    - plano_de_alocacao
    subtarefas:
    - id: com_set_t3_st1
      exemplo: Gerar os testes de contrato vai para o agente porque o critério é objetivo. Decidir a regra de acúmulo de cupons fica com a pessoa, porque envolve negócio.
      rotulo: Aplicar o critério de alocação a cada tarefa
      papel: tech_lead
      apoio:
      - gerente_de_engenharia
      entradas:
      - lista_de_tarefas
      - mapa_de_dependencias
      saidas:
      - alocacao
      - plano_de_alocacao
      tecnicas:
      - tecnica: tec_matriz_de_alocacao
        uso: obrigatoria
        porque: um critério escrito evita delegar ao agente só por conveniência
      status: rascunho
    - id: com_set_t3_st2
      exemplo: A tarefa de reembolso de cupom toca dinheiro e dados pessoais, então muda de agente para híbrida, com revisão obrigatória de uma pessoa.
      rotulo: Revisar tarefas ambíguas, sensíveis ou de risco
      papel: arquiteto
      apoio:
      - seguranca
      entradas:
      - alocacao
      - lista_de_tarefas
      saidas:
      - alocacao
      - plano_de_alocacao
      tecnicas:
      - tecnica: tec_adrs
        uso: recomendada
        porque: a decisão de arquitetura que fica com a pessoa merece registro
      - tecnica: tec_x3_amigos
        uso: opcional
        porque: alinha negócio, produto e qualidade quando há ambiguidade
      status: rascunho
    - id: com_set_t3_st3
      exemplo: 'Lista do agente: 5 tarefas (testes, endpoint, migração). Lista das pessoas: 2 tarefas (regra de acúmulo e texto da mensagem de erro).'
      rotulo: Montar as listas do agente e das pessoas
      papel: tech_lead
      entradas:
      - alocacao
      - lista_de_tarefas
      saidas:
      - plano_de_alocacao
      - tarefas_agente
      - tarefas_pessoa
      - tipo_alocacao
      status: rascunho
    playbook: pb_com_set_t3
    layout:
      coluna: 3
    status: rascunho
    publico: false
  - id: com_set_g1
    raia: com_set
    tipo: bifurcacao
    rotulo: Há tarefas para agentes?
    condicao: O plano de alocação tem tarefas para agentes?
    proximo:
    - para: com_set_t4
      condicao: sim, há tarefas para agentes
    - para: com_set_t8
      condicao: não, só pessoas
    estado: {}
    entradas:
    - tipo_alocacao
    - tarefas_agente
    - tarefas_pessoa
    papel: tech_lead
    playbook: pb_com_set_g1
    layout:
      coluna: 4
    status: rascunho
    publico: false
  - id: com_set_t4
    raia: com_set
    tipo: tarefa
    rotulo: Mapear papéis, skills e ferramentas por tarefa
    condicao: ''
    proximo:
    - para: com_set_t5
      condicao: ''
    estado: {}
    entradas:
    - plano_de_alocacao
    - lista_de_tarefas
    saidas:
    - mapa_de_capacidades
    subtarefas:
    - id: com_set_t4_st1
      rotulo: Identificar o papel de cada tarefa delegada
      papel: tech_lead
      apoio:
      - arquiteto
      saidas:
      - mapa_de_capacidades
      exemplo: 'Endpoint de cupom: papel Dev. Evals do recomendador: papel QA. ADR do contrato: Arquiteto.'
      status: rascunho
    - id: com_set_t4_st2
      rotulo: Listar as skills e as categorias de ferramenta por papel
      papel: engenheiro_de_ia
      apoio:
      - arquiteto
      entradas:
      - mapa_de_capacidades
      saidas:
      - mapa_de_capacidades
      exemplo: 'Agente Dev: skill de testes de contrato, ferramenta de controle de versão e de execução de testes.'
      status: rascunho
    - id: com_set_t4_st3
      rotulo: Definir permissões e limites de autonomia por papel
      papel: seguranca
      apoio:
      - arquiteto
      entradas:
      - mapa_de_capacidades
      saidas:
      - mapa_de_capacidades
      tecnicas:
      - tecnica: tec_menor_privilegio
        uso: obrigatoria
        porque: o agente só recebe o acesso que a tarefa exige
      exemplo: Agente Dev pode abrir PR, não pode fazer merge nem acessar dados de produção.
      status: rascunho
    playbook: pb_com_set_t4
    layout:
      coluna: 5
    status: rascunho
    publico: false
  - id: com_set_t5
    raia: com_set
    tipo: tarefa
    rotulo: Buscar agentes, skills e ferramentas existentes
    condicao: ''
    proximo:
    - para: com_set_g2
      condicao: ''
    estado: {}
    entradas:
    - mapa_de_capacidades
    - aprendizado_do_agente
    saidas:
    - selecao_de_agentes
    - cobertura_de_agentes
    subtarefas:
    - id: com_set_t5_st1
      rotulo: Consultar o catálogo de agentes, skills e aprendizados
      papel: tech_lead
      entradas:
      - mapa_de_capacidades
      - aprendizado_do_agente
      saidas:
      - selecao_de_agentes
      exemplo: O agente Dev do time já cobre APIs; o aprendizado registrado diz que ele erra fuso horário em datas.
      status: rascunho
    - id: com_set_t5_st2
      rotulo: Comparar as capacidades com o que cada papel exige
      papel: arquiteto
      entradas:
      - selecao_de_agentes
      - mapa_de_capacidades
      saidas:
      - selecao_de_agentes
      - cobertura_de_agentes
      exemplo: 'Cobertura: Dev atende, QA precisa de uma skill de evals, não há agente de dados. Resultado: precisam_de_ajuste.'
      status: rascunho
    playbook: pb_com_set_t5
    layout:
      coluna: 6
    status: rascunho
    publico: false
  - id: com_set_g2
    raia: com_set
    tipo: bifurcacao
    rotulo: Os agentes existentes cobrem os papéis?
    condicao: Os agentes existentes cobrem os papéis e as capacidades das tarefas?
    proximo:
    - para: com_set_t7
      condicao: cobrem
    - para: com_set_t6
      condicao: faltam agentes ou precisam de ajuste
    estado:
      cobertura_de_agentes: cobrem
    entradas:
    - cobertura_de_agentes
    papel: engenheiro_de_ia
    apoio: [arquiteto]
    playbook: pb_com_set_g2
    layout:
      coluna: 7
    status: rascunho
    publico: false
  - id: com_set_t6
    raia: com_set
    tipo: tarefa
    rotulo: Criar ou refinar agentes, skills e ferramentas
    condicao: ''
    proximo:
    - para: com_set_t7
      condicao: ''
    estado: {}
    entradas:
    - selecao_de_agentes
    - mapa_de_capacidades
    saidas:
    - agente_do_papel
    - skill_do_agente
    - configuracao_de_ferramentas
    subtarefas:
    - id: com_set_t6_st1
      rotulo: Criar ou ajustar a definição do agente do papel
      papel: engenheiro_de_ia
      apoio:
      - arquiteto
      - dev
      saidas:
      - agente_do_papel
      tecnicas:
      - tecnica: tec_prompt_engineering
        uso: recomendada
        porque: instruções claras e exemplos reduzem desvios do agente
      exemplo: Agente QA ganha instrução para escrever evals com casos de borda de data e moeda.
      status: rascunho
