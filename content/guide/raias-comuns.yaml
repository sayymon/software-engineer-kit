    exemplo: "Sessão de 30 minutos: dúvidas sobre o contrato do evento resolvidas antes de começar. Contexto com estrutura do projeto, padrões, convenções de teste e os ADRs da feature."
    resumo: 'Revisar o contexto com o time e prepará-lo para os agentes evita retrabalho: spec, design, ADRs, padrões e regras do projeto.'
    perguntas_chave: [pq_com_set_t2_1, pq_com_set_t2_2]
    status: rascunho
    publico: false
  - id: pb_com_set_t3
    exemplo: Das 9 tarefas, 5 vão para o agente, 2 ficam com pessoas e 2 são híbridas, com o agente propondo e uma pessoa aprovando.
    resumo: 'Nem toda tarefa deve ir para o agente. Classifique cada uma por critério, não por vontade: um complementa o outro.'
    perguntas_chave: [pq_com_set_t3_1, pq_com_set_t3_2]
    fazer:
    - Classifique como «agente» quando é verificável por testes ou evals, tem spec clara e tem baixo risco
    - Classifique como «pessoa» quando exige decisão de arquitetura, resolve ambiguidade, toca segurança ou compliance, envolve negociação com stakeholders ou exige acesso ou permissão sensível
    - 'Classifique como «hibrida» quando a pessoa decide ou pareia e o agente executa a parte mecânica: a tarefa entra nas duas listas'
    - 'Vocabulário: «hibrida» classifica a tarefa quando a pessoa do papel decide ou pareia e o agente do papel executa a parte mecânica; na subtarefa, o papel principal fica em `papel` e os demais em `apoio`'
    - Em dúvida entre agente e pessoa, classifique como pessoa e reavalie quando a dúvida for resolvida
    evitar:
    - Delegar ao agente uma tarefa ainda ambígua
    - Mandar para o agente tudo o que for conveniente, sem checar risco
    - Mandar para pessoas tarefas mecânicas e verificáveis por teste
    tecnicas:
    - tec_adrs
    status: rascunho
    publico: false
