  - id: pb_com_set_t1
    exemplo: "Branch feature/cupom-recorrente a partir da principal; ambiente local com dados de exemplo. Pipeline com testes, análise estática, varredura de dependências e publicação em homologação. Leitura do histórico em homologação para Dev e QA; nenhum acesso a dados de produção."
    resumo: 'Ambiente pronto antes da primeira linha de código: branch da feature, pipeline de integração contínua e acessos com menor privilégio.'
