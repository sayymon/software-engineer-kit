        uso: condicional
        quando:
          todos:
          - var: janela_critica
            igual: sim
        porque: em janela crítica, a carga de teste segue o pico esperado
      exemplo: Base com 2 milhões de pedidos anonimizados; carga do pico da campanha de fim de ano.
