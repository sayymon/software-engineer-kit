playbooks:
  - id: pb_com_pub_s0
    exemplo: "A raia Publicação em ambiente de testes começa recebendo Entrega integrada, Branch da feature e Pipeline de CI/CD; o primeiro passo é «Versionar conforme a estratégia do time». Por exemplo, Entrega integrada: PR de integração com os 3 PRs da onda 2 e os ajustes das pessoas."
    resumo: Início da raia. Depois da revisão e da execução, a feature é versionada conforme a estratégia do time e publicada em um ambiente de testes, como o staging de desenvolvimento, para os testes integrados.
    perguntas_chave: [pq_com_pub_s0_1]
    status: rascunho
    publico: false
  - id: pb_com_pub_t1
    resumo: A versão testada precisa ser a mesma que vai para produção. O versionamento segue a estratégia de branches do time e o build sai do pipeline.
    perguntas_chave: [pq_com_pub_t1_1, pq_com_pub_t1_2]
    status: rascunho
    publico: false
    fazer:
    - Faça o merge ou gere a versão pela estratégia do time
    - Gere o artefato pelo pipeline, nunca na máquina de alguém
    evitar:
    - Testar uma versão e implantar outra
    exemplo: Merge com a flag desligada; versão 4.12.0 gerada pelo pipeline.
  - id: pb_com_pub_t2
    resumo: Publicar no ambiente de testes, como o staging de desenvolvimento, e conferir saúde e configuração antes de liberar os testes.
    perguntas_chave: [pq_com_pub_t2_1, pq_com_pub_t2_2]
    status: rascunho
    publico: false
    exemplo: 4.12.0 no staging; consumidor de eventos conectado; health check verde.
  - id: pb_com_pub_g1
    resumo: Ambiente doente não testa nada. Falha na publicação vai para a análise da causa, normalmente de ambiente ou de configuração.
    perguntas_chave: [pq_com_pub_g1_1, pq_com_pub_g1_2]
    status: rascunho
    publico: false
    exemplo: 'Variável de ambiente ausente: falha na publicação.'
  - id: pb_com_pub_e1
    exemplo: "A raia Publicação em ambiente de testes devolve «publicado» entregando Versão da feature; em Publicar em ambiente de testes (feat_orq_c8), o fluxo segue para «Testes da feature». Por exemplo, Versão da feature: Versão 4.12.0 a partir do merge da feature."
    resumo: 'Retorno «publicado»: publicada no ambiente de testes.'
    perguntas_chave: [pq_com_pub_e1_1]
    status: rascunho
    publico: false
  - id: pb_com_pub_e2
    exemplo: "A raia Publicação em ambiente de testes devolve «falha_na_publicacao» entregando Ambiente de staging; em Publicar em ambiente de testes (feat_orq_c8), o fluxo segue para «Analisar a reprovação e iterar». Por exemplo, Ambiente de staging: Staging com a versão 4.12.0, saudável e com a configuração de produção."
    resumo: 'Retorno «falha_na_publicacao»: falha na publicação.'
    perguntas_chave: [pq_com_pub_e2_1]
    status: rascunho
    publico: false
  - id: pb_com_hml_s0
    exemplo: "A raia Testes integrados começa recebendo Versão da feature, Métricas de sucesso e Risco de liberação; o primeiro passo é «Definir o ambiente e a estratégia de liberação». Por exemplo, Versão da feature: Versão 4.12.0 a partir do merge da feature."
    resumo: 'Início da raia. O ambiente e a estratégia mudam conforme a feature: staging, homologação ou produção controlada, com feature flag, teste A/B e o aceite do negócio.'
    perguntas_chave: [pq_com_hml_s0_1]
    status: rascunho
    publico: false
  - id: pb_com_hml_t1
    resumo: 'O ambiente e a estratégia dependem da feature: staging para integração simples, homologação para dados e parceiros, produção controlada quando só o tráfego real valida.'
    perguntas_chave: [pq_com_hml_t1_1, pq_com_hml_t1_2, pq_com_hml_t1_3]
    status: rascunho
    publico: false
    fazer:
    - Registre o ambiente escolhido e o motivo
    - Defina a flag e o teste A/B quando o risco ou a hipótese pedirem
    exemplo: Homologação, porque integra com Pagamentos; flag com liberação por região; teste A/B de 3 semanas.
  - id: pb_com_hml_g1
    resumo: Staging valida a integração; homologação valida com dados representativos e parceiros; produção controlada valida com tráfego real num grupo pequeno.
    perguntas_chave: [pq_com_hml_g1_1]
    status: rascunho
    publico: false
    exemplo: 'Integração com Pagamentos: homologação.'
  - id: pb_com_hml_t2
    resumo: Testes integrados em staging com os demais sistemas, para integrações simples e de baixo risco.
    perguntas_chave: [pq_com_hml_t2_1]
    status: rascunho
    publico: false
    exemplo: 3 fluxos integrados verdes em staging.
  - id: pb_com_hml_t3
    resumo: 'Homologação reproduz produção: dados representativos e mascarados, parceiros conectados e a flag configurada.'
    perguntas_chave: [pq_com_hml_t3_1, pq_com_hml_t3_2]
    status: rascunho
    publico: false
    evitar:
    - Copiar dados pessoais de produção sem mascarar
    exemplo: 5 fluxos verdes, incluindo boleto vencido.
  - id: pb_com_hml_t4
    resumo: 'Teste em produção controlada: a feature fica ligada só para usuários internos ou um grupo piloto, com kill switch pronto.'
    perguntas_chave: [pq_com_hml_t4_1, pq_com_hml_t4_2]
    status: rascunho
    publico: false
    evitar:
    - Grupo piloto grande demais para conter o impacto
    exemplo: Time interno e 1% de uma região por 48 horas.
  - id: pb_com_hml_t5
    resumo: O aceite do negócio confirma que a feature atende à necessidade, e não só aos critérios técnicos.
    perguntas_chave: [pq_com_hml_t5_1]
    status: rascunho
    publico: false
    exemplo: Demonstração de 20 minutos e aceite registrado.
  - id: pb_com_hml_g2
    resumo: Aprovada só com os testes integrados verdes e o aceite do negócio.
    perguntas_chave: [pq_com_hml_g2_1]
    status: rascunho
    publico: false
    exemplo: 'Testes verdes e aceite registrado: segue para a implantação.'
  - id: pb_com_hml_e1
    exemplo: "A raia Testes integrados devolve «testes_integrados_aprovados» entregando Estratégia de liberação e Tem rollout gradual; em Testes integrados (feat_orq_c15), o fluxo segue para «Implantação». Por exemplo, Estratégia de liberação: Flag ligada para 10% dos compradores recorrentes."
    resumo: 'Retorno «testes_integrados_aprovados»: testes integrados aprovados.'
    perguntas_chave: [pq_com_hml_e1_1]
    status: rascunho
    publico: false
  - id: pb_com_hml_e2
    exemplo: "A raia Testes integrados devolve «reprovado» entregando Resultado da homologação; em Testes integrados (feat_orq_c15), o fluxo segue para «Analisar a reprovação e iterar». Por exemplo, Resultado da homologação: 3 fluxos integrados verdes."
    resumo: 'Retorno «reprovado»: reprovada nos testes integrados.'
    perguntas_chave: [pq_com_hml_e2_1]
    status: rascunho
    publico: false
  - id: pb_com_etg_s0
    exemplo: "A raia Implantação começa recebendo Versão da feature, Estratégia de liberação e Usa IA; o primeiro passo é «Afetado por janela crítica ou sazonalidade?». Por exemplo, Versão da feature: Versão 4.12.0 a partir do merge da feature."
    resumo: Início da implantação em produção. Testes integrados aprovados; a implantação respeita janelas críticas e termina com o checklist conferido.
    perguntas_chave: [pq_com_etg_s0_1]
    status: rascunho
    publico: false
  - id: pb_com_etg_g1
    exemplo: "SRE decide: «sim, há janela crítica ativa» leva a «Janela crítica: ajustar a entrega»; «não, sem janela crítica» leva a «Implantar em produção»."
    resumo: O contexto temporal muda a entrega. Confira se existe janela crítica, evento repentino ou sazonalidade antes de colocar a feature em produção.
    perguntas_chave: [pq_com_etg_g1_1, pq_com_etg_g1_2, pq_com_etg_g1_3]
    fazer:
    - Consulte o calendário de eventos críticos e o status de janela
    - Registre janela_critica e tipo_janela (sazonal, repentina, freeze, manutencao ou nenhuma)
    - Em dúvida, trate como janela ativa e reavalie quando a dúvida for resolvida
    - 'Critério da saída «sim, há janela crítica ativa»: pico sazonal de vendas, lançamento de creator, fechamento financeiro de período, datas promocionais de alto volume, code freeze, janela de manutenção ou evento repentino'
    - 'Critério da saída «não, sem janela crítica»: seguir com a entrega no plano normal'
    evitar:
    - Descobrir o freeze só depois do deploy
    - Entregar uma feature nova, e mais ainda uma com IA de custo variável, no pico de tráfego
    tecnicas:
    - tec_calendario_eventos_criticos
    - tec_status_de_janela
    - tec_code_freeze
    status: rascunho
    publico: false
  - id: pb_com_etg_t1
    exemplo: "SRE entrega Estratégia de liberação. Estratégia de liberação: Flag ligada para 10% dos compradores recorrentes."
    resumo: Na janela crítica o mesmo risco custa mais. Adie a entrega ou reduza o risco com feature flag e rollout gradual.
    perguntas_chave: [pq_com_etg_t1_1, pq_com_etg_t1_2]
    fazer:
    - Prefira adiar a entrega para depois da janela quando a feature não é urgente
    - Se precisar entregar, use feature flag, canary e rollout gradual, com kill switch pronto
    - Combine fallback e teto de custo por chamada antes de abrir para todo o tráfego
    - Registre o motivo do ajuste na linha do tempo da entrega
    evitar:
    - Entregar para 100% do tráfego em plena janela de pico
    - Depender de rollback de grande escopo durante a janela
    tecnicas:
    - tec_feature_flags
    - tec_canary_release
    - tec_deploy_gradual
    - tec_kill_switch
    - tec_code_freeze
    status: rascunho
    publico: false
  - id: pb_com_etg_t2
    resumo: Implantar pela estratégia de liberação definida, com a feature desligada quando houver flag e o rollback testado antes.
    perguntas_chave: [pq_com_etg_t2_1, pq_com_etg_t2_2]
    status: rascunho
    publico: false
    evitar:
    - Implantar fora do pipeline
    exemplo: 4.12.0 implantada com a flag desligada em 3 etapas.
  - id: pb_com_etg_t3
    resumo: 'O checklist de implantação confirma que subiu: versão, saúde, indicadores de monitoramento, logs, negócio e, com IA, a observabilidade do modelo.'
    perguntas_chave: [pq_com_etg_t3_1, pq_com_etg_t3_2, pq_com_etg_t3_3, pq_com_etg_t3_4]
    status: rascunho
    publico: false
    fazer:
    - Acompanhe os primeiros 30 minutos com o painel aberto
    - Compare com a versão anterior, não com a sensação
    exemplo: Instâncias na 4.12.0, erro e p95 estáveis, conversão do checkout sem queda.
  - id: pb_com_etg_g2
    resumo: Checklist todo verde segue para a liberação. Qualquer item vermelho reverte ou desliga a feature antes de investigar.
    perguntas_chave: [pq_com_etg_g2_1]
    status: rascunho
    publico: false
    exemplo: 'Erro do consumidor acima do normal: reverter.'
  - id: pb_com_etg_t4
    resumo: Reverter primeiro, investigar depois. Desligar a flag costuma ser mais rápido que reverter a versão.
    perguntas_chave: [pq_com_etg_t4_1, pq_com_etg_t4_2]
    status: rascunho
    publico: false
    exemplo: Flag desligada em 1 minuto; aviso no canal do time com o motivo.
  - id: pb_com_etg_e1
    exemplo: "A raia Implantação devolve «implantado» entregando Implantação em produção e Checklist de implantação; em Implantação (feat_orq_c16), o fluxo segue para «Liberação e comunicação aos stakeholders». Por exemplo, Implantação em produção: 4.12.0 implantada com a flag desligada."
    resumo: 'Retorno «implantado»: implantada e saudável em produção.'
    perguntas_chave: [pq_com_etg_e1_1]
    status: rascunho
    publico: false
  - id: pb_com_etg_e2
    exemplo: "A raia Implantação devolve «implantacao_revertida» entregando Reversão da implantação; em Implantação (feat_orq_c16), o fluxo segue para «Analisar a reprovação e iterar». Por exemplo, Reversão da implantação: Flag desligada em 1 minuto."
    resumo: 'Retorno «implantacao_revertida»: implantação revertida.'
    perguntas_chave: [pq_com_etg_e2_1]
    status: rascunho
    publico: false
  - id: pb_com_lib_s0
    exemplo: "A raia Liberação e comunicação começa recebendo Implantação em produção, Estratégia de liberação e Mapa de interessados; o primeiro passo é «Comunicar os stakeholders». Por exemplo, Implantação em produção: 4.12.0 implantada com a flag desligada."
    resumo: Início da raia. Depois da implantação, os stakeholders são acionados e, se houver estratégia de rollout, a feature é liberada em ondas por tipo de usuário ou região.
    perguntas_chave: [pq_com_lib_s0_1]
    status: rascunho
    publico: false
  - id: pb_com_lib_t1
    resumo: 'Depois de implantada, a feature é comunicada: interessados, suporte e times dependentes sabem o que muda, para quem, quando e como desligar.'
    perguntas_chave: [pq_com_lib_t1_1, pq_com_lib_t1_2, pq_com_lib_t1_3]
    status: rascunho
    publico: false
    exemplo: Aviso à liderança comercial, ao atendimento e a Pagamentos; notas da 4.12.0 publicadas.
  - id: pb_com_lib_g1
    resumo: Com estratégia de rollout, a liberação segue em ondas por tipo de usuário ou região; sem ela, a feature já está liberada.
    perguntas_chave: [pq_com_lib_g1_1]
    status: rascunho
    publico: false
    exemplo: 'Liberação por região: segue em ondas.'
  - id: pb_com_lib_t2
    resumo: Liberar em ondas limita o raio de impacto. A próxima onda só sai com os indicadores da anterior saudáveis.
    perguntas_chave: [pq_com_lib_t2_1, pq_com_lib_t2_2]
    status: rascunho
    publico: false
    evitar:
    - Ampliar a liberação por calendário, sem olhar os indicadores
    exemplo: Onda 1 no Sudeste; onda 2 em 48 horas com erro estável.
  - id: pb_com_lib_e1
    exemplo: "A raia Liberação e comunicação devolve «liberado» entregando Comunicado de lançamento; em Liberação e comunicação aos stakeholders (feat_orq_c17), o fluxo segue para «Validação em produção e monitoramento». Por exemplo, Comunicado de lançamento: Aviso com data, público e como desligar."
    resumo: 'Retorno «liberado»: liberada e comunicada.'
    perguntas_chave: [pq_com_lib_e1_1]
    status: rascunho
    publico: false
  - id: pb_com_mon_s0
    exemplo: "A raia Validação em produção e monitoramento começa recebendo Métricas de sucesso, Implantação em produção e Precisa de experimento; o primeiro passo é «Monitorar indicadores técnicos e de negócio». Por exemplo, Métricas de sucesso: KR de recompra do trimestre; KPI: recompra em 30 dias de 18% para 20%."
    resumo: 'Início da raia. Ciclo de validação em produção: indicadores técnicos e de negócio observados até o fim da janela; incidente causado pela feature aciona o fluxo de incidente.'
    perguntas_chave: [pq_com_mon_s0_1]
    status: rascunho
    publico: false
  - id: pb_com_mon_t1
    resumo: Validar em produção é acompanhar os indicadores técnicos e as métricas de sucesso até o fim da janela de validação.
    perguntas_chave: [pq_com_mon_t1_1, pq_com_mon_t1_2, pq_com_mon_t1_3]
    status: rascunho
    publico: false
    exemplo: SLO em 99,95%; recompra de 18% para 19,4% na primeira semana.
  - id: pb_com_mon_g1
    resumo: 'Incidente ou degradação causada pela feature aciona o fluxo de incidente: primeiro restaurar, depois corrigir.'
    perguntas_chave: [pq_com_mon_g1_1]
    status: rascunho
    publico: false
    exemplo: 'Erros no checkout com cupom subiram para 4% após a onda 2: incidente.'
  - id: pb_com_mon_t2
    resumo: Abrir o incidente com as evidências e desligar a feature quando o impacto exigir. O incidente assume a coordenação.
    perguntas_chave: [pq_com_mon_t2_1, pq_com_mon_t2_2]
    status: rascunho
    publico: false
    exemplo: Incidente aberto com o painel da onda 2; flag desligada para a onda 2.
  - id: pb_com_mon_g2
    resumo: A validação continua até o fim da janela combinada; aí as metas são avaliadas.
    perguntas_chave: [pq_com_mon_g2_1]
    status: rascunho
    publico: false
    exemplo: 'Janela de 4 semanas ainda aberta: continuar observando.'
  - id: pb_com_mon_t3
    resumo: 'Registrar o resultado contra as metas e limpar o temporário: flag removida e caminho antigo apagado.'
    perguntas_chave: [pq_com_mon_t3_1, pq_com_mon_t3_2]
    status: rascunho
    publico: false
    evitar:
    - Deixar feature flag para sempre no código
    exemplo: Meta de 20% atingida; flag e caminho antigo removidos.
  - id: pb_com_mon_e1
    exemplo: "A raia Validação em produção e monitoramento devolve «feature_validada» entregando Resultado da validação em produção; em Validação em produção e monitoramento (feat_orq_c18), o fluxo segue para «Feature validada em produção». Por exemplo, Resultado da validação em produção: Meta de 20% de recompra atingida em 4 semanas."
    resumo: 'Retorno «feature_validada»: feature validada em produção.'
    perguntas_chave: [pq_com_mon_e1_1]
    status: rascunho
    publico: false
  - id: pb_com_mon_e2
    exemplo: "A raia Validação em produção e monitoramento devolve «incidente_acionado» entregando Incidente aberto; em Validação em produção e monitoramento (feat_orq_c18), o fluxo segue para «Analisar a reprovação e iterar». Por exemplo, Incidente aberto: Incidente aberto a partir do bug da tela branca, com 14 tickets de clientes ligados."
    resumo: 'Retorno «incidente_acionado»: incidente acionado pela feature.'
    perguntas_chave: [pq_com_mon_e2_1]
    status: rascunho
    publico: false
  - id: pb_com_exe_t1
    resumo: 'Uma boa revisão de PR vai além de «o código funciona»: avalia o problema, a solução, os riscos, a manutenção futura e a experiência de quem vai operar. Siga a pirâmide de revisão: primeiro funcionalidade e implementação, depois testabilidade e cobertura, depois legibilidade e manutenibilidade, por último estilo, que fica com as ferramentas automáticas.'
    perguntas_chave: [pq_com_exe_t1_1, pq_com_exe_t1_2, pq_com_exe_t1_3, pq_com_exe_t1_4, pq_com_exe_t1_5, pq_com_exe_t1_6, pq_com_exe_t1_7, pq_com_exe_t1_8, pq_com_exe_t1_9]
    fazer:
    - 1. Leia a descrição, a tarefa vinculada, os critérios de aceite e o resultado do CI antes do diff
    - 2. Rode o PR localmente ou confira o ambiente de revisão
    - '3. Revise o diff por camadas: testes, lógica de negócio, integrações, interface e configuração'
    - '4. Execute os testes e confira o CI: lint, type check, testes, build e verificações de segurança'
    - 5. Faça uma passada de segurança, performance e operação
    - '6. Classifique os comentários: bloqueante, importante, sugestão ou menor, com o nível da pirâmide'
    - 7. Depois das correções, valide os bloqueantes antes de aprovar
    - Comente na linha, explique o risco e proponha uma alternativa concreta; pergunte quando houver dúvida e elogie boas decisões
    evitar:
    - Aprovar porque a formatação está impecável enquanto há falha lógica
    - Discutir estilo que o lint e o formatador resolvem
    - PR que mistura refatoração, feature nova e correção
    - Bloquear o merge por sugestão de melhoria
    exemplo: '[Bloqueante, nível 1] O cálculo ignora juros compostos quando períodos > 1. [Importante, nível 2] Falta teste para período zero. [Sugestão, nível 3] Extrair a regra de arredondamento. [Menor, nível 4] Renomear para taxaAnual.'
    status: rascunho
    publico: false
  - id: pb_com_set_s0
    exemplo: "A raia Preparação para execução (setup) começa recebendo Lista de tarefas, Matriz de papéis e Mapa de dependências; o primeiro passo é «Preparar o ambiente e as ferramentas». Por exemplo, Lista de tarefas: 1. Criar a tabela de cupons. 2. Expor a API de validação. 3. Cobrir com testes de contrato."
    resumo: 'Início do setup: tudo que é necessário para iniciar a execução, de ferramentas e ambiente a contexto, agentes e skills.'
