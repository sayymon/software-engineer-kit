    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: bug_tri_g2
    raia: bug_tri
    tipo: bifurcacao
    rotulo: É um potencial incidente?
    condicao: É um potencial incidente?
    proximo:
      - para: bug_tri_t3
        condicao: sim, pelo menos um critério atendido
      - para: bug_tri_t4
        condicao: não, nenhum critério atendido
    estado:
      potencial_incidente: sim|nao
      criterios_incidente: "lista dos critérios atendidos: raio_impacto, perda_corrupcao_dados, seguranca_compliance, dinheiro, degradacao_crescente_ou_sem_contorno, janela_critica"
      janela_critica: sim|nao
      tipo_janela: sazonal|repentina|freeze|manutencao|nenhuma
    entradas:
      - relato_do_bug
      - passos_de_reproducao
      - logs_do_bug
    saidas:
      - potencial_incidente
      - criterios_incidente
      - janela_critica
      - tipo_janela
    tecnicas:
      - tecnica: tec_blast_radius
        uso: obrigatoria
        porque: o critério de raio de impacto pede número, não impressão
      - tecnica: tec_matriz_severidade
        uso: recomendada
        porque: o mesmo critério de gravidade usado no incidente evita dois pesos e duas medidas
      - tecnica: tec_slo_sli
        uso: opcional
        porque: mostra se o indicador do serviço já está degradado
    papel: qa
    apoio:
      - sre
    consultado:
      - pm
    playbook: pb_bug_tri_g2
    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: bug_tri_t3
    raia: bug_tri
    tipo: tarefa
    rotulo: Acionar o incidente e seguir com a correção em paralelo
    condicao: ""
    proximo:
      - para: bug_tri_t4
        condicao: ""
    estado:
      potencial_incidente: sim
      criterios_incidente: registrar os critérios atendidos no ticket do bug e do incidente
    ligacoes:
      - demanda_destino: incidente
        para: inc_orq_s0
        condicao: "pelo menos um critério: raio de impacto (quantos usuários, creators ou compras afetados), perda ou corrupção de dados, segurança ou compliance, dinheiro (pagamentos, repasses), degradação crescente ou sem contorno"
        tipo: aciona
        rotulo: Bug vira potencial incidente
    entradas:
      - passos_de_reproducao
      - criterios_incidente
      - potencial_incidente
      - logs_do_bug
      - ambiente_do_bug
    saidas:
      - incidente_aberto
      - relato_do_bug
    subtarefas:
      - id: bug_tri_t3_st1
        exemplo: "Critérios atendidos no ticket: o defeito afeta o fluxo de pagamento e atinge mais de 5% dos clientes."
        rotulo: Registrar os critérios atendidos no ticket
        papel: qa
        entradas:
          - criterios_incidente
          - potencial_incidente
        saidas:
          - relato_do_bug
        status: rascunho
      - id: bug_tri_t3_st2
        exemplo: O incidente é aberto com o título "Falha no pagamento com cartão" e os dois tickets ficam ligados um ao outro.
        rotulo: Abrir o incidente e linkar os dois tickets
        papel: sre
        apoio:
          - tech_lead
        entradas:
          - criterios_incidente
        saidas:
          - incidente_aberto
        status: rascunho
      - id: bug_tri_t3_st3
        exemplo: "Para o incidente seguem 4 evidências: horário da primeira falha, versão afetada, identificador de 3 compras e o trecho do log."
        rotulo: Passar as evidências ao incidente
        papel: qa
        apoio:
          - dev
        entradas:
          - incidente_aberto
          - passos_de_reproducao
          - criterios_incidente
          - logs_do_bug
          - ambiente_do_bug
        tecnicas:
          - tecnica: tec_linha_do_tempo
            uso: opcional
            porque: ajuda o incidente a reconstruir quando o defeito começou
        saidas:
          - incidente_aberto
        status: rascunho
