    layout:
      coluna: 4
    status: rascunho
    publico: false
  - id: bug_tri_g3
    raia: bug_tri
    tipo: bifurcacao
    rotulo: Afetado por janela crítica ou sazonalidade?
    condicao: O fluxo é afetado por janela crítica, evento repentino ou sazonalidade?
    proximo:
      - para: bug_tri_g4
        condicao: sim, há janela crítica ativa
      - para: bug_tri_g5
        condicao: não, sem janela crítica
    estado:
      janela_critica: sim|nao
      tipo_janela: sazonal|repentina|freeze|manutencao|nenhuma
    entradas:
      - janela_critica
      - tipo_janela
    saidas:
      - janela_critica
      - tipo_janela
    tecnicas:
      - tecnica: tec_calendario_eventos_criticos
        uso: obrigatoria
        porque: a janela crítica só aparece quando alguém consulta o calendário
      - tecnica: tec_status_de_janela
        uso: recomendada
        porque: mostra se há freeze ou manutenção em vigor agora
    papel: tech_lead
    apoio:
      - pm
    playbook: pb_bug_tri_g3
    layout:
      coluna: 5
    status: rascunho
    publico: false
  - id: bug_tri_g4
    raia: bug_tri
    tipo: bifurcacao
    rotulo: A janela pede correção imediata ou adiamento?
    condicao: A janela pede correção imediata ou adiamento?
    proximo:
      - para: bug_tri_t6
        condicao: correção imediata (hotfix)
      - para: bug_tri_t5
        condicao: adiar com mitigação paliativa
      - para: bug_tri_g5
        condicao: a janela não altera a decisão
    estado:
      prioridade: hotfix|backlog
      tipo_janela: sazonal|repentina|freeze|manutencao
    entradas:
      - tipo_janela
      - avaliacao_de_impacto
      - severidade_bug
    saidas:
      - prioridade
    tecnicas:
      - tecnica: tec_code_freeze
        uso: condicional
        quando:
          todos:
            - var: tipo_janela
              em:
                - freeze
                - manutencao
        porque: em freeze, o hotfix só sai com exceção aprovada
      - tecnica: tec_hotfix
        uso: recomendada
        porque: a correção imediata é a menor mudança que resolve
    papel: tech_lead
    aprova: pm
    playbook: pb_bug_tri_g4
    layout:
      coluna: 6
    status: rascunho
    publico: false
  - id: bug_tri_t5
    raia: bug_tri
    tipo: tarefa
    rotulo: Aplicar paliativo e adiar a correção para depois da janela
    condicao: ""
    proximo:
      - para: bug_tri_t7
        condicao: ""
    estado:
      prioridade: backlog
      mitigacao_paliativa: sim
    entradas:
      - tipo_janela
      - avaliacao_de_impacto
    saidas:
      - paliativo_aplicado
      - mitigacao_paliativa
      - prioridade
      - item_de_backlog
    subtarefas:
      - id: bug_tri_t5_st1
        exemplo: O paliativo é desligar a flag do novo botão de pagamento, o que devolve o fluxo antigo sem mexer no código.
        rotulo: Aplicar o paliativo seguro
        papel: dev
        apoio:
          - sre
        entradas:
          - avaliacao_de_impacto
          - tipo_janela
        saidas:
          - paliativo_aplicado
          - mitigacao_paliativa
        tecnicas:
          - tecnica: tec_feature_flags
            uso: recomendada
            porque: a flag reduz o dano sem mexer no código em plena janela
          - tecnica: tec_degradacao_controlada
            uso: opcional
            porque: alternativa quando não há flag para o trecho afetado
        status: rascunho
      - id: bug_tri_t5_st2
        exemplo: Retomada marcada para 10 dias após o fim da janela, com a pessoa responsável pelo checkout como dona e o ticket linkado.
        rotulo: Registrar a data de retomada e o dono
        papel: tech_lead
        entradas:
          - paliativo_aplicado
          - tipo_janela
        saidas:
          - prioridade
          - item_de_backlog
        tecnicas:
          - tecnica: tec_code_freeze
            uso: condicional
            quando:
              todos:
                - var: tipo_janela
                  em:
                    - freeze
                    - manutencao
            porque: a retomada acompanha o fim do freeze ou da manutenção
        status: rascunho
    playbook: pb_bug_tri_t5
    layout:
      coluna: 7
    status: rascunho
    publico: false
  - id: bug_tri_g5
    raia: bug_tri
    tipo: bifurcacao
    rotulo: Bloqueante ou de alto impacto?
    condicao: Bloqueante ou de alto impacto?
    proximo:
      - para: bug_tri_t6
        condicao: "sim: tratar como hotfix"
      - para: bug_tri_t7
        condicao: "não: priorizar no backlog"
    estado:
      prioridade: hotfix|backlog
    entradas:
      - avaliacao_de_impacto
      - severidade_bug
    saidas:
      - prioridade
    tecnicas:
      - tecnica: tec_matriz_severidade
        uso: recomendada
        porque: hotfix só para o que o critério classifica como bloqueante ou de alto impacto
    papel: pm
    apoio:
      - tech_lead
    consultado:
      - suporte
    playbook: pb_bug_tri_g5
    layout:
      coluna: 7
    status: rascunho
    publico: false
  - id: bug_tri_t6
    raia: bug_tri
    tipo: tarefa
    rotulo: Abrir hotfix com escopo mínimo
    condicao: ""
    proximo:
      - para: bug_tri_e1
        condicao: ""
    estado:
      prioridade: hotfix
    entradas:
      - relato_do_bug
      - passos_de_reproducao
      - prioridade
    saidas:
      - hotfix_aberto
    subtarefas:
      - id: bug_tri_t6_st1
        exemplo: Branch criada a partir da tag da versão que está em produção, com o nome hotfix/pagamento-duplicado.
        rotulo: Criar a branch a partir do que está em produção
        papel: dev
        entradas:
          - relato_do_bug
          - passos_de_reproducao
        saidas:
          - hotfix_aberto
        tecnicas:
          - tecnica: tec_hotfix
            uso: obrigatoria
            porque: hotfix é a menor mudança que resolve, partindo do que roda em produção
        status: rascunho
      - id: bug_tri_t6_st2
        exemplo: "Antes de codar, avalia-se desligar a flag da funcionalidade: leva 2 minutos e resolve 90% dos casos, então vira o contorno imediato."
        rotulo: Avaliar o contorno imediato
        papel: tech_lead
        apoio:
          - sre
        entradas:
          - passos_de_reproducao
          - hotfix_aberto
        saidas:
          - hotfix_aberto
        tecnicas:
          - tecnica: tec_feature_flags
            uso: condicional
            quando:
              todos:
                - var: janela_critica
                  igual: sim
            porque: em janela crítica, a flag contorna o defeito sem deploy grande
          - tecnica: tec_rollback
            uso: opcional
            porque: alternativa quando não existe flag para o trecho
        status: rascunho
      - id: bug_tri_t6_st3
        exemplo: 'Escopo fixado em corrigir só a validação do valor. O time recebe o aviso no canal de engenharia: "hotfix em andamento, sem outras mudanças no checkout".'
        rotulo: Fixar o escopo mínimo e avisar o time
        papel: tech_lead
        entradas:
          - hotfix_aberto
          - prioridade
        saidas:
          - hotfix_aberto
        tecnicas:
          - tecnica: tec_code_review
            uso: recomendada
            porque: mudança de pressa precisa de um segundo par de olhos
        status: rascunho
    playbook: pb_bug_tri_t6
    layout:
      coluna: 8
    status: rascunho
    publico: false
  - id: bug_tri_t7
    raia: bug_tri
    tipo: tarefa
    rotulo: Priorizar no backlog com prazo
    condicao: ""
    proximo:
