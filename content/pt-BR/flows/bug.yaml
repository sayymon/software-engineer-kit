        entradas:
          - item_de_backlog
          - severidade_bug
        saidas:
          - item_de_backlog
          - prioridade
        tecnicas:
          - tecnica: tec_classes_de_servi_o
            uso: obrigatoria
            porque: sem prazo o bug no backlog apodrece
        status: rascunho
