id: bug
tipo: demanda
nome: Bug
sigla: bug
publico: false
raias:
  - id: bug_orq
    nome: Orquestração do bug
    demanda: bug
    responsabilidade: Conduzir o bug do relato ao fechamento, delegando cada etapa a uma raia
    cor: "#607D8B"
    orquestradora: true
    status: rascunho
    publico: false
  - id: bug_rep
    nome: Reprodução
    demanda: bug
    responsabilidade: Reproduzir o problema relatado
    cor: "#0072B2"
    entradas:
      - relato_do_bug
    status: rascunho
    publico: false
  - id: bug_tri
    nome: Triagem e classificação
    demanda: bug
    responsabilidade: Classificar o relato e priorizar a correção
    cor: "#E69F00"
    entradas:
      - relato_do_bug
      - passos_de_reproducao
      - ambiente_do_bug
      - logs_do_bug
      - registro_visual_do_bug
    status: rascunho
    publico: false
  - id: bug_cor
    nome: Correção
    demanda: bug
    responsabilidade: Isolar a causa raiz e corrigir com teste de regressão
    cor: "#009E73"
    status: rascunho
    publico: false
    entradas:
      - passos_de_reproducao
      - logs_do_bug
      - estado_dos_dados
      - teste_que_reproduz
      - prioridade
      - hotfix_aberto
      - mitigacao_paliativa
      - paliativo_aplicado
  - id: bug_ent
    nome: Validação e entrega
    demanda: bug
    responsabilidade: Validar a correção, entregá-la e verificar em produção
    cor: "#117733"
    status: rascunho
    publico: false
    entradas:
      - entrega_integrada
      - teste_que_reproduz
      - causa_raiz
      - passos_de_reproducao
      - logs_do_bug
      - tem_qa_dedicado
  - id: bug_pre
    nome: Prevenção
    demanda: bug
    responsabilidade: Descobrir por que o bug escapou e registrar a ação preventiva
    cor: "#CC79A7"
    status: rascunho
    publico: false
    entradas:
      - causa_raiz
      - relato_do_bug
      - verificacao_em_producao
