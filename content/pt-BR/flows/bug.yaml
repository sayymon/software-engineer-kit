      coluna: 3
    status: rascunho
    publico: false
  - id: bug_pre_e1
    raia: bug_pre
    tipo: fim
    retorno: acao_registrada
    rotulo: Ação preventiva registrada
    condicao: ""
    proximo: []
    estado: {}
    saidas:
      - registro_da_acao_preventiva
      - acao_preventiva
    playbook: pb_bug_pre_e1
    layout:
      coluna: 4
    status: rascunho
    publico: false
playbooks:
  - evitar:
      - Começar a corrigir antes de reproduzir
    fazer:
      - Registre quem reportou, versão, ambiente e passos
    id: pb_bug_orq_s0
    publico: false
    resumo: Um relato de bug é uma hipótese. Antes de corrigir, confirme que existe e que é defeito.
    status: rascunho
  - id: pb_bug_orq_c1
    resumo: "Chama a raia Reprodução: reproduzir o problema relatado. O fluxo segue pelo retorno que a raia devolver."
    fazer:
      - "Retornos possíveis: reproduzido, nao_reproduzido"
      - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_bug_orq_c2
    resumo: "Chama a raia Triagem e classificação: classificar o relato e priorizar a correção. O fluxo segue pelo retorno que a raia devolver."
    fazer:
      - "Retornos possíveis: hotfix, backlog, comportamento_esperado, pedido_feature"
      - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_bug_orq_c3
    resumo: "Chama a raia Correção: isolar a causa raiz e corrigir com teste de regressão. O fluxo segue pelo retorno que a raia devolver."
    fazer:
      - "Retornos possíveis: correcao_pronta"
      - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_bug_orq_c4
    resumo: A correção sobe para um ambiente de testes pela mesma estratégia de versionamento das outras entregas, antes de qualquer teste integrado. Falha na publicação volta para a correção.
    perguntas_chave:
      - '"A correção está numa versão identificável e reversível?"'
    fazer:
      - "Retornos possíveis: publicado, falha_na_publicacao"
    status: rascunho
    publico: false
  - id: pb_bug_orq_c5
    resumo: "Testes regressivos em duas frentes: o teste que reproduzia o defeito agora passa, e a suíte das funcionalidades core continua verde. Reprovação volta para a correção."
    perguntas_chave:
      - '"O teste que falhava com o bug agora passa?"'
      - '"Alguma funcionalidade core mudou de resultado?"'
    fazer:
      - "Retornos possíveis: testes_aprovados, testes_reprovados"
    evitar:
      - Rodar só o teste do bug e pular a suíte core
    exemplo: Teste do cupom expirado verde; 85 testes core verdes em 7 minutos.
    status: rascunho
    publico: false
  - id: pb_bug_orq_c6
    resumo: Regressão de ponta a ponta das jornadas que o bug afeta e das jornadas core que não podem quebrar. Reprovação volta para a correção.
    perguntas_chave:
      - '"A jornada onde o bug aparecia funciona de ponta a ponta?"'
    fazer:
      - "Retornos possíveis: aprovado, reprovado, nao_aplicavel"
    status: rascunho
    publico: false
  - id: pb_bug_orq_c7
    resumo: "Chama a raia Validação e entrega: validar a correção, entregá-la e verificar em produção. O fluxo segue pelo retorno que a raia devolver."
    fazer:
      - "Retornos possíveis: verificado, nao_corrigido"
      - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_bug_orq_c8
    resumo: "Chama a raia Prevenção: descobrir por que o bug escapou e registrar a ação preventiva. O fluxo segue pelo retorno que a raia devolver."
    fazer:
      - "Retornos possíveis: acao_registrada"
      - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - evitar:
      - Fechar sem avisar o reporter
    fazer:
      - Documente o que foi tentado e peça para reabrir se voltar com novas evidências
    id: pb_bug_orq_e1
    publico: false
    resumo: Fechar sem reprodução é decisão consciente, com registro do que foi tentado.
    status: rascunho
  - evitar:
      - Deixar a dúvida só em conversa privada
    fazer:
      - Linke o ticket à documentação
    id: pb_bug_orq_e2
    publico: false
    resumo: Registre a resposta para consultas futuras.
    status: rascunho
  - evitar:
      - Perder o histórico do relato
    fazer:
      - Confirme que o PM recebeu
    id: pb_bug_orq_e3
    publico: false
    resumo: O pedido segue o caminho de requisitos e priorização de produto.
    status: rascunho
  - evitar:
      - Esquecer de reportar padrões recorrentes
    fazer:
      - Registre o aprendizado se a causa revelar lacuna de processo
    id: pb_bug_orq_e4
    publico: false
    resumo: Correção com teste de regressão, verificação e ação preventiva registrada é o que impede o retorno do problema.
    status: rascunho
  - id: pb_bug_rep_s0
    resumo: "Início da raia Reprodução. Responsabilidade: reproduzir o problema relatado."
    status: rascunho
    publico: false
  - evitar:
      - Corrigir "no escuro" por intuição
      - Descartar o relato por não reproduzir de primeira
    fazer:
      - Siga os passos do relato no ambiente equivalente
      - Reduza ao caso mínimo (menos dados, menos passos)
      - Anote o resultado esperado e o observado
    id: pb_bug_rep_t1
    exemplo: Com o passo a passo do relator, o time reproduz o erro em ambiente de teste usando só um cupom e um produto, o menor caso possível.
    perguntas_chave:
      - '"Quais passos, dados e ambiente levam à falha?"'
      - '"Falha sempre ou às vezes?"'
    publico: false
    resumo: Sem reprodução não há correção verificável. Procure o menor caso que mostra a falha.
    status: rascunho
    tecnicas:
      - tec_reproducao_minima
  - evitar:
      - Fechar na primeira tentativa
    fazer:
      - Se não reproduziu, colete mais evidências antes de desistir
    id: pb_bug_rep_g1
    exemplo: O erro apareceu duas vezes em 5 tentativas no ambiente de teste, então foi reproduzido e o fluxo segue para a triagem.
    publico: false
    resumo: Reproduzir é a porta de entrada do fluxo.
    status: rascunho
  - evitar:
      - Pedir informação sem dizer qual
      - Usar dados reais de clientes em ambiente de teste
    fazer:
      - Peça ao reporter passos, captura e horário
      - Procure o rastro nos logs e traços
      - Tente com dados e configuração de produção (sem copiar dados sensíveis)
    id: pb_bug_rep_t2
    exemplo: O time pede ao relator o horário exato, o identificador da compra e a versão do aplicativo, e acha o rastro nos registros do mesmo minuto.
    publico: false
    resumo: Peça logs, horário, identificador da operação, versão e dados. Procure o rastro nos registros de produção.
    status: rascunho
    tecnicas:
      - tec_reproducao_minima
      - tec_telemetria_padronizada
  - evitar:
      - Manter o bug aberto para sempre sem ação
    fazer:
      - Se não reproduz, feche com o motivo e deixe a porta aberta para reabrir
    id: pb_bug_rep_g2
    exemplo: 'Mesmo com horário e identificador, o erro não aparece em 10 tentativas: o ticket é fechado com o motivo "não reproduzido".'
    publico: false
    resumo: Segunda e última tentativa antes de fechar por falta de reprodução.
    status: rascunho
  - id: pb_bug_rep_e1
    resumo: "Retorno «reproduzido» da raia Reprodução: reproduzido. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_bug_rep_e2
    resumo: "Retorno «nao_reproduzido» da raia Reprodução: não reproduzido. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_bug_tri_s0
    resumo: "Início da raia Triagem e classificação. Responsabilidade: classificar o relato e priorizar a correção."
    status: rascunho
    publico: false
  - evitar:
      - Chamar de "bug" tudo o que incomoda
      - Chamar de "não é bug" sem checar a spec
    fazer:
      - Consulte a spec, o critério de aceitação e a documentação
      - Se há dúvida, converse com o PM em vez de decidir sozinho
    id: pb_bug_tri_g1
    exemplo: O relator esperava um desconto que nenhum requisito prevê. Como não há requisito, a pergunta deixa de ser de defeito e vira de produto.
    perguntas_chave:
      - '"O que a spec ou o critério de aceitação diz?"'
      - '"O usuário esperava algo razoável que nunca prometemos?"'
    publico: false
    resumo: Compare o comportamento com o requisito ou a spec. Se não há requisito, a discussão é de produto, não de defeito.
    status: rascunho
  - evitar:
      - Resposta seca, sem explicação
    fazer:
      - Se mais de uma pessoa se confundiu, a melhoria de UX ou de texto vira item de backlog
    id: pb_bug_tri_t1
    exemplo: O time responde que o cupom só vale para a primeira compra, cita o requisito e propõe uma mensagem mais clara na tela.
    publico: false
    resumo: Explique ao reporter por que é esperado e, se a surpresa for frequente, melhore a documentação ou a interface.
    status: rascunho
  - evitar:
      - Segurar o ticket como "bug" para fugir da priorização de produto
    fazer:
      - Leve o contexto do relator (quem, quando, o que esperava) para a demanda de produto
    id: pb_bug_tri_t2
    exemplo: O pedido "aceitar carteira digital" sai do fluxo de bug e entra no de feature, com o relato e o print do relator.
    publico: false
    resumo: Reclassifique e envie ao fluxo de feature, com o contexto do reporter.
    status: rascunho
  - id: pb_bug_tri_g2
    exemplo: O defeito de pagamento duplicado pode estar afetando outros clientes agora, então é tratado como um potencial incidente.
    resumo: "Mapeamento: este defeito pode ser um incidente em formação? Se sim, o fluxo de incidente é acionado e o bug segue em paralelo para a correção."
    perguntas_chave:
      - '"Quantos usuários, creators ou compras são afetados?"'
      - '"Há perda ou corrupção de dados?"'
      - '"Há risco de segurança ou compliance?"'
      - '"Há dinheiro envolvido (pagamentos, repasses)?"'
      - '"A degradação cresce ou não tem contorno?"'
    fazer:
      - Marque sim se pelo menos um critério for atendido
      - Considere também a janela crítica (pico sazonal, evento repentino) como critério adicional e registre janela_critica e tipo_janela
      - Registre potencial_incidente e os critérios atendidos no ticket
      - Na dúvida, trate como potencial incidente e reavalie em 10 minutos
      - "Critério da saída «sim, pelo menos um critério atendido»: sim, pelo menos um critério: raio de impacto (quantos usuários, creators ou compras afetados), perda ou corrupção de dados, segurança ou compliance, dinheiro (pagamentos, repasses), degradação crescente ou sem contorno, ou janela crítica ativa (pico sazonal, evento repentino) que amplia o dano"
    evitar:
      - Decidir pela gravidade do relato e não pelo impacto medido
      - Esperar a correção para avisar o plantão
    tecnicas:
      - tec_matriz_severidade
      - tec_slo_sli
    status: rascunho
    publico: false
  - id: pb_bug_tri_t3
    exemplo: O incidente é aberto para acompanhar o impacto, e o bug segue em paralelo para a equipe de correção.
    resumo: Este bug atende a critério de incidente. O fluxo de incidente é acionado pela ligação e o fluxo de bug continua em paralelo, com a correção.
    perguntas_chave:
      - '"O incidente já foi aberto e quem é o incident commander?"'
    fazer:
      - "Siga com a correção do bug em paralelo: o incidente restaura o serviço, o bug corrige a causa"
      - Quando o incidente mitigar, a correção do bug continua normalmente
    evitar:
      - Parar a correção do bug porque o incidente foi aberto
      - Tratar os dois fluxos como se fossem um só
    tecnicas:
      - tec_incident_command
      - tec_matriz_severidade
    status: rascunho
    publico: false
  - evitar:
      - Priorizar por quem reclama mais alto
      - Rebaixar bug de segurança por ser raro
    fazer:
      - "Registre as duas coisas: severidade é o dano e prioridade é a ordem de tratamento"
      - Se algum critério de incidente foi atendido, o mapeamento anterior já acionou o fluxo de incidente; aqui a severidade orienta a prioridade da correção
    id: pb_bug_tri_t4
    exemplo: "Defeito no checkout, atingindo cerca de 2% dos pedidos e com contorno pelo aplicativo: severidade alta e prioridade média."
    perguntas_chave:
      - '"Quantos usuários e qual fluxo?"'
      - '"Há contorno?"'
      - '"Há risco de dados ou segurança?"'
    publico: false
    resumo: Severidade é o dano; prioridade é a ordem de tratamento. Combine impacto, alcance e existência de contorno.
    status: rascunho
    tecnicas:
      - tec_matriz_severidade
      - tec_classes_de_servi_o
  - id: pb_bug_tri_g3
    exemplo: O bug foi relatado em plena semana de um lançamento de creator, então a janela crítica está ativa e o fluxo segue pelo caminho "sim".
    resumo: Janela crítica altera a prioridade do bug. Confira o calendário antes de decidir hotfix ou backlog.
    perguntas_chave:
      - '"Estamos em pico sazonal, lançamento de creator, fechamento financeiro de período ou data promocional?"'
      - '"Há freeze ou manutenção em vigor?"'
    fazer:
      - Use o valor de janela_critica registrado no mapeamento de potencial incidente e reconfirme
      - Confira o calendário de eventos críticos e o status de janela
      - "Critério da saída «sim, há janela crítica ativa»: (pico sazonal, lançamento de creator, fechamento financeiro de período, datas promocionais, freeze, manutenção ou evento repentino)"
      - "Critério da saída «não, sem janela crítica»: avaliar bloqueio e impacto normalmente"
    evitar:
      - Priorizar sem olhar o calendário
      - Tratar freeze como regra sem exceção para bug grave
    tecnicas:
      - tec_calendario_eventos_criticos
      - tec_status_de_janela
      - tec_code_freeze
    status: rascunho
    publico: false
  - id: pb_bug_tri_g4
    exemplo: "Na janela de lançamento, o bug não bloqueia compras e há paliativo seguro: adiar a correção para depois da janela."
    resumo: Na janela, um bug não bloqueante pode virar hotfix. Em freeze, a correção pode esperar com mitigação paliativa.
    perguntas_chave:
      - '"O bug degrada receita ou experiência durante a janela?"'
      - '"Existe paliativo seguro até o fim do freeze?"'
    fazer:
      - "Imediata: hotfix com escopo mínimo; em freeze, só com exceção aprovada"
      - "Adiar: aplique o paliativo e marque a data de retomada"
      - "Sem efeito da janela: siga para a avaliação normal de bloqueio e impacto"
      - "Critério da saída «correção imediata (hotfix)»: correção imediata: o bug degrada receita ou experiência na janela de pico ou evento repentino, mesmo sem ser bloqueante (hotfix; em freeze, só com exceção aprovada)"
      - "Critério da saída «adiar com mitigação paliativa»: adiar: freeze ou manutenção em vigor e existe mitigação paliativa segura; corrigir depois da janela"
      - "Critério da saída «a janela não altera a decisão»: avaliar bloqueio e impacto normalmente"
    evitar:
      - Adiar sem paliativo
      - Hotfix grande em plena janela de pico
    tecnicas:
      - tec_hotfix
      - tec_code_freeze
      - tec_feature_flags
      - tec_capacity_planning_sazonal
    status: rascunho
    publico: false
  - id: pb_bug_tri_t5
    exemplo: A flag da novidade é desligada durante a janela e a correção é agendada para 10 dias depois, com dono definido.
    resumo: O paliativo reduz o dano até o fim da janela. A correção entra no backlog com data de retomada logo depois.
    fazer:
      - O paliativo pode ser feature flag, ajuste de configuração ou orientação ao suporte
      - Reavalie se a janela se estender
    evitar:
      - Esquecer o bug depois da janela
      - Paliativo sem dono nem data de remoção
    tecnicas:
      - tec_feature_flags
      - tec_code_freeze
    status: rascunho
    publico: false
  - evitar:
      - Transformar todo bug em hotfix
    fazer:
      - "Hotfix: bloqueio de fluxo crítico, perda de dados, falha de segurança"
      - "Backlog: demais casos, com prazo conforme a classe de serviço"
      - A janela crítica já foi avaliada na bifurcação anterior (hotfix antecipado ou adiamento com paliativo)
    id: pb_bug_tri_g5
    exemplo: "O pagamento duplicado atinge 3% dos clientes e gera estorno: é bloqueante e vai para hotfix."
    publico: false
    resumo: Hotfix interrompe o planejado e custa risco de pressa. Reserve para o que realmente não pode esperar.
    status: rascunho
  - evitar:
      - Aproveitar o hotfix para "arrumar de passagem"
    fazer:
      - "Escopo mínimo é regra: o que não resolve o defeito vai para outro ticket"
      - Uma flag desligada pode ser o contorno mais rápido
    id: pb_bug_tri_t6
    exemplo: A flag do novo fluxo de pagamento é desligada em 2 minutos, e o hotfix corrige só a validação do valor.
    publico: false
    resumo: Hotfix é a menor mudança que resolve. Uma flag desligada pode ser o contorno mais rápido.
    status: rascunho
    tecnicas:
      - tec_hotfix
      - tec_feature_flags
  - evitar:
      - Backlog de bugs eterno
    fazer:
      - "Revise os prazos na cadência de planejamento: bug sem dono e sem prazo apodrece"
    id: pb_bug_tri_t7
    exemplo: O bug de severidade média entra no backlog com prazo de 2 sprints e a pessoa responsável pelo checkout como dona.
    publico: false
    resumo: Bug no backlog tem dono, prioridade e prazo, senão apodrece.
    status: rascunho
    tecnicas:
      - tec_classes_de_servi_o
  - id: pb_bug_tri_e1
    resumo: "Retorno «hotfix» da raia Triagem e classificação: hotfix. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_bug_tri_e2
    resumo: "Retorno «backlog» da raia Triagem e classificação: backlog. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_bug_tri_e3
    resumo: "Retorno «comportamento_esperado» da raia Triagem e classificação: comportamento esperado. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_bug_tri_e4
    resumo: "Retorno «pedido_feature» da raia Triagem e classificação: pedido de feature. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_bug_cor_s0
    resumo: "Início da raia Correção. Responsabilidade: isolar a causa raiz e corrigir com teste de regressão."
    status: rascunho
    publico: false
  - evitar:
      - Tratar o sintoma e esquecer a causa
      - Mudar várias coisas ao mesmo tempo
    fazer:
      - Reduza o problema por bisseção (histórico de commits e dados)
      - Use logs, traços e depurador
      - Faça 5 porquês até a causa do processo
    id: pb_bug_cor_t1
    perguntas_chave:
      - '"Qual foi a última mudança que funcionou?"'
      - '"Por que a falha não foi pega antes?"'
    publico: false
    resumo: Encontre onde e por que falha, não apenas onde aparece.
    status: rascunho
    tecnicas:
      - tec_x5_whys
      - tec_bisect
  - evitar:
      - Corrigir sem teste
      - Teste que passa antes e depois da correção
    fazer:
      - Escreva o teste de regressão que reproduz o bug
      - Corrija no menor escopo possível
      - Rode a suíte completa
    id: pb_bug_cor_t2
    perguntas_chave:
      - '"O teste falha sem a correção?"'
    publico: false
    resumo: Escreva primeiro o teste que falha com o bug e passe com a correção. Ele protege contra a volta.
    status: rascunho
    tecnicas:
      - tec_teste_regressao
      - tec_tdd
  - id: pb_bug_cor_e1
    resumo: "Retorno «correcao_pronta» da raia Correção: correção pronta com teste de regressão. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_bug_ent_s0
    resumo: "Início da raia Validação e entrega. Responsabilidade: validar a correção, entregá-la e verificar em produção."
    status: rascunho
    publico: false
  - evitar:
      - Aprovar por pressa
      - PR sem contexto da causa
    fazer:
      - Peça revisão de alguém que conheça a área
      - Descreva causa, correção e risco no PR
      - Confirme que o teste de regressão está incluído
    id: pb_bug_ent_c1
    publico: false
    resumo: "Chama a raia comum Review humano: a revisão confirma que a correção trata a causa e não cria efeito colateral. Pedido de ajuste volta para a correção."
    status: rascunho
    tecnicas:
      - tec_code_review
  - evitar:
      - Pular a validação por falta de QA
    fazer:
      - "Com QA: ele valida o cenário e testa vizinhanças"
      - "Sem QA: o autor demonstra a correção a um par"
    id: pb_bug_ent_g1
    publico: false
    resumo: Quem valida depende de como o time é organizado. Sem QA, o time assume a validação.
    status: rascunho
  - evitar:
      - Validar só o caminho feliz
    fazer:
      - Execute o cenário do relato
      - Explore casos vizinhos (dados limite, perfis diferentes)
      - Confirme que o teste automatizado cobre o caso
    id: pb_bug_ent_t2
    publico: false
    resumo: QA verifica o cenário original e testa variações próximas onde a mesma causa pode aparecer.
    status: rascunho
    tecnicas:
      - tec_teste_regressao
  - evitar:
      - Autor validar sozinho a própria correção sem demonstrar
    fazer:
      - Autor e par repetem os passos do relato
      - Revise a cobertura do teste automatizado
    id: pb_bug_ent_t3
    publico: false
    resumo: Sem QA dedicado, outra pessoa do time reproduz o bug e confirma a correção.
    status: rascunho
    tecnicas:
      - tec_teste_regressao
      - tec_code_review
  - evitar:
      - Atalhar a esteira sem motivo registrado
    fazer:
      - Passe pela esteira de CI/CD
      - Prefira liberar gradualmente quando possível
      - Tenha plano de reversão
    id: pb_bug_ent_c2
    publico: false
    resumo: "Chama a raia comum Implantação: entregue com o mesmo cuidado de qualquer mudança; em hotfix, prefira deploy gradual. Implantação revertida volta para a correção."
    status: rascunho
    tecnicas:
      - tec_ci_cd
      - tec_deploy_gradual
      - tec_rollback
  - evitar:
      - Dar como resolvido apenas porque o deploy passou
    fazer:
      - Repita o cenário do relato
      - Observe erros e métricas por uma janela
    id: pb_bug_ent_t5
    publico: false
    resumo: Confirme em produção que o sintoma sumiu e que nada novo apareceu.
    status: rascunho
    tecnicas:
      - tec_telemetria_padronizada
  - evitar:
      - Repetir a mesma correção esperando outro resultado
    fazer:
      - Compare a hipótese inicial com o que foi observado
    id: pb_bug_ent_g2
    publico: false
    resumo: Se não está corrigido, volte à causa. Revise a hipótese em vez de repetir a mesma correção.
    status: rascunho
  - evitar:
      - Fechar sem avisar quem reportou
    fazer:
      - Atualize o ticket com causa, correção e versão
      - Avise o reporter e o suporte
      - Em seguida, faça a análise de escape para evitar que o mesmo tipo de bug volte
    id: pb_bug_ent_t6
    publico: false
    resumo: "Feche o ciclo com o reporter e deixe o rastro: causa, correção e link do PR."
    status: rascunho
  - id: pb_bug_ent_e1
    resumo: "Retorno «verificado» da raia Validação e entrega: corrigido e fechado. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_bug_ent_e2
    resumo: "Retorno «nao_corrigido» da raia Validação e entrega: não corrigido, reabrir a causa raiz. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_bug_pre_s0
    resumo: "Início da raia Prevenção. Responsabilidade: descobrir por que o bug escapou e registrar a ação preventiva."
    status: rascunho
    publico: false
  - id: pb_bug_pre_g1
    resumo: Todo defeito que chegou à produção passou por uma defesa que falhou. Descubra qual, para fechar a porta e não só o bug.
    perguntas_chave:
      - '"Que teste teria pego isso?"'
      - '"O requisito estava claro?"'
      - '"O que a revisão deixou passar?"'
      - '"Como soubemos do bug: monitoramento ou reclamação?"'
      - '"A mudança tinha proteção (flag, canary)?"'
    fazer:
      - Escolha a origem principal; se houver mais de uma, abra ações extras
      - Meça a taxa de escape de defeitos (defect escape rate) ao longo do tempo
      - Use os 5 porquês para sair do sintoma e chegar à defesa que faltou
      - "Critério da saída «requisito ambíguo»: a spec ou os critérios de aceitação deixavam dúvida"
      - "Critério da saída «sem observabilidade ou alerta»: o problema ficou invisível até alguém reportar"
      - "Critério da saída «mudança sem proteção»: foi para todos os usuários de uma vez, sem flag, canary ou rollout gradual"
    evitar:
      - Procurar quem errou
      - Pular a análise por ser um bug pequeno
    tecnicas:
      - tec_escape_analysis
      - tec_x5_whys
    status: rascunho
    publico: false
  - evitar:
      - Teste que repete a correção sem proteger a classe de falha
      - Teste frágil que depende de ambiente instável
    fazer:
      - Crie teste de regressão para o caso, se ainda não existir
      - Crie teste de contrato quando a falha veio da integração entre serviços
      - Cubra casos vizinhos da mesma causa
    id: pb_bug_pre_t2
    perguntas_chave:
      - '"O limite entre serviços tem teste de contrato?"'
    publico: false
    resumo: "O teste de regressão já cobre este bug. Aqui você olha a lacuna maior: o que mais, na mesma área, está sem teste?"
    status: rascunho
    tecnicas:
      - tec_teste_regressao
      - tec_contract_testing
  - evitar:
      - Corrigir só o código e deixar a spec vaga
      - Critério de aceitação que não dá para testar
    fazer:
      - Reescreva o requisito com critérios de aceitação em exemplos
      - Valide com o PM e com quem testa
      - Registre a decisão na documentação
    id: pb_bug_pre_t3
    perguntas_chave:
      - '"Dois engenheiros leriam isto da mesma forma?"'
    publico: false
    resumo: Requisito ambíguo gera bug de interpretação. Reescreva com critérios de aceitação verificáveis.
    status: rascunho
    tecnicas:
      - tec_criterios_aceitacao
      - tec_bdd_gherkin
  - id: pb_bug_pre_t4
    resumo: A revisão não pegou. Transforme o que escapou em item de checklist ou em regra automática.
    perguntas_chave:
      - '"Uma máquina poderia ter pego isso?"'
    fazer:
      - Se é padrão detectável, crie regra de lint ou análise estática
      - Se depende de julgamento, acrescente item ao checklist de revisão
      - Compartilhe o caso com o time
      - "Passo completo: Atualizar o checklist de revisão ou criar regra de lint ou análise estática"
    evitar:
      - Culpar o revisor
      - Checklist enorme que ninguém lê
    tecnicas:
      - tec_analise_estatica
      - tec_checklist_revisao
      - tec_linters
      - tec_code_review
    status: rascunho
    publico: false
  - evitar:
      - Alerta que dispara sem ação possível
      - Dashboard sem alerta
    fazer:
      - Defina um SLI para o comportamento e um SLO com meta
      - Crie alerta acionável com dono e runbook
      - Teste o alerta provocando a falha em ambiente seguro
    id: pb_bug_pre_t5
    perguntas_chave:
      - '"Que métrica teria mudado quando isto começou?"'
    publico: false
    resumo: O bug ficou invisível. Crie o sinal que o teria revelado antes do cliente.
    status: rascunho
    tecnicas:
      - tec_slo_sli
      - tec_alertas
      - tec_telemetria_padronizada
  - id: pb_bug_pre_t6
    resumo: A mudança foi para todos de uma vez. Reduza o raio de impacto das próximas com liberação gradual.
    perguntas_chave:
      - '"Se esta mudança falhar, quantos usuários sentem?"'
    fazer:
      - Use feature flag para ligar e desligar rápido
      - Libere por canary ou rollout gradual, olhando os indicadores
      - Tenha um plano de reversão pronto
      - "Passo completo: Proteger a mudança com feature flag, canary ou rollout gradual"
    evitar:
      - Flags que ficam para sempre no código
      - Canary sem métricas para comparar
    tecnicas:
      - tec_feature_flags
      - tec_canary_release
      - tec_deploy_gradual
    status: rascunho
    publico: false
  - evitar:
      - Ação genérica ("melhorar testes")
      - Registrar e não acompanhar
    fazer:
      - Registre a ação no backlog com dono, prazo e critério de pronto
      - Acompanhe a taxa de escape de defeitos
      - Este nó também recebe ações vindas de post-mortems de incidente (ligação alimenta de inc_pos_t2)
    id: pb_bug_pre_t7
    perguntas_chave:
      - '"Quem faz, até quando e como saberemos que funcionou?"'
    publico: false
    resumo: Ação preventiva sem dono vira boa intenção. Registre com prazo, critério de pronto e acompanhe até concluir.
    status: rascunho
    tecnicas:
      - tec_escape_analysis
      - tec_acoes_corretivas
  - id: pb_bug_pre_e1
    resumo: "Retorno «acao_registrada» da raia Prevenção: ação preventiva registrada. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_bug_g_jan
    resumo: Janela crítica altera a prioridade do bug. Confira o calendário antes de decidir hotfix ou backlog.
    perguntas_chave:
      - '"Estamos em pico sazonal, lançamento de creator, fechamento financeiro de período ou data promocional?"'
      - '"Há freeze ou manutenção em vigor?"'
    fazer:
      - Use o valor de janela_critica registrado no mapeamento de potencial incidente e reconfirme
      - Confira o calendário de eventos críticos e o status de janela
    evitar:
      - Priorizar sem olhar o calendário
      - Tratar freeze como regra sem exceção para bug grave
    tecnicas:
      - tec_calendario_eventos_criticos
      - tec_status_de_janela
      - tec_code_freeze
    status: rascunho
    publico: false
  - id: pb_bug_g_jan_dec
    resumo: Na janela, um bug não bloqueante pode virar hotfix. Em freeze, a correção pode esperar com mitigação paliativa.
    perguntas_chave:
      - '"O bug degrada receita ou experiência durante a janela?"'
      - '"Existe paliativo seguro até o fim do freeze?"'
    fazer:
      - "Imediata: hotfix com escopo mínimo; em freeze, só com exceção aprovada"
      - "Adiar: aplique o paliativo e marque a data de retomada"
      - "Sem efeito da janela: siga para a avaliação normal de bloqueio e impacto"
    evitar:
      - Adiar sem paliativo
      - Hotfix grande em plena janela de pico
    tecnicas:
      - tec_hotfix
      - tec_code_freeze
      - tec_feature_flags
      - tec_capacity_planning_sazonal
    status: rascunho
    publico: false
  - id: pb_bug_t_adiar
    resumo: O paliativo reduz o dano até o fim da janela. A correção entra no backlog com data de retomada logo depois.
    fazer:
      - Aplique o paliativo (feature flag, ajuste de configuração ou orientação ao suporte)
      - Registre a data de retomada e o dono
      - Reavalie se a janela se estender
    evitar:
      - Esquecer o bug depois da janela
      - Paliativo sem dono nem data de remoção
    tecnicas:
      - tec_feature_flags
      - tec_code_freeze
    status: rascunho
    publico: false
  - id: pb_bug_orq_g1
    resumo: "O hotfix tem escopo mínimo e urgência: segue direto para a validação e entrega, com review, validação de QA ou por par, implantação e verificação em produção. A correção de backlog passa antes pela publicação em ambiente de testes e pela regressão."
    perguntas_chave:
      - '"O impacto justifica pular a publicação em testes e a regressão completa?"'
      - '"O teste que reproduz o defeito já roda no pipeline do hotfix?"'
    fazer:
      - Manter o teste de regressão do defeito mesmo no hotfix
    evitar:
      - Usar o hotfix para encaixar mudanças fora do escopo mínimo
    exemplo: Hotfix da tela branca no checkout vai direto para o review e a implantação; depois da implantação, o monitoramento confirma que nada degradou.
    status: rascunho
    publico: false
  - id: pb_bug_ent_c3
    resumo: "Chama a raia comum Validação em produção e monitoramento: confirma que a correção não degradou nada. Se a correção causar incidente, a raia aciona o fluxo de incidente e o bug volta para a correção."
    perguntas_chave:
      - '"Os indicadores da área corrigida voltaram ao normal sem piorar outros?"'
    fazer:
      - "Retornos possíveis: feature_validada, incidente_acionado"
    status: rascunho
    publico: false
  - id: pb_bug_pre_t1
    resumo: "Antes de escolher a ação, descubra por qual barreira o defeito passou: teste, requisito, revisão, observabilidade ou proteção da mudança. A ação certa fecha a barreira que falhou."
    perguntas_chave:
      - '"Em qual etapa este defeito deveria ter parado?"'
      - '"O que faria a mesma classe de defeito parar ali da próxima vez?"'
    fazer:
      - Reconstrua o caminho do defeito com datas e versões
      - Discuta barreiras, nunca pessoas
    evitar:
      - Escolher a ação mais fácil em vez da barreira que falhou
    exemplo: O defeito passou pelo review e pelos testes; a barreira certa era o teste de contrato entre checkout e cupons.
    status: rascunho
    publico: false
