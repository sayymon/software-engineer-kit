    raia: bug_cor
    tipo: inicio
    rotulo: Bug priorizado, corrigir
    condicao: ""
    proximo:
      - para: bug_cor_t1
        condicao: ""
    estado: {}
    playbook: pb_bug_cor_s0
    layout:
      coluna: 0
    status: rascunho
    publico: false
  - id: bug_cor_t1
    raia: bug_cor
    tipo: tarefa
    rotulo: Isolar a causa raiz
    condicao: ""
    proximo:
      - para: bug_cor_t2
        condicao: ""
    estado: {}
    entradas:
      - passos_de_reproducao
      - logs_do_bug
      - estado_dos_dados
      - teste_que_reproduz
    saidas:
      - hipoteses_de_causa
      - causa_raiz
    subtarefas:
      - id: bug_cor_t1_st1
        rotulo: Levantar hipóteses a partir das evidências
        papel: dev
        apoio:
          - qa
        entradas:
          - logs_do_bug
          - estado_dos_dados
          - passos_de_reproducao
        saidas:
          - hipoteses_de_causa
        tecnicas:
          - tecnica: tec_x5_whys
            uso: recomendada
            porque: cada porquê aproxima do mecanismo, não do sintoma
        exemplo: H1 cache de cupons sem tratar expiração; H2 fuso no cálculo de validade.
        status: rascunho
      - id: bug_cor_t1_st2
        rotulo: Localizar a mudança que introduziu o defeito
        papel: dev
        quando:
          todos:
            - var: reproduzido
              igual: sim
        porque: só dá para buscar no histórico quando o teste reproduz o defeito
        entradas:
          - hipoteses_de_causa
          - teste_que_reproduz
        saidas:
          - hipoteses_de_causa
        tecnicas:
          - tecnica: tec_bisect
            uso: recomendada
            porque: com um teste que reproduz, a busca binária no histórico acha o commit em poucos passos
        exemplo: A busca binária entre as versões 4.10 e 4.12 aponta o commit do cache de cupons.
        status: rascunho
      - id: bug_cor_t1_st3
        rotulo: Confirmar a causa raiz com o teste que reproduz
        papel: dev
        apoio:
          - tech_lead
        entradas:
          - hipoteses_de_causa
          - teste_que_reproduz
        saidas:
          - causa_raiz
        exemplo: "Desligando o cache, o teste passa; ligando, falha: causa confirmada."
        status: rascunho
      - id: bug_cor_t1_st4
        rotulo: Procurar outros pontos com a mesma causa
        papel: tech_lead
        apoio:
          - arquiteto
        entradas:
          - causa_raiz
        saidas:
          - causa_raiz
        exemplo: O mesmo cache atende vale-presente; o caso entra na correção.
        status: rascunho
    playbook: pb_bug_cor_t1
    layout:
      coluna: 1
    status: rascunho
    publico: false
  - id: bug_cor_t2
    raia: bug_cor
    tipo: tarefa
    rotulo: Corrigir com teste de regressão
    condicao: ""
    proximo:
      - para: bug_cor_e1
        condicao: ""
    estado: {}
    saidas:
      - teste_que_reproduz
      - codigo_da_correcao
      - entrega_integrada
    entradas:
