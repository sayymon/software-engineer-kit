  - id: bug_rep_s0
    raia: bug_rep
    tipo: inicio
    rotulo: Bug a reproduzir
    condicao: ""
    proximo:
      - para: bug_rep_t1
        condicao: ""
    estado: {}
    entradas:
      - relato_do_bug
    playbook: pb_bug_rep_s0
    layout:
      coluna: 0
    status: rascunho
    publico: false
  - id: bug_rep_t1
    raia: bug_rep
    tipo: tarefa
    rotulo: Reproduzir o problema
    condicao: ""
    proximo:
      - para: bug_rep_g1
        condicao: ""
    estado:
      reproduzido: sim|nao
    entradas:
      - relato_do_bug
    saidas:
      - ambiente_do_bug
      - logs_do_bug
      - estado_dos_dados
      - registro_visual_do_bug
      - passos_de_reproducao
      - teste_que_reproduz
      - reproduzido
    subtarefas:
      - id: bug_rep_t1_st1
        rotulo: Reunir o contexto do relato
        descricao: Versão, dispositivo, navegador, conta, flags ativas e horário em que o bug aconteceu
        papel: suporte
        apoio:
          - qa
        entradas:
          - relato_do_bug
        saidas:
          - ambiente_do_bug
        exemplo: Versão 4.12.0, iPhone 13, conta comprador_recorrente_02, flag de cupom ligada, 14h32.
        status: rascunho
      - id: bug_rep_t1_st2
        rotulo: Coletar logs, rastros e métricas do horário do erro
        papel: dev
        apoio:
          - sre
        entradas:
          - ambiente_do_bug
        saidas:
          - logs_do_bug
        tecnicas:
          - tecnica: tec_logs_e_rastreamento
            uso: obrigatoria
            porque: o rastro mostra onde a requisição falhou sem depender da memória de quem relatou
        exemplo: Erro 500 no serviço de cupons, id de correlação 7f3a, timeout na consulta de saldo.
        status: rascunho
      - id: bug_rep_t1_st3
        rotulo: Capturar o estado dos dados envolvidos
        papel: dev
        apoio:
          - engenheiro_de_dados
        entradas:
          - ambiente_do_bug
          - logs_do_bug
        saidas:
          - estado_dos_dados
        tecnicas:
          - tecnica: tec_mascaramento_de_dados
            uso: obrigatoria
            porque: a evidência sai de produção e não pode expor dados de pessoas
        exemplo: Pedido 98213 com cupom expirado e status pendente, dados do comprador mascarados.
        status: rascunho
      - id: bug_rep_t1_st4
        rotulo: Reproduzir em ambiente controlado e registrar os passos
        papel: qa
        entradas:
          - ambiente_do_bug
          - logs_do_bug
          - estado_dos_dados
        saidas:
          - passos_de_reproducao
          - registro_visual_do_bug
          - reproduzido
        tecnicas:
          - tecnica: tec_reproducao_minima
            uso: obrigatoria
            porque: o menor caso que mostra a falha acelera o isolamento da causa
        exemplo: 3 passos com carrinho de 1 item e cupom expirado; gravação de 20 s anexada.
        status: rascunho
      - id: bug_rep_t1_st5
        rotulo: Escrever o teste automatizado que falha com o bug
        papel: dev
        quando:
          todos:
            - var: reproduzido
              igual: sim
        porque: o teste prova o defeito antes da correção e vira regressão depois dela
        entradas:
          - passos_de_reproducao
        saidas:
          - teste_que_reproduz
        tecnicas:
          - tecnica: tec_teste_regressao
            uso: obrigatoria
            porque: o mesmo teste falha agora e protege contra a volta do defeito
        exemplo: Teste de integração do checkout com cupom expirado falha com erro 500.
        status: rascunho
    playbook: pb_bug_rep_t1
    layout:
      coluna: 1
    status: rascunho
    publico: false
  - id: bug_rep_g1
    raia: bug_rep
    tipo: bifurcacao
    rotulo: Reproduziu?
    condicao: Reproduziu?
    proximo:
      - para: bug_rep_e1
        condicao: sim
      - para: bug_rep_t2
        condicao: não
    estado:
      reproduzido: sim|nao
    entradas:
      - reproduzido
      - passos_de_reproducao
    papel: qa
    playbook: pb_bug_rep_g1
    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: bug_rep_t2
    raia: bug_rep
    tipo: tarefa
    rotulo: Coletar evidências e tentar de novo
    condicao: ""
    proximo:
      - para: bug_rep_g2
        condicao: ""
    estado:
      reproduzido: nao
    entradas:
      - relato_do_bug
      - ambiente_do_bug
      - logs_do_bug
    saidas:
      - logs_do_bug
      - estado_dos_dados
      - registro_visual_do_bug
      - passos_de_reproducao
    subtarefas:
      - id: bug_rep_t2_st1
        rotulo: Ampliar a coleta para outros serviços e um período maior
        papel: dev
        apoio:
          - sre
        entradas:
          - logs_do_bug
        saidas:
          - logs_do_bug
        tecnicas:
          - tecnica: tec_logs_e_rastreamento
            uso: obrigatoria
            porque: a causa pode estar num serviço vizinho ou começar antes do horário relatado
        exemplo: Rastros de pagamentos e cupons nas 2 horas anteriores; 4 erros parecidos em outras contas.
        status: rascunho
      - id: bug_rep_t2_st2
        rotulo: Pedir ao relator gravação de tela ou dados adicionais
        papel: suporte
        entradas:
          - relato_do_bug
        saidas:
          - registro_visual_do_bug
        exemplo: O comprador enviou a gravação; o erro só aparece com o cupom aplicado depois do frete.
        status: rascunho
      - id: bug_rep_t2_st3
        rotulo: Tentar em ambiente próximo de produção com dados mascarados
        papel: qa
        apoio:
          - dev
        entradas:
          - logs_do_bug
          - registro_visual_do_bug
        saidas:
          - estado_dos_dados
          - passos_de_reproducao
        tecnicas:
          - tecnica: tec_mascaramento_de_dados
            uso: obrigatoria
            porque: dados próximos dos reais reproduzem sem expor pessoas
        exemplo: Reproduzido em homologação com cópia mascarada do pedido 98213.
        status: rascunho
    playbook: pb_bug_rep_t2
    layout:
      coluna: 3
    status: rascunho
    publico: false
  - id: bug_rep_g2
    raia: bug_rep
    tipo: bifurcacao
    rotulo: Reproduz com as novas evidências?
    condicao: Reproduz com as novas evidências?
    proximo:
      - para: bug_rep_e1
        condicao: sim
      - para: bug_rep_e2
        condicao: não
    estado:
      reproduzido: sim|nao
    entradas:
      - passos_de_reproducao
      - registro_visual_do_bug
    papel: qa
    apoio:
      - dev
    playbook: pb_bug_rep_g2
    layout:
      coluna: 4
    status: rascunho
    publico: false
  - id: bug_rep_e1
    raia: bug_rep
    tipo: fim
    retorno: reproduzido
    rotulo: Reproduzido
    condicao: ""
    proximo: []
    estado: {}
    saidas:
