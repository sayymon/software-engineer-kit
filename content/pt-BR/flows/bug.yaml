      - teste_que_reproduz
      - hotfix_aberto
      - paliativo_aplicado
    subtarefas:
      - id: bug_cor_t2_st1
        rotulo: Garantir o teste que falha antes de corrigir
        papel: dev
        entradas:
          - teste_que_reproduz
          - causa_raiz
        saidas:
          - teste_que_reproduz
        tecnicas:
          - tecnica: tec_tdd
            uso: obrigatoria
            porque: vermelho antes do verde prova que a correção trata o defeito
        exemplo: O teste do cupom expirado existe e falha; o caso do vale-presente ganha o seu.
        status: rascunho
      - id: bug_cor_t2_st2
        rotulo: Corrigir na branch do hotfix com escopo mínimo
        papel: dev
        quando:
          todos:
            - var: prioridade
              igual: hotfix
        porque: o hotfix não pode carregar mudanças que ainda não estão em produção
        entradas:
          - hotfix_aberto
          - causa_raiz
        saidas:
          - codigo_da_correcao
        tecnicas:
          - tecnica: tec_hotfix
            uso: obrigatoria
            porque: a branch parte do que está em produção e leva só a correção
        exemplo: Branch hotfix/cupom-expirado a partir da versão em produção, só com o tratamento da expiração.
        status: rascunho
      - id: bug_cor_t2_st3
        rotulo: Implementar a correção mínima na causa raiz
        papel: dev
        quando:
          todos:
            - var: prioridade
              igual: backlog
        porque: fora do hotfix, a correção segue o fluxo normal do time
        entradas:
          - causa_raiz
          - teste_que_reproduz
        saidas:
          - codigo_da_correcao
        exemplo: Tratamento de cupom expirado na consulta de saldo, 14 linhas.
        status: rascunho
      - id: bug_cor_t2_st4
        rotulo: Remover o paliativo aplicado na triagem
        papel: dev
        quando:
          todos:
            - var: mitigacao_paliativa
              igual: sim
        porque: paliativo esquecido vira dívida e esconde a próxima falha
        entradas:
          - paliativo_aplicado
          - codigo_da_correcao
        saidas:
          - codigo_da_correcao
        exemplo: A flag que escondia o campo de cupom no checkout é removida junto com a correção.
        status: rascunho
      - id: bug_cor_t2_st5
        rotulo: Abrir o PR com causa, correção e risco
        papel: dev
        entradas:
          - codigo_da_correcao
          - teste_que_reproduz
          - causa_raiz
        saidas:
          - entrega_integrada
        tecnicas:
          - tecnica: tec_code_review
            uso: obrigatoria
            porque: o PR leva o contexto para a revisão chegar à causa
        exemplo: PR com link do bug, causa raiz, o teste que falhava e o risco de efeito colateral no vale-presente.
        status: rascunho
    playbook: pb_bug_cor_t2
    layout:
      coluna: 2
    status: rascunho
    publico: false
