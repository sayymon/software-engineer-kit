  - id: feat_alo_t1
    raia: feat_alo
    tipo: tarefa
    rotulo: Quebra o design em tarefas pequenas e verificáveis
    condicao: ""
    proximo:
      - para: feat_alo_t2
        condicao: ""
    estado: {}
    entradas:
      - spec_pronta
      - requirements_md
      - design_md
      - requisitos_classificados
      - criterios_de_aceite
      - usa_ia
      - tem_integracao
    saidas:
      - lista_de_tarefas
      - mapa_de_dependencias
    subtarefas:
      - id: feat_alo_t1_st1
        exemplo: "A spec de cupom de desconto vira 9 tarefas: modelo de dados, regra de validade, endpoint, tela de aplicação e testes, cada uma com menos de um dia de trabalho."
        rotulo: Fatiar a spec em tarefas pequenas
        papel: tech_lead
        apoio:
          - dev
        entradas:
          - spec_pronta
          - requisitos_classificados
        saidas:
          - lista_de_tarefas
        tecnicas:
          - tecnica: tec_slicing_vertical
            uso: obrigatoria
            porque: fatias verticais entregam valor e cabem em uma única revisão
          - tecnica: tec_spec_driven_development
            uso: recomendada
            porque: a spec é o contrato que guia o recorte
        status: rascunho
      - id: feat_alo_t1_st2
        exemplo: 'Tarefa "validar cupom expirado": pronta quando o endpoint devolve erro 422 com a mensagem certa e o teste automatizado cobre a data limite.'
        rotulo: Definir o critério de pronto de cada tarefa
        papel: qa
        apoio:
          - pm
        entradas:
          - lista_de_tarefas
          - criterios_de_aceite
        saidas:
          - lista_de_tarefas
        tecnicas:
          - tecnica: tec_criterios_aceitacao
            uso: obrigatoria
            porque: sem critério verificável a tarefa não pode ser delegada nem revisada
          - tecnica: tec_bdd_gherkin
            uso: opcional
            porque: cenários escritos ajudam quando o critério é comportamental
          - tecnica: tec_contract_testing
            uso: condicional
            quando:
              todos:
                - var: usa_ia
                  igual: nao
                - var: tem_integracao
                  igual: sim
            porque: integração com outro sistema precisa de um contrato verificável por teste
        status: rascunho
      - id: feat_alo_t1_st3
        exemplo: A tela de aplicação depende do endpoint, que depende do modelo de dados. As tarefas de teste dependem de todas as outras.
        rotulo: Registrar as dependências entre tarefas
        papel: tech_lead
        entradas:
          - lista_de_tarefas
        saidas:
          - mapa_de_dependencias
        status: rascunho
      - id: feat_alo_t1_st4
        exemplo: "Como o recurso sugere cupons por IA, entram 3 tarefas extras: avaliação com 50 casos, teto de custo por chamada e fallback para regra fixa se o modelo cair."
        rotulo: Incluir tarefas de evals, custo e plano B (se usa IA)
        papel: arquiteto
        apoio:
          - qa
        entradas:
          - lista_de_tarefas
          - spec_pronta
        saidas:
          - lista_de_tarefas
        tecnicas:
          - tecnica: tec_evals
            uso: condicional
            quando:
              todos:
                - var: usa_ia
                  igual: sim
            porque: saída probabilística pede evals no lugar de asserts exatos
          - tecnica: tec_observabilidade_de_llm
            uso: condicional
            quando:
              todos:
                - var: usa_ia
                  igual: sim
            porque: mede custo e qualidade por chamada ao modelo
        status: rascunho
    playbook: pb_feat_alo_t1
    layout:
      coluna: 1
    status: rascunho
    publico: false
