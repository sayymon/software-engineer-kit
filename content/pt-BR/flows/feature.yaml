            uso: recomendada
            porque: negócio, desenvolvimento e qualidade encontram as lacunas juntos
        exemplo: "Sessão de 40 minutos: 3 casos de borda novos e 1 história quebrada em duas."
        status: rascunho
      - id: feat_lev_t2_st3
        rotulo: Escrever os critérios de aceite como exemplos
        papel: qa
        apoio:
