playbooks:
  - id: pb_feat_orq_s0
    resumo: Toda feature nasce de uma necessidade ou de uma oportunidade. Antes de pensar no que construir, entenda o porquê e verifique se já não existe algo que possa ser reutilizado. Em uma empresa, confirme também se a iniciativa está dentro dos objetivos reais, considerando os OKRs e os KPIs.
    perguntas_chave:
      - '"Qual é a necessidade ou a oportunidade por trás desta demanda?"'
      - '"Já existe algo que possamos reutilizar ou adaptar?"'
      - '"Qual OKR e qual KPI esta iniciativa move?"'
      - '"Quem se beneficia e o que muda para essas pessoas?"'
      - '"Como vamos medir o sucesso?"'
    fazer:
      - Descreva a necessidade ou a oportunidade em uma frase antes de falar de solução
      - Procure o que já existe (produto, serviço ou componente) e avalie reutilizar
      - Ligue a demanda a um OKR e a um KPI existentes
      - Identifique quem se beneficia e qual resultado esperar
      - Anote a hipótese de impacto e como vamos saber que funcionou
      - Inicie tentativas_iteracao em 0 (limite de 3 iterações de spec e contexto, no laço de validação)
    evitar:
      - Aceitar soluções prontas sem entender a necessidade ou a oportunidade
      - Construir antes de verificar o que já existe
      - Iniciativa sem OKR ou KPI que a sustente
      - Requisitos sem métrica de sucesso
      - Elicitação por e-mail apenas
    status: rascunho
    publico: false
  - id: pb_feat_orq_c1
    resumo: "Chama a raia Entendimento da necessidade e contexto: entender a necessidade ou oportunidade e o contexto em que ela surge. O fluxo segue pelo retorno que a raia devolver."
    perguntas_chave:
      - '"Qual resultado de negócio ou de usuário muda, e como vamos saber (métricas e metas)?"'
      - '"Quem pede, quem usa, quem decide, quem opera e quem é afetado?"'
      - '"Como a iniciativa se alinha aos OKRs e aos KPIs?"'
      - '"Já existe algo para reutilizar, ou vale construir, comprar ou assinar?"'
      - '"Qual o custo de adiar e qual a prioridade em relação ao restante?"'
      - '"Que riscos existem e qual a janela de oportunidade?"'
      - '"Quem se beneficia e o que muda para essas pessoas?"'
    fazer:
      - "Retornos possíveis: necessidade_entendida"
      - Registre o impacto esperado com métrica e meta
      - Mapeie os interessados (pede, usa, decide, opera, é afetado)
      - Decida de forma estratégica como atender (reutilizar, construir, comprar ou assinar)
    evitar:
      - Seguir sem saber qual resultado muda e como será medido
      - Esquecer quem opera ou é afetado
      - Escolher construir sem comparar com reutilizar, comprar ou assinar
    status: rascunho
    publico: false
  - id: pb_feat_orq_c3
    resumo: "Chama a raia Classificação e escopo dos requisitos: classificar os requisitos para delimitar o escopo. O fluxo segue pelo retorno que a raia devolver."
    perguntas_chave:
      - '"O que está dentro e o que está fora do escopo desta entrega?"'
    fazer:
      - "Retornos possíveis: requisitos_classificados"
    status: rascunho
    publico: false
  - id: pb_feat_orq_c4
    resumo: "A spec sai com requirements.md e design.md completos: DDD para extrair módulos, contextos e integrações, diagramas de arquitetura e de sequência, tecnologias, stack, estrutura do projeto, padrões e boas práticas, e os ADRs aprovados com os stakeholders."
    perguntas_chave:
      - '"A visão arquitetural é suficiente para decompor em tarefas?"'
      - '"Quais decisões de arquitetura precisam de ADR e de aprovação?"'
    status: rascunho
    publico: false
  - id: pb_feat_orq_c5
    resumo: Decompor o design em tarefas, mapear as dependências entre elas e os papéis que cada uma precisa. Quem exerce cada papel é decidido no setup.
    perguntas_chave:
      - '"Toda tarefa tem papel e dependências mapeadas?"'
    status: rascunho
    publico: false
  - id: pb_feat_orq_c6
    resumo: "Setup: ferramentas, ambiente, revisão de contexto, agentes e skills, tudo que é necessário para iniciar a execução das tarefas."
    perguntas_chave:
      - '"O que falta para a execução começar sem bloqueio?"'
    status: rascunho
    publico: false
  - id: pb_feat_orq_c7
    resumo: "Execução das tarefas: toda a coordenação entre agentes e pessoas por papel fica dentro da raia de execução."
    perguntas_chave:
      - '"As entregas foram integradas?"'
    status: rascunho
    publico: false
  - id: pb_feat_orq_c2
    resumo: "Chama a raia Levantamento e enriquecimento de requisitos: levantar os requisitos e enriquecê-los até ficarem claros e completos. O fluxo segue pelo retorno que a raia devolver."
    perguntas_chave:
      - '"Quem precisa ser ouvido para os requisitos ficarem claros e completos?"'
      - '"Quais são os usuários e as jornadas envolvidas?"'
      - '"Quais regras de negócio se aplicam?"'
      - '"Quais são os requisitos funcionais e não funcionais?"'
      - '"Quais restrições, dados e integrações precisamos considerar?"'
      - '"Que riscos e dependências existem?"'
      - '"Quais são os critérios de aceitação preliminares e as métricas de sucesso?"'
      - '"Que exemplos concretos e casos de borda ilustram o comportamento esperado?"'
      - '"O que fica fora do escopo?"'
    fazer:
      - "Retornos possíveis: requisitos_claros"
      - Levante usuários, jornadas e regras de negócio
      - Separe requisitos funcionais e não funcionais
      - Registre restrições, dados, integrações, riscos e dependências
      - Escreva critérios de aceitação preliminares com exemplos concretos
      - Declare o que fica fora do escopo
      - Cada técnica de elicitação é uma subtarefa condicionada ao contexto da demanda
    evitar:
      - Requisitos sem métrica de sucesso
      - Casos de borda deixados para depois
      - Escopo sem limite declarado
    status: rascunho
    publico: false
  - id: pb_feat_orq_c8
    resumo: Depois da revisão dos PRs e da execução, a feature é versionada pela estratégia do time e publicada em um ambiente de testes, como o staging de desenvolvimento.
    perguntas_chave:
      - '"A versão publicada é a mesma que será implantada?"'
    status: rascunho
    publico: false
  - id: pb_feat_orq_c9
    resumo: "Testes da feature: unitários, de integração e de contrato, sempre revisados e aprimorados com TDD e a pirâmide de testes. O limite de tentativas fica dentro da raia."
    perguntas_chave:
      - '"Cada critério de aceite tem teste?"'
    status: rascunho
    publico: false
  - id: pb_feat_orq_c10
    resumo: Testes de ponta a ponta das jornadas críticas. Não se aplica quando a feature não muda uma jornada.
    perguntas_chave:
      - '"Quais jornadas a feature toca?"'
    status: rascunho
    publico: false
  - id: pb_feat_orq_c11
    resumo: "Evals só para features com IA aplicada: qualidade, alucinação, custo por chamada e latência."
    perguntas_chave:
      - '"A feature usa IA?"'
    status: rascunho
    publico: false
  - id: pb_feat_orq_c12
    resumo: Testes de performance contra as metas dos requisitos não funcionais.
    perguntas_chave:
      - '"Há meta de latência ou de carga?"'
    status: rascunho
    publico: false
  - id: pb_feat_orq_c13
    resumo: "Testes de segurança: análise estática, dependências, segredos e testes da aplicação em execução."
    perguntas_chave:
      - '"Há vulnerabilidade alta ou crítica aberta?"'
    status: rascunho
    publico: false
  - id: pb_feat_orq_c14
    resumo: Review humano da entrega, inclusive do que os agentes geraram. Ajustes solicitados voltam para a análise da reprovação.
    perguntas_chave:
      - '"O review aprovou sem pendências?"'
    status: rascunho
    publico: false
  - id: pb_feat_orq_c15
    resumo: "Testes integrados no ambiente que a feature pede: staging, homologação ou produção controlada, com feature flag, teste A/B e o aceite do negócio."
    perguntas_chave:
      - '"Em qual ambiente esta feature precisa ser testada?"'
    status: rascunho
    publico: false
  - id: pb_feat_orq_c16
    resumo: "Implantação em produção com o checklist: versão, saúde, indicadores de monitoramento, logs e negócio. Implantação doente é revertida."
    perguntas_chave:
      - '"O checklist de implantação está verde?"'
    status: rascunho
    publico: false
  - id: pb_feat_orq_c17
    resumo: Depois de implantada, os stakeholders são acionados e, com estratégia de rollout, a feature é liberada por tipo de usuário ou região.
    perguntas_chave:
      - '"Quem precisa saber e quando cada público recebe a feature?"'
    status: rascunho
    publico: false
  - id: pb_feat_orq_c18
    resumo: Ciclo de validação em produção com monitoramento técnico e de negócio. Incidente causado pela feature aciona o fluxo de incidente.
    perguntas_chave:
      - '"As metas de sucesso foram atingidas na janela de validação?"'
    status: rascunho
    publico: false
  - id: pb_feat_orq_c19
    resumo: "Toda reprovação passa por análise de causa: na spec ou no contexto, volta à decomposição; na implementação, volta à execução."
    perguntas_chave:
      - '"A causa está na spec ou na implementação?"'
    status: rascunho
    publico: false
  - id: pb_feat_orq_e1
    resumo: "Retorno «feature_validada»: a feature está em produção, liberada, monitorada e com o resultado registrado contra as metas de sucesso."
    perguntas_chave:
      - '"Que sinal mostra que o requisito virou entrega previsível?"'
      - '"Quem acompanha qualidade, custo e drift depois da entrega, quando a feature usa IA?"'
    status: rascunho
    publico: false
  - id: pb_feat_orq_e2
    resumo: "Retorno «reutilizar_existente»: uma solução que já existe atende a necessidade. A melhor feature é a que não precisa ser construída."
    perguntas_chave:
      - '"Quem é o dono da solução existente e como ela será disponibilizada?"'
      - '"O que precisa ser comunicado aos interessados?"'
    fazer:
      - Combine com o dono da solução como o time vai usá-la
      - Atualize o registro da necessidade com a decisão e avise os interessados
    exemplo: "O componente de cupom já aceita regra por público: o time só configura a campanha, sem desenvolvimento novo."
    status: rascunho
    publico: false
  - id: pb_feat_orq_e3
    resumo: "Retorno «fora_dos_objetivos»: a iniciativa não move um OKR nem um KPI atual. Ela volta ao demandante com o motivo registrado e pode voltar quando os objetivos mudarem."
    perguntas_chave:
      - '"Qual objetivo futuro tornaria esta iniciativa prioritária?"'
      - '"O demandante entendeu o motivo e o caminho para trazê-la de volta?"'
    fazer:
      - Registre o motivo no registro da necessidade
      - Combine com o demandante quando reavaliar
    exemplo: Ideia de programa de pontos registrada para o planejamento do próximo semestre, quando entra o objetivo de fidelização.
    status: rascunho
    publico: false
  - id: pb_feat_lev_s0
    resumo: "Início da raia Levantamento e enriquecimento de requisitos. Responsabilidade: levantar os requisitos e enriquecê-los até ficarem claros e completos."
    perguntas_chave:
      - '"O que já sabemos da necessidade?"'
      - '"Qual é o registro de origem (ticket, documento ou conversa)?"'
      - '"Quais lacunas de informação ainda existem?"'
      - '"Quem precisamos consultar?"'
      - '"Qual é o prazo desejado?"'
    fazer:
      - Reúna o que já se sabe e aponte o registro de origem
      - Liste as lacunas de informação
      - Defina quem consultar e em que ordem
      - Combine o prazo desejado com as pessoas envolvidas
    evitar:
      - Começar a levantar sem ler o registro de origem
      - Consultar só quem está mais à mão
    status: rascunho
    publico: false
    exemplo: Registro da necessidade em PRD, mapa de interessados e métricas de sucesso já validados.
  - id: pb_feat_lev_t1
    resumo: Entrevista não basta. A primeira subtarefa classifica o contexto, e cada técnica só entra quando o contexto pede.
    perguntas_chave:
      - '"O que o usuário faz hoje para atender essa necessidade?"'
      - '"Quais fluxos alternativos e erros já foram mapeados?"'
      - '"O contexto é core, de suporte ou genérico?"'
      - '"Quantos sistemas dependem desta mudança?"'
    fazer:
      - Classifique o contexto antes de escolher as técnicas
      - 5 porquês com incerteza alta
      - Impact Mapping em contexto core com muitos dependentes
      - Event Storming em fluxo complexo ou com variações
      - Jobs to Be Done para necessidade de usuário
      - Observação do trabalho real quando há processo atual
      - Análise de dados quando há dados disponíveis
    evitar:
      - Elicitação só com quem fala mais alto
      - Confundir o que pedem com o que precisam
      - Aplicar todas as técnicas em toda demanda
    exemplo: "Contexto core com 4 dependentes e fluxo com variações: Impact Mapping, Event Storming e análise de dados."
    status: rascunho
    publico: false
  - id: pb_feat_lev_g1
    resumo: Requisitos claros seguem para o registro dos cards; incompletos voltam ao enriquecimento.
    perguntas_chave:
      - '"Os requisitos estão claros e completos?"'
    exemplo: "Faltava o comportamento para boleto vencido: volta ao enriquecimento."
    status: rascunho
    publico: false
  - id: pb_feat_lev_t2
    resumo: "Transformar requisitos em trabalho previsível: histórias INVEST, 3 Amigos, critérios como exemplos e a Definition of Done mínima."
    perguntas_chave:
      - '"Como sabemos que está pronto?"'
      - '"Qual o comportamento quando falha?"'
      - '"Isso cabe numa sprint? Senão, como fatiamos?"'
    fazer:
      - "DoD mínima: critérios de aceite atendidos, gates de qualidade e segurança aprovados, requisitos funcionais e não funcionais cobertos por testes"
    evitar:
      - História gigante
      - Critério genérico como «deve ser rápido»
    exemplo: 6 histórias INVEST, 14 critérios em exemplos e a DoD mínima acordada com o time.
    status: rascunho
    publico: false
  - id: pb_feat_lev_t3
    resumo: Os requisitos saem registrados como cards na ferramenta de gestão do fluxo do time e como um contrato funcional e técnico de pronto, da visão de negócio aos testes e à análise de vulnerabilidades.
    perguntas_chave:
      - '"Cada card tem critérios de aceite e dependências?"'
      - '"O contrato diz quais testes e quais análises de segurança provam o pronto?"'
    exemplo: 6 cards com critérios e o contrato de pronto anexado ao registro da necessidade.
    status: rascunho
    publico: false
  - id: pb_feat_lev_e1
    resumo: "Retorno «requisitos_claros»: requisitos levantados, histórias refinadas, critérios de aceite, DoD, cards e contrato de pronto."
    perguntas_chave:
      - '"Os critérios de aceite estão em exemplos que dá para testar?"'
    status: rascunho
    publico: false
  - id: pb_feat_spc_s0
    resumo: "Início da raia Especificação (SDD). Responsabilidade: escrever a spec que serve de contrato para o time e para agentes."
    perguntas_chave:
      - '"O requisito pronto traz contexto, exemplos e critérios para virar spec?"'
    status: rascunho
    publico: false
  - id: pb_feat_spc_g1
    exemplo: A feature sugere produtos com um modelo de recomendação, então a saída varia e o fluxo segue pelo caminho com IA.
    resumo: "Define usa_ia. Com IA, a saída varia: a spec precisa de critérios de avaliação (evals) e de custo, e a validação e a entrega herdam isso."
    perguntas_chave:
      - '"A saída da feature varia para a mesma entrada (LLM, classificador, recomendação)?"'
    fazer:
      - Registre usa_ia (sim|nao); ele ativa o requisito probabilistico_ia na spec, na validação (evals) e na entrega (observabilidade de IA)
      - "Critério da saída «sim, usa IA»: há LLM, agente de IA, classificador, recomendação ou outro modelo cuja saída é probabilística"
      - "Critério da saída «não, só lógica determinística»: a mesma entrada sempre produz a mesma saída"
      - "O fato de um agente ESCREVER o código não faz a feature usar IA: usa_ia trata do que a feature faz em produção, não de quem a construiu"
    evitar:
      - Marcar usa_ia só porque um agente vai codar a feature
      - Descobrir o custo por chamada depois do deploy
    status: rascunho
    publico: false
  - id: pb_feat_spc_t1
    resumo: Com IA, a spec precisa de critérios de avaliação (evals), orçamento de custo por chamada, plano B e riscos de alucinação e de dependência de fornecedor do modelo.
    perguntas_chave:
      - '"Qual conjunto de casos prova que a saída é boa o suficiente?"'
      - '"Qual o teto de custo por chamada e o que acontece se for ultrapassado?"'
      - '"Qual o plano B se o modelo ou o fornecedor ficar indisponível?"'
    fazer:
      - Defina os casos de avaliação e o limiar de aceite
      - Registre o custo por chamada e por tarefa
      - Liste casos conhecidos de alucinação
    exemplo: Aceite com 90% de sugestões válidas em 50 casos; teto de custo por chamada; fallback para regra fixa.
    status: rascunho
    publico: false
  - id: pb_feat_spc_t2
    resumo: "O requirements.md é o contrato do que a feature faz: histórias, critérios de aceite em EARS, requisitos não funcionais com metas e, com IA, o requisito probabilístico."
    perguntas_chave:
      - '"Cada critério de aceite é verificável por um teste?"'
      - '"Os requisitos não funcionais têm metas numéricas?"'
      - '"A feature muda uma jornada de usuário?"'
    evitar:
      - Critério genérico como «deve ser rápido»
    exemplo: requirements.md com 6 histórias, 14 critérios em EARS e 4 requisitos não funcionais.
    status: rascunho
    publico: false
  - id: pb_feat_spc_t3
    resumo: O DDD é a base para extrair módulos, contextos e integrações. Os contextos delimitados viram módulos com dono, e o mapa de contextos mostra as integrações.
    perguntas_chave:
      - '"Quais contextos a feature toca e quem é o dono de cada um?"'
      - '"A linguagem do negócio está igual no código e na conversa?"'
      - '"Quais integrações entre contextos surgem?"'
    exemplo: "Contextos Promoções e Pedidos, integração por eventos, termo único: comprador recorrente."
    status: rascunho
    publico: false
  - id: pb_feat_spc_t4
    resumo: "O design.md reúne a visão arquitetural completa: diagramas de arquitetura e de sequência, dados, contratos, tecnologias, stack, estrutura do projeto, padrões e boas práticas. É dele que saem as tarefas."
    perguntas_chave:
      - '"Dá para decompor o design em tarefas sem voltar a perguntar?"'
      - '"Os fluxos principais têm diagrama de sequência?"'
      - '"As alternativas descartadas e os riscos estão registrados?"'
    evitar:
      - Design só com texto, sem diagramas
      - Decidir stack sem considerar o que o time já opera
    status: rascunho
    publico: false
    exemplo: "design.md do cupom recorrente: C4 com 3 contêineres, 2 diagramas de sequência, contrato de validação, stack e padrões."
  - id: pb_feat_spc_t5
    resumo: Nesta fase começam as principais decisões de arquitetura. Cada decisão relevante vira ADR, e as que afetam outros times são aprovadas com os stakeholders.
    perguntas_chave:
      - '"Quais decisões são difíceis de reverter?"'
      - '"Quais stakeholders precisam aprovar cada decisão?"'
    fazer:
      - Um ADR por decisão, com contexto, alternativas e consequências
      - Reunião curta com quem a decisão afeta
    exemplo: ADR de integração por eventos aprovado com Pedidos e Pagamentos.
    status: rascunho
    publico: false
  - id: pb_feat_spc_g2
    resumo: A spec só segue para a decomposição com requirements, design e ADRs aprovados. Sem aprovação, o design é revisto.
    perguntas_chave:
      - '"Os stakeholders aprovaram as decisões que os afetam?"'
    status: rascunho
    publico: false
    exemplo: "Aprovada: ADR de eventos aceito por Pedidos e Pagamentos; segue para a decomposição."
  - id: pb_feat_spc_e1
    resumo: "Retorno «spec_pronta»: requirements.md, design.md e ADRs prontos e aprovados, com a visão arquitetural completa para decompor em tarefas."
    perguntas_chave:
      - '"A spec tem tudo o que a decomposição precisa?"'
    status: rascunho
    publico: false
  - id: pb_feat_alo_s0
    resumo: "Início da raia Decomposição e alocação de tarefas. Responsabilidade: decompor a spec em tarefas e alocar cada uma ao agente, a pessoas ou a ambos."
    perguntas_chave:
      - '"A spec está clara o bastante para ser quebrada em tarefas verificáveis?"'
    status: rascunho
    publico: false
  - id: pb_feat_alo_t1
    exemplo: A spec do cupom é quebrada em 9 tarefas de até um dia, cada uma com um teste que mostra se está pronta.
    resumo: Depois do ciclo de SDD, a spec vira um conjunto de tarefas. Tarefa pequena e verificável é a unidade que dá para delegar, testar e revisar.
    perguntas_chave:
      - '"Cada tarefa tem um critério de pronto que um teste ou uma pessoa consegue checar?"'
    fazer:
      - Cada tarefa precisa de entrada, saída e critério de aceite que um teste ou uma pessoa consiga checar
      - "Tamanho de referência: uma tarefa cabe em uma única revisão"
      - "A decomposição é uma proposta: o agente pode rascunhar e a pessoa valida o recorte"
    evitar:
      - Tarefa gigante que mistura decisão e implementação
      - Tarefa sem critério de aceite verificável
    tecnicas:
      - tec_slicing_vertical
    status: rascunho
    publico: false
  - id: pb_feat_alo_t2
    resumo: Cada tarefa precisa de um papel principal e dos papéis de apoio. Quem exerce cada papel, uma pessoa ou um agente do papel, é decidido depois, no setup.
    perguntas_chave:
      - '"Qual papel é dono de cada tarefa?"'
      - '"Quais tarefas tocam segurança, dados pessoais ou decisões de arquitetura?"'
    evitar:
      - Decidir agente ou pessoa antes de saber o papel
    status: rascunho
    publico: false
    exemplo: "9 tarefas: 5 com papel Dev, 2 com QA, 1 com Arquiteto e 1 com Engenharia de dados; 2 marcadas como sensíveis."
  - id: pb_feat_alo_t3
    resumo: "Dependências e ordem: decisões que bloqueiam vêm primeiro, depois a execução em paralelo onde possível, depois a integração."
    perguntas_chave:
      - '"Quais tarefas dependem de uma decisão ainda aberta?"'
      - '"O que pode rodar em paralelo?"'
    status: rascunho
    publico: false
    exemplo: Contrato do evento primeiro; endpoint, consumidor e testes em paralelo; integração por último.
  - id: pb_feat_alo_e1
    resumo: "Retorno «tarefas_mapeadas»: tarefas, papéis, dependências e ordem prontos para o setup da execução."
    perguntas_chave:
      - '"Toda tarefa tem papel, critério de pronto e dependências?"'
    status: rascunho
    publico: false
  - id: pb_feat_ite_s0
    resumo: "Início da raia. Toda reprovação tem uma causa: na spec ou no contexto, volta à decomposição; na implementação, volta à execução com a correção aberta."
    perguntas_chave:
      - '"O que esta raia recebe de quem a chamou?"'
    status: rascunho
    publico: false
  - id: pb_feat_ite_t1
    resumo: "Analisar a causa da reprovação. Toda reprovação tem uma causa: na spec ou no contexto, volta à decomposição; na implementação, volta à execução com a correção aberta."
    perguntas_chave:
      - '"Qual artefato esta tarefa entrega?"'
    status: rascunho
    publico: false
  - id: pb_feat_ite_g1
    resumo: "A causa na spec ou no contexto volta à decomposição; na implementação, segue para avaliar o impacto: bug ou incidente."
    perguntas_chave:
      - '"A causa está na spec ou na implementação?"'
    status: rascunho
    publico: false
    exemplo: "Critério de recusa ambíguo: causa na spec."
  - id: pb_feat_ite_t2
    resumo: "Ajustar a spec e o contexto. Toda reprovação tem uma causa: na spec ou no contexto, volta à decomposição; na implementação, volta à execução com a correção aberta."
    perguntas_chave:
      - '"Qual artefato esta tarefa entrega?"'
    status: rascunho
    publico: false
  - id: pb_feat_ite_t3
    resumo: "Abrir a correção na implementação. Toda reprovação tem uma causa: na spec ou no contexto, volta à decomposição; na implementação, volta à execução com a correção aberta."
    perguntas_chave:
      - '"Qual artefato esta tarefa entrega?"'
    status: rascunho
    publico: false
  - id: pb_feat_ite_e1
    resumo: "Retorno «spec_ajustada»: spec e contexto ajustados."
    perguntas_chave:
      - '"O retorno entrega: Ajuste da spec?"'
    status: rascunho
    publico: false
  - id: pb_feat_ite_e2
    resumo: "Retorno «correcao_na_implementacao»: correção aberta para a execução."
    perguntas_chave:
      - '"O retorno entrega: Tarefa de correção?"'
    status: rascunho
    publico: false
  - id: pb_feat_ite_g2
    resumo: "Falha na implementação que ficou só na feature segue como bug. Se impactou vários usuários em produção, vira incidente: primeiro restaurar o serviço, depois corrigir."
    perguntas_chave:
      - '"A falha chegou a usuários em produção?"'
      - '"Quantos usuários, compras ou regiões foram afetados?"'
      - '"Já existe um incidente aberto para esta falha?"'
    fazer:
      - "Use os critérios de incidente: raio de impacto, perda de dados, segurança, dinheiro ou degradação sem contorno"
    exemplo: "Erro só em homologação: bug. Erro em 4% dos checkouts de uma região em produção: incidente."
    status: rascunho
    publico: false
  - id: pb_feat_ite_t4
    resumo: Com impacto amplo, o fluxo de incidente assume a mitigação. A feature registra a correção que vai precisar e volta à execução depois.
    perguntas_chave:
      - '"O incidente já foi aberto pelo monitoramento?"'
      - '"Quem é o incident commander?"'
    evitar:
      - Abrir um segundo incidente para a mesma falha
      - Corrigir a feature antes de mitigar o impacto
    exemplo: Incidente vinculado; flag desligada pelo incidente; card de correção criado para a feature.
    status: rascunho
    publico: false
  - id: pb_feat_ite_e3
    resumo: "Retorno «incidente_acionado»: o incidente cuida da mitigação e a correção da feature volta à execução."
    perguntas_chave:
      - '"A correção registrada tem o teste que comprova o pronto?"'
    status: rascunho
    publico: false
  - id: pb_feat_ent_s0
    resumo: Toda feature nasce de uma necessidade ou de uma oportunidade. Antes de pensar no que construir, entenda o porquê e verifique se já não existe algo que possa ser reutilizado. Em uma empresa, confirme também se a iniciativa está dentro dos objetivos reais, considerando os OKRs e os KPIs.
    perguntas_chave:
      - '"Esta demanda nasce de uma necessidade ou de uma oportunidade?"'
      - '"Já existe algo que possamos reutilizar ou adaptar?"'
      - '"Qual OKR e qual KPI esta iniciativa move?"'
      - '"Quem se beneficia e em que contexto?"'
    fazer:
      - Registre se é necessidade ou oportunidade e quem a trouxe
      - Pesquise o que já existe antes de propor algo novo
      - Confirme o OKR e o KPI que a iniciativa move
      - Liste as pessoas que se beneficiam
    evitar:
      - Pular o porquê e ir direto para a solução
      - Ignorar o que já existe e poderia ser reutilizado
      - Seguir sem alinhar a iniciativa aos objetivos da empresa
    status: rascunho
    publico: false
  - id: pb_feat_ent_t1
    resumo: "Registrar a necessidade ou oportunidade no formato que o time usa. O modelo de trabalho do time define o formato: PRD, documento de visão, termo de abertura, plano de negócio ou card no fluxo."
    perguntas_chave:
      - '"É necessidade de usuário, oportunidade de negócio, objetivo estratégico, exigência regulatória ou melhoria interna?"'
      - '"Qual time vai atender e qual é o modelo de trabalho dele?"'
      - '"Há um segundo modelo envolvido, como um time de dados apoiando um time de produto?"'
      - '"Quanto já sabemos: a incerteza é baixa, média ou alta?"'
      - '"Qual formato de registro esse time usa e lê?"'
    fazer:
      - Registre quem trouxe a demanda e a origem dela
      - Classifique o modelo de trabalho e a incerteza no próprio registro
      - Use o formato que o time já lê; o card no fluxo aponta para o documento quando houver
    evitar:
      - Escrever um documento longo para uma demanda de baixa incerteza
      - Seguir com a demanda só na conversa, sem registro
    exemplo: "Oportunidade de negócio, time de produto com PM apoiado pelo time de dados, incerteza média: PRD curto e card no fluxo do time."
    status: rascunho
    publico: false
  - id: pb_feat_ent_t2
    resumo: "Antes de propor algo novo, procure o que já existe: serviços, componentes, bibliotecas, dados e decisões anteriores. Reutilizar reduz custo, prazo e risco."
    perguntas_chave:
      - '"Algum time já resolveu algo parecido?"'
      - '"Existe serviço, componente ou dado que atende parte da necessidade?"'
      - '"Por que a solução existente não foi usada até agora?"'
      - '"Adaptar o que existe custa menos que construir?"'
    fazer:
      - Pesquise no catálogo de serviços e nas decisões registradas
      - Confirme o encaixe com quem conhece cada solução
      - Classifique o resultado como atende, parcial ou não existe
    evitar:
      - Concluir que nada serve sem perguntar a quem conhece
      - Copiar uma solução sem entender os limites dela
    exemplo: O componente de cupom atende 70% da necessidade; a regra por histórico de compra é a única parte nova.
    status: rascunho
    publico: false
  - id: pb_feat_ent_g1
    resumo: Se uma solução existente atende por completo, a raia termina com «reutilizar_existente». Se atende em parte, o que existe entra como restrição e o entendimento continua.
    perguntas_chave:
      - '"A solução existente atende a necessidade inteira ou só uma parte?"'
      - '"O dono da solução concorda com o novo uso?"'
    exemplo: "Atende em parte: o componente de cupom entra como base, e a regra por histórico vira o escopo novo."
    status: rascunho
    publico: false
  - id: pb_feat_ent_t3
    resumo: O PM traz o porquê; o engenheiro garante que o porquê vira resultado verificável. As subtarefas mudam conforme a origem e a incerteza da demanda.
    perguntas_chave:
      - '"Qual resultado de negócio ou de usuário muda, e como saberemos?"'
      - '"Quem pede, quem usa, quem decide, quem opera e quem é afetado?"'
      - '"Qual OKR e qual KPI a iniciativa move, e qual a meta?"'
      - '"Qual o custo de adiar?"'
      - '"Quais restrições já são conhecidas: prazo, compliance, custo?"'
    fazer:
      - Escreva o objetivo como "queremos [resultado] medido por [métrica]"
      - Execute só as subtarefas que a origem e a incerteza pedem
    evitar:
      - Pular direto para a solução técnica
      - Aceitar "precisa ser rápido" sem número
      - Ignorar custo como requisito
    exemplo: Queremos aumentar a recompra em 30 dias de 18% para 20%, medida pelo painel de recompra, até o fim do trimestre.
    status: rascunho
    publico: false
  - id: pb_feat_ent_g2
    resumo: Uma iniciativa que não move um objetivo atual do demandante volta a ele com o motivo registrado. Isso protege o foco do time e deixa a porta aberta para o futuro.
    perguntas_chave:
      - '"Qual KR ou KPI esta iniciativa move de forma mensurável?"'
      - '"Existe uma exigência regulatória que torna a iniciativa obrigatória mesmo sem OKR?"'
    exemplo: "Exigência regulatória sem OKR associado: segue como alinhada, porque cumprir a regra é objetivo do demandante."
    status: rascunho
    publico: false
  - id: pb_feat_ent_t4
    resumo: Validar o entendimento com os interessados antes de levantar requisitos evita retrabalho. A validação termina com uma aprovação registrada e o time avisado.
    perguntas_chave:
      - '"Os interessados reconhecem a necessidade como foi escrita?"'
      - '"A métrica de sucesso é a que eles vão acompanhar?"'
    fazer:
      - Faça uma revisão curta e registre a aprovação no registro da necessidade
      - Avise o time com o link do registro e o próximo passo
    evitar:
      - Seguir com aprovação só verbal
    exemplo: Aprovação registrada pelo PM e pela liderança comercial; mensagem publicada no canal do time.
    status: rascunho
    publico: false
  - id: pb_feat_ent_e1
    resumo: "Retorno «necessidade_entendida»: a necessidade está registrada no formato do time, com interessados, métricas de sucesso, modelo de trabalho e incerteza. Esses itens são a entrada do levantamento de requisitos."
    perguntas_chave:
      - '"O objetivo está escrito como resultado medido por uma métrica?"'
      - '"O registro diz qual modelo de trabalho e qual incerteza orientam os próximos passos?"'
    status: rascunho
    publico: false
  - id: pb_feat_ent_e2
    resumo: "Retorno «reutilizar_existente»: o levantamento de reuso mostrou uma solução que atende por completo."
    perguntas_chave:
      - '"O levantamento registra a solução escolhida e o dono dela?"'
    status: rascunho
    publico: false
  - id: pb_feat_ent_e3
    resumo: "Retorno «fora_dos_objetivos»: a iniciativa não está alinhada aos OKRs e KPIs atuais e volta ao demandante com o motivo."
    perguntas_chave:
      - '"O motivo está registrado de forma que o demandante entenda?"'
    status: rascunho
    publico: false
  - id: pb_feat_cls_s0
    resumo: "Início da raia Classificação e escopo dos requisitos. Responsabilidade: classificar os requisitos para delimitar o escopo."
    perguntas_chave:
      - '"O requisito já está claro o bastante para ser classificado?"'
    status: rascunho
    publico: false
  - id: pb_feat_cls_t1
    exemplo: 15 requisitos classificados, 4 fora do escopo registrados para a próxima iteração.
    resumo: Classificar mostra o que é comportamento, o que é qualidade e o que é limite. Priorizar e registrar o que fica fora protege o prazo e o foco.
    perguntas_chave:
      - '"Cada requisito é funcional, não funcional, restrição ou inverso?"'
      - '"O que precisa entrar agora e o que pode esperar?"'
      - '"O que fica fora do escopo está escrito e combinado?"'
    fazer:
      - "Funcional: o que o sistema deve fazer"
      - "NFR: performance, segurança, escalabilidade, custo"
      - "Restrição: tecnologia, prazo, compliance"
      - "Inverso: o que NÃO deve acontecer (tão importante quanto)"
    evitar:
      - Tratar requisito não funcional como detalhe de implementação
      - Escopo aberto sem a lista do que fica fora
    tecnicas:
      - tec_requisitos_funcionais
      - tec_requisitos_n_o_funcionais
      - tec_moscow
    status: rascunho
    publico: false
  - id: pb_feat_cls_c1
    resumo: Chama a raia Prontidão (Definition of Ready) logo depois de classificar e delimitar o escopo. Costuma ser uma confirmação rápida com o time; quando falta algo, a própria raia de prontidão refina até atender.
    perguntas_chave:
      - '"O time puxaria este item hoje sem perguntas pendentes?"'
    fazer:
      - "Retorno possível: pronto_para_iniciar"
    status: rascunho
    publico: false
  - id: pb_feat_cls_e1
    resumo: "Retorno «pronto_para_especificar» da raia Classificação, escopo e prontidão: requisitos classificados em funcional, NFR, restrição e inverso, escopo delimitado e Definition of Ready confirmada. Quem chamou a raia segue por este retorno."
    perguntas_chave:
      - '"Algum NFR ou restrição ficou de fora da classificação?"'
    status: rascunho
    publico: false
