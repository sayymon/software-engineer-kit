      - origem_da_demanda
      - nivel_de_incerteza
      - levantamento_de_reuso
    saidas:
      - mapa_de_interessados
      - mapa_de_impacto
      - caso_de_negocio
      - metricas_de_sucesso
      - alinhada_aos_objetivos
      - registro_da_necessidade
      - precisa_de_experimento
    subtarefas:
      - id: feat_ent_t3_st1
        rotulo: Mapear os interessados
        papel: pm
        entradas:
          - registro_da_necessidade
        saidas:
          - mapa_de_interessados
        tecnicas:
          - tecnica: tec_mapa_de_interessados
            uso: obrigatoria
            porque: quem pede, usa, decide, opera e é afetado define as validações e as prioridades
        exemplo: "Pede: liderança comercial. Usa: compradores recorrentes. Decide: PM. Opera: time de pagamentos. Afetado: atendimento."
        status: rascunho
      - id: feat_ent_t3_st2
        rotulo: Entender o trabalho que o usuário quer realizar
        papel: pm
        apoio:
          - designer
        quando:
          todos:
            - var: origem_da_demanda
              igual: necessidade_de_usuario
        porque: necessidade vinda de usuário pede entender o objetivo dele antes da solução
        entradas:
          - registro_da_necessidade
          - nivel_de_incerteza
        saidas:
          - registro_da_necessidade
        tecnicas:
          - tecnica: tec_jobs_to_be_done
            uso: obrigatoria
            porque: descreve o resultado que o usuário busca, sem amarrar a solução
          - tecnica: tec_x5_whys
            uso: condicional
            quando:
              todos:
                - var: nivel_de_incerteza
                  igual: alta
            porque: com incerteza alta, perguntar por que algumas vezes chega à necessidade real por trás do pedido
        exemplo: Quando compro de novo do mesmo criador, quero reaproveitar meus dados de pagamento para concluir em menos de um minuto.
        status: rascunho
      - id: feat_ent_t3_st3
        rotulo: Ligar a entrega ao impacto esperado
        papel: pm
        apoio:
          - tech_lead
        quando:
          todos:
            - var: nivel_de_incerteza
              em:
                - media
                - alta
        porque: com incerteza média ou alta, o mapa evita construir algo que não move o resultado
        entradas:
          - mapa_de_interessados
        saidas:
          - mapa_de_impacto
        tecnicas:
          - tecnica: tec_impact_mapping
            uso: obrigatoria
            porque: liga objetivo, atores, impactos e entregas em um único desenho
        exemplo: "Objetivo: mais recompra. Ator: comprador recorrente. Impacto: concluir mais rápido. Entrega: pagamento em um clique."
        status: rascunho
      - id: feat_ent_t3_st4
        rotulo: Montar o caso de negócio
        papel: pm
        apoio:
          - stakeholder
        quando:
          todos:
            - var: origem_da_demanda
              igual: oportunidade_de_negocio
        porque: oportunidade de negócio só segue com retorno esperado e custo estimado
        entradas:
          - registro_da_necessidade
          - levantamento_de_reuso
        saidas:
          - caso_de_negocio
        tecnicas:
          - tecnica: tec_caso_de_negocio
            uso: obrigatoria
            porque: compara retorno, custo, risco e custo de adiar
        exemplo: "Retorno estimado: mais 4% de recompra em 6 meses. Custo: 2 sprints. Custo de adiar: perder a campanha do próximo trimestre."
        status: rascunho
      - id: feat_ent_t3_st5
        rotulo: Definir as métricas de sucesso e o OKR e o KPI
        papel: pm
        apoio:
          - stakeholder
        entradas:
          - registro_da_necessidade
        saidas:
          - metricas_de_sucesso
          - alinhada_aos_objetivos
          - precisa_de_experimento
        tecnicas:
          - tecnica: tec_okrs
            uso: obrigatoria
            porque: a iniciativa precisa mover um objetivo real da empresa
        exemplo: "Move o KR de recompra do trimestre. KPI: taxa de recompra em 30 dias, de 18% para 20%."
        status: rascunho
    playbook: pb_feat_ent_t3
    layout:
      coluna: 4
    status: rascunho
    publico: false
