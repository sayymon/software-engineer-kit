  - id: feat_ent_t1
    raia: feat_ent
    tipo: tarefa
    rotulo: Registrar a necessidade ou oportunidade
    condicao: ""
    proximo:
      - para: feat_ent_t2
        condicao: ""
    estado: {}
    saidas:
      - registro_da_necessidade
      - origem_da_demanda
      - modelo_de_trabalho
      - modelo_de_trabalho_complementar
      - nivel_de_incerteza
      - tipo_de_feature
    subtarefas:
      - id: feat_ent_t1_st1
        rotulo: Abrir o registro com a origem e quem traz a demanda
        papel: pm
        saidas:
          - registro_da_necessidade
          - origem_da_demanda
        exemplo: "Registro aberto: oportunidade de negócio trazida pela liderança comercial, aumentar a conversão de compradores recorrentes."
        status: rascunho
      - id: feat_ent_t1_st2
        rotulo: Classificar o modelo de trabalho e a incerteza
        papel: pm
        apoio:
          - tech_lead
        entradas:
          - registro_da_necessidade
        saidas:
          - registro_da_necessidade
          - modelo_de_trabalho
          - modelo_de_trabalho_complementar
          - nivel_de_incerteza
          - tipo_de_feature
        exemplo: Time de produto com PM, apoio do time de dados; incerteza média, porque o público é conhecido e a solução não; tipo melhoria_funcional.
        status: rascunho
      - id: feat_ent_t1_st3
        rotulo: Escolher o formato do registro conforme o modelo do time
        papel: pm
        entradas:
          - registro_da_necessidade
          - modelo_de_trabalho
          - modelo_de_trabalho_complementar
          - origem_da_demanda
        saidas:
          - registro_da_necessidade
        tecnicas:
          - tecnica: tec_design_docs
            uso: condicional
            quando:
              algum:
                - var: modelo_de_trabalho
                  em:
                    - plataforma
                    - dados
                - var: modelo_de_trabalho_complementar
                  em:
                    - plataforma
                    - dados
            porque: times de plataforma e de dados registram a necessidade como documento de visão
          - tecnica: tec_caso_de_negocio
            uso: condicional
            quando:
              todos:
                - var: origem_da_demanda
                  igual: oportunidade_de_negocio
            porque: oportunidade de negócio precisa de retorno esperado e custo estimado antes de seguir
        exemplo: Como é time de produto com PM, o registro vira um PRD curto; o card no fluxo do time aponta para ele.
        status: rascunho
    playbook: pb_feat_ent_t1
    layout:
      coluna: 1
    status: rascunho
    publico: false
  - id: feat_ent_t2
    raia: feat_ent
