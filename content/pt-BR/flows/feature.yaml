          - tecnica: tec_bdd_gherkin
            uso: recomendada
            porque: exemplos concretos deixam o comportamento sem ambiguidade
        exemplo: Dado um comprador com 2 compras, quando aplica o cupom, então o desconto aparece no total.
        status: rascunho
      - id: feat_lev_t2_st4
        rotulo: Definir a Definition of Done mínima
        papel: tech_lead
        apoio:
          - qa
          - devsecops
        saidas:
          - definition_of_done
        exemplo: "Pronto quando: critérios de aceite atendidos, gates de qualidade e segurança aprovados, requisitos funcionais e não funcionais cobertos por testes."
        status: rascunho
