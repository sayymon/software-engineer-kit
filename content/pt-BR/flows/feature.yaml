        rotulo: Desenhar a arquitetura em contexto, contêineres e componentes
        papel: arquiteto
        saidas:
          - diagrama_de_arquitetura
        tecnicas:
          - tecnica: tec_modelo_c4
            uso: recomendada
            porque: níveis de zoom deixam a arquitetura legível para cada público
        exemplo: "Contêineres: API de promoções, consumidor de eventos de pedidos, cache de histórico."
        status: rascunho
      - id: feat_spc_t4_st2
        rotulo: Desenhar os diagramas de sequência dos fluxos principais
        papel: arquiteto
        apoio:
          - dev
        saidas:
          - diagrama_de_sequencia
        tecnicas:
          - tecnica: tec_uml_sequencia
            uso: obrigatoria
            porque: mostra a ordem das chamadas, os tempos e os pontos de falha
        exemplo: "Sequência: checkout chama promoções, promoções lê o cache de histórico e devolve o desconto."
        status: rascunho
      - id: feat_spc_t4_st3
        rotulo: Definir modelos de dados e contratos de integração
        papel: arquiteto
        apoio:
          - engenheiro_de_dados
        saidas:
          - design_md
          - tem_integracao
          - expoe_interface_externa
        tecnicas:
          - tecnica: tec_contract_testing
            uso: condicional
            quando:
              todos:
                - var: tem_integracao
                  igual: sim
            porque: contratos definidos aqui viram testes de contrato
        exemplo: "Contrato: POST /cupons/validar com comprador, carrinho e código; resposta com desconto ou motivo."
        status: rascunho
      - id: feat_spc_t4_st4
        rotulo: Definir tecnologias, stack e estrutura do projeto
        papel: arquiteto
        apoio:
          - tech_lead
        saidas:
          - visao_de_tecnologia
        exemplo: Mesmo stack do contexto de Promoções; novo módulo de elegibilidade com camadas de domínio e aplicação.
        status: rascunho
      - id: feat_spc_t4_st5
        rotulo: Definir padrões de projeto e boas práticas
        papel: arquiteto
        apoio:
          - dev
        saidas:
          - visao_de_tecnologia
          - design_md
        tecnicas:
          - tecnica: tec_padroes_de_projeto
            uso: recomendada
            porque: padrões conhecidos reduzem decisões repetidas e revisões longas
        exemplo: Strategy para regras de elegibilidade; repositório para o histórico; idempotência no consumidor.
        status: rascunho
      - id: feat_spc_t4_st6
        rotulo: Consolidar a visão arquitetural no design.md
        papel: arquiteto
        entradas:
          - diagrama_de_arquitetura
          - diagrama_de_sequencia
          - visao_de_tecnologia
        saidas:
          - design_md
          - risco_de_liberacao
        tecnicas:
          - tecnica: tec_design_docs
            uso: obrigatoria
            porque: um único documento permite decompor a arquitetura em tarefas
        exemplo: design.md com contexto, diagramas, contratos, dados, stack, padrões, riscos e alternativas.
        status: rascunho
