  - id: feat_spc_t1
    raia: feat_spc
    tipo: tarefa
    rotulo: Especificar o requisito probabilístico (IA)
    condicao: ""
    proximo:
      - para: feat_spc_t2
        condicao: ""
    estado:
      usa_ia: sim
    entradas:
      - requisitos_classificados
    saidas:
      - requisitos_de_ia
    subtarefas:
      - id: feat_spc_t1_st1
        rotulo: Definir os casos de avaliação e o limiar de aceite
        papel: qa
        apoio:
          - pm
        saidas:
          - requisitos_de_ia
        tecnicas:
          - tecnica: tec_evals
            uso: obrigatoria
            porque: saída probabilística pede casos de avaliação no lugar de asserts exatos
        exemplo: 50 casos de sugestão de cupom, 10 de borda; aceite quando 90% das sugestões forem válidas.
        status: rascunho
      - id: feat_spc_t1_st2
        rotulo: Definir o orçamento de custo por chamada e o plano B
        papel: arquiteto
        saidas:
          - requisitos_de_ia
        exemplo: Teto de custo por chamada e regra fixa de fallback se o modelo cair ou passar do teto.
        status: rascunho
      - id: feat_spc_t1_st3
        rotulo: Mapear alucinação e dependência de fornecedor do modelo
        papel: arquiteto
        apoio:
          - devsecops
        saidas:
          - requisitos_de_ia
        exemplo: "Risco: sugerir cupom inexistente. Mitigação: validar contra o catálogo antes de exibir."
        status: rascunho
    playbook: pb_feat_spc_t1
    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: feat_spc_t2
    raia: feat_spc
    tipo: tarefa
    rotulo: Escrever o requirements.md
    condicao: ""
    proximo:
      - para: feat_spc_t3
        condicao: ""
    estado: {}
    entradas:
      - requisitos_classificados
      - criterios_de_aceite
      - registro_da_necessidade
      - requisitos_de_ia
    saidas:
      - requirements_md
      - muda_jornada
      - tem_requisito_de_performance
    subtarefas:
      - id: feat_spc_t2_st1
        rotulo: Escrever as histórias e os critérios de aceite em EARS
        papel: pm
        apoio:
          - qa
        saidas:
          - requirements_md
          - muda_jornada
        tecnicas:
          - tecnica: tec_criterios_aceitacao
            uso: obrigatoria
            porque: critério verificável é a base dos testes e da delegação
          - tecnica: tec_bdd_gherkin
            uso: opcional
            porque: cenários ajudam quando o critério é comportamental
        exemplo: WHEN o comprador recorrente aplica o cupom THE sistema SHALL validar o histórico em até 300 ms.
        status: rascunho
      - id: feat_spc_t2_st2
        rotulo: Registrar os requisitos não funcionais com metas
        papel: arquiteto
        saidas:
          - requirements_md
          - tem_requisito_de_performance
        tecnicas:
          - tecnica: tec_requisitos_n_o_funcionais
            uso: obrigatoria
            porque: desempenho, segurança e disponibilidade precisam de metas numéricas
        exemplo: p95 abaixo de 300 ms com 500 requisições por segundo; disponibilidade de 99,9%.
        status: rascunho
      - id: feat_spc_t2_st3
        rotulo: Incluir o requisito probabilístico
        papel: pm
        apoio:
          - arquiteto
        quando:
          todos:
            - var: usa_ia
              igual: sim
        porque: só features com IA têm requisito probabilístico
        entradas:
          - requisitos_de_ia
        saidas:
          - requirements_md
        exemplo: Seção de requisitos de IA com os casos de avaliação, o limiar e o teto de custo.
        status: rascunho
      - id: feat_spc_t2_st4
        rotulo: Revisar o requirements.md com os interessados
        papel: pm
        apoio:
          - stakeholder
        entradas:
          - requirements_md
        saidas:
          - requirements_md
        exemplo: Revisão de 30 minutos com o PM e a liderança comercial; dois critérios ajustados.
        status: rascunho
    playbook: pb_feat_spc_t2
    layout:
      coluna: 3
    status: rascunho
    publico: false
  - id: feat_spc_t3
    raia: feat_spc
    tipo: tarefa
    rotulo: Modelar o domínio com DDD
    condicao: ""
    proximo:
      - para: feat_spc_t4
        condicao: ""
    estado: {}
    entradas:
      - requirements_md
    saidas:
      - modelo_de_dominio
      - mapa_de_contextos
    subtarefas:
      - id: feat_spc_t3_st1
        rotulo: Descobrir eventos, comandos e regras do domínio
        papel: arquiteto
        apoio:
          - pm
          - dev
        quando:
          todos:
            - var: nivel_de_incerteza
              em:
                - media
                - alta
        porque: com incerteza média ou alta, descobrir o domínio com quem o conhece evita modelos errados
        saidas:
          - modelo_de_dominio
        tecnicas:
          - tecnica: tec_event_storming
            uso: obrigatoria
            porque: revela eventos, regras e fronteiras do domínio em uma sessão
        exemplo: "Eventos: CupomAplicado, HistoricoConsultado, CupomRecusado. Regra: só compradores com 2 compras."
        status: rascunho
      - id: feat_spc_t3_st2
        rotulo: Delimitar os contextos e a linguagem ubíqua
        papel: arquiteto
        saidas:
          - mapa_de_contextos
          - modelo_de_dominio
        tecnicas:
          - tecnica: tec_ddd_estrategico
            uso: obrigatoria
            porque: contextos delimitados definem módulos e donos
        exemplo: "Contextos: Promoções (dono do cupom) e Pedidos (dono do histórico). Termo único: comprador recorrente."
        status: rascunho
      - id: feat_spc_t3_st3
        rotulo: Mapear módulos e integrações entre contextos
        papel: arquiteto
        apoio:
          - tech_lead
        saidas:
          - mapa_de_contextos
        tecnicas:
          - tecnica: tec_ddd_estrategico
            uso: obrigatoria
            porque: o mapa de contextos mostra quem depende de quem e como
        exemplo: Promoções consome eventos de Pedidos por mensageria; não há chamada síncrona entre os contextos.
        status: rascunho
    playbook: pb_feat_spc_t3
    layout:
      coluna: 4
    status: rascunho
    publico: false
  - id: feat_spc_t4
    raia: feat_spc
    tipo: tarefa
    rotulo: Desenhar a arquitetura no design.md
    condicao: ""
    proximo:
