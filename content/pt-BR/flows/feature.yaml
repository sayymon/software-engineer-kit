        rotulo: Pesquisar soluções, componentes e serviços existentes
        papel: arquiteto
        apoio:
          - dev
        entradas:
          - registro_da_necessidade
        saidas:
          - levantamento_de_reuso
        exemplo: "Encontrados: um serviço de recomendação já usado na vitrine e um componente de cupom que aceita regras por público."
        status: rascunho
      - id: feat_ent_t2_st2
        rotulo: Avaliar o encaixe com quem conhece cada solução
        papel: arquiteto
        apoio:
          - tech_lead
        entradas:
          - levantamento_de_reuso
        saidas:
          - levantamento_de_reuso
          - existe_solucao_reutilizavel
        tecnicas:
          - tecnica: tec_adrs
            uso: recomendada
            porque: decisões anteriores explicam limites e escolhas das soluções existentes
        exemplo: "O componente de cupom atende 70% da necessidade; falta a regra por histórico de compra. Resultado: parcial."
        status: rascunho
    playbook: pb_feat_ent_t2
    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: feat_ent_g1
    raia: feat_ent
    tipo: bifurcacao
    rotulo: Já existe solução que atende?
    condicao: Já existe solução que atende a necessidade?
    proximo:
      - para: feat_ent_e2
        condicao: atende por completo
      - para: feat_ent_t3
        condicao: atende em parte ou não existe
    estado:
      existe_solucao_reutilizavel: atende
    entradas:
      - existe_solucao_reutilizavel
      - levantamento_de_reuso
    papel: arquiteto
    apoio:
      - pm
    consultado:
      - tech_lead
    playbook: pb_feat_ent_g1
    layout:
      coluna: 3
    status: rascunho
    publico: false
  - id: feat_ent_t3
    raia: feat_ent
    tipo: tarefa
    rotulo: Entender interessados, impacto e resultados
    condicao: ""
    proximo:
