id: feature
tipo: demanda
nome: Feature
sigla: feat
publico: false
raias:
  - id: feat_orq
    nome: Orquestração da feature
    demanda: feature
    responsabilidade: Conduzir a feature da necessidade percebida à entrega monitorada, delegando cada etapa a uma raia
    cor: "#607D8B"
    orquestradora: true
    status: rascunho
    publico: false
  - id: feat_ent
    nome: Entendimento da necessidade e contexto
    demanda: feature
    responsabilidade: Entender a necessidade ou oportunidade e o contexto em que ela surge
    cor: "#332288"
    status: rascunho
    publico: false
    entradas:
      - resultado_da_validacao
  - id: feat_lev
    nome: Levantamento e enriquecimento de requisitos
    demanda: feature
    responsabilidade: Levantar os requisitos e enriquecê-los até ficarem claros e completos
    cor: "#117733"
    status: rascunho
    publico: false
    entradas:
      - registro_da_necessidade
      - mapa_de_interessados
      - metricas_de_sucesso
      - origem_da_demanda
      - nivel_de_incerteza
      - mapa_de_impacto
      - caso_de_negocio
  - id: feat_cls
    nome: Classificação, escopo e prontidão
    demanda: feature
    responsabilidade: Classificar os requisitos, delimitar o escopo e confirmar a Definition of Ready antes de especificar
    cor: "#CC6677"
    status: rascunho
    publico: false
    entradas:
      - requisitos_levantados
      - historias_refinadas
      - contrato_funcional_e_tecnico
      - tipo_de_feature
  - id: feat_spc
    nome: "Especificação (SDD): requirements e design"
    demanda: feature
    responsabilidade: Escrever o requirements.md e o design.md com DDD, diagramas de arquitetura e de sequência, stack, padrões e ADRs aprovados com os stakeholders
    cor: "#44AA99"
    status: rascunho
    publico: false
    entradas:
      - requisitos_classificados
      - criterios_de_aceite
      - registro_da_necessidade
      - historias_refinadas
      - contrato_funcional_e_tecnico
      - escopo_da_feature
  - id: feat_alo
    nome: Decomposição e mapeamento de tarefas
    demanda: feature
    responsabilidade: Decompor o design em tarefas, mapear as dependências e os papéis necessários para cada uma
    cor: "#0072B2"
    entradas:
      - spec_pronta
      - requirements_md
      - design_md
      - adrs_da_feature
      - requisitos_classificados
      - criterios_de_aceite
      - usa_ia
      - tem_integracao
      - ajuste_da_spec
      - cards_da_feature
    status: rascunho
    publico: false
  - id: feat_ite
    nome: Análise da reprovação e iteração
    demanda: feature
    responsabilidade: Encontrar a causa de uma reprovação e devolvê-la à spec ou à implementação
    cor: "#CC79A7"
    status: rascunho
    publico: false
