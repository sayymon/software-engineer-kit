  - id: feat_lev_t1
    raia: feat_lev
    tipo: tarefa
    rotulo: Elicitar com as técnicas que o contexto pede
    condicao: ""
    proximo:
      - para: feat_lev_g1
        condicao: ""
    estado: {}
    entradas:
      - registro_da_necessidade
      - mapa_de_interessados
      - origem_da_demanda
      - nivel_de_incerteza
      - mapa_de_impacto
      - caso_de_negocio
    saidas:
      - requisitos_levantados
      - tipo_de_contexto
      - tem_muitos_dependentes
      - complexidade_do_fluxo
      - existe_processo_atual
      - ha_dados_disponiveis
    subtarefas:
      - id: feat_lev_t1_st1
        rotulo: Classificar o contexto da elicitação
        papel: pm
        apoio:
          - arquiteto
        saidas:
          - requisitos_levantados
          - tipo_de_contexto
          - tem_muitos_dependentes
          - complexidade_do_fluxo
          - existe_processo_atual
          - ha_dados_disponiveis
        exemplo: Contexto core, 4 sistemas dependentes, fluxo com variações por meio de pagamento, processo atual manual, dados de compra disponíveis.
        status: rascunho
      - id: feat_lev_t1_st2
        rotulo: Chegar à necessidade real com 5 porquês
        papel: pm
        quando:
          todos:
            - var: nivel_de_incerteza
              igual: alta
        porque: com incerteza alta, o pedido inicial raramente é a necessidade real
        saidas:
          - requisitos_levantados
        tecnicas:
          - tecnica: tec_x5_whys
            uso: obrigatoria
            porque: perguntar por que algumas vezes chega à causa por trás do pedido
        exemplo: "Pedido: cupom para recorrentes. Por quê? Recompra caiu. Por quê? Checkout longo para quem já comprou."
        status: rascunho
      - id: feat_lev_t1_st3
        rotulo: Mapear os impactos entre sistemas
        papel: arquiteto
        apoio:
          - pm
        quando:
          todos:
            - var: tem_muitos_dependentes
              igual: sim
            - var: tipo_de_contexto
              igual: core
        porque: em contexto core com muitos sistemas dependentes, o mapa evita efeitos colaterais não previstos
        saidas:
          - mapa_de_impacto
          - requisitos_levantados
        tecnicas:
          - tecnica: tec_impact_mapping
            uso: obrigatoria
            porque: liga objetivo, atores, impactos e entregas, inclusive nos sistemas vizinhos
        exemplo: "Impactos: Pedidos publica evento novo, Pagamentos recalcula total, Atendimento recebe novos motivos de contato."
        status: rascunho
      - id: feat_lev_t1_st4
        rotulo: Mapear o fluxo e as variações com Event Storming
        papel: arquiteto
        apoio:
          - pm
          - dev
        quando:
          todos:
            - var: complexidade_do_fluxo
              em:
                - complexo
                - com_variacoes
        porque: fluxo complexo ou com variações esconde regras que só aparecem quando os eventos são colocados em ordem
        saidas:
          - requisitos_levantados
          - modelo_de_dominio
        tecnicas:
          - tecnica: tec_event_storming
            uso: obrigatoria
            porque: revela eventos, regras, exceções e variações do fluxo em uma sessão
        exemplo: "Variações: cupom com cartão, com boleto e com saldo; boleto vencido devolve o cupom ao comprador."
        status: rascunho
      - id: feat_lev_t1_st5
        rotulo: Entender o trabalho que o usuário quer realizar
        papel: pm
        apoio:
          - designer
        quando:
          todos:
            - var: origem_da_demanda
              igual: necessidade_de_usuario
        porque: necessidade vinda de usuário pede o objetivo dele, não a solução pedida
        saidas:
          - requisitos_levantados
        tecnicas:
          - tecnica: tec_jobs_to_be_done
            uso: obrigatoria
            porque: descreve o resultado que o usuário busca sem amarrar a solução
        exemplo: Quando volto a comprar do mesmo criador, quero concluir sem preencher tudo de novo.
        status: rascunho
      - id: feat_lev_t1_st6
        rotulo: Observar o trabalho real onde ele acontece
        papel: designer
        apoio:
          - pm
        quando:
          todos:
            - var: existe_processo_atual
              igual: sim
        porque: o processo relatado e o processo real costumam ser diferentes
        saidas:
          - requisitos_levantados
        tecnicas:
          - tecnica: tec_gemba_observa_o
            uso: obrigatoria
            porque: observar o uso real revela atalhos, contornos e dores não relatados
        exemplo: Atendimento aplica cupons manualmente por planilha para 30 compradores por dia.
        status: rascunho
      - id: feat_lev_t1_st7
        rotulo: Validar as percepções com dados
        papel: engenheiro_de_dados
        apoio:
          - pm
        quando:
          todos:
            - var: ha_dados_disponiveis
              igual: sim
        porque: dados confirmam ou derrubam o que as entrevistas sugerem
        saidas:
          - requisitos_levantados
        tecnicas:
          - tecnica: tec_an_lise_de_dados
            uso: obrigatoria
            porque: logs, métricas e funis medem o tamanho real da necessidade
        exemplo: "Funil: 38% dos compradores recorrentes abandonam na etapa de pagamento."
        status: rascunho
    playbook: pb_feat_lev_t1
    layout:
      coluna: 1
    status: rascunho
    publico: false
