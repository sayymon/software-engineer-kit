  - id: feat_cls_t1
    raia: feat_cls
    tipo: tarefa
    rotulo: Classificar os requisitos e delimitar o escopo
    condicao: ""
    proximo:
      - para: feat_cls_c1
        condicao: ""
    estado: {}
    playbook: pb_feat_cls_t1
    layout:
      coluna: 1
    status: rascunho
    publico: false
    entradas:
      - requisitos_levantados
      - historias_refinadas
      - contrato_funcional_e_tecnico
      - tipo_de_feature
    saidas:
      - requisitos_classificados
      - escopo_da_feature
      - tem_requisito_de_performance
      - precisa_de_experimento
      - tem_integracao
      - tem_requisito_de_acessibilidade
      - exige_seguranca_reforcada
      - altera_comportamento_existente
    subtarefas:
      - id: feat_cls_t1_st1
        rotulo: Classificar em funcional, não funcional, restrição ou inverso
        papel: pm
        apoio:
          - arquiteto
        saidas:
          - requisitos_classificados
        tecnicas:
          - tecnica: tec_requisitos_funcionais
            uso: recomendada
            porque: o que o sistema faz
          - tecnica: tec_requisitos_n_o_funcionais
            uso: obrigatoria
            porque: "como o sistema se comporta: desempenho, segurança, disponibilidade"
        exemplo: 9 funcionais, 4 não funcionais, 1 restrição (sem dado pessoal fora do país) e 1 inverso (não aplicar cupom em assinatura).
        status: rascunho
      - id: feat_cls_t1_st2
        rotulo: Priorizar os requisitos
        papel: pm
        apoio:
          - stakeholder
        entradas:
          - requisitos_classificados
        saidas:
          - requisitos_classificados
        tecnicas:
          - tecnica: tec_moscow
            uso: recomendada
            porque: separa o que precisa entrar do que pode esperar
          - tecnica: tec_wsjf
            uso: condicional
            quando:
              todos:
                - var: origem_da_demanda
                  igual: oportunidade_de_negocio
            porque: oportunidade de negócio compete por prioridade pelo custo do atraso
          - tecnica: tec_kano_model
            uso: opcional
            porque: mostra o que encanta e o que só evita insatisfação
        exemplo: "Precisa: elegibilidade e recusa com motivo. Deveria: painel. Poderia: notificação. Não agora: relatório."
        status: rascunho
      - id: feat_cls_t1_st3
        rotulo: Registrar o que entra e o que fica fora do escopo
        papel: pm
        apoio:
          - tech_lead
        entradas:
          - requisitos_classificados
        saidas:
          - escopo_da_feature
        exemplo: "Fora do escopo: cupom para assinaturas e relatório, registrados para a próxima iteração."
        status: rascunho
      - id: feat_cls_t1_st4
        rotulo: Derivar as variáveis genéricas dos requisitos no escopo
        descricao: "Os requisitos não funcionais que ficaram no escopo ligam as variáveis que as raias comuns leem, e o tipo de feature serve de ponto de partida: performance sugere tem_requisito_de_performance; experimento sugere precisa_de_experimento; integracao sugere tem_integracao; acessibilidade sugere tem_requisito_de_acessibilidade; seguranca sugere exige_seguranca_reforcada; melhoria_funcional, performance e acessibilidade sugerem altera_comportamento_existente. Vale o que os requisitos mostram; a spec confirma."
        porque: mantém as raias comuns desacopladas da feature, porque elas leem só as variáveis genéricas e nunca o tipo
        papel: tech_lead
        apoio:
          - pm
          - arquiteto
        entradas:
          - requisitos_classificados
          - escopo_da_feature
          - tipo_de_feature
        saidas:
          - requisitos_classificados
          - tem_requisito_de_performance
          - precisa_de_experimento
          - tem_integracao
          - tem_requisito_de_acessibilidade
          - exige_seguranca_reforcada
          - altera_comportamento_existente
        exemplo: "Tipo melhoria_funcional, mas o escopo traz meta de p95 abaixo de 300 ms: altera_comportamento_existente e tem_requisito_de_performance ficam sim."
        status: rascunho
