          - comunicado_do_incidente
        tecnicas:
          - tecnica: tec_sla
            uso: condicional
            quando:
              todos:
                - var: tem_sla
                  igual: sim
            porque: contratos de SLA costumam ter prazo e canal obrigatórios para avisar o cliente
          - tecnica: tec_comunicacao_incidente
            uso: obrigatoria
            porque: cadência fixa reduz perguntas paralelas ao time
          - tecnica: tec_status_page
