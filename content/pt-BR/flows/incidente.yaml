    subtarefas:
      - id: inc_pos_t1_st1
        rotulo: Reconstruir a linha do tempo com os fatos
        papel: sre
        entradas:
          - linha_do_tempo_do_incidente
        saidas:
          - post_mortem
        tecnicas:
          - tecnica: tec_linha_do_tempo
            uso: obrigatoria
            porque: fatos com horário antes de qualquer opinião
        exemplo: "Linha do tempo completa: deploy, alerta, comando, rollback e estabilização, com horários."
        status: rascunho
      - id: inc_pos_t1_st2
        rotulo: Conduzir a análise sem culpados
        papel: tech_lead
        apoio:
          - sre
          - dev
        entradas:
          - post_mortem
        saidas:
          - post_mortem
        tecnicas:
          - tecnica: tec_blameless_postmortem
            uso: obrigatoria
            porque: pessoas falam do que aconteceu sem medo
          - tecnica: tec_x5_whys
            uso: recomendada
            porque: chega à causa de sistema, não à pessoa
        exemplo: "Causa: cálculo de frete sem flag; detecção boa (2 minutos); rollback demorou 10 minutos por falta de runbook."
        status: rascunho
      - id: inc_pos_t1_st3
        rotulo: Calcular o impacto no SLA e os avisos ou créditos devidos
        papel: sre
        apoio:
          - pm
        quando:
          todos:
            - var: tem_sla
              igual: sim
        porque: o contrato define o que o cliente recebe quando o compromisso é descumprido
        entradas:
          - linha_do_tempo_do_incidente
        saidas:
          - impacto_no_sla
        tecnicas:
          - tecnica: tec_sla
            uso: obrigatoria
            porque: mede o tempo consumido contra o compromisso e os prazos contratuais
        exemplo: 38 minutos consumiram 88% do SLA do mês; sem violação; aviso contratual a 2 parceiros.
        status: rascunho
