  - id: inc_cls_t2
    raia: inc_cls
    tipo: tarefa
    rotulo: "Janela crítica: reavaliar severidade e contenção"
    condicao: ""
    proximo:
      - para: inc_cls_g2
        condicao: ""
    estado:
      janela_critica: sim
      tipo_janela: sazonal|repentina|freeze|manutencao
      severidade: sev1|sev2|sev3
      contencao_restrita: sim
    entradas:
      - severidade
      - janela_critica
      - tipo_janela
      - raio_de_impacto
      - justificativa_da_severidade
    saidas:
      - severidade
      - contencao_restrita
      - justificativa_da_severidade
    subtarefas:
      - id: inc_cls_t2_st1
        exemplo: "É a semana de um grande lançamento de creator: um incidente que seria SEV3 passa a valer no mínimo SEV2 até o fim da janela."
        rotulo: Elevar a severidade mínima da janela
        papel: sre
        apoio:
          - stakeholder
        entradas:
          - severidade
          - tipo_janela
        saidas:
          - severidade
          - justificativa_da_severidade
        tecnicas:
          - tecnica: tec_capacity_planning_sazonal
            uso: opcional
            porque: ajuda a calibrar a severidade mínima nos picos previsíveis
        status: rascunho
      - id: inc_cls_t2_st2
        exemplo: Durante a janela, a reversão do release fica proibida sem aprovação do responsável. A contenção passa a ser desligar a flag da novidade.
        rotulo: Restringir a contenção arriscada
        papel: sre
        apoio:
          - dev
        entradas:
          - severidade
          - raio_de_impacto
          - tipo_janela
        saidas:
          - contencao_restrita
          - justificativa_da_severidade
        tecnicas:
          - tecnica: tec_feature_flags
            uso: recomendada
            porque: desligar por flag evita deploy em plena janela
          - tecnica: tec_canary_release
            uso: condicional
            quando:
              todos:
                - var: janela_critica
                  igual: sim
                - var: tipo_janela
                  em:
                    - sazonal
                    - repentina
            porque: no pico, a mudança de contenção sobe aos poucos para limitar o dano
          - tecnica: tec_code_freeze
            uso: condicional
            quando:
              todos:
                - var: tipo_janela
                  em:
                    - freeze
                    - manutencao
            porque: em freeze ou manutenção, qualquer mudança exige exceção aprovada
        status: rascunho
      - id: inc_cls_t2_st3
        exemplo: 'Na linha do tempo: "14h35, severidade elevada de SEV3 para SEV2 por causa do lançamento em andamento".'
        rotulo: Registrar o motivo na linha do tempo
        papel: sre
        entradas:
          - justificativa_da_severidade
          - severidade
        saidas:
          - justificativa_da_severidade
        tecnicas:
          - tecnica: tec_linha_do_tempo
            uso: recomendada
            porque: quem assume depois entende por que a severidade subiu
        status: rascunho
    playbook: pb_inc_cls_t2
    layout:
      coluna: 3
    status: rascunho
    publico: false
