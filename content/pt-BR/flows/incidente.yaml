  - id: pb_inc_cls_e3
    resumo: "Retorno «sev3» da raia Classificação de severidade: severidade SEV3. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_inc_cmd_s0
    resumo: "Início da raia Comando do incidente. Responsabilidade: definir o comando conforme a estrutura do time e sinalizar a necessidade de escalada."
    status: rascunho
    publico: false
  - id: pb_inc_cmd_g1
    resumo: "SEV3 não pede estrutura de comando nem escalada: o dono do serviço trata com ticket. SEV1 e SEV2 seguem para a definição do comando pela estrutura do time."
    fazer:
      - Use a severidade classificada na etapa anterior
      - "SEV3: registre o ticket e identifique o dono"
      - "SEV1 ou SEV2: escolha a estrutura do time e assuma o comando"
    evitar:
      - Montar estrutura de crise para SEV3
      - Tratar SEV1 ou SEV2 como tarefa de backlog
    status: rascunho
    publico: false
  - evitar:
      - Resolver sem deixar rastro
      - Deixar o ticket sem dono
    fazer:
      - Abra ticket com impacto, sintoma e contorno
      - Identifique o dono do serviço (o aviso sai na etapa de comunicação do SEV3)
      - Defina prazo de correção conforme a classe de serviço
    id: pb_inc_cmd_t1
    publico: false
    resumo: Incidente leve também precisa de dono e registro, sem cerimônia de crise. A comunicação e a contenção do SEV3 acontecem nas raias de comunicação e de contenção que vêm a seguir.
    status: rascunho
    tecnicas:
      - tec_classes_de_servi_o
  - id: pb_inc_cmd_g2
    resumo: Quem comanda o incidente depende de como o time é organizado. Defina isso antes do incidente, não durante.
    perguntas_chave:
      - '"Existe escala de plantão com nome e telefone?"'
      - '"Quem decide quando há conflito sobre o que fazer?"'
    fazer:
      - "Com on-call dedicado e SRE: siga a escala e a política de escalonamento"
      - "Sem on-call formal: o dono do serviço assume e aciona quem mais conhece o sistema"
      - "Time pequeno em horário comercial: o tech lead comanda e o acordo de cobertura fora do horário vale"
      - "Follow-the-sun: o responsável do turno ativo comanda e o comando passa por handoff estruturado entre turnos"
      - "Critério da saída «follow-the-sun (fusos que se revezam)»: time distribuído em fusos horários que se revezam (follow-the-sun, times internacionais)"
    evitar:
      - Descobrir quem manda no meio da crise
      - Depender de uma única pessoa que "sabe tudo"
    tecnicas:
      - tec_incident_command
      - tec_oncall_rotation
      - tec_follow_the_sun
    status: rascunho
    publico: false
  - id: pb_inc_cmd_t2
    resumo: O engenheiro de plantão é o incident commander (IC) por padrão. SRE ou plataforma apoiam com ferramentas e infraestrutura.
    perguntas_chave:
      - '"Quem é o IC e quem é o responsável pela comunicação?"'
      - '"O plantão secundário foi acionado?"'
    fazer:
      - IC coordena e decide, não executa a correção
      - "Separe papéis: IC, executor técnico, comunicação e anotador da linha do tempo"
      - Acione SRE ou plataforma cedo se a causa parece infraestrutura
      - Passe o comando formalmente se o IC cansar (troca declarada)
      - "Passo completo: On-call dedicado: acionar plantão e assumir incident commander"
    evitar:
      - IC mexendo no código ao mesmo tempo que coordena
      - Plantão resolvendo sozinho por orgulho
    tecnicas:
      - tec_incident_command
      - tec_oncall_rotation
      - tec_escalonamento
    status: rascunho
    publico: false
  - id: pb_inc_cmd_t3
    resumo: Sem on-call formal, o time dono do serviço responde. O dono do serviço é o IC, com um backup nomeado.
    perguntas_chave:
      - '"Quem do time conhece melhor este serviço agora?"'
      - '"Quem cobre se o IC ficar indisponível?"'
    fazer:
      - Nomeie IC e um backup na hora, no canal do incidente
      - Chame por contato direto quem mais conhece o sistema
      - Registre a lacuna de cobertura como ação do post-mortem (propor escala formal)
      - "Passo completo: You-build-you-run: dono do serviço assume e monta rodízio informal"
    evitar:
      - Todo mundo investigando sem coordenação
      - Depender de voluntários espontâneos sem registro
    tecnicas:
      - tec_incident_command
      - tec_oncall_rotation
    status: rascunho
    publico: false
  - id: pb_inc_cmd_t4
    resumo: Em time pequeno, o tech lead é o IC e acumula papéis. Fora do horário vale o acordo de cobertura mínima que o time escreveu.
    perguntas_chave:
      - '"Estamos dentro ou fora do horário combinado?"'
      - '"O que o acordo de cobertura prevê para esta severidade?"'
    fazer:
      - "Dentro do horário: IC é o tech lead, com um segundo para comunicação"
      - "Fora do horário: siga o acordo (contato do líder, janela de atendimento, contorno para o cliente)"
      - Para SEV1, acione o contato de emergência combinado, mesmo fora do horário
      - Peça ajuda de times vizinhos mais cedo, pois falta gente para os papéis
      - "Passo completo: Time pequeno em horário comercial: tech lead comanda e aciona cobertura combinada"
    evitar:
      - Prometer cobertura 24x7 que o time não sustenta
      - Esconder o incidente até a manhã seguinte quando a severidade é alta
    tecnicas:
      - tec_incident_command
      - tec_escalonamento
    status: rascunho
    publico: false
  - id: pb_inc_cmd_t5
    resumo: Em follow-the-sun, o responsável do turno ativo é o incident commander. A passagem entre turnos é estruturada e SEV1 não troca de turno sem handoff confirmado.
    perguntas_chave:
      - '"Quem detém o comando agora e até quando?"'
      - '"O próximo turno confirmou o recebimento do handoff?"'
    fazer:
      - O incident commander é o responsável do turno ativo
      - "Handoff estruturado: linha do tempo, hipóteses abertas, ações em andamento, quem assume e janela de passagem sobreposta"
      - Em SEV1, o comando só passa quando o handoff estiver confirmado pelo turno que chega
      - Registre o handoff na linha do tempo do incidente
      - Quem sai fica disponível durante a janela sobreposta
      - "Passo completo: Follow-the-sun: o responsável do turno ativo assume como incident commander e faz handoff estruturado entre turnos (SEV1 não passa de turno sem handoff confirmado)"
    evitar:
      - Passar o incidente por mensagem solta, sem confirmação
      - Sair antes do fim da janela de passagem
      - Deixar duas pessoas achando que comandam
    tecnicas:
      - tec_handoff_de_turno
      - tec_follow_the_sun
      - tec_incident_command
      - tec_linha_do_tempo
    status: rascunho
    publico: false
  - id: pb_inc_cmd_g3
    resumo: "Escalar cedo é cuidado, não fracasso. Defina critérios antes: dependência externa, causa fora do serviço ou tempo sem progresso."
    fazer:
      - Escale se a causa parece estar em plataforma, rede, banco ou fornecedor
      - Escale se o SEV1 passar 30 minutos sem hipótese promissora
      - Com janela crítica ativa, antecipe a escalada (prazo menor, valor a calibrar)
      - "Leve contexto: sintoma, impacto, o que já foi tentado e o que precisa"
      - Com escalada, o fluxo reavalia a severidade em seguida; sem escalada, segue direto para a comunicação e a contenção por severidade
      - "Critério da saída «sim, dependência fora do time ou sem progresso»: sim, causa ou dependência fora do time, ou sem progresso em 30 minutos no SEV1 (com janela_critica = sim, antecipar: sem hipótese promissora em prazo menor, valor a calibrar)"
    evitar:
      - Escalar sem contexto ("não funciona")
      - Esperar a causa ficar óbvia para pedir ajuda
    tecnicas:
      - tec_escalonamento
    status: rascunho
    publico: false
  - id: pb_inc_cmd_e1
    resumo: "Retorno «seguir» da raia Comando do incidente: seguir sem escalada. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_inc_cmd_e2
    resumo: "Retorno «escalar» da raia Comando do incidente: escalar. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_inc_esc_s0
    resumo: "Início da raia Escalada. Responsabilidade: escalar o incidente para outro time ou para a liderança."
    status: rascunho
    publico: false
  - evitar:
      - Transferir o incidente inteiro e sair
      - Culpar o outro time no canal
      - Continuar tentando a mesma mitigação depois da terceira falha
    fazer:
      - Acione pelo canal de plantão do outro time, não por conversa privada
      - Informe severidade, sintoma, impacto, o que já tentou e o que precisa
      - Mantenha o IC original coordenando, com o outro time como executor
      - "Esgotadas 3 tentativas: acione a liderança, considere rollback total ou modo degradado, e defina um novo plano antes de voltar à mitigação"
      - Depois da escalada o contador tentativas_mitigacao volta a 0 e um novo ciclo de até 3 tentativas começa sob o novo plano
    id: pb_inc_esc_t1
    perguntas_chave:
      - '"Qual time é dono da dependência e como acioná-lo?"'
      - '"Quais mitigações já foram tentadas e o que cada uma mostrou?"'
    publico: false
    resumo: Escalar é levar contexto, tentativas e o pedido claro ao dono certo. Quando a escalada vem de 3 tentativas de mitigação esgotadas, ela é obrigatória e a liderança entra no incidente.
    status: rascunho
    tecnicas:
      - tec_escalonamento
      - tec_rollback
      - tec_degradacao_controlada
  - id: pb_inc_esc_e1
    resumo: "Retorno «escalado» da raia Escalada: escalada feita. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_inc_rcl_s0
    resumo: "Início da raia Reavaliação de severidade. Responsabilidade: reavaliar a severidade e dizer se ela mudou."
    status: rascunho
    publico: false
  - id: pb_inc_rcl_t1
    resumo: Depois da escalada ou de nova informação, confirme se a severidade ainda vale. A reclassificação decide se comunicação e contenção se repetem.
    perguntas_chave:
      - '"A severidade ainda é a mesma depois do que aprendemos?"'
      - '"Qual o raio de impacto hoje?"'
    fazer:
      - Registre severidade_anterior e severidade_atual
      - Use a mesma matriz de severidade da classificação inicial
      - Reveja o impacto e, se houver janela crítica, a severidade mínima da janela
      - "Passo completo: Reclassificar a severidade depois da escalada ou de nova informação"
    evitar:
      - Mudar a severidade por pressão de quem comunica
      - Reclassificar sem registrar o motivo
    tecnicas:
      - tec_matriz_severidade
      - tec_blast_radius
    status: rascunho
    publico: false
  - id: pb_inc_rcl_g1
    resumo: Só uma mudança de severidade volta à comunicação e contenção. Sem mudança, o time segue para a mitigação sem repetir o que já foi feito.
    fazer:
      - "Mudou: volte à comunicação e à contenção e execute-as para a nova severidade"
      - "Subiu: aplique contenção adicional e a cadência da severidade maior"
      - "Desceu: ajuste a cadência de atualização e a contenção"
      - "Não mudou: siga direto para a mitigação"
      - "Critério da saída «sim, diferente da severidade anterior»: sim, severidade_atual diferente de severidade_anterior: executar comunicação e contenção da nova severidade (se subiu, contenção adicional; se desceu, reduzir a cadência de atualização)"
      - "Critério da saída «não, igual à severidade anterior»: não, severidade_atual igual a severidade_anterior: seguir direto para a mitigação sem repetir comunicação nem contenção"
    evitar:
      - Repetir comunicado e contenção sem mudança de severidade
      - Rebaixar a severidade sem evidência de queda do impacto
    tecnicas:
      - tec_matriz_severidade
      - tec_comunicacao_incidente
    status: rascunho
    publico: false
  - id: pb_inc_rcl_e1
    resumo: "Retorno «severidade_mudou» da raia Reavaliação de severidade: severidade mudou. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_inc_rcl_e2
    resumo: "Retorno «severidade_mantida» da raia Reavaliação de severidade: severidade mantida. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_inc_com_s0
    resumo: "Início da raia Comunicação por severidade. Responsabilidade: comunicar o incidente na cadência da severidade."
    status: rascunho
    publico: false
  - id: pb_inc_com_g1
    resumo: A severidade decide o tipo de comunicação e de contenção de danos. Este nó é executado na primeira passagem e quando a reclassificação mostra que a severidade mudou.
    perguntas_chave:
      - '"A severidade ainda é a mesma depois do que aprendemos até aqui?"'
      - '"Qual o blast radius (raio de impacto) hoje: quantos clientes, regiões e fluxos?"'
    fazer:
      - "SEV1: war room, incident commander, comunicado a cada 30 minutos, contenção agressiva"
      - "SEV2: atualização a cada 60 minutos, contenção seletiva"
      - "SEV3: aviso ao dono do serviço, contenção só se houver risco de escalada"
      - "Se a severidade subiu: contenção adicional. Se desceu: ajuste a cadência e a contenção"
      - Os três ramos terminam no retorno comunicado; em seguida vêm a contenção por severidade e a mitigação (inc_mit_t1)
      - "Critério da saída «SEV1»: indisponibilidade total, perda de dados ou impacto financeiro ou de segurança relevante"
      - "Critério da saída «SEV2»: degradação importante ou parte dos clientes sem funcionalidade central"
    evitar:
      - Escolher a severidade pelo conforto de quem comunica
      - Aplicar contenção de SEV1 em um SEV3 e gerar ruído sem necessidade
    tecnicas:
      - tec_matriz_severidade
      - tec_blast_radius
    status: rascunho
    publico: false
  - id: pb_inc_com_t1
    resumo: "SEV1 pede coordenação total e comunicação previsível: sala de guerra, comandante e atualizações a cada 30 minutos."
    perguntas_chave:
      - '"Quem é o IC e quem cuida só da comunicação?"'
      - '"O que o cliente e a liderança precisam saber agora?"'
    fazer:
      - Abra a war room (canal e chamada) e nomeie o incident commander
      - Avise execs e suporte de imediato
      - Com janela_critica = sim, antecipe o primeiro comunicado
      - Publique na status page e atualize a cada 30 minutos, mesmo sem novidade
      - "Cada mensagem traz: impacto, estado atual, próxima atualização"
      - Separe o papel de comunicação do papel de quem corrige
      - "Passo completo: SEV1: abrir war room, nomear incident commander e comunicar execs, clientes e status page a cada 30 minutos"
    evitar:
      - Comunicar só quando houver solução
      - Mensagem técnica demais para execs e clientes
      - O IC escrevendo mensagens enquanto coordena
    tecnicas:
      - tec_war_room
      - tec_status_page
      - tec_comunicacao_incidente
      - tec_incident_command
    status: rascunho
    publico: false
  - evitar:
      - Avisar a empresa toda por um impacto parcial
      - Ficar mais de 60 minutos sem atualização
    fazer:
      - Avise suporte e stakeholders afetados
      - Com janela_critica = sim, antecipe o aviso e considere a cadência de SEV1
      - Atualize a cada 60 minutos no canal combinado
      - Escale para o fluxo de SEV1 se o impacto crescer
    id: pb_inc_com_t2
    perguntas_chave:
      - '"Quais times e clientes estão afetados?"'
    publico: false
    resumo: SEV2 pede comunicação dirigida a quem é afetado, com atualização a cada 60 minutos.
    status: rascunho
    tecnicas:
      - tec_comunicacao_incidente
  - evitar:
      - Abrir sala de crise
      - Deixar o dono do serviço sem saber
    fazer:
      - Avise o dono do serviço e o suporte, se houver cliente afetado
      - Registre a comunicação no ticket
    id: pb_inc_com_t3
    publico: false
    resumo: SEV3 pede apenas aviso ao dono do serviço, com rastro no ticket.
    status: rascunho
    tecnicas:
      - tec_comunicacao_incidente
  - id: pb_inc_com_e1
    resumo: "Retorno «comunicado» da raia Comunicação por severidade: comunicação feita. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_inc_con_s0
    resumo: "Início da raia Contenção de danos. Responsabilidade: conter os danos na intensidade da severidade."
    status: rascunho
    publico: false
  - id: pb_inc_con_g1
    resumo: A severidade decide a intensidade da contenção de danos. É o mesmo critério da comunicação, aplicado à contenção.
    fazer:
      - "SEV1: contenção agressiva"
      - "SEV2: contenção seletiva"
      - "SEV3: conter só se houver risco de escalada"
    evitar:
      - Aplicar contenção de SEV1 em um SEV3 e gerar ruído sem necessidade
    status: rascunho
    publico: false
  - id: pb_inc_con_t1
    resumo: Em SEV1 o dano cresce a cada minuto. Contenha de forma agressiva e reversível, antes de diagnosticar a causa.
    perguntas_chave:
      - '"Qual a ação mais rápida e reversível que reduz o blast radius?"'
      - '"Alguma região ou tenant pode ser isolado para proteger o resto?"'
    fazer:
      - Rollback imediato se houve mudança recente
      - Desligue a feature flag ou use o kill switch da funcionalidade suspeita
      - Aplique rate limit ou circuit breaker para proteger dependências
      - Isole o tenant ou a região afetada
      - Congele deploys até o incidente fechar
      - Com janela_critica = sim, evite deploy e prefira feature flag a rollback de grande escopo
      - Registre cada ação e o horário na linha do tempo
      - "Passo completo: SEV1: contenção agressiva (rollback imediato, desligar feature flag, rate limit ou circuit breaker, isolar tenant ou região, congelar deploys)"
    evitar:
      - Esperar a causa raiz para agir
      - Várias contenções ao mesmo tempo sem registro
      - Congelar deploy sem avisar os times
    tecnicas:
      - tec_rollback
      - tec_kill_switch
      - tec_circuit_breaker
      - tec_rate_limiting
      - tec_blast_radius
      - tec_feature_flags
    status: rascunho
    publico: false
  - id: pb_inc_con_t2
    resumo: "Em SEV2 conte com contenção seletiva: reduza o dano sem derrubar o que está funcionando."
    perguntas_chave:
      - '"Qual funcionalidade pode ser desligada ou degradada sem afetar o fluxo central?"'
    fazer:
      - Use feature flag para desligar só o trecho suspeito
      - Com janela_critica = sim, evite deploy na janela e prefira flag a rollback de grande escopo
      - Aplique degradação controlada (por exemplo, esconder recurso secundário)
      - Reavalie a severidade se a contenção não reduzir o impacto
      - "Passo completo: SEV2: contenção seletiva (feature flag e degradação controlada)"
    evitar:
      - Rollback total sem avaliar o custo
      - Deixar o impacto crescer por receio de desligar uma flag
    tecnicas:
      - tec_feature_flags
      - tec_degradacao_controlada
      - tec_blast_radius
    status: rascunho
    publico: false
  - evitar:
      - Contenção agressiva sem necessidade
      - Ignorar sinais de que o impacto está crescendo
    fazer:
      - Avalie o risco de escalada em poucos minutos
      - Se houver risco, use uma contenção simples (flag ou ajuste de limite)
      - Se não houver risco, registre a decisão de não conter
    id: pb_inc_con_t3
    perguntas_chave:
      - '"O problema pode escalar para SEV2 se nada for feito?"'
    publico: false
    resumo: Em SEV3 só contenha se houver risco de o problema crescer. Caso contrário, siga para a mitigação normal.
    status: rascunho
    tecnicas:
      - tec_feature_flags
      - tec_blast_radius
  - id: pb_inc_con_e1
    resumo: "Retorno «contido» da raia Contenção de danos: contenção aplicada. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_inc_mit_s0
    resumo: "Início da raia Mitigação e verificação. Responsabilidade: restaurar o serviço e verificar a estabilidade em até 3 tentativas."
    status: rascunho
    publico: false
  - evitar:
      - Caçar a causa raiz enquanto o cliente continua sem serviço
      - Mudanças em massa sem registro
      - Correção "criativa" em produção sem revisão do IC
    fazer:
      - A contenção de danos por severidade já foi aplicada; aqui você restaura o serviço
      - "Prefira ações reversíveis: rollback, desligar feature flag, failover, aumentar capacidade"
      - Se existe runbook, siga o passo a passo
      - Registre cada ação e o horário na linha do tempo
      - Mude uma coisa por vez para saber o que funcionou
      - Cada mitigação conta como uma tentativa (tentativas_mitigacao); o limite é 3
    id: pb_inc_mit_t1
    perguntas_chave:
      - '"Qual a ação mais rápida e reversível que reduz o impacto?"'
      - '"O runbook cobre este sintoma?"'
    publico: false
    resumo: Mitigar é diminuir o dano agora, mesmo sem entender a causa. A causa raiz pode esperar, o cliente não.
    status: rascunho
    tecnicas:
      - tec_rollback
      - tec_feature_flags
      - tec_runbook
  - id: pb_inc_mit_g1
    resumo: Decide se segue para verificação, volta a diagnosticar ou escala. O limite é de 3 tentativas de mitigação.
    fazer:
      - Confirme pelos indicadores, não pela sensação
      - Cada falha incrementa tentativas_mitigacao antes de avaliar a saída
      - "Falhou e tentativas_mitigacao < 3: diagnostique de novo"
      - "Falhou e tentativas_mitigacao >= 3: escalada obrigatória, acione a liderança e considere rollback total ou modo degradado"
      - "Critério da saída «não e tentativas < 3: diagnosticar de novo»: não funcionou e tentativas_mitigacao < 3: diagnosticar de novo"
      - "Critério da saída «não e tentativas >= 3: escalada obrigatória»: não funcionou e tentativas_mitigacao >= 3 (ou sem hipótese nova antes disso): escalada obrigatória, esgotadas 3 tentativas, acionar liderança, considerar rollback total ou modo degradado"
    evitar:
      - Repetir a mesma ação esperando resultado diferente
    status: rascunho
    publico: false
  - evitar:
      - Declarar resolvido no primeiro verde
      - Confiar só no alerta que parou de disparar
    fazer:
      - Verifique erros, latência e disponibilidade contra o SLO
      - Rode um teste do fluxo crítico (smoke)
      - Observe por uma janela combinada antes de declarar resolvido
    id: pb_inc_mit_t2
    perguntas_chave:
      - '"Os indicadores voltaram ao normal e ficaram?"'
      - '"O fluxo crítico do cliente funciona ponta a ponta?"'
    publico: false
    resumo: Voltar não é o alerta ter sumido. Confirme com indicadores e com um teste do caminho do cliente.
    status: rascunho
    tecnicas:
      - tec_slo_sli
  - evitar:
      - Teoria sem dados
      - Diagnóstico em silêncio, sem atualizar o canal
    fazer:
      - Formule uma hipótese por vez e teste com baixo risco
      - Compare com o último estado saudável conhecido
      - Use observabilidade (logs, métricas, traços) em vez de palpite
      - O contador tentativas_mitigacao já foi incrementado no gateway anterior; use o diagnóstico para a próxima tentativa ser diferente das anteriores
    id: pb_inc_mit_t3
    perguntas_chave:
      - '"O que mudou antes do sintoma?"'
      - '"O que os logs, traços e métricas dizem agora?"'
    publico: false
    resumo: "Diagnóstico a serviço da mitigação: o objetivo é achar a próxima ação, não a causa final."
    status: rascunho
    tecnicas:
      - tec_x5_whys
      - tec_telemetria_padronizada
  - id: pb_inc_mit_g2
    resumo: Gate de estabilidade. Se voltou a degradar, retome a mitigação e mantenha a comunicação ativa.
    fazer:
      - Defina a janela de observação por severidade (por exemplo, 30 a 60 minutos para SEV1)
      - "Se voltou a degradar, conta como tentativa de mitigação: incremente tentativas_mitigacao"
      - Com tentativas_mitigacao < 3, volte à mitigação; com 3 ou mais, escalada obrigatória
      - "Critério da saída «não, voltou a degradar e tentativas < 3»: não, voltou a degradar e tentativas_mitigacao < 3: nova mitigação"
      - "Critério da saída «não, voltou a degradar e tentativas >= 3»: não, voltou a degradar e tentativas_mitigacao >= 3: escalada obrigatória, esgotadas 3 tentativas, acionar liderança, considerar rollback total ou modo degradado"
    evitar:
      - Encerrar o canal cedo demais
    status: rascunho
    publico: false
  - id: pb_inc_mit_e1
    resumo: "Retorno «estavel» da raia Mitigação e verificação: serviço estável. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_inc_mit_e2
    resumo: "Retorno «tentativas_esgotadas» da raia Mitigação e verificação: 3 tentativas esgotadas, escalar. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_inc_enc_s0
    resumo: "Início da raia Encerramento. Responsabilidade: encerrar o incidente com a causa tratada e a resolução comunicada."
    status: rascunho
    publico: false
  - evitar:
      - Deixar a correção provisória virar permanente sem registro
      - Fechar sem dono para a causa raiz
    fazer:
      - Investigue a causa raiz com calma, com dados da linha do tempo
      - Se a correção definitiva é grande, abra tarefa com dono e prazo
      - Mude o estado do incidente para resolvido e avise o canal
    id: pb_inc_enc_t1
    perguntas_chave:
      - '"O contorno é provisório? Quem corrige a causa e quando?"'
    publico: false
    resumo: Com o serviço estável, trate a causa. A correção definitiva pode ser tarefa separada, com prazo.
    status: rascunho
    tecnicas:
      - tec_x5_whys
  - evitar:
      - Silêncio depois que o serviço volta
    fazer:
      - Envie a mensagem de resolução ao mesmo público do aviso inicial
      - Informe quando o post-mortem será publicado
    id: pb_inc_enc_t2
    publico: false
    resumo: "Feche o ciclo com quem foi avisado: o que houve, impacto, estado atual e próximo passo (post-mortem)."
    status: rascunho
    tecnicas:
      - tec_comunicacao_incidente
  - id: pb_inc_enc_e1
    resumo: "Retorno «encerrado» da raia Encerramento: incidente encerrado. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_inc_pos_s0
    resumo: "Início da raia Aprendizado pós-incidente. Responsabilidade: transformar o incidente em aprendizado e ações corretivas."
    status: rascunho
    publico: false
  - evitar:
      - Pular post-mortem de SEV1 por cansaço
    fazer:
      - "SEV1 e SEV2: post-mortem formal em até 5 dias úteis"
      - "SEV3 recorrente: promova a formal"
      - "Orçamento de erro estourado: use como gatilho para priorizar confiabilidade"
    id: pb_inc_pos_g1
    publico: false
    resumo: Post-mortem formal para incidentes de severidade alta ou quando o orçamento de erro foi consumido. Para os leves, um registro curto basta.
    status: rascunho
    tecnicas:
      - tec_error_budget
  - evitar:
      - Procurar "o culpado"
      - Post-mortem sem dados da linha do tempo
      - Reunião só de quem esteve no incidente
    fazer:
      - Monte a linha do tempo com horários reais do canal
      - Faça os 5 porquês até chegar a fatores do sistema
      - Inclua o que deu certo, além do que falhou
      - Publique o documento para quem quiser ler
    id: pb_inc_pos_t1
    perguntas_chave:
      - '"Que condições do sistema permitiram isso?"'
      - '"O que nos surpreendeu?"'
      - '"O que funcionou bem?"'
    publico: false
    resumo: "Aprender sem culpar: o foco é o sistema que permitiu a falha, não a pessoa."
    status: rascunho
    tecnicas:
      - tec_blameless_postmortem
      - tec_x5_whys
      - tec_linha_do_tempo
  - evitar:
      - Ações genéricas ("melhorar monitoramento")
      - Ações sem dono
    fazer:
      - Priorize ações que removem a causa ou detectam mais cedo
      - Registre no backlog com prioridade visível
      - Inclua melhorias de alerta, runbook e cobertura de plantão
      - Ações que previnem uma classe de bug alimentam o fluxo de bug (etapa "Registrar ação preventiva e acompanhar") pela ligação alimenta
    id: pb_inc_pos_t2
    perguntas_chave:
      - '"Quem faz o quê até quando?"'
      - '"Como saberemos que esta ação evitou a repetição?"'
    publico: false
    resumo: Post-mortem sem ação é só história. Cada ação tem dono, prazo e critério de pronto.
    status: rascunho
    tecnicas:
      - tec_acoes_corretivas
      - tec_runbook
  - evitar:
      - Esquecer as ações depois da semana do incidente
    fazer:
      - Revise as ações abertas na retrospectiva ou na reunião de operação
      - Reporte ações atrasadas à liderança
    id: pb_inc_pos_t3
    publico: false
    resumo: "Follow-up fecha o aprendizado: revise o andamento das ações em cadência fixa."
    status: rascunho
    tecnicas:
      - tec_acoes_corretivas
  - evitar:
      - Descartar o aprendizado por ser incidente pequeno
    fazer:
      - Anote causa, correção e o que evitaria a repetição
      - Atualize o runbook
    id: pb_inc_pos_t4
    publico: false
    resumo: Para SEV3, registre o que aprendeu em poucas linhas e ajuste o runbook ou o alerta.
    status: rascunho
    tecnicas:
      - tec_runbook
  - id: pb_inc_pos_e1
    resumo: "Retorno «formal» da raia Aprendizado pós-incidente: post-mortem formal concluído. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_inc_pos_e2
    resumo: "Retorno «registro_leve» da raia Aprendizado pós-incidente: registro leve feito. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_inc_g_jan
    resumo: O contexto temporal muda a ação. Confira se existe janela crítica, evento repentino ou sazonalidade antes de decidir severidade e contenção.
    perguntas_chave:
      - '"Estamos em pico sazonal, lançamento de creator, fechamento financeiro de período ou data promocional de alto volume?"'
      - '"Há code freeze ou janela de manutenção em vigor?"'
      - '"Ocorreu um evento repentino (viral de creator, falha de provedor, ataque)?"'
    fazer:
      - Consulte o calendário de eventos críticos e o status de janela
      - Registre janela_critica e tipo_janela (sazonal, repentina, freeze, manutencao ou nenhuma)
      - Em dúvida, trate como janela ativa e reavalie quando a dúvida for resolvida
    evitar:
      - Decidir a severidade só pelo sintoma, ignorando o momento
      - Descobrir o freeze depois de fazer o deploy de contenção
    tecnicas:
      - tec_calendario_eventos_criticos
      - tec_status_de_janela
      - tec_code_freeze
    status: rascunho
    publico: false
  - id: pb_inc_t_jan
    resumo: Na janela crítica o mesmo sintoma custa mais. Suba a severidade mínima, antecipe escalada e comunicação e restrinja a contenção arriscada.
    perguntas_chave:
      - '"Qual a severidade mínima combinada para esta janela?"'
      - '"Que contenção é segura agora: feature flag ou rollback de grande escopo?"'
    fazer:
      - Eleve a severidade mínima conforme o tipo de janela (valor a calibrar)
      - Antecipe a escalada e o primeiro comunicado
      - Evite deploy na janela; prefira feature flag, kill switch ou degradação controlada a rollback de grande escopo
      - Registre o motivo da reavaliação na linha do tempo
    evitar:
      - Fazer deploy de correção em plena janela de pico
      - Manter a severidade baixa por o impacto parecer pequeno em números absolutos
    tecnicas:
      - tec_calendario_eventos_criticos
      - tec_code_freeze
      - tec_feature_flags
      - tec_capacity_planning_sazonal
      - tec_game_day
    status: rascunho
    publico: false
  - id: pb_inc_t_fts
    resumo: Em follow-the-sun, o responsável do turno ativo é o incident commander. A passagem entre turnos é estruturada e SEV1 não troca de turno sem handoff confirmado.
    perguntas_chave:
      - '"Quem detém o comando agora e até quando?"'
      - '"O próximo turno confirmou o recebimento do handoff?"'
    fazer:
      - O incident commander é o responsável do turno ativo
      - "Handoff estruturado: linha do tempo, hipóteses abertas, ações em andamento, quem assume e janela de passagem sobreposta"
      - Em SEV1, o comando só passa quando o handoff estiver confirmado pelo turno que chega
      - Registre o handoff na linha do tempo do incidente
      - Quem sai fica disponível durante a janela sobreposta
    evitar:
      - Passar o incidente por mensagem solta, sem confirmação
      - Sair antes do fim da janela de passagem
      - Deixar duas pessoas achando que comandam
    tecnicas:
      - tec_handoff_de_turno
      - tec_follow_the_sun
      - tec_incident_command
      - tec_linha_do_tempo
    status: rascunho
    publico: false
  - id: pb_inc_t_reav
    resumo: Depois da escalada ou de nova informação, confirme se a severidade ainda vale. A reclassificação decide se comunicação e contenção se repetem.
    perguntas_chave:
      - '"A severidade ainda é a mesma depois do que aprendemos?"'
      - '"Qual o raio de impacto hoje?"'
    fazer:
      - Registre severidade_anterior e severidade_atual
      - Use a mesma matriz de severidade da classificação inicial
      - Reveja o impacto e, se houver janela crítica, a severidade mínima da janela
    evitar:
      - Mudar a severidade por pressão de quem comunica
      - Reclassificar sem registrar o motivo
    tecnicas:
      - tec_matriz_severidade
      - tec_blast_radius
    status: rascunho
    publico: false
  - id: pb_inc_g_sev_mud
    resumo: Só uma mudança de severidade volta à comunicação e contenção. Sem mudança, o time segue para a mitigação sem repetir o que já foi feito.
    fazer:
      - "Mudou: volte para a bifurcação de severidade e execute a comunicação e contenção da nova severidade"
      - "Subiu: aplique contenção adicional e a cadência da severidade maior"
      - "Desceu: ajuste a cadência de atualização e a contenção"
      - "Não mudou: siga direto para a mitigação"
    evitar:
      - Repetir comunicado e contenção sem mudança de severidade
      - Rebaixar a severidade sem evidência de queda do impacto
    tecnicas:
      - tec_matriz_severidade
      - tec_comunicacao_incidente
    status: rascunho
    publico: false
  - id: pb_inc_tri_t2
    resumo: "Alarme falso também é trabalho: registre por que não havia impacto e ajuste o alerta para não acordar ninguém à toa da próxima vez."
    perguntas_chave:
      - '"Que mudança no alerta teria evitado este acionamento sem esconder um problema real?"'
    fazer:
      - Ajuste o limite, a janela ou a rota com base nos sinais coletados
    evitar:
      - Silenciar o alerta sem entender o pico
    exemplo: O alerta disparou por 30 segundos de erro num endpoint interno; a janela passou para 5 minutos.
    status: rascunho
    publico: false
