playbooks:
  - evitar:
      - Começar a investigar em conversas paralelas e dispersas
      - Esperar "ter certeza" para avisar o time
    fazer:
      - Registre quem detectou, quando e por qual canal (alerta, cliente, suporte)
      - Abra um canal único de coordenação desde o primeiro minuto
      - Se o incidente veio do fluxo de bug (ligação aciona), registre o link do ticket do bug e siga em paralelo com ele
    id: pb_inc_orq_s0
    publico: false
    resumo: Incidente é qualquer evento que degrada o serviço para o cliente agora. A prioridade é restaurar o serviço, não achar culpado.
    status: rascunho
    tecnicas:
      - tec_incident_command
  - id: pb_inc_orq_c1
    resumo: "Chama a raia Detecção e triagem: confirmar se o alerta tem impacto real no cliente. O fluxo segue pelo retorno que a raia devolver."
    fazer:
      - "Retornos possíveis: impacto_confirmado, alarme_falso"
      - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c2
    resumo: "Chama a raia Classificação de severidade: classificar a severidade do incidente, considerando janelas críticas. O fluxo segue pelo retorno que a raia devolver."
    fazer:
      - "Retornos possíveis: sev1, sev2, sev3"
      - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c3
    resumo: "Chama a raia Comando do incidente: definir o comando conforme a estrutura do time e sinalizar a necessidade de escalada. O fluxo segue pelo retorno que a raia devolver."
    fazer:
      - "Retornos possíveis: seguir, escalar"
      - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c4
    resumo: "Chama a raia Comunicação por severidade: comunicar o incidente na cadência da severidade. O fluxo segue pelo retorno que a raia devolver."
    fazer:
      - "Retornos possíveis: comunicado"
      - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c5
    resumo: "Chama a raia Contenção de danos: conter os danos na intensidade da severidade. O fluxo segue pelo retorno que a raia devolver."
    fazer:
      - "Retornos possíveis: contido"
      - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c6
    resumo: "Chama a raia Mitigação e verificação: restaurar o serviço e verificar a estabilidade em até 3 tentativas. O fluxo segue pelo retorno que a raia devolver."
    fazer:
      - "Retornos possíveis: estavel, tentativas_esgotadas"
      - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c7
    resumo: "Chama a raia Escalada: escalar o incidente para outro time ou para a liderança. O fluxo segue pelo retorno que a raia devolver."
    fazer:
      - "Retornos possíveis: escalado"
      - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c8
    resumo: "Chama a raia Reavaliação de severidade: reavaliar a severidade e dizer se ela mudou. O fluxo segue pelo retorno que a raia devolver."
    fazer:
      - "Retornos possíveis: severidade_mudou, severidade_mantida"
      - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c9
    resumo: "Chama a raia Encerramento: encerrar o incidente com a causa tratada e a resolução comunicada. O fluxo segue pelo retorno que a raia devolver."
    fazer:
      - "Retornos possíveis: encerrado"
      - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - id: pb_inc_orq_c10
    resumo: "Chama a raia Aprendizado pós-incidente: transformar o incidente em aprendizado e ações corretivas. O fluxo segue pelo retorno que a raia devolver."
    fazer:
      - "Retornos possíveis: formal, registro_leve"
      - Siga a saída que corresponde ao retorno da raia chamada
    status: rascunho
    publico: false
  - evitar:
      - Deixar o alerta ruidoso como está
    fazer:
      - Anote o motivo do falso positivo
      - Abra tarefa para ajustar ou remover o alerta
    id: pb_inc_orq_e1
    publico: false
    resumo: Alarme falso também ensina. Ajuste o alerta para reduzir ruído e proteger a atenção de quem está de plantão.
    status: rascunho
  - evitar:
      - Encerrar sem registrar o resultado
    fazer:
      - Arquive o canal com o resumo e links da linha do tempo
    id: pb_inc_orq_e2
    publico: false
    resumo: Incidente bom é o que termina com o serviço de pé, o time com ação clara e o sistema um pouco mais forte.
    status: rascunho
  - id: pb_inc_tri_s0
    resumo: "Início da raia Detecção e triagem. Responsabilidade: confirmar se o alerta tem impacto real no cliente."
    status: rascunho
    publico: false
  - evitar:
      - Descartar o alerta sem checar o impacto real
      - Investigar a causa antes de medir o impacto
    fazer:
      - Olhe os indicadores de saúde (erros, latência, disponibilidade) e compare com o normal
      - "Cheque mudanças recentes: deploys, flags, migrações"
      - Procure o runbook do serviço e siga o primeiro passo
    id: pb_inc_tri_t1
    exemplo: O alerta de pagamentos disparou às 14h02. Em 10 minutos a equipe confirma nos painéis que há falhas reais e já identifica o serviço afetado.
    perguntas_chave:
      - '"Quem está sendo afetado e desde quando?"'
      - '"O que mudou nas últimas horas (deploy, configuração, tráfego)?"'
      - '"Existe runbook para este sintoma?"'
    publico: false
    resumo: Confirme depressa se o problema é real e qual o impacto no cliente. Triagem leva minutos, não horas.
    status: rascunho
    tecnicas:
      - tec_runbook
      - tec_slo_sli
  - evitar:
      - Silenciar alerta sem registrar o motivo
      - Ignorar alerta recorrente "porque sempre é falso"
    fazer:
      - Se não houve impacto, registre o alerta e ajuste o limiar ou a regra
      - Na dúvida com sinais conflitantes, trate como incidente e reavalie em 10 minutos
    id: pb_inc_tri_g1
    exemplo: "Os painéis mostram 12% de erro no pagamento e reclamações no suporte: impacto real confirmado, então segue como incidente."
    publico: false
    resumo: "Gate de realidade: sem impacto confirmado não há incidente, mas há dívida de alerta."
    status: rascunho
  - id: pb_inc_tri_e1
    resumo: "Retorno «impacto_confirmado» da raia Detecção e triagem: impacto confirmado. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_inc_tri_e2
    resumo: "Retorno «alarme_falso» da raia Detecção e triagem: alarme falso ou sem impacto. Quem chamou a raia segue por este retorno."
    status: rascunho
    publico: false
  - id: pb_inc_cls_s0
    resumo: "Início da raia Classificação de severidade. Responsabilidade: classificar a severidade do incidente, considerando janelas críticas."
    status: rascunho
    publico: false
  - evitar:
      - Classificar pelo medo de acordar alguém
      - Rebaixar severidade para "não fazer barulho"
    fazer:
      - "SEV1: indisponibilidade total, perda de dados ou impacto financeiro e de segurança relevante"
      - "SEV2: degradação importante ou parte dos clientes sem funcionalidade central"
      - "SEV3: impacto limitado, com contorno disponível"
      - Em dúvida entre dois níveis, adote o mais alto e reveja depois
    id: pb_inc_cls_t1
    exemplo: "Checkout com 12% de erros, mas com contorno por outro meio de pagamento: classificado como SEV2."
    perguntas_chave:
      - '"Há perda de dados ou indisponibilidade total?"'
      - '"Quantos clientes e qual receita estão afetados?"'
      - '"Existe contorno para o cliente?"'
    publico: false
    resumo: Severidade define quem acorda, quem é avisado e quanto de processo se aplica. Use uma matriz escrita, não intuição.
    status: rascunho
    tecnicas:
      - tec_matriz_severidade
  - id: pb_inc_cls_g1
    exemplo: O incidente acontece na semana de um grande lançamento de creator, então a janela crítica está ativa e o fluxo segue pelo caminho "sim".
    resumo: O contexto temporal muda a ação. Confira se existe janela crítica, evento repentino ou sazonalidade antes de decidir severidade e contenção.
    perguntas_chave:
      - '"Estamos em pico sazonal, lançamento de creator, fechamento financeiro de período ou data promocional de alto volume?"'
      - '"Há code freeze ou janela de manutenção em vigor?"'
      - '"Ocorreu um evento repentino (viral de creator, falha de provedor, ataque)?"'
    fazer:
      - Consulte o calendário de eventos críticos e o status de janela
      - Registre janela_critica e tipo_janela (sazonal, repentina, freeze, manutencao ou nenhuma)
      - Em dúvida, trate como janela ativa e reavalie quando a dúvida for resolvida
      - "Critério da saída «sim, há janela crítica ativa»: pico sazonal de vendas, lançamento de creator, fechamento financeiro de período, datas promocionais de alto volume, code freeze, janela de manutenção ou evento repentino (viral de creator, falha de provedor, ataque)"
      - "Critério da saída «não, sem janela crítica»: seguir com a severidade classificada"
    evitar:
      - Decidir a severidade só pelo sintoma, ignorando o momento
      - Descobrir o freeze depois de fazer o deploy de contenção
    tecnicas:
      - tec_calendario_eventos_criticos
      - tec_status_de_janela
      - tec_code_freeze
    status: rascunho
    publico: false
  - id: pb_inc_cls_t2
    exemplo: Por causa do lançamento em andamento, um problema que seria SEV3 passa a SEV2 e a comunicação ao time sai 30 minutos antes.
    resumo: Na janela crítica o mesmo sintoma custa mais. Suba a severidade mínima, antecipe escalada e comunicação e restrinja a contenção arriscada.
    perguntas_chave:
      - '"Qual a severidade mínima combinada para esta janela?"'
      - '"Que contenção é segura agora: feature flag ou rollback de grande escopo?"'
    fazer:
      - A severidade mínima por tipo de janela é um valor a calibrar com o time
      - "Antecipe a escalada e o primeiro comunicado: o prazo antecipado é um valor a calibrar"
      - Prefira kill switch ou degradação controlada a rollback de grande escopo, quando existirem
      - Em dúvida sobre a janela, trate como ativa e reavalie quando a dúvida for resolvida
    evitar:
      - Fazer deploy de correção em plena janela de pico
      - Manter a severidade baixa por o impacto parecer pequeno em números absolutos
    tecnicas:
      - tec_calendario_eventos_criticos
      - tec_code_freeze
      - tec_feature_flags
      - tec_capacity_planning_sazonal
      - tec_game_day
    status: rascunho
    publico: false
  - evitar:
      - Montar sala de crise para SEV3
      - Tratar SEV1 como tarefa normal de backlog
    fazer:
      - "SEV1 e SEV2: o comando é definido conforme a estrutura do time (raia Comando do incidente), depois vêm a comunicação e a contenção por severidade"
      - "SEV3: o dono do serviço trata em horário comercial, com ticket, e também passa pela comunicação e contenção (versão leve)"
    id: pb_inc_cls_g2
    exemplo: "Checkout com 12% de erros e vendas caindo: SEV2, com resposta coordenada e papéis definidos."
    publico: false
    resumo: SEV1 e SEV2 pedem resposta coordenada com papéis. SEV3 pede tratamento direto pelo dono do serviço.
