    exemplo: Pagamentos sem teste de contrato; 60% das falhas do semestre vieram do cálculo de frete sem teste de integração
    status: rascunho
    publico: false
  - id: estrategia_de_testes
    nome: Estratégia de testes
    descricao: Lista priorizada de testes a criar, com o nível de cada um
    tipo: documento
    exemplo: "Prioridade 1: contrato com o gateway de pagamento; prioridade 2: integração do frete; prioridade 3: E2E do checkout"
    status: rascunho
    publico: false
