playbooks:
  - id: pb_dsc_ava_s0
    resumo: "Início da raia Avaliação de uso e impacto. Responsabilidade: medir o uso, identificar os consumidores e decidir se descontinua."
    status: rascunho
    publico: false
  - id: pb_dsc_ava_t1
    resumo: "Medir o uso e identificar os consumidores. Entrega: quem usa, quanto e com que dependência."
    perguntas_chave:
      - '"O que precisa estar claro para medir o uso e identificar os consumidores?"'
    status: rascunho
    publico: false
  - id: pb_dsc_ava_g1
    resumo: Descontinuar? A resposta decide o retorno da raia.
    status: rascunho
    publico: false
  - id: pb_dsc_ava_e1
    resumo: Retorno «descontinuar» da raia Avaliação de uso e impacto. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_dsc_ava_e2
    resumo: Retorno «manter» da raia Avaliação de uso e impacto. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_dsc_avi_s0
