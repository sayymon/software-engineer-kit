    status: rascunho
    publico: false
  - id: pb_dsc_avi_e1
    resumo: Retorno «consumidores_migrados» da raia Aviso e migração dos consumidores. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_dsc_orq_s0
    resumo: "Descontinuar é uma entrega: tem consumidores, prazo e comunicação. Meça o uso antes de decidir e avise antes de remover."
    status: rascunho
    publico: false
  - id: pb_dsc_orq_c1
    resumo: Chama a raia Avaliação de uso e impacto. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - "Retornos possíveis: descontinuar, manter"
    status: rascunho
    publico: false
  - id: pb_dsc_orq_c2
