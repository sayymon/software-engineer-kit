id: descontinuacao
tipo: demanda
nome: Descontinuação e deprecação
sigla: dsc
publico: false
artefatos:
  - id: mapa_de_consumidores
    nome: Mapa de consumidores
    descricao: Quem usa, quanto e com que dependência
    tipo: dado
    exemplo: "Endpoint antigo de relatório: 3 consumidores, 2% do tráfego, um parceiro externo"
    status: rascunho
    publico: false
  - id: aviso_de_deprecacao
    nome: Aviso de deprecação
    descricao: Mensagem aos consumidores com prazo, alternativa e guia
    tipo: comunicacao
    exemplo: "Aviso aos consumidores: endpoint antigo sai em 90 dias; use o novo, guia de migração anexo"
    destinatarios:
      - times_dependentes
      - stakeholder
      - suporte
    status: rascunho
    publico: false
  - id: adocao_da_alternativa
    nome: Adoção da alternativa
    descricao: Percentual de consumidores migrados até o prazo
    tipo: dado
    exemplo: 2 de 3 consumidores migrados em 45 dias; o parceiro externo pediu mais 30 dias
    status: rascunho
    publico: false
raias:
  - id: dsc_orq
    nome: "Orquestração: descontinuação e deprecação"
    demanda: descontinuacao
    responsabilidade: Conduzir a demanda de descontinuação e deprecação do início ao fim, delegando cada etapa a uma raia
    cor: "#607D8B"
    orquestradora: true
    status: rascunho
    publico: false
  - id: dsc_ava
    nome: Avaliação de uso e impacto
    demanda: descontinuacao
    responsabilidade: Medir o uso, identificar os consumidores e decidir se descontinua
    cor: "#332288"
    status: rascunho
    publico: false
  - id: dsc_avi
    nome: Aviso e migração dos consumidores
    demanda: descontinuacao
    responsabilidade: Anunciar o prazo, oferecer o caminho de migração e acompanhar a adoção
    cor: "#117733"
    status: rascunho
    publico: false
