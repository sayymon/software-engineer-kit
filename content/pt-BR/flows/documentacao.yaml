id: documentacao
tipo: demanda
nome: Documentação
sigla: doc
publico: false
artefatos:
  - id: plano_da_documentacao
    nome: Plano da documentação
    descricao: Para quem, que tipo (tutorial, guia, referência, explicação) e onde mora
    tipo: documento
    exemplo: Guia de uso da API de cupons para times parceiros, no portal de desenvolvedores, gerado a partir do contrato
    status: rascunho
    publico: false
  - id: documentacao_escrita
    nome: Documentação escrita
    descricao: Texto ou diagrama pronto para revisão
    tipo: documento
    exemplo: Guia com autenticação, três exemplos de chamada e a tabela de erros
    status: rascunho
    publico: false
  - id: documentacao_validada
    nome: Documentação validada
    descricao: Documento ajustado depois de alguém do público usar
    tipo: documento
    exemplo: Uma pessoa de um time parceiro integrou seguindo só o guia; dois passos foram reescritos
    status: rascunho
    publico: false
  - id: aviso_de_documentacao
    nome: Aviso de documentação
    descricao: Mensagem com o link e o que mudou
    tipo: comunicacao
    exemplo: "Mensagem no canal dos times parceiros: guia novo da API de cupons publicado, com o link"
    destinatarios:
      - times_dependentes
      - suporte
    status: rascunho
    publico: false
raias:
  - id: doc_orq
    nome: "Orquestração: documentação"
    demanda: documentacao
    responsabilidade: Conduzir a demanda de documentação do início ao fim, delegando cada etapa a uma raia
    cor: "#607D8B"
    orquestradora: true
    status: rascunho
    publico: false
  - id: doc_pla
    nome: Planejamento da documentação
    demanda: documentacao
    responsabilidade: Definir o público, o tipo de documento e a fonte de verdade
    cor: "#332288"
    status: rascunho
    publico: false
  - id: doc_esc
    nome: Escrita da documentação
    demanda: documentacao
    responsabilidade: Escrever a documentação e validar com quem vai usar
    cor: "#117733"
    status: rascunho
    publico: false
  - id: doc_pub
    nome: Publicação e divulgação
    demanda: documentacao
    responsabilidade: Publicar no lugar certo e avisar quem precisa saber
    cor: "#CC6677"
    status: rascunho
    publico: false
