playbooks:
  - id: pb_doc_pla_s0
    resumo: "Início da raia Planejamento da documentação. Responsabilidade: definir o público, o tipo de documento e a fonte de verdade."
    status: rascunho
    publico: false
  - id: pb_doc_pla_t1
    resumo: "Definir público, tipo e fonte de verdade. Entrega: para quem, que tipo (tutorial, guia, referência, explicação) e onde mora."
    perguntas_chave:
      - '"O que precisa estar claro para definir público, tipo e fonte de verdade?"'
    status: rascunho
    publico: false
  - id: pb_doc_pla_e1
    resumo: Retorno «plano_definido» da raia Planejamento da documentação. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_doc_esc_s0
    resumo: "Início da raia Escrita da documentação. Responsabilidade: escrever a documentação e validar com quem vai usar."
    status: rascunho
    publico: false
  - id: pb_doc_esc_t1
    resumo: "Escrever a documentação. Entrega: texto ou diagrama pronto para revisão."
    perguntas_chave:
      - '"O que precisa estar claro para escrever a documentação?"'
    status: rascunho
    publico: false
  - id: pb_doc_esc_t2
    resumo: "Validar com uma pessoa do público. Entrega: documento ajustado depois de alguém do público usar."
    perguntas_chave:
      - '"O que precisa estar claro para validar com uma pessoa do público?"'
    status: rascunho
    publico: false
  - id: pb_doc_esc_e1
    resumo: Retorno «documentacao_pronta» da raia Escrita da documentação. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_doc_pub_s0
    resumo: "Início da raia Publicação e divulgação. Responsabilidade: publicar no lugar certo e avisar quem precisa saber."
    status: rascunho
    publico: false
  - id: pb_doc_pub_t1
    resumo: "Publicar e avisar os interessados. Entrega: mensagem com o link e o que mudou."
    perguntas_chave:
      - '"O que precisa estar claro para publicar e avisar os interessados?"'
    status: rascunho
    publico: false
  - id: pb_doc_pub_e1
    resumo: Retorno «documentacao_publicada» da raia Publicação e divulgação. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_doc_orq_s0
    resumo: "Documentação é legado: escreva para quem vem depois. Defina o público e a fonte de verdade antes de escrever."
    status: rascunho
    publico: false
  - id: pb_doc_orq_c1
    resumo: Chama a raia Planejamento da documentação. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - "Retornos possíveis: plano_definido"
    status: rascunho
    publico: false
  - id: pb_doc_orq_c2
    resumo: Chama a raia Escrita da documentação. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - "Retornos possíveis: documentacao_pronta"
    status: rascunho
    publico: false
  - id: pb_doc_orq_c3
    resumo: Chama a raia Review humano. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - "Retornos possíveis: aprovado_pelo_humano, ajustes_solicitados"
    status: rascunho
    publico: false
  - id: pb_doc_orq_c4
    resumo: Chama a raia Publicação e divulgação. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - "Retornos possíveis: documentacao_publicada"
    status: rascunho
    publico: false
  - id: pb_doc_orq_e1
    resumo: Documentação publicada e divulgada. Fim da demanda.
    status: rascunho
    publico: false
