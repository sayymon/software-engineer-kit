id: tec_jobs_to_be_done
tipo: tecnica
nome: Jobs to Be Done
descricao: Descreve o progresso que a pessoa quer fazer numa situação, independentemente da solução.
quando_usar:
  - Necessidade vinda de usuário
  - Entender por que alguém troca de solução
quando_evitar:
  - Demanda puramente técnica ou regulatória
exemplo: Quando volto a comprar do mesmo criador, quero concluir sem preencher tudo de novo, para não perder tempo.
como_aplicar:
  - Entreviste sobre situações reais
  - "Escreva o job: quando, quero, para"
  - Liste as forças que ajudam e atrapalham a troca
resultado_esperado: Jobs priorizados que orientam requisitos e métricas.
status: rascunho
publico: false
