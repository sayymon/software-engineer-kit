id: tec_adrs
tipo: tecnica
nome: ADRs
descricao: "Architecture Decision Record: registro curto de uma decisão de arquitetura com contexto, alternativas, decisão e consequências."
quando_usar:
  - "Decisões difíceis de reverter: integração, banco, stack, contrato público"
  - Decisões que afetam outros times
quando_evitar:
  - Escolhas triviais e facilmente reversíveis
exemplo: "ADR-014: integrar Promoções e Pedidos por eventos; alternativa síncrona descartada por acoplamento e latência."
como_aplicar:
  - Escreva o contexto e o problema
  - Liste as alternativas com prós e contras
  - Registre a decisão e as consequências
  - Revise com quem a decisão afeta
resultado_esperado: Um arquivo de ADR versionado junto do código, com status proposto, aceito ou substituído.
status: rascunho
publico: false
