id: tec_status_page
tipo: tecnica
nome: Status page
descricao: Página pública ou interna com o estado do serviço e atualizações periódicas durante o incidente.
quando_usar:
  - Incidentes com clientes afetados
  - SEV1 com atualizações a cada 30 minutos
quando_evitar:
  - Incidentes sem impacto visível
  - Publicar detalhes técnicos que confundem o cliente
status: rascunho
publico: false
exemplo: "Página de status atualizada: lentidão no checkout, causa em investigação, próxima atualização em 30 minutos."
