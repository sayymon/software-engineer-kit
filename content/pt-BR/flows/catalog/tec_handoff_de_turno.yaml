id: tec_handoff_de_turno
tipo: tecnica
nome: Handoff de turno
descricao: Passagem estruturada do comando entre turnos, com linha do tempo, hipóteses abertas, ações em andamento, quem assume e janela de passagem sobreposta.
quando_usar:
  - Incidente que atravessa a troca de turno ou de fuso
  - Troca de incident commander por cansaço
quando_evitar:
  - Incidente curto que termina antes da troca
  - Passagem sem confirmação de quem recebe
status: rascunho
publico: false
exemplo: "Passagem às 16h: linha do tempo, hipóteses abertas, ações em andamento e quem assume."
