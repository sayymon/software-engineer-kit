id: tec_tdd
tipo: tecnica
nome: TDD
descricao: "Test-Driven Development: escrever o teste antes do código, ver falhar, implementar o mínimo e refatorar."
quando_usar:
  - Lógica de negócio e correções de falhas
quando_evitar:
  - Exploração descartável
exemplo: Teste novo de recusa com motivo escrito antes da correção; falhou, passou e o código foi simplificado.
como_aplicar:
  - Escreva um teste que falha
  - Implemente o mínimo para passar
  - Refatore com os testes verdes
resultado_esperado: Código coberto por testes que nasceram com ele.
status: rascunho
publico: false
