id: tec_okrs_por_sprint
tipo: tecnica
nome: OKRs por sprint
descricao: Ligar o objetivo de cada iteração a um KR, para que cada entrega mostre progresso no resultado.
quando_usar:
  - Times que trabalham por iterações com OKRs trimestrais
quando_evitar:
  - Fluxo contínuo sem iterações
exemplo: "Iteração 4: liberar elegibilidade para 10% dos recorrentes e medir recompra."
como_aplicar:
  - Escolha o KR da iteração
  - Defina o objetivo da iteração
  - Reveja o KR na revisão
resultado_esperado: Objetivo da iteração ligado a um KR.
status: rascunho
publico: false
