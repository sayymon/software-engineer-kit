id: tec_game_day
tipo: tecnica
nome: Game day
descricao: Exercício planejado que simula falhas e eventos repentinos para treinar o time e validar runbooks e contenções.
quando_usar:
  - Antes de janelas críticas
  - Validar o handoff e a escalada
quando_evitar:
  - Executar sem aviso nem plano de reversão
  - Rodar em produção sem salvaguardas
status: rascunho
publico: false
exemplo: Simulação da queda do serviço de histórico em homologação para treinar a resposta.
