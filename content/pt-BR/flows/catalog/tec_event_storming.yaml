id: tec_event_storming
tipo: tecnica
nome: Event Storming
descricao: Oficina colaborativa que coloca os eventos do domínio em ordem no tempo e revela comandos, regras, atores, exceções e fronteiras.
quando_usar:
  - Fluxo complexo ou com variações
  - Domínio pouco conhecido pelo time
quando_evitar:
  - Fluxo simples e já bem entendido
exemplo: "Eventos: CupomAplicado, HistoricoConsultado, CupomRecusado; variação por boleto vencido devolve o cupom."
como_aplicar:
  - Reúna negócio e técnica
  - Escreva os eventos no passado e ordene
  - Acrescente comandos, regras e atores
  - Marque dúvidas e fronteiras
resultado_esperado: Modelo de domínio com eventos, regras e fronteiras candidatas a contextos.
status: rascunho
publico: false
