nome: WSJF
descricao: "Weighted Shortest Job First: prioriza pelo custo do atraso dividido pelo tamanho do trabalho."
quando_usar:
  - Várias iniciativas disputando a mesma capacidade
quando_evitar:
  - Exigências regulatórias com prazo legal
exemplo: "Cupom recorrente: custo do atraso alto (campanha do trimestre) e tamanho médio, fica na frente do relatório."
como_aplicar:
  - Estime valor, urgência e redução de risco
  - Some como custo do atraso
  - Divida pelo tamanho e ordene
resultado_esperado: Lista priorizada com o cálculo registrado.
status: rascunho
publico: false
