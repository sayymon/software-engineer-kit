id: tec_slicing_vertical
tipo: tecnica
nome: Slicing vertical
descricao: Fatiar o trabalho em pedaços que atravessam todas as camadas e entregam valor de ponta a ponta.
quando_usar:
  - Histórias grandes ou tarefas por camada
quando_evitar:
  - Trabalho de infraestrutura que não tem fatia visível
exemplo: Em vez de «banco, API e tela», a fatia é «recusa com motivo», da regra até a mensagem na tela.
como_aplicar:
  - Escolha um caminho de ponta a ponta
  - Reduza ao mínimo que gera valor
  - Repita para o próximo caminho
resultado_esperado: Histórias pequenas, testáveis e demonstráveis.
status: rascunho
publico: false
