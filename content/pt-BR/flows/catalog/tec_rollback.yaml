id: tec_rollback
tipo: tecnica
nome: Rollback
descricao: Retornar à versão anterior estável para restaurar o serviço rapidamente.
quando_usar:
  - Incidente causado por mudança recente
quando_evitar:
  - Mudanças com migração de dados irreversível sem plano
status: rascunho
publico: false
exemplo: Versão 4.12.0 revertida para a 4.11.3 em 1 comando pelo pipeline.
