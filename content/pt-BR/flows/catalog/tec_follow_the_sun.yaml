id: tec_follow_the_sun
tipo: tecnica
nome: Follow-the-sun
descricao: Modelo em que times em fusos horários diferentes se revezam, de modo que sempre haja um turno ativo com um responsável pelo incidente.
quando_usar:
  - Times internacionais com cobertura contínua
  - Incidentes longos que cruzam turnos
quando_evitar:
  - Time em um único fuso sem cobertura distribuída
  - Turnos sem janela de passagem sobreposta
status: rascunho
publico: false
exemplo: Incidente passa da equipe de São Paulo para a da Europa com handoff confirmado.
