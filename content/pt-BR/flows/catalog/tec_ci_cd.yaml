id: tec_ci_cd
tipo: tecnica
nome: CI/CD
descricao: "Integração e entrega contínuas: todo commit passa por build, testes e análises automáticas e pode ser implantado pelo pipeline."
quando_usar:
  - Qualquer código que vai para produção
quando_evitar:
  - Protótipo descartável
exemplo: Pipeline com testes, lint, análise de segurança e publicação em staging em 8 minutos por commit.
como_aplicar:
  - Automatize build e testes a cada commit
  - Inclua análises de qualidade e segurança
  - Implante pelo pipeline, nunca à mão
resultado_esperado: Pipeline verde como condição de merge e implantação rastreável até o commit.
status: rascunho
publico: false
