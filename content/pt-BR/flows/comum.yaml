playbooks:
  - id: pb_com_pub_s0
    resumo: Início da raia. Depois da revisão e da execução, a feature é versionada conforme a estratégia do time e publicada em um ambiente de testes, como o staging de desenvolvimento, para os testes integrados.
    perguntas_chave:
      - '"Chegaram: Entrega integrada, Branch da feature?"'
    status: rascunho
    publico: false
  - id: pb_com_pub_t1
    resumo: A versão testada precisa ser a mesma que vai para produção. O versionamento segue a estratégia de branches do time e o build sai do pipeline.
    perguntas_chave:
      - '"Qual a estratégia de versionamento do time: trunk, feature branch ou outra?"'
      - '"O build é reproduzível a partir do commit?"'
    status: rascunho
    publico: false
    fazer:
      - Faça o merge ou gere a versão pela estratégia do time
      - Gere o artefato pelo pipeline, nunca na máquina de alguém
    evitar:
      - Testar uma versão e implantar outra
    exemplo: Merge com a flag desligada; versão 4.12.0 gerada pelo pipeline.
  - id: pb_com_pub_t2
    resumo: Publicar no ambiente de testes, como o staging de desenvolvimento, e conferir saúde e configuração antes de liberar os testes.
    perguntas_chave:
      - '"A versão subiu com as variáveis de ambiente e as integrações novas?"'
      - '"Os dados do ambiente servem para os testes?"'
    status: rascunho
    publico: false
    exemplo: 4.12.0 no staging; consumidor de eventos conectado; health check verde.
  - id: pb_com_pub_g1
    resumo: Ambiente doente não testa nada. Falha na publicação vai para a análise da causa, normalmente de ambiente ou de configuração.
    perguntas_chave:
      - '"O serviço subiu saudável?"'
      - '"As integrações respondem?"'
    status: rascunho
    publico: false
    exemplo: "Variável de ambiente ausente: falha na publicação."
  - id: pb_com_pub_e1
    resumo: "Retorno «publicado»: publicada no ambiente de testes."
    perguntas_chave:
      - '"O retorno entrega: Versão da feature?"'
    status: rascunho
    publico: false
  - id: pb_com_pub_e2
    resumo: "Retorno «falha_na_publicacao»: falha na publicação."
    perguntas_chave:
      - '"O retorno entrega: Ambiente de testes atualizado?"'
    status: rascunho
    publico: false
  - id: pb_com_hml_s0
    resumo: "Início da raia. O ambiente e a estratégia mudam conforme a feature: staging, homologação ou produção controlada, com feature flag, teste A/B e o aceite do negócio."
    perguntas_chave:
      - '"Chegaram: Versão da feature, Métricas de sucesso, Risco de liberação, Precisa de experimento?"'
    status: rascunho
    publico: false
  - id: pb_com_hml_t1
    resumo: "O ambiente e a estratégia dependem da feature: staging para integração simples, homologação para dados e parceiros, produção controlada quando só o tráfego real valida."
    perguntas_chave:
      - '"Qual ambiente reproduz o risco desta feature?"'
      - '"A liberação precisa de feature flag?"'
      - '"O resultado de negócio é hipótese que pede teste A/B?"'
    status: rascunho
    publico: false
    fazer:
      - Registre o ambiente escolhido e o motivo
      - Defina a flag e o teste A/B quando o risco ou a hipótese pedirem
    exemplo: Homologação, porque integra com Pagamentos; flag com liberação por região; teste A/B de 3 semanas.
  - id: pb_com_hml_g1
    resumo: Staging valida a integração; homologação valida com dados representativos e parceiros; produção controlada valida com tráfego real num grupo pequeno.
    perguntas_chave:
      - '"Em qual ambiente os testes integrados acontecem?"'
    status: rascunho
    publico: false
    exemplo: "Integração com Pagamentos: homologação."
  - id: pb_com_hml_t2
    resumo: Testes integrados em staging com os demais sistemas, para integrações simples e de baixo risco.
    perguntas_chave:
      - '"Os sistemas vizinhos estão na versão que vai para produção?"'
    status: rascunho
    publico: false
    exemplo: 3 fluxos integrados verdes em staging.
  - id: pb_com_hml_t3
    resumo: "Homologação reproduz produção: dados representativos e mascarados, parceiros conectados e a flag configurada."
    perguntas_chave:
      - '"Os dados de homologação são representativos e mascarados?"'
      - '"Os parceiros estão conectados?"'
    status: rascunho
    publico: false
    evitar:
      - Copiar dados pessoais de produção sem mascarar
    exemplo: 5 fluxos verdes, incluindo boleto vencido.
  - id: pb_com_hml_t4
    resumo: "Teste em produção controlada: a feature fica ligada só para usuários internos ou um grupo piloto, com kill switch pronto."
    perguntas_chave:
      - '"Quem é o grupo piloto?"'
      - '"Em quanto tempo a feature é desligada se algo sair do esperado?"'
    status: rascunho
    publico: false
    evitar:
      - Grupo piloto grande demais para conter o impacto
    exemplo: Time interno e 1% de uma região por 48 horas.
  - id: pb_com_hml_t5
    resumo: O aceite do negócio confirma que a feature atende à necessidade, e não só aos critérios técnicos.
    perguntas_chave:
      - '"O PM e os interessados viram a feature funcionando?"'
    status: rascunho
    publico: false
    exemplo: Demonstração de 20 minutos e aceite registrado.
  - id: pb_com_hml_g2
    resumo: Aprovada só com os testes integrados verdes e o aceite do negócio.
    perguntas_chave:
      - '"Os testes passaram e o negócio aceitou?"'
    status: rascunho
    publico: false
    exemplo: "Testes verdes e aceite registrado: segue para a implantação."
  - id: pb_com_hml_e1
    resumo: "Retorno «testes_integrados_aprovados»: testes integrados aprovados."
    perguntas_chave:
      - '"O retorno entrega: Estratégia de liberação, Tem rollout gradual?"'
    status: rascunho
    publico: false
  - id: pb_com_hml_e2
    resumo: "Retorno «reprovado»: reprovada nos testes integrados."
    perguntas_chave:
      - '"O retorno entrega: Resultado da homologação?"'
    status: rascunho
    publico: false
  - id: pb_com_etg_s0
    resumo: Início da implantação em produção. Testes integrados aprovados; a implantação respeita janelas críticas e termina com o checklist conferido.
    perguntas_chave:
      - '"Quando e como esta entrega vai para produção?"'
    status: rascunho
    publico: false
  - id: pb_com_etg_g1
    resumo: O contexto temporal muda a entrega. Confira se existe janela crítica, evento repentino ou sazonalidade antes de colocar a feature em produção.
    perguntas_chave:
      - '"Estamos perto de um pico sazonal, de um lançamento de creator ou de um fechamento financeiro de período?"'
      - '"Há code freeze ou janela de manutenção em vigor?"'
      - '"Ocorreu um evento repentino (viral de creator, falha de provedor, ataque)?"'
    fazer:
      - Consulte o calendário de eventos críticos e o status de janela
      - Registre janela_critica e tipo_janela (sazonal, repentina, freeze, manutencao ou nenhuma)
      - Em dúvida, trate como janela ativa e reavalie quando a dúvida for resolvida
      - "Critério da saída «sim, há janela crítica ativa»: pico sazonal de vendas, lançamento de creator, fechamento financeiro de período, datas promocionais de alto volume, code freeze, janela de manutenção ou evento repentino"
      - "Critério da saída «não, sem janela crítica»: seguir com a entrega no plano normal"
    evitar:
      - Descobrir o freeze só depois do deploy
      - Entregar uma feature nova, e mais ainda uma com IA de custo variável, no pico de tráfego
    tecnicas:
      - tec_calendario_eventos_criticos
      - tec_status_de_janela
      - tec_code_freeze
    status: rascunho
    publico: false
  - id: pb_com_etg_t1
    resumo: Na janela crítica o mesmo risco custa mais. Adie a entrega ou reduza o risco com feature flag e rollout gradual.
    perguntas_chave:
      - '"Vale adiar para depois da janela ou liberar atrás de uma feature flag?"'
      - '"Como desligamos a feature, ou trocamos o modelo, se o custo ou a qualidade piorarem no pico?"'
    fazer:
      - Prefira adiar a entrega para depois da janela quando a feature não é urgente
      - Se precisar entregar, use feature flag, canary e rollout gradual, com kill switch pronto
      - Combine fallback e teto de custo por chamada antes de abrir para todo o tráfego
      - Registre o motivo do ajuste na linha do tempo da entrega
    evitar:
      - Entregar para 100% do tráfego em plena janela de pico
      - Depender de rollback de grande escopo durante a janela
    tecnicas:
      - tec_feature_flags
      - tec_canary_release
      - tec_deploy_gradual
      - tec_kill_switch
      - tec_code_freeze
    status: rascunho
    publico: false
  - id: pb_com_etg_t2
    resumo: Implantar pela estratégia de liberação definida, com a feature desligada quando houver flag e o rollback testado antes.
    perguntas_chave:
      - '"O rollback foi testado?"'
      - '"A feature sobe desligada?"'
    status: rascunho
    publico: false
    evitar:
      - Implantar fora do pipeline
    exemplo: 4.12.0 implantada com a flag desligada em 3 etapas.
  - id: pb_com_etg_t3
    resumo: "O checklist de implantação confirma que subiu: versão, saúde, indicadores de monitoramento, logs, negócio e, com IA, a observabilidade do modelo."
    perguntas_chave:
      - '"Todas as instâncias estão na versão nova?"'
      - '"Erro, latência e saturação estão iguais à versão anterior?"'
      - '"Há erro novo nos logs?"'
      - '"Os indicadores de negócio continuam estáveis?"'
    status: rascunho
    publico: false
    fazer:
      - Acompanhe os primeiros 30 minutos com o painel aberto
      - Compare com a versão anterior, não com a sensação
    exemplo: Instâncias na 4.12.0, erro e p95 estáveis, conversão do checkout sem queda.
  - id: pb_com_etg_g2
    resumo: Checklist todo verde segue para a liberação. Qualquer item vermelho reverte ou desliga a feature antes de investigar.
    perguntas_chave:
      - '"O checklist está todo verde?"'
    status: rascunho
    publico: false
    exemplo: "Erro do consumidor acima do normal: reverter."
  - id: pb_com_etg_t4
    resumo: Reverter primeiro, investigar depois. Desligar a flag costuma ser mais rápido que reverter a versão.
    perguntas_chave:
      - '"A flag resolve ou a versão precisa voltar?"'
      - '"Quem precisa saber da reversão?"'
    status: rascunho
    publico: false
    exemplo: Flag desligada em 1 minuto; aviso no canal do time com o motivo.
  - id: pb_com_etg_e1
    resumo: "Retorno «implantado»: implantada e saudável em produção."
    perguntas_chave:
      - '"O retorno entrega: Implantação em produção, Checklist de implantação?"'
    status: rascunho
    publico: false
  - id: pb_com_etg_e2
    resumo: "Retorno «implantacao_revertida»: implantação revertida."
    perguntas_chave:
      - '"O retorno entrega: Reversão da implantação?"'
    status: rascunho
    publico: false
  - id: pb_com_lib_s0
    resumo: Início da raia. Depois da implantação, os stakeholders são acionados e, se houver estratégia de rollout, a feature é liberada em ondas por tipo de usuário ou região.
    perguntas_chave:
      - '"Chegaram: Implantação em produção, Estratégia de liberação, Mapa de interessados, Tem rollout gradual?"'
    status: rascunho
    publico: false
  - id: pb_com_lib_t1
    resumo: "Depois de implantada, a feature é comunicada: interessados, suporte e times dependentes sabem o que muda, para quem, quando e como desligar."
    perguntas_chave:
      - '"Quem precisa saber e por qual canal?"'
      - '"O suporte sabe responder às dúvidas novas?"'
      - '"As notas de versão e a documentação de uso estão publicadas?"'
    status: rascunho
    publico: false
    exemplo: Aviso à liderança comercial, ao atendimento e a Pagamentos; notas da 4.12.0 publicadas.
  - id: pb_com_lib_g1
    resumo: Com estratégia de rollout, a liberação segue em ondas por tipo de usuário ou região; sem ela, a feature já está liberada.
    perguntas_chave:
      - '"A estratégia prevê liberação por tipo de usuário ou região?"'
    status: rascunho
    publico: false
    exemplo: "Liberação por região: segue em ondas."
  - id: pb_com_lib_t2
    resumo: Liberar em ondas limita o raio de impacto. A próxima onda só sai com os indicadores da anterior saudáveis.
    perguntas_chave:
      - '"Qual o público de cada onda?"'
      - '"Qual indicador libera a próxima?"'
    status: rascunho
    publico: false
    evitar:
      - Ampliar a liberação por calendário, sem olhar os indicadores
    exemplo: Onda 1 no Sudeste; onda 2 em 48 horas com erro estável.
  - id: pb_com_lib_e1
    resumo: "Retorno «liberado»: liberada e comunicada."
    perguntas_chave:
      - '"O retorno entrega: Comunicado de lançamento?"'
    status: rascunho
    publico: false
  - id: pb_com_mon_s0
    resumo: "Início da raia. Ciclo de validação em produção: indicadores técnicos e de negócio observados até o fim da janela; incidente causado pela feature aciona o fluxo de incidente."
    perguntas_chave:
      - '"Chegaram: Métricas de sucesso, Implantação em produção, Precisa de experimento?"'
    status: rascunho
    publico: false
  - id: pb_com_mon_t1
    resumo: Validar em produção é acompanhar os indicadores técnicos e as métricas de sucesso até o fim da janela de validação.
    perguntas_chave:
      - '"Os SLOs se mantêm?"'
      - '"A métrica de sucesso está se movendo?"'
      - '"O teste A/B tem significância?"'
    status: rascunho
    publico: false
    exemplo: SLO em 99,95%; recompra de 18% para 19,4% na primeira semana.
  - id: pb_com_mon_g1
    resumo: "Incidente ou degradação causada pela feature aciona o fluxo de incidente: primeiro restaurar, depois corrigir."
    perguntas_chave:
      - '"A degradação começou com a liberação da feature?"'
    status: rascunho
    publico: false
    exemplo: "Erros no checkout com cupom subiram para 4% após a onda 2: incidente."
  - id: pb_com_mon_t2
    resumo: Abrir o incidente com as evidências e desligar a feature quando o impacto exigir. O incidente assume a coordenação.
    perguntas_chave:
      - '"O incidente tem as evidências da feature?"'
      - '"Desligar a feature contém o impacto?"'
    status: rascunho
    publico: false
    exemplo: Incidente aberto com o painel da onda 2; flag desligada para a onda 2.
  - id: pb_com_mon_g2
    resumo: A validação continua até o fim da janela combinada; aí as metas são avaliadas.
    perguntas_chave:
