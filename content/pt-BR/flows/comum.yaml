        rotulo: Rodar a análise estática de segurança
        papel: devsecops
        saidas:
          - relatorio_de_seguranca
        tecnicas:
          - tecnica: tec_analise_estatica
            uso: obrigatoria
            porque: encontra padrões vulneráveis no código antes da execução
        exemplo: Nenhuma injeção; um log com dado pessoal corrigido.
        status: rascunho
      - id: com_seg_t1_st2
        rotulo: Verificar vulnerabilidades e licenças das dependências
        papel: devsecops
        saidas:
          - relatorio_de_seguranca
        tecnicas:
          - tecnica: tec_analise_de_dependencias
            uso: obrigatoria
            porque: a maior parte do código executado vem de dependências
        exemplo: Uma biblioteca com vulnerabilidade média atualizada para a versão corrigida.
        status: rascunho
      - id: com_seg_t1_st3
        rotulo: Procurar segredos no código e na configuração
        papel: devsecops
        saidas:
          - relatorio_de_seguranca
        tecnicas:
          - tecnica: tec_varredura_de_segredos
            uso: obrigatoria
            porque: segredo no repositório é vazamento permanente
        exemplo: Nenhum token ou senha encontrado no histórico da branch.
        status: rascunho
