  - id: pb_com_set_e1
    resumo: "Retorno «pronto_para_executar»: ambiente, ferramentas, contexto, plano de alocação e plano de agentes por papel prontos."
    perguntas_chave:
      - '"A primeira onda de tarefas pode começar agora?"'
