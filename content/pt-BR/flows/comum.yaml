    status: rascunho
    publico: false
  - id: pb_com_set_t7
    resumo: "O agente também é software: ele precisa de testes e evals antes de atuar na feature, inclusive dos limites de segurança."
    perguntas_chave:
      - '"Os casos cobrem tarefas típicas, specs ambíguas e pedidos fora do escopo?"'
      - '"O agente recusa ações proibidas?"'
    evitar:
