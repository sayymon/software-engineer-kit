decisoes:
  - id: com_set_s0
    raia: com_set
    tipo: inicio
    rotulo: Tarefas mapeadas, preparar a execução
    condicao: ""
    proximo:
      - para: com_set_t1
        condicao: ""
    estado: {}
    playbook: pb_com_set_s0
    layout:
      coluna: 0
    status: rascunho
    publico: false
  - id: com_set_t1
    raia: com_set
    tipo: tarefa
    rotulo: Preparar o ambiente e as ferramentas
    condicao: ""
    proximo:
      - para: com_set_t2
        condicao: ""
    estado: {}
    entradas:
      - lista_de_tarefas
      - mapa_de_tarefas
    saidas:
      - ambiente_de_execucao
      - branch_da_feature
    subtarefas:
      - id: com_set_t1_st1
        rotulo: Criar a branch da feature e o ambiente de desenvolvimento
        papel: dev
        saidas:
          - branch_da_feature
          - ambiente_de_execucao
        tecnicas:
          - tecnica: tec_estrategia_de_branches
            uso: obrigatoria
            porque: a branch da feature isola o trabalho e define como ele volta à principal
        exemplo: Branch feature/cupom-recorrente a partir da principal; ambiente local com dados de exemplo.
        status: rascunho
      - id: com_set_t1_st2
        rotulo: Configurar o pipeline de integração contínua
        papel: engenheiro_de_plataforma
        apoio:
          - sre
          - devsecops
        saidas:
          - ambiente_de_execucao
        tecnicas:
          - tecnica: tec_ci_cd
            uso: obrigatoria
            porque: todo commit da feature passa pelos testes e pelas análises automáticas
        exemplo: Pipeline com testes, análise estática, varredura de dependências e publicação em homologação.
        status: rascunho
      - id: com_set_t1_st3
        rotulo: Liberar acessos com menor privilégio
        papel: devsecops
        saidas:
          - ambiente_de_execucao
        tecnicas:
          - tecnica: tec_menor_privilegio
            uso: obrigatoria
            porque: cada pessoa e agente recebe só o acesso que a tarefa exige
        exemplo: Leitura do histórico em homologação para Dev e QA; nenhum acesso a dados de produção.
        status: rascunho
    playbook: pb_com_set_t1
    layout:
      coluna: 1
    status: rascunho
    publico: false
  - id: com_set_t2
    raia: com_set
    tipo: tarefa
    rotulo: Revisar e preparar o contexto
    condicao: ""
    proximo:
      - para: com_set_t3
        condicao: ""
    estado: {}
    entradas:
      - spec_pronta
      - design_md
      - adrs_da_feature
    saidas:
      - contexto_de_execucao
    subtarefas:
      - id: com_set_t2_st1
        rotulo: Revisar a spec, o design e os ADRs com o time
        papel: tech_lead
        apoio:
          - arquiteto
        saidas:
          - contexto_de_execucao
        exemplo: "Sessão de 30 minutos: dúvidas sobre o contrato do evento resolvidas antes de começar."
        status: rascunho
      - id: com_set_t2_st2
        rotulo: Preparar o contexto do projeto para os agentes
        papel: engenheiro_de_ia
        apoio:
          - arquiteto
        entradas:
          - contexto_de_execucao
        saidas:
          - contexto_de_execucao
        tecnicas:
          - tecnica: tec_spec_driven_development
            uso: recomendada
            porque: agentes executam melhor com spec, padrões e regras do projeto à mão
        exemplo: Contexto com estrutura do projeto, padrões, convenções de teste e os ADRs da feature.
        status: rascunho
    playbook: pb_com_set_t2
    layout:
      coluna: 2
    status: rascunho
    publico: false
  - id: com_set_t3
    raia: com_set
    tipo: tarefa
    rotulo: "Definir quem exerce cada papel: pessoa, agente ou par"
    condicao: ""
    proximo:
      - para: com_set_g1
        condicao: ""
    estado:
      alocacao: agente|pessoa|hibrida
      tarefas_agente: lista de tarefas
      tarefas_pessoa: lista de tarefas
    entradas:
      - lista_de_tarefas
      - matriz_de_papeis
      - mapa_de_dependencias
    saidas:
      - alocacao
      - tarefas_agente
      - tarefas_pessoa
      - tipo_alocacao
      - plano_de_alocacao
    subtarefas:
      - id: com_set_t3_st1
        exemplo: Gerar os testes de contrato vai para o agente porque o critério é objetivo. Decidir a regra de acúmulo de cupons fica com a pessoa, porque envolve negócio.
        rotulo: Aplicar o critério de alocação a cada tarefa
        papel: tech_lead
        apoio:
          - gerente_de_engenharia
        entradas:
          - lista_de_tarefas
          - mapa_de_dependencias
        saidas:
          - alocacao
          - plano_de_alocacao
        tecnicas:
          - tecnica: tec_matriz_de_alocacao
            uso: obrigatoria
            porque: um critério escrito evita delegar ao agente só por conveniência
        status: rascunho
      - id: com_set_t3_st2
        exemplo: A tarefa de reembolso de cupom toca dinheiro e dados pessoais, então muda de agente para híbrida, com revisão obrigatória de uma pessoa.
        rotulo: Revisar tarefas ambíguas, sensíveis ou de risco
        papel: arquiteto
        apoio:
          - devsecops
        entradas:
          - alocacao
          - lista_de_tarefas
        saidas:
          - alocacao
          - plano_de_alocacao
        tecnicas:
          - tecnica: tec_adrs
            uso: recomendada
            porque: a decisão de arquitetura que fica com a pessoa merece registro
          - tecnica: tec_x3_amigos
            uso: opcional
            porque: alinha negócio, produto e qualidade quando há ambiguidade
        status: rascunho
      - id: com_set_t3_st3
        exemplo: "Lista do agente: 5 tarefas (testes, endpoint, migração). Lista das pessoas: 2 tarefas (regra de acúmulo e texto da mensagem de erro)."
        rotulo: Montar as listas do agente e das pessoas
        papel: tech_lead
        entradas:
          - alocacao
          - lista_de_tarefas
        saidas:
          - plano_de_alocacao
          - tarefas_agente
          - tarefas_pessoa
          - tipo_alocacao
        status: rascunho
    playbook: pb_com_set_t3
    layout:
      coluna: 3
    status: rascunho
    publico: false
