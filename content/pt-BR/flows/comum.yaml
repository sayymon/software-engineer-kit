    status: rascunho
    publico: false
  - id: pb_com_set_g3
    resumo: Agente reprovado volta ao refinamento até 3 tentativas; depois, as tarefas seguem com pessoas do papel.
    perguntas_chave:
      - '"O ajuste resolve a causa da reprovação?"'
    status: rascunho
    publico: false
    exemplo: "Segunda reprovação do agente Dev: refinar de novo."
  - id: pb_com_set_t8
    resumo: Tarefas independentes rodam em paralelo; com 3 ou mais, um swarm coordenado reduz o tempo. O plano diz quem coordena e onde as entregas se juntam.
    perguntas_chave:
      - '"Quais tarefas não dependem umas das outras?"'
