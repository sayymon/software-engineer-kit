          - tecnica: tec_piramide_de_testes
            uso: obrigatoria
            porque: poucos E2E, só das jornadas críticas, para a suíte continuar rápida
        exemplo: Dado um comprador com 2 compras, quando aplica o cupom no checkout, então o desconto aparece no total.
