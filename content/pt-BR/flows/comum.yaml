    status: rascunho
    publico: false
    exemplo: "Janela de 4 semanas ainda aberta: continuar observando."
  - id: pb_com_mon_t3
    resumo: "Registrar o resultado contra as metas e limpar o temporário: flag removida e caminho antigo apagado."
