            uso: obrigatoria
            porque: o nível de conformidade adotado vira critério de aprovação da jornada
        exemplo: A jornada de checkout roda o verificador automático e um roteiro manual com leitor de tela.
        status: rascunho
      - id: com_e2e_t1_st4
        rotulo: Incluir as jornadas core que não podem quebrar
        papel: qa
        apoio:
          - pm
        porque: a jornada afetada passa, mas a regressão prova que as jornadas core continuam inteiras
        entradas:
          - jornadas_criticas
        saidas:
          - testes_e2e
        exemplo: Além do checkout com cupom, rodam login, busca e compra simples de ponta a ponta.
