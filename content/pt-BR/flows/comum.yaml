    exemplo: Meta de 20% atingida; flag e caminho antigo removidos.
  - id: pb_com_mon_e1
    resumo: "Retorno «feature_validada»: feature validada em produção."
    perguntas_chave:
      - '"O retorno entrega: Resultado da validação em produção?"'
    status: rascunho
    publico: false
  - id: pb_com_mon_e2
    resumo: "Retorno «incidente_acionado»: incidente acionado pela feature."
    perguntas_chave:
      - '"O retorno entrega: Incidente aberto?"'
    status: rascunho
    publico: false
  - id: pb_com_exe_t1
    resumo: "Uma boa revisão de PR vai além de «o código funciona»: avalia o problema, a solução, os riscos, a manutenção futura e a experiência de quem vai operar. Siga a pirâmide de revisão: primeiro funcionalidade e implementação, depois testabilidade e cobertura, depois legibilidade e manutenibilidade, por último estilo, que fica com as ferramentas automáticas."
    perguntas_chave:
      - '"O problema e o escopo estão claros?"'
      - '"A solução é correta e cobre casos-limite?"'
      - '"Testes adequados existem e passam?"'
      - '"Segurança, autorização e dados sensíveis foram considerados?"'
      - '"Performance, escalabilidade e custos foram avaliados?"'
      - '"Observabilidade, rollback e rollout estão definidos?"'
      - '"O código é legível, testável e consistente com o projeto?"'
      - '"Documentação e configuração foram atualizadas?"'
      - '"Os comentários distinguem bloqueantes de sugestões?"'
    fazer:
      - 1. Leia a descrição, a tarefa vinculada, os critérios de aceite e o resultado do CI antes do diff
      - 2. Rode o PR localmente ou confira o ambiente de revisão
      - "3. Revise o diff por camadas: testes, lógica de negócio, integrações, interface e configuração"
      - "4. Execute os testes e confira o CI: lint, type check, testes, build e verificações de segurança"
      - 5. Faça uma passada de segurança, performance e operação
      - "6. Classifique os comentários: bloqueante, importante, sugestão ou menor, com o nível da pirâmide"
      - 7. Depois das correções, valide os bloqueantes antes de aprovar
      - Comente na linha, explique o risco e proponha uma alternativa concreta; pergunte quando houver dúvida e elogie boas decisões
    evitar:
      - Aprovar porque a formatação está impecável enquanto há falha lógica
      - Discutir estilo que o lint e o formatador resolvem
      - PR que mistura refatoração, feature nova e correção
      - Bloquear o merge por sugestão de melhoria
    exemplo: "[Bloqueante, nível 1] O cálculo ignora juros compostos quando períodos > 1. [Importante, nível 2] Falta teste para período zero. [Sugestão, nível 3] Extrair a regra de arredondamento. [Menor, nível 4] Renomear para taxaAnual."
    status: rascunho
    publico: false
  - id: pb_com_set_s0
    resumo: "Início do setup: tudo que é necessário para iniciar a execução, de ferramentas e ambiente a contexto, agentes e skills."
    perguntas_chave:
      - '"O que falta para a primeira tarefa começar sem bloqueio?"'
    status: rascunho
    publico: false
  - id: pb_com_set_t1
    resumo: "Ambiente pronto antes da primeira linha de código: branch da feature, pipeline de integração contínua e acessos com menor privilégio."
    perguntas_chave:
      - '"A branch e o pipeline estão prontos?"'
      - '"Cada pessoa e agente tem só o acesso de que precisa?"'
    status: rascunho
    publico: false
  - id: pb_com_set_t2
    resumo: "Revisar o contexto com o time e prepará-lo para os agentes evita retrabalho: spec, design, ADRs, padrões e regras do projeto."
    perguntas_chave:
      - '"O time entendeu o design e os ADRs?"'
      - '"Os agentes têm o contexto do projeto à mão?"'
    status: rascunho
    publico: false
  - id: pb_com_set_t3
    exemplo: Das 9 tarefas, 5 vão para o agente, 2 ficam com pessoas e 2 são híbridas, com o agente propondo e uma pessoa aprovando.
    resumo: "Nem toda tarefa deve ir para o agente. Classifique cada uma por critério, não por vontade: um complementa o outro."
    perguntas_chave:
      - '"Esta tarefa seria verificada por teste ou eval, ou depende de um julgamento humano?"'
      - '"O que acontece se o agente errar aqui e ninguém notar?"'
    fazer:
      - Classifique como «agente» quando é verificável por testes ou evals, tem spec clara e tem baixo risco
      - Classifique como «pessoa» quando exige decisão de arquitetura, resolve ambiguidade, toca segurança ou compliance, envolve negociação com stakeholders ou exige acesso ou permissão sensível
      - "Classifique como «hibrida» quando a pessoa decide ou pareia e o agente executa a parte mecânica: a tarefa entra nas duas listas"
      - "Vocabulário: «hibrida» classifica a tarefa quando a pessoa do papel decide ou pareia e o agente do papel executa a parte mecânica; na subtarefa, o papel principal fica em `papel` e os demais em `apoio`"
      - Em dúvida entre agente e pessoa, classifique como pessoa e reavalie quando a dúvida for resolvida
    evitar:
      - Delegar ao agente uma tarefa ainda ambígua
      - Mandar para o agente tudo o que for conveniente, sem checar risco
      - Mandar para pessoas tarefas mecânicas e verificáveis por teste
    tecnicas:
      - tec_adrs
    status: rascunho
    publico: false
  - id: pb_com_set_g1
    resumo: Sem tarefas para agentes, o setup pula a preparação de agentes e vai direto ao plano de execução.
    perguntas_chave:
      - '"O plano tem tarefas para agentes?"'
    status: rascunho
    publico: false
    exemplo: "Feature só com tarefas de pessoas: pula para o plano de ondas."
  - id: pb_com_set_t4
    resumo: Cada tarefa delegada precisa de um papel, das skills desse papel, das categorias de ferramenta e dos limites de autonomia.
    perguntas_chave:
      - '"Qual papel exerce cada tarefa?"'
      - '"Que skills e categorias de ferramenta o papel exige?"'
      - '"O que o agente não pode fazer?"'
    evitar:
      - Dar ao agente mais acesso do que a tarefa exige
    status: rascunho
    publico: false
  - id: pb_com_set_t5
    resumo: Antes de criar um agente, procure os que já existem e os aprendizados registrados sobre eles.
    perguntas_chave:
      - '"Há agentes do papel que já resolveram tarefas parecidas?"'
      - '"O que o catálogo registra sobre desvios desses agentes?"'
    status: rascunho
    publico: false
  - id: pb_com_set_g2
    resumo: Agentes existentes que cobrem os papéis vão direto para os testes; faltando agente ou capacidade, a raia cria ou refina.
    perguntas_chave:
      - '"A cobertura é completa, parcial ou inexistente?"'
    status: rascunho
    publico: false
    exemplo: "Agente QA sem skill de evals: refinar."
  - id: pb_com_set_t6
    resumo: Criar ou refinar o agente, as skills e a configuração das ferramentas. Tudo que é criado aqui vira item do catálogo de agentes do time.
    perguntas_chave:
      - '"O agente do papel tem instrução, contexto e exemplos suficientes?"'
      - '"A skill nova é reutilizável por outros times?"'
    fazer:
      - Versione a definição do agente e as skills junto com os testes
    evitar:
