  - id: pb_com_dea_t1
    resumo: "Autonomia delimitada: tools, arquivos, limites. Nem total, nem zero."
    perguntas_chave:
      - '"O agente pode tocar em X, mas precisa de aprovação para Y"'
      - '"Que plano B existe se o fornecedor do modelo mudar, sair do ar ou subir o preço?"'
    fazer:
      - Defina quais arquivos/tools o agente pode tocar
      - 'Limite escopo: "só este módulo"'
      - Defina o que requer aprovação humana
      - Use agents especializados (planejador, builder, reviewer)
      - "Requisito probabilístico: registre o modelo e o fornecedor usados e o plano B (dependência de fornecedor de modelo)"
      - "Requisito probabilístico: fixe um teto de custo por chamada e por tarefa do agente"
    evitar:
      - Dar acesso total ao repo
      - Delegar decisão arquitetural ao agente
      - Confiar sem verificar
    tecnicas:
      - tec_agente_de_codigo
      - tec_protocolo_de_ferramentas_para_agentes
      - tec_multi_agent
    status: rascunho
    publico: false
  - id: pb_com_dea_t2
    resumo: O agente gera; você revisa. A qualidade do output depende da spec.
    perguntas_chave:
      - '"O que o agente produziu que a spec não pediu?"'
    fazer:
      - Gera código, testes e docs a partir da spec
      - Roda testes e linters
      - Propõe PR com descrição
      - Versione o prompt, o modelo e os parâmetros usados na execução
    evitar:
      - Aceitar output sem rodar testes
      - Deixar o agente inventar APIs
    tecnicas:
      - tec_tdd
      - tec_ci_cd
      - tec_linters
    status: rascunho
    publico: false
  - id: pb_com_dea_e1
    resumo: "Retorno «entrega_gerada» da raia Delegação e execução pelo agente: código, testes e docs gerados a partir da spec, prontos para validar. Quem chamou a raia segue por este retorno."
    perguntas_chave:
      - '"A entrega traz testes e uma descrição que dá para validar?"'
    status: rascunho
    publico: false
  - id: pb_com_exe_s0
    resumo: Início da raia Execução por papéis. Toda a coordenação entre agentes e pessoas acontece aqui, e não na orquestradora.
    perguntas_chave:
      - '"Os planos de alocação e de agentes estão prontos?"'
    status: rascunho
    publico: false
  - id: pb_com_exe_g1
    resumo: Decisões humanas que bloqueiam os agentes vêm primeiro, para os agentes não trabalharem sobre premissas erradas.
    perguntas_chave:
      - '"Alguma tarefa de agente depende de decisão de pessoa?"'
    status: rascunho
    publico: false
    exemplo: "Formato do evento ainda aberto: pessoas decidem antes."
  - id: pb_com_exe_c1
    resumo: Pessoas do papel tomam as decisões bloqueantes antes de os agentes começarem.
    perguntas_chave:
      - '"As decisões ficaram registradas onde o agente vai ler?"'
    status: rascunho
    publico: false
  - id: pb_com_exe_g2
    resumo: Sem agentes prontos ou sem tarefas para eles, a execução segue direto com as pessoas.
    perguntas_chave:
      - '"Há agentes prontos para as tarefas?"'
    status: rascunho
    publico: false
    exemplo: "Agentes Dev e QA prontos: executam."
  - id: pb_com_exe_c2
    resumo: Os agentes de cada papel executam as tarefas da onda, em paralelo quando o plano permite. Um desvio do esperado aciona a melhoria do agente.
    perguntas_chave:
      - '"A saída do agente atende a spec, os testes e os limites?"'
    status: rascunho
    publico: false
  - id: pb_com_exe_c3
    resumo: Quando um agente sai do esperado, ele é revisado e melhorado antes de voltar a executar. Depois de 3 desvios iguais, a tarefa passa a uma pessoa do papel.
    perguntas_chave:
      - '"O desvio virou teste do agente?"'
      - '"O aprendizado foi registrado no catálogo?"'
    status: rascunho
    publico: false
  - id: pb_com_exe_g3
    resumo: Depois dos agentes, as pessoas executam o que ficou com elas no plano.
    perguntas_chave:
      - '"Há tarefas do plano sem entrega?"'
    status: rascunho
    publico: false
    exemplo: Migração de dados ficou com a pessoa de Engenharia de dados.
  - id: pb_com_exe_c4
    resumo: Pessoas do papel executam as tarefas humanas e as tarefas que os agentes não concluíram.
    perguntas_chave:
      - '"Quem assume cada tarefa que voltou do agente?"'
    status: rascunho
    publico: false
  - id: pb_com_exe_e1
    resumo: "Retorno «execucao_integrada»: entregas de agentes e pessoas integradas e prontas para a validação."
    perguntas_chave:
      - '"A entrega integrada tem link para cada PR e cada decisão?"'
    status: rascunho
    publico: false
  - id: pb_com_dea_g1
    resumo: Toda saída de agente é conferida contra a spec, os testes e os limites de autonomia. Um desvio não é falha do processo, é insumo para melhorar o agente.
    perguntas_chave:
      - '"A saída atende a spec e passa nos testes?"'
      - '"O agente ficou dentro dos limites de autonomia?"'
    status: rascunho
    publico: false
  - id: pb_com_dea_e2
    resumo: "Retorno «desvio_do_agente»: a saída saiu do esperado e vai para a melhoria contínua do agente."
    perguntas_chave:
      - '"O desvio está registrado com o esperado, o obtido e a evidência?"'
    status: rascunho
    publico: false
  - id: pb_com_mel_s0
    resumo: Início da raia Melhoria contínua dos agentes. Cada desvio é uma oportunidade de melhorar o agente para esta e para as próximas features.
    perguntas_chave:
      - '"Qual tarefa e qual agente desviaram?"'
    status: rascunho
    publico: false
  - id: pb_com_mel_t1
    resumo: "Classificar a causa do desvio direciona o ajuste: spec, contexto, instrução, skill, ferramenta, permissão ou modelo."
    perguntas_chave:
      - '"O esperado e o obtido estão descritos com evidência?"'
      - '"A causa está no agente ou na spec?"'
    status: rascunho
    publico: false
  - id: pb_com_mel_t2
    resumo: O ajuste depende da causa, e todo desvio vira um caso de teste do agente.
    perguntas_chave:
      - '"O ajuste resolve a causa ou só o sintoma?"'
      - '"O novo caso de teste reproduz o desvio?"'
    evitar:
      - Ajustar o agente quando a causa é a spec ambígua
    status: rascunho
    publico: false
  - id: pb_com_mel_t3
    resumo: O aprendizado vai para o catálogo de agentes e é lido na próxima seleção de agentes.
    perguntas_chave:
      - '"Outro time se beneficia deste aprendizado?"'
    status: rascunho
    publico: false
  - id: pb_com_mel_g1
    resumo: Depois de 3 desvios iguais, a tarefa passa a uma pessoa do papel e o agente fica marcado para revisão maior.
    perguntas_chave:
      - '"O desvio se repete mesmo com os ajustes?"'
    status: rascunho
    publico: false
    exemplo: "Terceiro erro de fuso horário: assumir por pessoa."
  - id: pb_com_mel_e1
    resumo: "Retorno «agente_ajustado»: o agente foi ajustado e testado, e volta a executar a tarefa."
    perguntas_chave:
      - '"O agente ajustado passou no novo caso de teste?"'
    status: rascunho
    publico: false
  - id: pb_com_mel_e2
    resumo: "Retorno «assumir_por_pessoa»: a tarefa passa a uma pessoa do papel, com o aprendizado registrado."
    perguntas_chave:
      - '"Quem assume a tarefa e qual o prazo?"'
    status: rascunho
    publico: false
  - id: pb_com_exp_s0
    resumo: "Início da raia Execução pelas pessoas. Responsabilidade: executar pelas pessoas as tarefas humanas e de decisão, pareando com o agente nas híbridas."
    perguntas_chave:
      - '"Que tarefas e decisões só pessoas podem tomar nesta feature?"'
    status: rascunho
    publico: false
  - id: pb_com_exp_t1
    resumo: O que exige julgamento, negociação ou acesso sensível fica com pessoas. Elas também desbloqueiam o agente com decisões claras.
    perguntas_chave:
      - '"A decisão tomada está registrada de forma que o agente (e o time) consegue usar?"'
    fazer:
      - "Execute as tarefas necessariamente humanas: decisões de arquitetura, ambiguidades, segurança e compliance, negociação com stakeholders, acessos e permissões"
      - Registre cada decisão como contexto (ADR ou atualização da spec), para o agente e para o time
      - Execute as tarefas de pessoa que não dependem do agente
    evitar:
      - Decidir de cabeça e não registrar
      - Deixar o agente esperando uma decisão sem aviso
    tecnicas:
      - tec_adrs
    status: rascunho
    publico: false
  - id: pb_com_exp_g1
    resumo: "Tarefas híbridas pedem pareamento: a pessoa do papel decide e o agente executa a parte mecânica."
    perguntas_chave:
      - '"Há tarefa híbrida no plano?"'
    fazer:
      - "Critério da saída «sim, há tarefa híbrida»: a lista tarefas_pessoa contém tarefas marcadas como híbridas"
      - "Critério da saída «não, só tarefas humanas»: nenhuma tarefa da pessoa tem parte delegável"
    status: rascunho
    publico: false
    exemplo: ADR escrito pela pessoa, rascunho de testes pelo agente.
  - id: pb_com_exp_t2
    resumo: "Pareamento humano e agente: a pessoa conduz, o agente acelera, e a pessoa responde pelo resultado."
    perguntas_chave:
      - '"Quem responde pelo resultado desta tarefa se o agente errar?"'
    fazer:
      - A pessoa conduz a decisão e delega o trecho mecânico ao agente, com limite de autonomia curto
      - Revise cada trecho gerado antes de seguir
      - Se o trecho delegado crescer, devolva a tarefa à alocação
    evitar:
      - Aceitar o que o agente gerou sem ler
      - Delegar a decisão junto com a execução
    status: rascunho
    publico: false
  - id: pb_com_exp_e1
    resumo: "Retorno «execucao_humana_concluida» da raia Execução pelas pessoas: tarefas humanas e decisões concluídas e registradas. Quem chamou a raia segue por este retorno."
    perguntas_chave:
      - '"As decisões estão registradas onde o agente e o time as encontram?"'
    status: rascunho
    publico: false
  - id: pb_com_pro_s0
    resumo: "Início da raia Prontidão (Definition of Ready). Responsabilidade: garantir que o requisito atende à Definition of Ready."
    perguntas_chave:
      - '"O time já viu este item e concorda com o entendimento?"'
    status: rascunho
    publico: false
  - id: pb_com_pro_g1
    exemplo: Uma história sem critério de aceite volta ao refinamento.
    resumo: Só segue o que atende à Definition of Ready. O restante volta ao refinamento com o time.
    perguntas_chave:
      - '"As histórias atendem à Definition of Ready?"'
    fazer:
      - DoR atendido = trabalho previsível
      - Se não atendido, refina com o time antes de puxar
      - "Critério da saída «não»: item sem estimativa, com bloqueio ou sem CA verificável, então refinar com o time"
      - "Critério da saída «sim»: entendido, estimado, sem bloqueios e com CA verificáveis"
    evitar:
      - Puxar item sem DoR e "refinar na daily"
      - Deixar o time descobrir a ambiguidade no meio do sprint
    tecnicas:
      - tec_definition_of_ready
    status: rascunho
    publico: false
  - id: pb_com_pro_t1
    exemplo: Painel fatiado em duas histórias; dependência do evento de pedidos confirmada.
    resumo: "A Definition of Ready é o filtro de entrada: o time só puxa o que está claro, estimado, fatiado e sem bloqueio."
    perguntas_chave:
      - '"A história tem critério de aceite verificável?"'
      - '"Cabe numa iteração?"'
      - '"As dependências estão confirmadas?"'
    fazer:
      - Estimativa colaborativa (Planning Poker)
      - Identifique riscos técnicos e dependências
      - Defina o "walking skeleton" do item
      - Refine com exemplos concretos
      - Priorize as fatias por valor e urgência (WSJF, Kano ou MoSCoW)
    evitar:
      - Puxar história com dependência aberta
      - Estimar sem entender o critério de aceite
    tecnicas:
      - tec_planning_poker
      - tec_wsjf
      - tec_kano_model
    status: rascunho
    publico: false
  - id: pb_com_pro_e1
    resumo: "Retorno «pronto_para_iniciar» da raia Prontidão (Definition of Ready): item que atende à Definition of Ready, fatiado e priorizado. Quem chamou a raia segue para a próxima etapa da própria demanda (especificar, corrigir, executar)."
    perguntas_chave:
      - '"O item cabe numa sprint e tem prioridade definida?"'
    status: rascunho
    publico: false
