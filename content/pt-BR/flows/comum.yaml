  - id: com_val_t1
    raia: com_val
    tipo: tarefa
    rotulo: Revisar e aprimorar os testes (TDD e pirâmide)
    condicao: ""
    proximo:
      - para: com_val_t2
        condicao: ""
    estado: {}
    entradas:
      - entrega_integrada
      - criterios_de_aceite
      - requirements_md
      - altera_comportamento_existente
      - corrige_defeito
      - teste_que_reproduz
    saidas:
      - plano_de_testes
      - testes_da_feature
      - suite_de_regressao_core
    subtarefas:
      - id: com_val_t1_st1
        rotulo: Conferir que cada critério de aceite tem teste
        papel: qa
        saidas:
          - plano_de_testes
        tecnicas:
          - tecnica: tec_criterios_aceitacao
            uso: obrigatoria
            porque: critério sem teste não está validado
        exemplo: 14 critérios, 14 testes; 2 critérios só tinham teste manual e ganharam teste automatizado.
        status: rascunho
      - id: com_val_t1_st2
        rotulo: "Equilibrar a pirâmide: unitários, integração e contrato"
        papel: qa
        apoio:
          - dev
        entradas:
          - plano_de_testes
        saidas:
          - testes_da_feature
          - plano_de_testes
        tecnicas:
          - tecnica: tec_piramide_de_testes
            uso: obrigatoria
            porque: muitos testes rápidos na base, poucos testes caros no topo
          - tecnica: tec_tdd
            uso: recomendada
            porque: teste escrito antes mantém o desenho simples e testável
          - tecnica: tec_contract_testing
            uso: condicional
            quando:
              todos:
                - var: tem_integracao
                  igual: sim
            porque: integração com outro contexto precisa de contrato verificável
        exemplo: 120 unitários, 18 de integração e 6 de contrato; nenhum teste depende da ordem de execução.
        status: rascunho
      - id: com_val_t1_st3
        rotulo: Fixar a linha de base do comportamento atual
        papel: qa
        apoio:
          - dev
        quando:
          todos:
            - var: altera_comportamento_existente
              igual: sim
        porque: quem muda algo em produção precisa provar o que mudou e o que continuou igual
        entradas:
          - altera_comportamento_existente
        saidas:
          - testes_da_feature
        tecnicas:
          - tecnica: tec_teste_regressao
            uso: obrigatoria
            porque: os testes do comportamento atual passam antes e depois, exceto onde a mudança é intencional
        exemplo: Antes de mudar o frete, 12 testes registram o cálculo atual; só os 3 do comprador recorrente mudam de resultado.
        status: rascunho
      - id: com_val_t1_st4
        rotulo: Confirmar que o teste que reproduzia o defeito agora passa
        papel: dev
        quando:
          todos:
            - var: corrige_defeito
              igual: sim
        porque: o mesmo teste que provou o defeito prova a correção e passa a proteger contra a volta dele
        entradas:
          - teste_que_reproduz
        saidas:
          - testes_da_feature
        tecnicas:
          - tecnica: tec_teste_regressao
            uso: obrigatoria
            porque: o teste entra na suíte e roda em toda entrega seguinte
        exemplo: Teste do cupom expirado falhava com erro 500 e agora passa com a mensagem de cupom inválido.
        status: rascunho
      - id: com_val_t1_st5
        rotulo: Rodar a regressão das funcionalidades core
        papel: qa
        porque: nenhuma entrega pode quebrar o que sustenta o negócio, mesmo longe da mudança
        saidas:
          - suite_de_regressao_core
        tecnicas:
          - tecnica: tec_teste_regressao
            uso: obrigatoria
            porque: a suíte core roda inteira, não só a parte perto da mudança
        exemplo: Login, busca, checkout, pagamento e nota fiscal; 85 testes verdes.
        status: rascunho
    playbook: pb_com_val_t1
    layout:
      coluna: 1
    status: rascunho
    publico: false
