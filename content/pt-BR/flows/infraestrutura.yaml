    exemplo: Arquivo versionado que aumenta o pool de conexões do banco e adiciona uma réplica de leitura
    status: rascunho
    publico: false
  - id: plano_de_mudanca
    nome: Plano de mudança
    descricao: Serviços afetados, janela de execução e passos para voltar
    tipo: documento
    exemplo: Afeta pedidos e relatórios; janela de baixo tráfego às 4h; rollback volta a configuração anterior em 5 minutos
    status: rascunho
    publico: false
