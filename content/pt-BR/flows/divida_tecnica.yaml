playbooks:
  - id: pb_dvt_ava_s0
    resumo: "Início da raia Avaliação da dívida. Responsabilidade: mapear a dívida, medir o custo de carregá-la e decidir se paga agora."
    status: rascunho
    publico: false
  - id: pb_dvt_ava_t1
    resumo: "Mapear a dívida e onde ela dói. Entrega: onde está a dívida, que mudanças ela atrasa e com que frequência."
    perguntas_chave:
      - '"O que precisa estar claro para mapear a dívida e onde ela dói?"'
    status: rascunho
    publico: false
  - id: pb_dvt_ava_t2
    resumo: "Estimar o custo de carregar e o risco de pagar. Entrega: tempo perdido por mudança, incidentes ligados e esforço estimado da refatoração."
    perguntas_chave:
      - '"O que precisa estar claro para estimar o custo de carregar e o risco de pagar?"'
    status: rascunho
    publico: false
  - id: pb_dvt_ava_g1
    resumo: Pagar a dívida agora? A resposta decide o retorno da raia.
    status: rascunho
    publico: false
  - id: pb_dvt_ava_e1
    resumo: Retorno «pagar_agora» da raia Avaliação da dívida. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_dvt_ava_e2
    resumo: Retorno «aceitar_a_divida» da raia Avaliação da dívida. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_dvt_pla_s0
    resumo: "Início da raia Plano de refatoração segura. Responsabilidade: planejar a refatoração em passos pequenos, reversíveis e protegidos por testes."
    status: rascunho
    publico: false
  - id: pb_dvt_pla_t1
    resumo: "Escrever testes de caracterização do comportamento atual. Entrega: testes que fixam o comportamento atual antes de mexer na estrutura."
    perguntas_chave:
      - '"O que precisa estar claro para escrever testes de caracterização do comportamento atual?"'
    status: rascunho
    publico: false
  - id: pb_dvt_pla_t2
    resumo: "Fatiar a refatoração em passos pequenos e reversíveis. Entrega: sequência de passos, cada um integrável e reversível sozinho."
    perguntas_chave:
      - '"O que precisa estar claro para fatiar a refatoração em passos pequenos e reversíveis?"'
    status: rascunho
    publico: false
  - id: pb_dvt_pla_e1
    resumo: Retorno «plano_pronto» da raia Plano de refatoração segura. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_dvt_orq_s0
    resumo: "Toda dívida tem juros: o custo de carregá-la cresce a cada mudança. Antes de refatorar, meça o custo e o risco e decida pagar agora, planejar ou aceitar de forma consciente."
    status: rascunho
    publico: false
  - id: pb_dvt_orq_c1
    resumo: Chama a raia Avaliação da dívida. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - "Retornos possíveis: pagar_agora, aceitar_a_divida"
    status: rascunho
    publico: false
  - id: pb_dvt_orq_c2
    resumo: Chama a raia Plano de refatoração segura. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - "Retornos possíveis: plano_pronto"
    status: rascunho
    publico: false
  - id: pb_dvt_orq_c3
    resumo: Chama a raia Verificar a prontidão (Definition of Ready). O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - "Retornos possíveis: pronto_para_iniciar"
    status: rascunho
    publico: false
  - id: pb_dvt_orq_c4
    resumo: Chama a raia Execução das tarefas. O fluxo segue pelo retorno que a raia devolver.
