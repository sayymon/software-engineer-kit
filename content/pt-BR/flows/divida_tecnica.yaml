id: divida_tecnica
tipo: demanda
nome: Dívida técnica e refatoração
sigla: dvt
publico: false
artefatos:
  - id: mapa_da_divida
    nome: Mapa da dívida
    descricao: Onde está a dívida, que mudanças ela atrasa e com que frequência
    tipo: documento
    exemplo: Módulo de cupons com regras duplicadas em três serviços; toda mudança de desconto leva o dobro do tempo
    status: rascunho
    publico: false
  - id: custo_da_divida
    nome: Custo da dívida
    descricao: Tempo perdido por mudança, incidentes ligados e esforço estimado da refatoração
    tipo: dado
    exemplo: 2 dias extras por mudança, 3 incidentes no trimestre; refatoração estimada em 8 dias
    status: rascunho
    publico: false
  - id: testes_de_caracterizacao
    nome: Testes de caracterização
    descricao: Testes que fixam o comportamento atual antes de mexer na estrutura
    tipo: teste
    exemplo: 40 testes fixam o cálculo atual de desconto antes da extração do módulo
    status: rascunho
    publico: false
  - id: plano_de_refatoracao
    nome: Plano de refatoração
    descricao: Sequência de passos, cada um integrável e reversível sozinho
    tipo: documento
    exemplo: "5 passos: extrair interface, mover regra, trocar chamadas, remover duplicata, apagar código morto"
    status: rascunho
    publico: false
raias:
  - id: dvt_orq
    nome: "Orquestração: dívida técnica e refatoração"
    demanda: divida_tecnica
    responsabilidade: Conduzir a demanda de dívida técnica e refatoração do início ao fim, delegando cada etapa a uma raia
    cor: "#607D8B"
    orquestradora: true
    status: rascunho
    publico: false
  - id: dvt_ava
    nome: Avaliação da dívida
    demanda: divida_tecnica
    responsabilidade: Mapear a dívida, medir o custo de carregá-la e decidir se paga agora
    cor: "#332288"
    status: rascunho
    publico: false
  - id: dvt_pla
    nome: Plano de refatoração segura
    demanda: divida_tecnica
    responsabilidade: Planejar a refatoração em passos pequenos, reversíveis e protegidos por testes
    cor: "#117733"
    status: rascunho
    publico: false
