        condicao: muda comportamento para o usuário
      - para: cho_ent_e3
        condicao: adiada até atrasar cada mudança
      - para: cho_ent_e4
        condicao: exige migração ou upgrade com quebra de compatibilidade
      - para: cho_ent_e5
        condicao: exige mudança de infraestrutura
      - para: cho_ent_e6
        condicao: remove algo que ainda tem consumidores
    estado: {}
    entradas:
      - descricao_da_tarefa
    papel: tech_lead
    apoio:
