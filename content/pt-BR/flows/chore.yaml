playbooks:
  - id: pb_cho_ent_s0
    resumo: "Início da raia Enquadramento da tarefa. Responsabilidade: confirmar que é mesmo uma chore ou reclassificar para a demanda certa."
    status: rascunho
    publico: false
  - id: pb_cho_ent_t1
    resumo: "Descrever a tarefa e o critério de pronto. Entrega: card com o que fazer, por que agora e como saber que terminou."
    perguntas_chave:
      - '"O que precisa estar claro para descrever a tarefa e o critério de pronto?"'
    status: rascunho
    publico: false
  - id: pb_cho_ent_g1
    resumo: Ainda é uma chore? A resposta decide o retorno da raia.
    status: rascunho
    publico: false
  - id: pb_cho_ent_e1
    resumo: Retorno «confirmada_como_chore» da raia Enquadramento da tarefa. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_cho_ent_e2
    resumo: Retorno «reclassificar_como_feature» da raia Enquadramento da tarefa. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_cho_ent_e3
    resumo: Retorno «reclassificar_como_divida_tecnica» da raia Enquadramento da tarefa. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_cho_ent_e4
    resumo: Retorno «reclassificar_como_migracao» da raia Enquadramento da tarefa. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_cho_ent_e5
    resumo: Retorno «reclassificar_como_infraestrutura» da raia Enquadramento da tarefa. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_cho_ent_e6
    resumo: Retorno «reclassificar_como_descontinuacao» da raia Enquadramento da tarefa. Quem chamou a raia segue por este retorno.
    status: rascunho
    publico: false
  - id: pb_cho_orq_s0
    resumo: "Chore é manutenção de rotina sem mudança de comportamento para o usuário: atualizar dependência, renovar certificado, ajustar configuração. Se muda comportamento, é feature; se foi adiada até acumular custo, virou dívida técnica, migração, mudança de infraestrutura ou descontinuação."
    status: rascunho
    publico: false
  - id: pb_cho_orq_c1
    resumo: Chama a raia Enquadramento da tarefa. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - "Retornos possíveis: confirmada_como_chore, reclassificar_como_feature, reclassificar_como_divida_tecnica, reclassificar_como_migracao, reclassificar_como_infraestrutura, reclassificar_como_descontinuacao"
    status: rascunho
    publico: false
  - id: pb_cho_orq_c2
    resumo: Chama a raia Execução das tarefas. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - "Retornos possíveis: execucao_integrada"
    status: rascunho
    publico: false
  - id: pb_cho_orq_c3
    resumo: Chama a raia Testes automatizados. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - "Retornos possíveis: testes_aprovados, testes_reprovados"
    status: rascunho
    publico: false
  - id: pb_cho_orq_c4
    resumo: Chama a raia Review humano. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - "Retornos possíveis: aprovado_pelo_humano, ajustes_solicitados"
    status: rascunho
    publico: false
  - id: pb_cho_orq_c5
    resumo: Chama a raia Implantação. O fluxo segue pelo retorno que a raia devolver.
    fazer:
      - "Retornos possíveis: implantado, implantacao_revertida"
    status: rascunho
    publico: false
  - id: pb_cho_orq_e1
    resumo: Tarefa concluída e implantada. Fim da demanda.
    status: rascunho
    publico: false
  - id: pb_cho_orq_e2
    resumo: Reclassificada como feature. Fim da demanda.
    status: rascunho
    publico: false
  - id: pb_cho_orq_e3
    resumo: Reclassificada como dívida técnica. Fim da demanda.
    status: rascunho
    publico: false
  - id: pb_cho_orq_e4
    resumo: Reclassificada como migração. Fim da demanda.
    status: rascunho
    publico: false
  - id: pb_cho_orq_e5
    resumo: Reclassificada como infraestrutura. Fim da demanda.
    status: rascunho
    publico: false
  - id: pb_cho_orq_e6
    resumo: Reclassificada como descontinuação. Fim da demanda.
    status: rascunho
    publico: false
