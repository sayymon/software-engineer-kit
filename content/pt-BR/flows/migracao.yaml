id: migracao
tipo: demanda
nome: Migração e upgrade
sigla: mig
publico: false
artefatos:
  - id: inventario_da_migracao
    nome: Inventário da migração
    descricao: Componentes, dados e consumidores afetados
    tipo: documento
    exemplo: Banco de pedidos na versão antiga, 4 serviços leem direto da tabela, 2 relatórios dependem do formato atual
    status: rascunho
    publico: false
  - id: plano_de_migracao
    nome: Plano de migração
    descricao: Passos reversíveis, critério de avanço e rollback de cada passo
    tipo: documento
    exemplo: "Expandir: coluna nova; migrar: escrita dupla e cópia em lotes; contrair: leitura só da nova; rollback em cada passo"
    status: rascunho
    publico: false
  - id: remocao_do_legado
    nome: Remoção do legado
    descricao: PR que remove o caminho antigo e as flags de transição
    tipo: pull_request
    exemplo: PR que remove a coluna antiga, a escrita dupla e a flag de transição
    status: rascunho
    publico: false
raias:
  - id: mig_orq
    nome: "Orquestração: migração e upgrade"
    demanda: migracao
    responsabilidade: Conduzir a demanda de migração e upgrade do início ao fim, delegando cada etapa a uma raia
    cor: "#607D8B"
    orquestradora: true
    status: rascunho
    publico: false
  - id: mig_ava
    nome: Avaliação e plano de migração
    demanda: migracao
    responsabilidade: Inventariar o que muda, checar compatibilidade e planejar passos reversíveis
    cor: "#332288"
    status: rascunho
    publico: false
  - id: mig_lim
    nome: Limpeza pós-migração
    demanda: migracao
    responsabilidade: Remover o caminho antigo depois que o novo está provado em produção
    cor: "#117733"
    status: rascunho
    publico: false
